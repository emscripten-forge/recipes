context:
  name: rust-nightly
  version: 1.101.0
  rust_rev: f26d0d0a526104442fb49a0ec68b7992d7e43d35
  llvm_version: "23.1.3"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  git: https://github.com/madsmtm/rust.git
  rev: ${{ rust_rev }}
  depth: 1
  submodules: false

build:
  number: 0
  script: build.sh

requirements:
  build:
  - if: osx
    then:
      - clang ==${{ llvm_version }}
      - clangxx ==${{ llvm_version }}
    else:
      - ${{ compiler("c") }}
      - ${{ compiler("cxx") }}
  - cmake
  - ninja
  - python >=3.13
  - curl >=8.0
  - git
  - xz
  - llvmdev ==${{ llvm_version }}
  - lld ==${{ llvm_version }}
  host:
  - llvm ==${{ llvm_version }}
  - lld ==${{ llvm_version }}
  run:
  - llvm ==${{ llvm_version }}
  - lld ==${{ llvm_version }}

tests:
- script:
  - test_toolchain.sh
  files:
    recipe:
    - test_toolchain.sh
  requirements:
    run:
    - emscripten-core

about:
  homepage: https://www.rust-lang.org
  license: MIT
  license_file:
    - LICENSE-APACHE
    - LICENSE-MIT
  summary: |
    Rust is a systems programming language that runs blazingly fast, prevents
    segfaults, and guarantees thread safety. This package provides the compiler
    (rustc), cargo, rust-src, and the standard library built for the host,
    wasm32-unknown-emscripten and wasm64-unknown-emscripten.
  repository: https://github.com/rust-lang/rust
  documentation: https://www.rust-lang.org/en-US/documentation.html

extra:
  recipe-maintainers:
    - DerThorsten
    - IsabelParedes
    - Alex-PLACET
