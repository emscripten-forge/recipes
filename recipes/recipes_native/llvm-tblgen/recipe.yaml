context:
  version: 23.1.2

package:
  name: llvm-tblgen
  version: ${{ version }}

source:
  url: https://github.com/llvm/llvm-project/archive/refs/tags/llvmorg-${{ version
    }}.tar.gz
  sha256: 75788d759e6987a910975b902f554dc77c08b076b945b2cebde54116d8e831ca

build:
  number: 0

requirements:
  build:
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - cmake
  - ninja
  
tests:
- package_contents:
    files:
    - bin/llvm-tblgen
    - bin/llvm-min-tblgen
    - bin/clang-tblgen
    - bin/mlir-tblgen
    - bin/mlir-linalg-ods-yaml-gen
    - bin/llvm-lit

about:
  license: Apache-2.0 WITH LLVM-exception
  license_family: Apache
  license_file: LICENSE.TXT
  summary: The LLVM Project is a collection of modular and reusable compiler and toolchain
    technologies.
  homepage: https://llvm.org

extra:
  recipe-maintainers:
  - DerThorsten
  - anutosh491
