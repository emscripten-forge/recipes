packages:
  zlib:
    exclude_patterns:
      - pattern: '**/so'
  widgetsnbextension:
    exclude_patterns:
      - pattern: '**'
  numpy:
    exclude_patterns:
    - pattern: '**/*.pyx'
    - pattern: '**/*.pyc'
    - pattern: '**/*.typed'
    - pattern: '**/*.egg-info'
default:
  exclude_patterns:
    - pattern: 'bin/**'
    - pattern: '**/bin/**'
    - pattern: 'tests/**'
    # - pattern: '**/tests/**'
    # - pattern: '**/*.ini'
    - pattern: '**/*.exe'
    - pattern: '**/*.c'
    - pattern: '**/*.pxd'
    # - pattern: '**/*.pyi'
    - pattern: '**/*.pyx'
    - pattern: '**/*.pyc'
    - pattern: '**/*.typed'
    - pattern: '**/*.egg-info'
    - pattern: '**/site-packages/pip/_vendor/**'
    - pattern: '**/idlelib/**'
    - pattern: '**/ensurepip/**'
    - pattern: 'Scripts/*'
    # pyjs' runtime (libpyjs-static) and the npm package's JavaScript
    # (pyjs-npm): pyjs-code-runner serves them from the env directly, a copy
    # in the packed env is never used (~20 MB per test page)
    - pattern: 'lib_js/**'
    # Excluding jupyter front-end and server extensions
    - pattern: 'share/jupyter/nbextensions/**'
    - pattern: 'share/jupyter/labextensions/**'
    - pattern: 'etc/jupyter/nbconfig/**'