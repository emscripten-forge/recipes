context:
  name: xeus-tester
  version: 0.1.0
  xeus_runner_version: 0.0.3

package:
  name: ${{ name }}
  version: ${{ version }}

source:
- url: https://registry.npmjs.org/@xeus-runner/xeus-runner/-/xeus-runner-${{ xeus_runner_version }}.tgz
  sha256: 31842f67ff1893db31a614de3e4a98b76537a04bfa29a69db38f7d45f2f9e045
  target_directory: xeus-runner

build:
  number: 0
  noarch: generic

requirements:
  run:
  - nodejs >=24

tests:
- package_contents:
    files:
    - bin/xeus-tester
    - share/xeus-tester/xeus_tester.mjs
    - share/xeus-tester/dist_node/xeus-runner.js
    - share/xeus-tester/dist_node/node_worker_impl.js
    - share/xeus-tester/dist_node/unpack.wasm
    - share/xeus-tester/index.html
    - share/xeus-tester/dist_web/xeus-runner.js
    - share/xeus-tester/dist_web/comlink_web_worker_impl.js
    - share/xeus-tester/dist_web/coincident_web_worker_impl.js
    - share/xeus-tester/dist_web/unpack.wasm

about:
  summary: Package to test emscripten-forge packages inside xeus kernels using xeus-runner.
  license: BSD-3-Clause
  license_file: xeus-runner/LICENSE

extra:
  recipe-maintainers:
  - ianthomas23
