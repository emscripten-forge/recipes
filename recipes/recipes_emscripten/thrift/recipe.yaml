context:
  version: 0.22.0
  name: thrift

build:
  number: 4

outputs:
  - staging:
      name: build-cache
    build:
      script: build.sh
    requirements:
      build:
      - ${{ compiler("cxx") }}
      - cmake
      - make
      - python
      - pip
      - setuptools
      host:
      - boost-algorithm
      - boost-chrono
      - boost-config
      - boost-date_time
      - boost-filesystem
      - boost-foreach
      - boost-format
      - boost-locale
      - boost-mpl
      - boost-numeric_conversion
      - boost-predef
      - boost-program_options
      - boost-random
      - boost-scope_exit
      - boost-smart_ptr
      - boost-test
      - boost-thread
      - boost-tokenizer
      - boost-type_traits
      - boost-uuid
      - openssl
      - zlib
    source:
      - url: https://github.com/apache/thrift/archive/refs/tags/v${{ version }}.tar.gz
        sha256: c4649c5879dd56c88f1e7a1c03e0fbfcc3b2a2872fb81616bffba5aa8a225a37

  - package:
      name: thrift-cpp
      version: ${{ version }}
    inherit: build-cache
    build:
      script: echo "Collecting files from cache"
      files:
        include:
          - lib/libthrift.a
    requirements:
      run:
        - boost-chrono
        - boost-date_time
        - boost-filesystem
        - boost-program_options
        - boost-random
        - boost-test
        - openssl
        - zlib
    tests:
      - package_contents:
          lib:
            - libthrift.a

  - package:
      name: thrift-cpp-dev
      version: ${{ version }}
    inherit: build-cache
    build:
      script: echo "Collecting files from cache"
      files:
        include:
          - include/thrift/**
          - lib/cmake/thrift/
          - lib/cmake/thrift-emscripten/
          - lib/pkgconfig/thrift.pc
    requirements:
      run:
        # the CMake configs and thrift.pc here point at ../../../lib/libthrift.a
        - ${{ pin_subpackage('thrift-cpp', exact=True) }}
        - boost-algorithm
        - boost-chrono
        - boost-config
        - boost-date_time
        - boost-filesystem
        - boost-foreach
        - boost-format
        - boost-locale
        - boost-mpl
        - boost-numeric_conversion
        - boost-predef
        - boost-program_options
        - boost-random
        - boost-scope_exit
        - boost-smart_ptr
        - boost-test
        - boost-thread
        - boost-tokenizer
        - boost-type_traits
        - boost-uuid
    tests:
      - package_contents:
          include:
            - thrift/Thrift.h
            - thrift/protocol/TBinaryProtocol.h
      - script:
          - bash build_tests.sh
        requirements:
          build:
            - ${{ compiler("cxx") }}
            - cmake
        files:
          recipe:
            - build_tests.sh
            - tests/thrift-cpp/

  # ============================================================================
  # Python bindings
  # ============================================================================
  - package:
      name: thrift
      version: ${{ version }}
    inherit: build-cache
    build:
      script: build_python.sh
      files:
        exclude:
        - '**/__pycache__/**'
        - '**/*.pyc'
        - '**/test_*.py'
      python:
        skip_pyc_compilation:
        - '**/*.py'
    requirements:
      build:
        - cross-python_emscripten-wasm32

      host:
        - python
        - setuptools
        - thrift-cpp-dev =${{ version }}
      run:
        - python
        - six
    tests:
      - script: pytester
        files:
          recipe:
            - test_import_thrift.py
        requirements:
          build:
            - pytester
          run:
            - pytester-run

about:
  homepage: https://thrift.apache.org/
  license: Apache-2.0
  license_file: LICENSE
  summary: "Apache Thrift - A scalable cross-language services development framework"
  description: |
    Apache Thrift is a software framework for scalable cross-language services development.
    It combines a software stack with a code generation engine to build services that work
    efficiently and seamlessly between C++, Java, Python, PHP, Ruby, Erlang, Perl, Haskell,
    C#, Cocoa, JavaScript, Node.js, Smalltalk, OCaml and Delphi and other languages.
  documentation: https://thrift.apache.org/docs/
  repository: https://github.com/apache/thrift
  license_family: Apache

extra:
  recipe-maintainers:
    - Copilot
