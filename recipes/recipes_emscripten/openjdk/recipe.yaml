context:
  version: "21.0.13+1" 
  
package:
  name: openjdk
  version: ${{ version }}

source:
  url: https://github.com/openjdk/jdk21u/archive/refs/tags/jdk-${{ version }}.tar.gz
  sha256: 9d6ba2c8df3c9a43521206f881998b734af3c1d8e1020e0e387e78fb5cf94912

build:
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - make
    - autoconf
    - pkg-config
    - findutils
    - coreutils
    - openjdk =21
  host:
    - libffi 

about:
  homepage: https://openjdk.org/
  summary: open-source implementation of the Java Platform
  license: GPL-2.0-only
  license_file: LICENSE