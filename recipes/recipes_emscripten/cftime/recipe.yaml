context:
  name: cftime
  version: 1.6.6

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 7b2716b3dce97ba1740189c424ce97bd6f8e65391b7fe323c6f0f817f6a8ad56

build:
  script: $PYTHON -m pip install . -vv
  number: 0

  files:
    exclude:
    - '**/*.pyx'
    - '**/__pycache__/**'
    - '**/*.pyc'
    - '**/test_*.py'
  python:
    skip_pyc_compilation:
    - '**/*.py'
requirements:
  build:
  - ${{ compiler('c') }}
  - cython
  - cross-python_emscripten-wasm32
  - python
  - numpy
  - pip
  host:
    # overwrite the numpy version here so we don't get pinnings / run export
  - numpy
  - python
  run:
  - python
  - numpy

tests:
- script: pytester
  files:
    recipe:
    - test_cftime.py
  requirements:
    build:
    - pytester
    run:
    - pytester-run
about:
  summary: Time-handling functionality from netcdf4-python
  license: MIT
  license_file: LICENSE

  homepage: https://pypi.org/project/cftime/
extra:
  recipe-maintainers:
  - wolfv
