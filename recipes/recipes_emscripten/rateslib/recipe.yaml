context:
  name: rateslib
  version: 2.7.1

package:
  name: ${{ name }}
  version: ${{ version }}

source:
- url: https://files.pythonhosted.org/packages/source/r/rateslib/rateslib-${{ version }}.tar.gz
  sha256: b4007e57c29581aa6f7c235cda06754d0afedde4817336032cd88a5c1b7a72d8

build:
  number: 0
  script: |
    set -e
    export MATURIN_PYTHON_SYSCONFIGDATA_DIR=${PREFIX}/etc/conda/_sysconfigdata__emscripten_wasm32-emscripten.py
    export PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1
    rustup component add rust-src
    ${PYTHON} -m pip install . -vvv

requirements:
  build:
  - cross-python_${{ target_platform }}
  - maturin
  - pip
  - rust-nightly
  host:
  - python
  - pip
  - numpy
  run:
  - python
  - numpy
  - pandas
  - matplotlib

tests:
- script: pytester
  requirements:
    build:
    - pytester
    run:
    - pytester-run
  files:
    recipe:
    - test_rateslib.py

about:
  homepage: https://rateslib.com/py/en/2.7.x/
  repository: https://github.com/attack68/rateslib
  summary: A fixed income library for trading interest rates
  license: LicenseRef-Rateslib-Dual
  license_file: LICENCE

extra:
  recipe-maintainers:
  - Copilot
