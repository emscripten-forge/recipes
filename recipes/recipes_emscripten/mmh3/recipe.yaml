context:
  name: mmh3
  version: 5.3.0

package:
  name: ${{ name }}
  version: ${{ version }}

source:
- url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 95832419b87b882bec9dcd7d041d74887ba7745b3659c14be1ae1db5cfa35cad

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . ${{ PIP_ARGS }}

  files:
    exclude:
    - '**/*.pyi'
    - '**/test_*.py'
requirements:
  build:
  - ${{ compiler('c') }}
  - cross-python_${{ target_platform }}
  - python
  - pip
  host:
  - python
  run:
  - python

tests:
- script: pytester
  files:
    recipe:
    - test_import_mmh3.py
  requirements:
    build:
    - pytester
    run:
    - pytester-run

about:
  homepage: https://github.com/hajimes/mmh3
  license: MIT
  license_file: LICENSE
  summary: Python extension for MurmurHash (MurmurHash3), a set of fast and robust hash functions.
  repository: https://github.com/hajimes/mmh3

extra:
  recipe-maintainers:
  - Copilot
