context:
  name: mmh3
  version: 5.3.1

package:
  name: ${{ name }}
  version: ${{ version }}

source:
- url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: bd86d0c86b52332319d981d03781ff77811a29db544a69902dc06b5506bb3e19

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . ${{ PIP_ARGS }}

  files:
    exclude:
    - '**/*.pyi'
    - '**/test_*.py'
requirements:
  build:
  - ${{ compiler('c') }}
  - cross-python_${{ target_platform }}
  - python
  - pip
  host:
  - python
  run:
  - python

tests:
- script: pytester
  files:
    recipe:
    - test_import_mmh3.py
  requirements:
    build:
    - pytester
    run:
    - pytester-run

about:
  homepage: https://github.com/hajimes/mmh3
  license: MIT
  license_file: LICENSE
  summary: Python extension for MurmurHash (MurmurHash3), a set of fast and robust hash functions.
  repository: https://github.com/hajimes/mmh3

extra:
  recipe-maintainers:
  - Copilot
