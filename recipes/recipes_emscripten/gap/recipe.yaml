context:
  version: 4.16.1

package:
  name: gap
  version: ${{ version }}

source:
  url: https://github.com/gap-system/gap/archive/refs/tags/v${{ version }}.tar.gz
  sha256: f53615fbdf6bd6e90520b36fad05890c8a6cfb848de81630cc69022fbd297d2f

build:
  number: 0
  script: build.sh

requirements:
  build:
  - autoconf
  - automake
  - libtool
  - make
  - python
  - ${{ compiler('c') }}
  - ${{ compiler('cxx') }}
  host:
  - gmp
  - zlib

tests:
- package_contents:
    files:
    - lib/libgap.a
    - include/gap/gap.h
    - bin/gap.js
    - bin/gap.wasm

about:
  homepage: https://www.gap-system.org/
  license: GPL-2.0-only
  license_file: LICENSE
  summary: GAP is a system for computational discrete algebra, with particular emphasis on computational group theory.

extra:
  recipe-maintainers:
  - mkoeppe
