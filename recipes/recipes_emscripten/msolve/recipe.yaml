context:
  name: msolve
  version: 0.11.0

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://msolve.lip6.fr/downloads/v${{ version }}/msolve-${{ version }}.tar.gz
  sha256: 0f32011c4333efb662ce8f5febf6b5dc1a8e6f1e4a935361b9af5009bd5cdb98

build:
  number: 0

requirements:
  build:
  - autoconf
  - automake
  - libtool
  - make
  - ${{ compiler("c") }}
  - ${{ compiler('cxx') }}
  - pkg-config
  - autoconf-archive
  host:
  - gmp-static
  - mpfr
  - libflint

tests:
- package_contents:
    files:
    - lib/libmsolve.a
    - include/msolve/msolve/msolve.h

about:
  homepage: https://msolve.lip6.fr/
  license: GPL-2.0-only
  license_file: COPYING
  summary: msolve is a library, written in plain C, for solving multivariate polynomial systems.

extra:
  recipe-maintainers:
  - wangyenshu
