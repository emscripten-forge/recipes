context:
  name: 4ti2
  version: 1.6.16

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/4ti2/4ti2/releases/download/Release_${{ version | replace('.','_') }}/4ti2-${{ version 
    }}.tar.gz
  sha256: a45629835ac138bb17896c509278b956c11917ec58e57165a2ee0c54ed0307cb

build:
  number: 0

requirements:
  build:
  - ${{ compiler('cxx') }}
  - libtool
  - m4
  - make
  - gnuconfig
  host:
  - glpk
  - gmp
  - zlib

tests:
- package_contents:
    files:
    - include/4ti2/4ti2.h
    - lib/lib4ti2gmp.a

about:
  license: GPL-2.0-or-later
  license_file: COPYING
  summary: Algebraic, geometric and combinatorial problems on linear spaces
  homepage: https://4ti2.github.io/

extra:
  recipe-maintainers:
  - mkoeppe
