context:
  name: interpolation
  version: 2.2.7

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/i/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: ec7ffd912e9354b67d9b65f8ecbf9136b1fdfdba03ad65765410db9e4c1537c4
  patches:
  - patches/0001-use-poetry-core-backend.patch

build:
  number: 0
  script: ${PYTHON} -m pip install . ${PIP_ARGS}

  files:
    exclude:
    - '**/tests/**'
    - '**/__pycache__/**'
    - '**/*.pyc'
    - '**/test_*.py'
  python:
    skip_pyc_compilation:
    - '**/*.py'

requirements:
  build:
  - cross-python_${{ target_platform }}
  - python
  - pip
  host:
  - python
  - poetry-core
  run:
  - python
  - numba 0.66.*
  - scipy >=1.10,<2
  - packaging >=21.3

tests:
- script: pytester
  files:
    recipe:
    - test_interpolation.py
  requirements:
    build:
    - pytester
    run:
    - pytester-run

about:
  homepage: https://github.com/EconForge/interpolation.py
  repository: https://github.com/EconForge/interpolation.py
  license: BSD-2-Clause
  license_file: LICENSE
  summary: Interpolation routines accelerated with Numba

extra:
  recipe-maintainers:
  - anutosh491
