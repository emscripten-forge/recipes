context:
  version: 10.8.6

package:
  name: passagemath-sympow
  version: ${{ version }}

source:
- url: https://pypi.org/packages/source/p/passagemath-sympow/passagemath_sympow-${{ version }}.tar.gz
  sha256: f9fe3fd26e103660dbceb929c7cf20946ff4bb3de8d355c7b25802d05a697089

build:
  script: ${{ PYTHON }} -m pip install .
  number: 0

requirements:
  build:
  - python
  - crossenv >=1.2
  - cross-python_emscripten-wasm32
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - pip
  - passagemath-setup
  - passagemath-environment
  - cython
  - cysignals
  - pkgconfig
  - passagemath-abi == ${{ version }}
  host:
  - python
  - sympow
  - passagemath-categories
  run:
  - python
  - cysignals
  - sympow
  - passagemath-categories
  - passagemath-modules

tests:
- script: pytester
  files:
    recipe:
    - test_passagemath_sympow.py
  requirements:
    build:
    - pytester
    run:
    - pytester-run
    - passagemath-repl

about:
  license: GPL-2.0-or-later
  license_file: README.rst
  summary: 'passagemath: Special values of symmetric power elliptic curve L-functions with sympow'
  description: |
    Distribution of a part of the Sage library.
    It provides an interface to sympow.

extra:
  emscripten_tests:
    python:
      pytest_files:
      - test_passagemath_sympow.py
  recipe-maintainers:
  - mkoeppe
