context:
  version: "1.3.7"
package:
  name: libvorbis
  version: ${{ version }}
source:
  url: https://downloads.xiph.org/releases/vorbis/libvorbis-${{ version }}.tar.xz
  sha256: b33cc4934322bcbf6efcbacf49e3ca01aadbea4114ec9589d1b1e9d20f72954b
build:
  number: 0
  script: build.sh
requirements:
  build:
    - ${{ compiler('c') }}
    - cmake
    - ninja
    - pkg-config
  host:
    - libogg >=1.3.6
about:
  homepage: https://xiph.org/vorbis/
  license: BSD-3-Clause
  license_file: COPYING
  summary: Ogg Vorbis codec libraries, including vorbisfile
