context:
  name: safetensors
  version: 0.8.0

package:
  name: ${{ name }}
  version: ${{ version }}

source:
- url: https://files.pythonhosted.org/packages/source/s/safetensors/safetensors-${{ version }}.tar.gz
  sha256: fabaf3e0f18a6618d9b36560682562157f77c2b71fcffc7b432be2baed9d753d

build:
  number: 0
  script: |
    set -e
    export MATURIN_PYTHON_SYSCONFIGDATA_DIR=${PREFIX}/etc/conda/_sysconfigdata__emscripten_wasm32-emscripten.py
    export PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1
    rustup component add rust-src
    ${PYTHON} -m pip install . -vvv

requirements:
  build:
  - cross-python_${{ target_platform }}
  - maturin
  - pip
  - rust-nightly
  host:
  - python
  - pip
  run:
  - python
  - numpy

tests:
- script: pytester
  requirements:
    build:
    - pytester
    run:
    - pytester-run
  files:
    recipe:
    - test_safetensors.py

about:
  homepage: https://github.com/huggingface/safetensors
  repository: https://github.com/huggingface/safetensors
  summary: Simple, safe way to store and distribute tensors
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
  - Copilot
