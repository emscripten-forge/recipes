context:
  version: 10.8.7

package:
  name: passagemath-flint
  version: ${{ version }}

source:
- url: https://pypi.org/packages/source/p/passagemath-flint/passagemath_flint-${{ version }}.tar.gz
  sha256: 2ce9850947bdd881734974add3974251bc108b523065b2246b0a6fd19728b2c6

build:
  script: |
    patch -p2 < ${RECIPE_DIR}/patches/0001-Use-distutils-libraries-FLINT_LIBRARIES-throughout.patch
    patch -p3 < ${RECIPE_DIR}/patches/0003-pkgs-sagemath-setup.py-Add-flint-to-required_modules.patch
    export LDFLAGS="$LDFLAGS -Wl,--allow-multiple-definition"
    ${{ PYTHON }} -m pip install .
  number: 1

requirements:
  build:
  - python
  - crossenv >=1.2
  - cross-python_emscripten-wasm32
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - pip
  - passagemath-setup
  - passagemath-environment
  - cython
  - cysignals
  - pkgconfig
  - numpy
  - passagemath-abi == ${{ version }}
  host:
  - python
  - gmp
  - mpfr
  - mpc
  - gsl
  - ntl
  - libflint
  - mpfi
  - numpy
  - cysignals
  - memory-allocator
  - passagemath-categories
  - passagemath-modules
  - passagemath-ntl
  run:
  - python
  - cysignals
  - memory-allocator
  - numpy
  - passagemath-categories
  - passagemath-ntl

tests:
- script: pytester
  files:
    recipe:
    - test_passagemath_flint.py
  requirements:
    build:
    - pytester
    run:
    - pytester-run
    - passagemath-modules
    - passagemath-repl

about:
  license: GPL-2.0-or-later
  license_file: README.rst
  summary: 'passagemath: Fast computations with MPFI and FLINT'
  description: |
    Distribution of a part of the Sage library.
    It provides Cython interfaces to the MPFI and FLINT libraries.
    It also ships the implementation of number fields.

extra:
  emscripten_tests:
    python:
      pytest_files:
      - test_passagemath_flint.py
  recipe-maintainers:
  - mkoeppe
