context:
  version: "8.22.0"
package:
  name: libcurl
  version: ${{ version }}
source:
  url: https://curl.se/download/curl-${{ version }}.tar.xz
  sha256: f7ef3ae8a22e521f289803fe93543eb64c329b58aa73a9e224dfd915a2a5f4f7
build:
  number: 0
  script: build.sh
requirements:
  build:
    - ${{ compiler('c') }}
    - cmake
    - ninja
    - pkg-config
  host:
    - openssl
    - zlib
about:
  homepage: https://curl.se/libcurl/
  license: curl
  license_file: COPYING
  summary: Static libcurl for linking Wesnoth on emscripten-wasm32
