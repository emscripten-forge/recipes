context:
  version: 0.13.1

package:
  name: xproperty
  version: ${{ version }}

source:
  url: https://github.com/jupyter-xeus/xproperty/archive/refs/tags/${{ version }}.tar.gz
  sha256: b41300838d0ca500d755f909377ba85b560da695809df20556d243c0f7023b23

build:
  number: 0

requirements:
  build:
  - ${{ compiler("cxx") }}
  - cmake
  - ninja
  host:
  - nlohmann_json
  run:
  - nlohmann_json

tests:
- script:
  - test -f $PREFIX/include/xproperty/xproperty.hpp

about:
  license: BSD-3-Clause
  license_family: BSD-3
  license_file: LICENSE
  summary: Traitlets-like C++ properties and implementation of the observer pattern
  homepage: https://github.com/jupyter-xeus/xproperty
extra:
  recipe-maintainers:
  - DerThorsten
  - JohanMabille

