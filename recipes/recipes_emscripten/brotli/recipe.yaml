context:
  version: 1.2.1

package:
  name: brotli
  version: ${{ version }}

source:
- url: https://github.com/google/brotli/archive/v${{ version }}.tar.gz
  sha256: 98d35d11a78dc453aebb7d10c3748f3f73ff78c8267c0dc697b8631f67bf7e8f

build:
  number: 0

requirements:
  build:
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - cross-python_emscripten-wasm32
  - cmake
  - ninja
  host:
  - python

about:
  license: MIT
  license_file: LICENSE
  summary: Brotli compression format
  homepage: https://github.com/google/brotli
extra:
  recipe-maintainers:
  - DerThorsten
