context:
  name: atlasofliegroups
  version: "1.0dev"
  rev: "7e1b958c7aa9456769cc9cf09ac1542814b4800a"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  git: https://github.com/jeffreyadams/atlasofliegroups.git
  rev: ${{ rev }}

build:
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - make
    - bison
    - flex
    - python >=3.6

tests:
- package_contents:
    files:
    - bin/atlas.js
    - bin/atlas.wasm
    - bin/Fokko.js
    - bin/Fokko.wasm

about:
  homepage: https://www.liegroups.org
  license: GPL-3.0-only
  license_file: LICENSE
  summary: Atlas of Lie Groups and Representations software.

extra:
  recipe-maintainers:
  - wangyenshu
