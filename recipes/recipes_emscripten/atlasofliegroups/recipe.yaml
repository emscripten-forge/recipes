context:
  name: atlasofliegroups
  version: alcove-light

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/jeffreyadams/atlasofliegroups/archive/refs/tags/${{ version }}.tar.gz
  sha256: 68fa6dac4b342cfd3d3e4a2a5f6764dc92803a773b4a131a59dec1b9c4be1990

build:
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - make
    - bison
    - flex
    - python >=3.6

tests:
- package_contents:
    files:
    - bin/atlas.js
    - bin/atlas.wasm
    - bin/Fokko.js
    - bin/Fokko.wasm

about:
  homepage: https://www.liegroups.org
  license: GPL-3.0-only
  license_file: LICENSE
  summary: Atlas of Lie Groups and Representations software.

extra:
  recipe-maintainers:
  - wangyenshu
