<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swing application demo</title>
<link rel="stylesheet" href="style.css"></head>
<body><main>
<h1>Swing application</h1>
<p class="lead">A Java program started with <code>OpenJDK8.run()</code>; its frame is drawn in the box below.</p>
<div id="screen" class="screen"></div>
<div id="status">Loading the Java runtime&hellip;</div>
<div id="console"></div>
<p class="note"><a href="index.html">All demos</a></p>
<script src="../openjdk8-web.js" data-applets="off"></script>
<script>
(function () {
var out = document.getElementById('console'), statusEl = document.getElementById('status');
function log(s) { out.textContent += s + '\n'; out.scrollTop = out.scrollHeight; console.log(s); }
OpenJDK8.run({
  root: document.getElementById('screen'),
  documentTitle: false,
  args: ['-cp', '/app/swingdemo.jar', 'SwingDemo'],
  files: { '/app/swingdemo.jar': 'swingdemo.jar' },
  onStdout: log,
  onStderr: log,
  onProgress: function (loaded, total) {
    statusEl.textContent = 'Loading the Java runtime ' + Math.round(100 * loaded / total) + '%';
  },
  onExit: function (rc) { statusEl.textContent = 'Java exited with status ' + rc; },
}).then(function () { statusEl.textContent = 'Java is running.'; },
        function (e) { statusEl.textContent = 'Could not start Java: ' + e.message; });
})();
</script>
</main></body></html>
