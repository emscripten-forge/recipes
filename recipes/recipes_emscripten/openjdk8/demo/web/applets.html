<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Java applets demo</title>
<link rel="stylesheet" href="style.css"></head>
<body><main>
<h1>Java applets</h1>
<p class="lead">Both applets run in one Java VM. Click the AWT applet to play a sound and call JavaScript;
drag to draw.</p>
<div class="row">
  <div>
    <h2>AWT applet</h2>
    <applet code="DemoApplet.class" codebase="classes/" width="380" height="240" name="demo">
      <param name="message" value="Hello from an AWT applet!">
      <param name="bgcolor" value="#fffbe6">
      Java applets are not supported by this browser.
    </applet>
  </div>
  <div>
    <h2>Swing applet</h2>
    <object type="application/x-java-applet" width="300" height="240">
      <param name="code" value="SwingApplet">
      <param name="archive" value="swingapplet.jar">
    </object>
  </div>
</div>
<p id="js-out">LiveConnect: click the AWT applet.</p>
<p class="note"><a href="index.html">All demos</a></p>
<script>
function appletClicked(n, from) {
  document.getElementById('js-out').textContent = 'LiveConnect: applet click #' + n + ' ' + from;
  return 'ok-' + n;
}
</script>
<script src="../openjdk8-web.js"></script>
</main></body></html>
