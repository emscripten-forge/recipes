context:
  name: openjdk8
  version: "jdk8u504-ga"
  support_version: "0.3.0"
  icedtea_web_version: "1.8.8"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  - url: https://github.com/openjdk/jdk8u/archive/refs/tags/${{ version }}.tar.gz
    sha256: 406a990606b3452485b1554d0b9463fa0ef8e34c70cd1033b54ff12dd9a2f611
    patches:
      # configure: the wasm32-unknown-emscripten target (Zero VM)
      - patches/0001-build-wasm32-emscripten-target.patch
      # HotSpot Zero: Emscripten build flags, OS layer for a single-process,
      # signal-free environment, cooperative threads (gthread-jspi)
      - patches/0002-hotspot-zero-on-emscripten.patch
      # clang may otherwise fold markOop lock-bit tests (monitors hang)
      - patches/0003-hotspot-markoop-value-alignment.patch
      # class library natives: built-in (statically linked) JNI libraries,
      # NIO without epoll, console input, XAWT as the only toolkit
      - patches/0004-jdk-native-libraries-on-emscripten.patch
      # Java Sound: Direct Audio playback through Web Audio
      - patches/0005-javasound-webaudio-direct-audio.patch
      # AWT on x11.wasm: X11 structure layouts computed for its headers,
      # its wide KeyCode narrowed in the modifier map XToolkit reads
      - patches/0006-awt-x11wasm-struct-layouts-and-keycode.patch
  # build support: compiler wrapper, browser runtime, link and JRE staging
  # scripts, launcher, applet and Web Start loader
  - url: https://github.com/wangyenshu/openjdk8-support/archive/refs/tags/v${{ support_version }}.tar.gz
    sha256: b25e88743395e3d7be3eba9b92e23a4013a96b5f9444f6faaf27dab33637999d
    target_directory: support
  # Java Web Start: IcedTea-Web's NetX (javaws), built by
  # support/javaws/build-javaws.sh into openjdk8-javaws.jar
  - url: https://github.com/AdoptOpenJDK/IcedTea-Web/archive/refs/tags/icedtea-web-${{ icedtea_web_version }}.tar.gz
    sha256: f4203a605a3c9c50acdcc6eef4a366b9fdd36d95edcd76bcbfede01107cb5fe6
    target_directory: icedtea-web

build:
  number: 1
  script: build.sh

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    # configure checks for a compiler for the build machine
    - gcc
    - gxx
    # boot JDK: compiles the Java class library and runs the build tools
    - openjdk 8.*
    - make
    - zip
    - unzip
    # DejaVu fonts, bundled in the JRE (lib/fonts)
    - font-ttf-dejavu
    # headers only (libcups is dlopen()ed, which fails in wasm)
    - libcups
    # (python comes with the Emscripten toolchain)
  host:
    - x11-wasm
    - gthread-jspi
    - freetype
    - zlib
    # headers only (the JDK loads fontconfig at run time when present)
    - fontconfig
    # Zero calls every JNI method through ffi_call; this variant's calls can
    # block and switch green threads (JSPI). Not libffi-pthread: it calls
    # through JavaScript (JSPI cannot suspend those frames) and needs
    # stackSave, which this non-pthread module does not have.
    - libffi-jspi
  # everything is linked statically into openjdk8.wasm
  ignore_run_exports:
    by_name:
      - freetype
      - zlib
      - libpng
      - fontconfig
      - expat
      - x11-wasm
      - gthread-jspi

tests:
  - package_contents:
      files:
        - share/openjdk8-wasm/openjdk8.js
        - share/openjdk8-wasm/openjdk8.wasm
        - share/openjdk8-wasm/openjdk8-jre.json
        - share/openjdk8-wasm/openjdk8-jre.data.gz
        - share/openjdk8-wasm/openjdk8-web.js
        - share/openjdk8-wasm/openjdk8-javaws.jar

about:
  homepage: https://openjdk.org/projects/jdk8u/
  repository: https://github.com/openjdk/jdk8u
  # OpenJDK; DejaVu fonts; support code; IcedTea-Web (openjdk8-javaws.jar:
  # NetX is LGPL-2.1+, newer files GPL-2.0 with the Classpath exception)
  license: GPL-2.0-only WITH Classpath-exception-2.0 AND Bitstream-Vera AND MIT AND LGPL-2.1-or-later
  license_file:
    - LICENSE
    - ASSEMBLY_EXCEPTION
    - THIRD_PARTY_README
    # the build support code and browser runtime (openjdk8-support)
    - support/LICENSE
    # the bundled DejaVu fonts
    - support/jre-overlay/lib/fonts/LICENSE-DejaVu.txt
    # libffi (libffi-jspi), linked into openjdk8.wasm; build.sh copies it
    # from the host prefix
    - libffi-jspi/LICENSE
    # IcedTea-Web (openjdk8-javaws.jar)
    - icedtea-web/LICENSE
    - icedtea-web/COPYING
  summary: OpenJDK 8 Java runtime for WebAssembly, with AWT/Swing and applets in the browser
  description: |
    The OpenJDK 8 Java runtime (HotSpot Zero interpreter and the complete
    Java SE 8 class library) compiled to WebAssembly.

    In the browser, AWT and Swing windows are drawn by x11.wasm (the XAWT
    toolkit and the Java2D X11 pipeline with FreeType fonts), Java Sound
    plays through Web Audio, http/https URLs are fetched with fetch(), and
    netscape.javascript.JSObject (LiveConnect) calls into the page.
    share/openjdk8-wasm/openjdk8-web.js starts the <applet>, <object> and <embed>
    applets of a page in one Java VM, or runs a program with OpenJDK8.run().
    Java threads are cooperative green threads (gthread-jspi), so a browser
    with WebAssembly JSPI is needed (Chrome/Edge 137 or later), but no
    SharedArrayBuffer or cross-origin isolation.

    Java Web Start: following a link to a .jnlp file on such a page (or
    calling OpenJDK8.runJNLP(url)) runs the application with IcedTea-Web's
    javaws, share/openjdk8-wasm/openjdk8-javaws.jar, which is only fetched
    then. Its security dialogs work as on the desktop.

    openjdk8-java (from openjdk-tools) runs Java programs under Node.js 25 or
    later (headless AWT), like the java command, and openjdk8-javaws runs
    JNLP files.

    Installed files: share/openjdk8-wasm/{openjdk8.js, openjdk8.wasm, openjdk8-jre.json,
    openjdk8-jre.data.gz, openjdk8-web.js, openjdk8-javaws.jar}.
    Not included: the JDK tools (javac, ...), JIT compilers, debugging
    (JDWP), process creation, sockets other than http(s) via fetch.

extra:
  recipe-maintainers:
    - wangyenshu
