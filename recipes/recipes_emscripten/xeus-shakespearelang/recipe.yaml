context:
  version: 0.1.2

package:
  name: xeus-shakespearelang
  version: ${{ version }}

source:
  url: https://github.com/DerThorsten/xeus-pywrap/archive/refs/tags/${{ version }}.tar.gz
  sha256: bfe2aa21c3b5597d9f608e3207bed08846a98d051fb423d6fc9595c500639093


build:
  number: 0

requirements:
  build:
  - ${{ compiler("cxx") }}
  - python
  host:
  - python
  run:
  - python
  - xeus-pywrap >=0.1.1
  - tatsu

tests:
- package_contents:
    files:
    - share/jupyter/kernels/xeus_shakespearelang/kernel.json
    - lib/python3.13/site-packages/xeus_shakespearelang/__init__.py

about:
  license: BSD-3-Clause
  license_family: BSD-3
  license_file: LICENSE
  summary: xeus-shakespearelang
  homepage: https://github.com/DerThorsten/xeus-pywrap

extra:
  recipe-maintainers:
  - DerThorsten
