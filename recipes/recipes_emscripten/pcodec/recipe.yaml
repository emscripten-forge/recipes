context:
  name: pcodec
  version: 1.1.0

package:
  name: ${{ name }}
  version: ${{ version }}

source:
- url: https://files.pythonhosted.org/packages/source/p/pcodec/pcodec-${{ version }}.tar.gz
  sha256: 71d306ff461d7089fcf578649212afc6f78307b2a78d9c44d819a7eddeb3bfd0

build:
  number: 0
  script: |
    set -e
    export MATURIN_PYTHON_SYSCONFIGDATA_DIR=${PREFIX}/etc/conda/_sysconfigdata__emscripten_wasm32-emscripten.py
    export PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1
    rustup component add rust-src
    ${PYTHON} -m pip install . -vvv

requirements:
  build:
  - cross-python_${{ target_platform }}
  - maturin
  - pip
  - rust-nightly
  host:
  - python
  - pip
  - numpy
  run:
  - python
  - numpy

tests:
- script: pytester
  requirements:
    build:
    - pytester
    run:
    - pytester-run
  files:
    recipe:
    - test_pcodec.py

about:
  homepage: https://github.com/mwlon/pcodec
  repository: https://github.com/mwlon/pcodec
  summary: Good compression for numerical sequences
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
  - Copilot
