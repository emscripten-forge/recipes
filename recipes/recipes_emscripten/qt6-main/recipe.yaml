context:
  version: 6.11.2

package:
  name: qt6-main
  version: ${{ version }}

source:
  url: https://download.qt.io/official_releases/qt/6.11/${{ version }}/submodules/qtbase-everywhere-src-${{ version }}.tar.xz
  sha256: 5b2e00eccaf5a4d8c14134ffa0ea8dfd0a35ae1ffc7f8d87fa4305a1ed23cf22

build:
  number: 0

requirements:
  build:
  - ${{ compiler('cxx') }}
  - cmake
  - ninja
  - perl
  - python
  # Host Qt for the build platform — provides moc, rcc, uic, qt-configure-module
  # binaries that must run natively during the cross-compile.
  - qt6-main
  host:
  - zlib

tests:
- package_contents:
    files:
    - lib/libQt6Core.a
    - lib/libQt6Gui.a
    - lib/libQt6Widgets.a
    - lib/libQt6Xml.a
    - lib/libQt6Network.a
    - lib/cmake/Qt6/Qt6Config.cmake
    - include/QtCore/QString
- script:
  - build_tests.sh
  requirements:
    build:
    - ${{ compiler('cxx') }}
  files:
    recipe:
    - build_tests.sh

about:
  homepage: https://www.qt.io/
  repository: https://code.qt.io/qt/qtbase.git
  license: LGPL-3.0-only
  license_file: LICENSES/LGPL-3.0-only.txt
  summary: Qt6 base libraries (Core, Gui, Widgets, Network, Xml, ...) built for Emscripten (WASM)

extra:
  recipe-maintainers:
  - mmesch
