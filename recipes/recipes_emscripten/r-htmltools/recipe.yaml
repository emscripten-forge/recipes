context:
  name: htmltools
  version: 0.5.9

package:
  name: r-${{ name }}
  version: ${{ version }}

source:
  url:
  - https://cran.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cran.r-project.org/src/contrib/Archive/${{ name }}/${{ name }}_${{ version }}.tar.gz
  - https://cloud.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  sha256: 19308618da485818f69dcfeeadd2ddc81d43a736a74519df7b3fd98e13128afd
  patches:
  - patches/0001-Make-findDependencies-iterative.patch

build:
  number: 5
  # Dependencies not yet available for R 4.6.x on conda-forge
  skip: ${{ r_base == '4.6.1' }}
  script: $R CMD INSTALL $R_ARGS .

requirements:
  build:
  - ${{ compiler('c') }}
  - cross-r-base_${{ target_platform }} ==${{ r_base }}
  - r-base64enc
  - r-digest
  - r-fastmap
  - r-rlang
  host:
  - r-base ==${{ r_base }}
  - r-base64enc
  - r-digest
  - r-fastmap
  - r-rlang
  run:
  - r-base64enc
  - r-digest
  - r-fastmap
  - r-rlang

tests:
- package_contents:
    lib:
    - R/library/${{ name }}/libs/${{ name }}.so
- script: run_r_test
  files:
    recipe:
    - test_${{ name }}.R
  requirements:
    build:
    - r-wasm-tester

about:
  homepage: https://rstudio.github.io/htmltools/
  repository: https://github.com/rstudio/htmltools
  license: GPL-2.0-or-later
  license_file: ${{ PREFIX }}/lib/R/share/licenses/GPL-2
  license_family: GPL3
  summary: Tools for HTML
  description: Tools for creating, manipulating, and writing HTML from R.

extra:
  recipe-maintainers:
  - IsabelParedes
  - anutosh491
