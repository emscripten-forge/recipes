context:
  version: 1.5.2
  name: rasterio

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: e65a15b7bd22ce8f8ce8159856669dc9fafabf66cde6156e8f8e71d55abcd515

build:
  number: 0

requirements:
  build:
  - python
  - cython
  - cross-python_emscripten-wasm32
  - ${{ compiler("c") }}
  - pip
  - numpy
  - setuptools
  host:
  - numpy
  - libgdal-core
  - proj-static
  - python
  - geos-static
  - libiconv-static
  - libtiff-static
  - libpng-static
  - zlib-static
  run:
  - libgdal-core
  - numpy
  - affine
  - attrs
  - certifi
  - click
  - cligj

tests:
- script: pytester
  requirements:
    build:
    - pytester
    run:
    - pytester-run
  files:
    recipe:
    - test_rasterio.py

about:
  homepage: https://github.com/rasterio/rasterio
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Fast and direct raster I/O for use with Numpy and SciPy

extra:
  recipe-maintainers:
  - DerThorsten
  - IsabelParedes
