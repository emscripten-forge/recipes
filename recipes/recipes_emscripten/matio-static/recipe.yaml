context:
  name: matio-static
  version: 1.6.0

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/tbeu/matio/releases/download/v${{ version }}/matio-${{ version }}.tar.gz
  sha256: 1481dc74e01d249e90f064333f969369fe3dd11d6cc6963e8635c581aa5d7711
  patches:
    # the matio recipe's
    - patches/0002-Do-not-build-matdump-exe.patch
    - patches/0004-Add-missing-matio.cmake.in.patch

build:
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - cmake
    - make
  host:
    - hdf5-static
    - zlib
  run:
    # programs that link libmatio.a link these too
    - ${{ pin_compatible('hdf5-static', upper_bound='x.x.x') }}
    - zlib

tests:
  - package_contents:
      files:
        - include/matio-static/matio.h
        - include/matio-static/matio_pubconf.h
        - lib/matio-static/libmatio.a
        - lib/pkgconfig/matio-static.pc
        - share/licenses/matio-static/COPYING
  # MAT 5 (compressed) and MAT 7.3 (HDF5) files written and read back, in a
  # program without and one with pthreads (shared memory)
  - script:
      - export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
      - emcc -O2 test_matio.c $(pkg-config --cflags --libs --static matio-static) -o test_matio.js
      - node test_matio.js
      - emcc -O2 -pthread test_matio.c $(pkg-config --cflags --libs --static matio-static) -o test_matio_pthread.js
      - node test_matio_pthread.js
    requirements:
      build:
        - ${{ compiler('c') }}
        - pkg-config
    files:
      recipe:
        - test_matio.c

about:
  homepage: https://github.com/tbeu/matio
  license: BSD-2-Clause
  license_file: COPYING
  summary: MATLAB MAT file I/O library as a static archive (with MAT 7.3 / HDF5)
  description: |
    The matio package has matio as a side module (shared library). This
    package has the same version as a static archive linked with
    hdf5-static, for programs linked as a whole, including programs built
    with pthreads, which cannot load side modules. It reads and writes MAT
    files of versions 4, 5 (with compression) and 7.3 (HDF5). It is
    installed under its own names (include/matio-static, lib/matio-static,
    matio-static.pc) so that it never replaces, or is mistaken for, the
    matio package.

extra:
  recipe-maintainers:
    - wangyenshu
