context:
  name: sp
  version: 2.2-3

package:
  name: r-${{ name }}
  version: ${{ version | replace('-', '_') }}

source:
  url:
  - https://cran.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cloud.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cran.r-project.org/src/contrib/Archive/${{ name }}/${{ name }}_${{ version }}.tar.gz
  sha256: a238205229d60340df0911ad13b23d5f7e504c84f8b2917130d8f97c4c8523f5

build:
  number: 0
  # Dependencies not yet available for R 4.6.x on conda-forge
  skip: ${{ r_base == '4.6.1' }}
  script: $R CMD INSTALL $R_ARGS .

requirements:
  build:
  - cross-r-base_${{ target_platform }} ==${{ r_base }}
  - ${{ compiler('c') }}
  - r-lattice
  host:
  - r-base ==${{ r_base }}
  - r-lattice
  run:
  - r-lattice

tests:
- package_contents:
    lib:
    - R/library/${{ name }}/libs/${{ name }}.so
- script: run_r_test
  files:
    recipe:
    - test_${{ name }}.R
  requirements:
    build:
    - r-wasm-tester

about:
  homepage: https://edzer.github.io/sp/
  repository: https://github.com/edzer/sp/
  license: GPL-2.0-or-later
  license_file:
  - ${{ PREFIX }}/lib/R/share/licenses/GPL-2
  - ${{ PREFIX }}/lib/R/share/licenses/GPL-3
  summary: Classes and Methods for Spatial Data
  description: |
    Classes and methods for spatial data; the classes document where the spatial
    location information resides, for 2D or 3D data. Utility functions are
    provided, e.g. for plotting data as maps, spatial selection, as well as
    methods for retrieving coordinates, for subsetting, print, summary, etc.

extra:
  recipe-maintainers:
  - IsabelParedes
