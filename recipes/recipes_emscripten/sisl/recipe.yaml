context:
  name: sisl
  version: 0.20.0

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/s/sisl/sisl-${{ version }}.tar.gz
  sha256: b590b24030947a040ab6144e10dcf36b4d6c1fac2868fe880002a1869716e05e

build:
  number: 0
  script: build.sh

  files:
    exclude:
    - '**/__pycache__/**'
    - '**/*.pyc'
    - '**/test_*.py'
  python:
    skip_pyc_compilation:
    - '**/*.py'

requirements:
  build:
  - ${{ compiler('c') }}
  - ${{ compiler('cxx') }}
  - cross-python_${{ target_platform }}
  - python
  - pip
  - cmake >=3.15
  - scikit-build-core >=1.0
  - setuptools-scm >=8
  - cython >=3.0.8
  - numpy >=2.1.0
  host:
  - python
  - pip
  - numpy >=2.1.0
  - pyparsing
  run:
  - python
  - numpy
  - scipy >=1.15
  - pyparsing
  - xarray >=2024.3
  - pandas
  - matplotlib
  - tqdm

tests:
- script: pytester
  files:
    recipe:
    - test_sisl.py
  requirements:
    build:
    - pytester
    run:
    - pytester-run

about:
  homepage: https://github.com/zerothi/sisl
  license: MPL-2.0
  license_file: LICENSE
  summary: Manipulation and post-processing of DFT output and creating tight-binding models for NEGF transport
  repository: https://github.com/zerothi/sisl

extra:
  recipe-maintainers:
  - Copilot
