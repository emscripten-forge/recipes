context:
  name: planarity
  version: 5.1.0.0

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/graph-algorithms/edge-addition-planarity-suite/releases/download/Version_${{ version 
    }}/planarity-${{ version }}.tar.gz
  sha256: 4b05187bc0b44e042ed6e477723565e909a71de3c8c26bafe1dbca034e1a454b

build:
  number: 0

requirements:
  build:
  - autoconf
  - automake
  - libtool
  - make
  - pkg-config
  - autoconf-archive
  - ${{ compiler('cxx') }}

tests:
- package_contents:
    files:
    - lib/libplanarity.a
    - include/planarity/graphLib.h

about:
  homepage: https://github.com/graph-algorithms/edge-addition-planarity-suite
  license: LicenseRef-planarity
  license_file: LICENSE.TXT
  summary: implementations of the edge addition planar graph embedding algorithm and related algorithms

extra:
  recipe-maintainers:
  - wangyenshu
