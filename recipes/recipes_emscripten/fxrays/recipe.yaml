context:
  name: fxrays
  version: 1.3.6

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/F/FXrays/FXrays-${{ version }}.tar.gz
  sha256: 7a93545a77b53ff4098d2c9768cc5422b54ac8c31797db96160ba48894db1c68

build:
  number: 0
  script: ${PYTHON} -m pip install . ${PIP_ARGS}

requirements:
  build:
  - ${{ compiler('c') }}
  - cross-python_${{ target_platform }}
  - python
  - pip
  - setuptools
  - wheel
  - cython
  host:
  - python
  run:
  - python

tests:
- script: pytester
  files:
    recipe:
    - test_fxrays.py
  requirements:
    build:
    - pytester
    run:
    - pytester-run
- package_contents:
    files:
    - lib/python3.13/site-packages/FXrays/FXraysmodule.cpython-313-wasm32-emscripten.so

about:
  homepage: https://github.com/3-manifolds/FXrays
  license: GPL-2.0-or-later
  license_file: README.rst
  summary: Integer points in rational polytopes, especially for normal surface theory
  repository: https://github.com/3-manifolds/FXrays

extra:
  recipe-maintainers:
  - wangyenshu
