context:
  name: llvmlite
  version: 0.49.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
- url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 00f16db782f4a13c78c5804aedc434e46794a77e89999a168f9401106270e50a
  patches:
  - patches/0001-emscripten-cmake-build-system.patch
  - patches/0002-add-wasmlinker-cpp.patch
  - patches/0003-add-wasmengine-python.patch
  - patches/0004-emscripten-python-compat.patch

build:
  number: 0

requirements:
  build:
  - python
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - cross-python_${{ target_platform }}
  - cmake
  - make

  host:
  - python
  - setuptools
  # llvm 22.* matches llvmlite 0.48's official LLVM support range.
  # liblldWasm.a + liblldCommon.a (for wasmlinker.cpp) are bundled in the
  # llvm package on emscripten-forge alongside the LLVM static archives.
  - llvm 22.*

  run:
  - python
  # view_dot_graph() uses Graphviz's in-process SWIG binding on Emscripten;
  # the ordinary python-graphviz backend requires an unavailable subprocess.
  - graphviz-python 15.*

tests:
- script: pytester
  files:
    recipe:
    - test_llvmlite.py
  requirements:
    build:
    - pytester
    run:
    - pytester-run

about:
  homepage: http://llvmlite.pydata.org
  license: BSD-2-Clause
  license_file: LICENSE
  summary: >
    A lightweight LLVM python binding for writing JIT compilers.
    Includes WasmExecutionEngine for JIT-like execution inside Emscripten/JupyterLite.
  documentation: http://llvmlite.pydata.org/
  repository: https://github.com/numba/llvmlite

extra:
  recipe-maintainers:
  - anutosh491
