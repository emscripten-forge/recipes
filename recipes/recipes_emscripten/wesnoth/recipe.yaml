context:
  version: "1.19.28"
package:
  name: wesnoth
  version: ${{ version }}
source:
  url: https://github.com/wesnoth/wesnoth/archive/refs/tags/${{ version }}.tar.gz
  patches:
    - 0001-emscripten-build.patch
build:
  number: 0
  script: build.sh
requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - cmake
    - ninja
    - pkg-config
  host:
    - boost-iostreams
    - boost-program-options
    - boost-regex
    - boost-thread
    - boost-random
    - boost-locale
    - boost-filesystem
    - boost-graph
    - lua >=5.4,<5.5
    - openssl
    - icu
    - fontconfig
    - cairo
    - pango >=1.50
    - sdl3 >=3.4
    - sdl3-image >=3.4
    - sdl3-mixer >=3.2
    - libogg >=1.3.6
    - libvorbis >=1.3.7
    - libcurl >=8.22
about:
  homepage: https://www.wesnoth.org/
  license: GPL-2.0-or-later
  license_file: COPYING
  summary: Battle for Wesnoth 1.19.28 compiled to WebAssembly with Emscripten
