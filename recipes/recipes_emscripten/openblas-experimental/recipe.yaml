context:
  name: openblas
  version: 0.3.35.dev0
  commit: 97fa0789a56d0ff374707e187d3327ccabc3f78a

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/OpenMathLib/OpenBLAS/archive/${{ commit }}.tar.gz
  sha256: b909e4e56928617d840d125fce273a4b4ef0e89e922cf8c5d7c0014c4bca6c89
  patches:
  # Branch containing these patches is emforge-on-develop at https://github.com/mmesch/OpenBLAS
  # (rebased onto OpenMathLib/OpenBLAS develop @ ${{ commit }}).
  # To regenerate:
  #   git format-patch ${{ commit }}..emforge-on-develop -o patches/
  #   cd patches && for f in [0-9]*-*.patch; do mv "$f" "${f#[0-9][0-9][0-9][0-9]-}"; done
  # Apply order is set by this list, not by filename. The last four patches
  # adapt the OpenBLAS test suite for emscripten/wasm.
  - patches/Remove-march-flags.patch
  - patches/Skip-linktest.patch
  - patches/Add-dummy-length-arguments-for-char-arguments.patch
  - patches/Return-void-not-int.patch
  - patches/Int-to-void-return-types-of-lapack-functions-used-by.patch
  - patches/Enable-LAPACK_FORTRAN_STDLEN_END-for-lapacke-calling.patch
  - patches/Clear-FEXTRALIB-when-linking-shared-library.patch
  - patches/Skip-fork-based-utests-for-emscripten.patch
  - patches/Run-OpenBLAS-tests-under-node-for-emscripten.patch
  - patches/Return-int-from-ctest-F77-wrappers-for-wasm-ABI.patch
  - patches/Use-int-return-for-f2c-Subroutine-decls-in-ctest.patch

build:
  number: 3

  files:
    exclude:
    - '**/test_*.py'

requirements:
  build:
  - ${{ compiler('c') }}
  - ${{ compiler('fortran') }}
  - cmake
  - make
  - nodejs
  host:
  - libflang >= 20.1

tests:
- package_contents:
    include:
    - cblas.h
    - f77blas.h
    - lapack.h
    - lapacke.h
    - openblas_config.h
    lib:
    - libopenblas.a
    - libopenblas.so
    files:
    - lib/pkgconfig/openblas.pc
- script: pytester
  files:
    recipe:
    - test_openblas.py
  requirements:
    build:
    - pytester
    run:
    - pytester-run

about:
  homepage: http://www.openblas.net/
  repository: https://github.com/OpenMathLib/OpenBLAS
  license: BSD-3-Clause
  license_file: LICENSE
  summary: An optimized BLAS library based on GotoBLAS2 1.13 BSD version (develop snapshot with WASM SIMD)

extra:
  maintainers:
  - mmesch
  channel: emscripten-forge-4x-experimental
