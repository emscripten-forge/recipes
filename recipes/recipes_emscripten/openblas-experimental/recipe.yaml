context:
  name: openblas
  version: 0.3.35.dev0
  commit: c097a72ac679659ffeaea741c52f4cf24b33f2d7

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/OpenMathLib/OpenBLAS/archive/${{ commit }}.tar.gz
  sha256: 89e4ad5dd62b830ee9f950bf9fa2d94fdf9b9ca209bc376582b7884d6edf423d
  patches:
  # Branch containing these patches is v0.3.35.dev0-emforge at https://github.com/mmesch/OpenBLAS
  # (rebased onto OpenMathLib/OpenBLAS develop @ ${{ commit }}).
  # Use `git format-patch ${{ commit }}..v0.3.35.dev0-emforge` to create patch files.
  # Patches 0009-0012 adapt the OpenBLAS test suite for emscripten/wasm.
  - patches/0001-Remove-march-flags.patch
  - patches/0002-Skip-linktest.patch
  - patches/0003-Add-emscripten-as-supported-arch.patch
  - patches/0004-Add-dummy-length-arguments-for-char-arguments.patch
  - patches/0005-Return-void-not-int.patch
  - patches/0006-Int-to-void-return-types-of-lapack-functions-used-by.patch
  - patches/0007-Enable-LAPACK_FORTRAN_STDLEN_END-for-lapacke-calling.patch
  - patches/0008-Clear-FEXTRALIB-when-linking-shared-library.patch
  - patches/0009-Skip-fork-based-utests-for-emscripten.patch
  - patches/0010-Run-OpenBLAS-tests-under-node-for-emscripten.patch
  - patches/0011-Return-int-from-ctest-F77-wrappers-for-wasm-ABI.patch
  - patches/0012-Use-int-return-for-f2c-Subroutine-decls-in-ctest.patch
  - patches/0013-wasm-use-relaxed-simd-madd-for-v_muladd-when-availab.patch

build:
  number: 1

  files:
    exclude:
    - '**/test_*.py'

requirements:
  build:
  - ${{ compiler('c') }}
  - ${{ compiler('fortran') }}
  - cmake
  - make
  - nodejs
  host:
  - libflang >= 20.1

tests:
- package_contents:
    include:
    - cblas.h
    - f77blas.h
    - lapack.h
    - lapacke.h
    - openblas_config.h
    lib:
    - libopenblas.a
    - libopenblas.so
    files:
    - lib/pkgconfig/openblas.pc
- script: pytester
  files:
    recipe:
    - test_openblas.py
  requirements:
    build:
    - pytester
    run:
    - pytester-run

about:
  homepage: http://www.openblas.net/
  repository: https://github.com/OpenMathLib/OpenBLAS
  license: BSD-3-Clause
  license_file: LICENSE
  summary: An optimized BLAS library based on GotoBLAS2 1.13 BSD version (develop snapshot with WASM SIMD)

extra:
  maintainers:
  - mmesch
  channel: emscripten-forge-4x-experimental
