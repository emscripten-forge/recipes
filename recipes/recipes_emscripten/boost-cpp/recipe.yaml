context:
  version: 1.92.0
  build_number: 0

build:
  number: ${{ build_number }}

outputs:
  - staging:
      name: build-cache
    build:
      script: build.sh
    requirements:
      build:
        - ${{ compiler('cxx') }}
      host:
        - bzip2
        - zlib
    source:
      - git: https://github.com/boostorg/boost.git
        tag: boost-${{ version }}

# >>> generated by scripts/gen_boost_deps.py - do not edit by hand
  - package:
      name: boost-callable_traits
      version: ${{ version }}
    inherit: build-cache
    build:
      script: bash "$RECIPE_DIR/gen_cmake_configs.sh" callable_traits header-only
      files:
        include:
          - include/boost/callable_traits/**
          - include/boost/callable_traits.hpp
          - lib/cmake/boost_callable_traits/boost_callable_traitsConfig.cmake
    requirements:
      run:

    tests:
      - script:
          - bash tests/build_tests_cmake.sh callable_traits
        requirements:
          build:
            - ${{ compiler("cxx") }}

        files:
          recipe:
            - tests/build_tests_cmake.sh
            - tests/CMakeLists.txt
            - tests/test_callable_traits.cpp
  - package:
      name: boost-config
