context:
  version: 1.92.0
  filename: boost_${{ version | replace('.', '_') }}

package:
  name: boost-cpp
  version: ${{ version }}
source:
  url: https://archives.boost.io/release/${{ version }}/source/${{ filename }}.tar.bz2
  sha256: 5c1d40cb8e19adbf740a4ec2da35b3e58f3f5804b1dce44deb53df72193cbc6c
  # patches:
  # - 0001-config-libcpp15.patch

build:
  number: 1

  files:
    exclude:
    - '**/test/**'
requirements:
  build:
  - ${{ compiler('cxx') }}
  host:
  - bzip2
  - zlib

  run:
  - bzip2

about:
  license: BSL-1.0
  license_file: LICENSE_1_0.txt
  summary: Free peer-reviewed portable C++ source libraries.

  homepage: http://www.boost.org/
extra:
  recipe-maintainers:
  - wolfv
  - Alexis Placet
