context:
  name: perl
  version: "5.44.0"
  # the two-component series, which is what perl names its architecture
  # dependent library directory after
  series: "5.44"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  - url: https://www.cpan.org/src/5.0/perl-${{ version }}.tar.gz
    sha256: 3b855066b92491cb40e86affb1ca57d1a388aa43e51b91c7806a32c2f65f96c3
    patches:
      - 0001-emscripten-no-fork-no-spawn-system.patch
      - 0002-emscripten-sigsuspend-not-here.patch

  # Pure-perl CPAN distributions, installed into site_perl by build.sh.
  #
  # This interpreter is static (usedl='undef', dlsrc='dl_none.xs'), so an XS
  # distribution would have to be linked into perl itself; a distribution written
  # purely in perl just needs its lib/ tree copied in.  They are fetched as
  # checksummed sources rather than with cpanm at build time, which keeps the
  # build reproducible and offline -- and cpanm could not cross-compile anything
  # for wasm anyway.
  #
  # JSON, XML::SAX (+ XML::SAX::Base, XML::NamespaceSupport), XML::Writer and SVG
  # are the modules polymake looks for.  The rest are widely used pure-perl
  # distributions that cost nothing to carry.
  - url: https://cpan.metacpan.org/authors/id/I/IS/ISHIGAKI/JSON-4.11.tar.gz
    sha256: 713bdbe724dbb915ed50265ffe47e079a511980cb2427aa19076788bb64c3182
    target_directory: cpan-dists/JSON
  - url: https://cpan.metacpan.org/authors/id/G/GR/GRANTM/XML-SAX-1.02.tar.gz
    sha256: 4506c387043aa6a77b455f00f57409f3720aa7e553495ab2535263b4ed1ea12a
    target_directory: cpan-dists/XML-SAX
  - url: https://cpan.metacpan.org/authors/id/G/GR/GRANTM/XML-SAX-Base-1.09.tar.gz
    sha256: 66cb355ba4ef47c10ca738bd35999723644386ac853abbeb5132841f5e8a2ad0
    target_directory: cpan-dists/XML-SAX-Base
  - url: https://cpan.metacpan.org/authors/id/P/PE/PERIGRIN/XML-NamespaceSupport-1.12.tar.gz
    sha256: 47e995859f8dd0413aa3f22d350c4a62da652e854267aa0586ae544ae2bae5ef
    target_directory: cpan-dists/XML-NamespaceSupport
  - url: https://cpan.metacpan.org/authors/id/J/JO/JOSEPHW/XML-Writer-0.900.tar.gz
    sha256: 73c8f5bd3ecf2b350f4adae6d6676d52e08ecc2d7df4a9f089fa68360d400d1f
    target_directory: cpan-dists/XML-Writer
  - url: https://cpan.metacpan.org/authors/id/M/MA/MANWAR/SVG-2.89.tar.gz
    sha256: 74751f6880accbf93b2235161ec459a3d07909928794c90f1adc91b158db7711
    target_directory: cpan-dists/SVG
  - url: https://cpan.metacpan.org/authors/id/E/ET/ETHER/Try-Tiny-0.32.tar.gz
    sha256: ef2d6cab0bad18e3ab1c4e6125cc5f695c7e459899f512451c8fa3ef83fa7fc0
    target_directory: cpan-dists/Try-Tiny
  - url: https://cpan.metacpan.org/authors/id/E/ET/ETHER/YAML-Tiny-1.76.tar.gz
    sha256: a8d584394cf069bf8f17cba3dd5099003b097fce316c31fb094f1b1c171c08a3
    target_directory: cpan-dists/YAML-Tiny
  - url: https://cpan.metacpan.org/authors/id/D/DA/DAGOLDEN/Path-Tiny-0.150.tar.gz
    sha256: ff20713d1a14d257af9c78209001f40dc177e4b9d1496115cbd8726d577946c7
    target_directory: cpan-dists/Path-Tiny
  - url: https://cpan.metacpan.org/authors/id/P/PL/PLICEASE/File-Which-1.27.tar.gz
    sha256: 3201f1a60e3f16484082e6045c896842261fc345de9fb2e620fd2a2c7af3a93a
    target_directory: cpan-dists/File-Which
  - url: https://cpan.metacpan.org/authors/id/I/IS/ISHIGAKI/Text-CSV-2.06.tar.gz
    sha256: dfcaec925a788b0ba41e51bc6d16e21b0e98b4c7af9b79395090add75f5e506f
    target_directory: cpan-dists/Text-CSV
  - url: https://cpan.metacpan.org/authors/id/O/OA/OALDERS/URI-5.37.tar.gz
    sha256: 5a8750ddd8ee743d7cc89bebdd542a9b78a34023164ebe19dea0c248e121c21e
    target_directory: cpan-dists/URI
  - url: https://cpan.metacpan.org/authors/id/H/HA/HAARG/Role-Tiny-2.002005.tar.gz
    sha256: 4618ec524618c104dc28a8cc86af129a00cad282aea7f4c75060ba05d4c8f4d7
    target_directory: cpan-dists/Role-Tiny
  - url: https://cpan.metacpan.org/authors/id/E/ET/ETHER/Class-Method-Modifiers-2.15.tar.gz
    sha256: 65cd85bfe475d066e9186f7a8cc636070985b30b0ebb1cde8681cf062c2e15fc
    target_directory: cpan-dists/Class-Method-Modifiers
  # Sub::Quote is a distribution of its own, not part of Moo; Moo fails to load
  # without it
  - url: https://cpan.metacpan.org/authors/id/H/HA/HAARG/Sub-Quote-2.006009.tar.gz
    sha256: 967282d54d2d51b198c67935594f93e4dea3e54d1e5bced158c94e29be868a4b
    target_directory: cpan-dists/Sub-Quote
  - url: https://cpan.metacpan.org/authors/id/H/HA/HAARG/Moo-2.005005.tar.gz
    sha256: fb5a2952649faed07373f220b78004a9c6aba387739133740c1770e9b1f4b108
    target_directory: cpan-dists/Moo

build:
  number: 1
  script: build.sh

requirements:
  build:
    - autoconf
    - automake
    - libtool
    - make
    - patch
    - pkg-config
    - autoconf-archive
    - perl
    - gcc
    - gxx
    - ${{ compiler("c") }}
    - ${{ compiler('cxx') }}
    - nodejs

tests:
- package_contents:
    files:
    - bin/perl.wasm
    - bin/perl
    # what an embedder links against: the interpreter itself, plus the core
    # extensions, which a perl without dynamic loading keeps as separate archives
    # rather than inside libperl.a
    - lib/perl5/${{ series }}/core_perl/CORE/libperl.a
    - lib/perl5/${{ series }}/core_perl/CORE/perl.h
    - lib/perl5/${{ series }}/core_perl/auto/POSIX/POSIX.a
    - lib/perl5/${{ series }}/core_perl/auto/List/Util/Util.a
    # pure-perl distributions
    - lib/perl5/site_perl/JSON.pm
    - lib/perl5/site_perl/XML/SAX.pm
    - lib/perl5/site_perl/XML/SAX/Base.pm
    - lib/perl5/site_perl/XML/SAX/PurePerl.pm
    - lib/perl5/site_perl/XML/SAX/ParserDetails.ini
    - lib/perl5/site_perl/XML/NamespaceSupport.pm
    - lib/perl5/site_perl/XML/Writer.pm
    - lib/perl5/site_perl/SVG.pm
    - lib/perl5/site_perl/Try/Tiny.pm
    - lib/perl5/site_perl/YAML/Tiny.pm
    - lib/perl5/site_perl/Path/Tiny.pm
    - lib/perl5/site_perl/File/Which.pm
    - lib/perl5/site_perl/Text/CSV.pm
    - lib/perl5/site_perl/URI.pm
    - lib/perl5/site_perl/Role/Tiny.pm
    - lib/perl5/site_perl/Class/Method/Modifiers.pm
    - lib/perl5/site_perl/Sub/Quote.pm
    - lib/perl5/site_perl/Moo.pm

about:
  homepage: https://www.perl.org/
  # perl 5 is dual licensed; build.sh already installs both texts
  license: GPL-1.0-or-later OR Artistic-1.0-Perl
  license_file:
    - Copying
    - Artistic
  summary: Perl is a highly capable, feature-rich programming language with over 38 years of development.

extra:
  recipe-maintainers:
    - wangyenshu
