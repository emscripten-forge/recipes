context:
  name: perl
  version: 5.45.1

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://www.cpan.org/src/5.0/perl-${{ version }}.tar.gz
  sha256: 2b6d691916596835c411ee0181b6c66e4ee1c8d6ab60f8b0733c7c9cf8b58e3e
  patches:
  - 0001-emscripten-no-fork-no-spawn-system.patch
  - 0002-emscripten-sigsuspend-not-here.patch

build:
  number: 0
  script: build.sh

requirements:
  build:
  - autoconf
  - automake
  - libtool
  - make
  - patch
  - pkg-config
  - autoconf-archive
  - perl
  - gcc
  - gxx
  - ${{ compiler("c") }}
  - ${{ compiler('cxx') }}
  - nodejs

tests:
- package_contents:
    files:
    - bin/perl.wasm
    - bin/perl

about:
  homepage: https://www.perl.org/
  license: GPL-1.0-or-later
  license_file: Copying
  summary: Perl is a highly capable, feature-rich programming language with over 38 years of development.

extra:
  recipe-maintainers:
  - wangyenshu
