context:
  name: spatialgeometry
  version: 1.4.2

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/spatialgeometry-${{version }}.tar.gz
  sha256: 82bc3325eb25395b974f076ce6a963852dba215a2b979a91d79a1a08f7f4ae0c

build:
  number: 0
  script: ${PYTHON} -m pip install . -vvv

  files:
    exclude:
    - '**/__pycache__/**'
    - '**/*.pyc'
  python:
    skip_pyc_compilation:
    - '**/*.py'

requirements:
  build:
  - ${{ compiler('c') }}
  - ${{ compiler('cxx') }}
  - cross-python_${{ target_platform }}
  - numpy
  - pip
  - scikit-build-core >=0.9
  - nanobind >=2
  host:
  - numpy
  - python
  run:
  - python
  - spatialmath-python >=1.0.0
  - numpy

tests:
- script: pytester
  requirements:
    build:
    - pytester
    run:
    - pytester-run
  files:
    recipe:
    - test_spatialgeometry.py

about:
  summary: A Shape and Geometry Package
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/jhavl/spatialgeometry

extra:
  recipe-maintainers:
  - IsabelParedes
