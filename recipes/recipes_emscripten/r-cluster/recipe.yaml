context:
  name: r-cluster
  version: 2.1.8.3

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url:
  - https://cran.r-project.org/src/contrib/cluster_${{ version }}.tar.gz
  - https://cloud.r-project.org/src/contrib/cluster_${{ version }}.tar.gz
  sha256: e240bebe2aa85f9d9f674cd7addc3dc9023f9e4c3f462eca94e582e22a5ce2e9

build:
  number: 0
  script: $R CMD INSTALL $R_ARGS .

requirements:
  build:
  - cross-r-base_${{ target_platform }} ==${{ r_base }}
  - ${{ compiler('c') }}
  - ${{ compiler('fortran') }}
  host:
  - libflang
  - r-base ==${{ r_base }}

tests:
- package_contents:
    lib:
    - R/library/cluster/libs/cluster.so
- script: run_r_test test_cluster.R
  files:
    recipe:
    - test_cluster.R
  requirements:
    build:
    - r-wasm-tester

about:
  homepage: https://svn.r-project.org/R-packages/trunk/cluster/
  license: GPL-2.0-or-later
  license_file: GPL-2
  summary: 'Finding Groups in Data: Cluster Analysis Extended Rousseeuw et al.'

extra:
  recipe-maintainers:
  - anutosh491
