context:
  name: mathicgb
  version: '1.5'

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url:
  - https://github.com/Macaulay2/mathicgb/releases/download/v${{ version }}/mathicgb-${{ version }}.tar.gz
  sha256: 07fc9683153430d137c239d57120e1dc8a2288e100002440298093dc12984624

build:
  number: 0

requirements:
  build:
  - autoconf
  - automake
  - libtool
  - make
  - pkg-config
  - autoconf-archive
  - ${{ compiler('cxx') }}
  host:
  - memtailor
  - mathic

tests:
- package_contents:
    files:
    - lib/libmathicgb.a
    - include/mathicgb.h
    - bin/mgb
    - bin/mgb.wasm

about:
  repository: https://github.com/Macaulay2/mathicgb
  license: GPL-2.0-or-later
  license_file:
  - gpl-2.0.txt
  - gpl-3.0.txt
  summary: Mathicgb is a program for computing Groebner basis and signature Grobner bases.

extra:
  recipe-maintainers:
  - wangyenshu
