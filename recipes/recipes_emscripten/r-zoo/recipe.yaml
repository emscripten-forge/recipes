context:
  version: 1.9-1
  name: zoo

package:
  name: r-${{ name }}
  version: ${{ version | replace("-", "_") }}

source:
  url:
  - https://cran.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cloud.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  sha256: a2d998726a9b528efd20af449099e4b2df53887a0d10f48ac9ba63992b3a053a

build:
  number: 0
  script: $R CMD INSTALL $R_ARGS .
  skip: ${{ r_base == '4.6.1' }}

requirements:
  build:
  - cross-r-base_${{ target_platform }} ==${{ r_base }}
  - ${{ compiler('c') }}
  - r-lattice
  host:
  - r-base ==${{ r_base }}
  - r-lattice
  run:
  - r-lattice

tests:
- package_contents:
    lib:
    - R/library/${{ name }}/libs/${{ name }}.so
- script: run_r_test
  files:
    recipe:
    - test_zoo.R
  requirements:
    build:
    - r-wasm-tester

about:
  homepage: http://zoo.R-Forge.R-project.org/
  license: GPL-2.0-or-later
  license_family: GPL
  license_file: ${{ PREFIX }}/lib/R/share/licenses/GPL-2
  summary: |
    S3 Infrastructure for Regular and Irregular Time Series (Z's Ordered Observations)
  description: |
    An S3 class with methods for totally ordered indexed observations. It is particularly aimed at irregular time
    series of numeric vectors/matrices and factors. zoo's key design goals are independence of a particular 
    index/date/time class and consistency with ts and base R by providing methods to extend standard generics.

extra:
  recipe-maintainers:
  - DerThorsten
