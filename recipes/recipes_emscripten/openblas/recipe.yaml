context:
  name: openblas
  version: 0.3.33

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/OpenMathLib/OpenBLAS/archive/v${{ version }}.tar.gz
  sha256: 6761af1d9f5d353ab4f0b7497be2643313b36c8f31caec0144bfef198e71e6ab
  patches:
  # Branch containing these patches is v0.3.33-emforge at https://github.com/jjerphan/OpenBLAS
  # Use `git format-patch v0.3.33..v0.3.33-emforge` to create patch files.
  - patches/0001-Remove-march-flags.patch
  - patches/0002-Skip-linktest.patch
  - patches/0003-Add-emscripten-as-supported-arch.patch
  - patches/0004-Add-dummy-length-arguments-for-char-arguments.patch
  - patches/0005-Return-void-not-int.patch
  - patches/0006-Int-to-void-return-types-of-lapack-functions-used-by.patch
  - patches/0007-Enable-LAPACK_FORTRAN_STDLEN_END-for-lapacke-calling.patch
  - patches/0008-Clear-FEXTRALIB-when-linking-shared-library.patch

build:
  number: 0

  files:
    exclude:
    - '**/test_*.py'

requirements:
  build:
  - ${{ compiler('c') }}
  - flang_${{ target_platform }} >= 20.1
  - cmake
  - make
  host:
  - libflang >= 20.1

tests:
- package_contents:
    include:
    - cblas.h
    - f77blas.h
    - lapack.h
    - lapacke.h
    - openblas_config.h
    lib:
    - libopenblas.a
    - libopenblas.so
    files:
    - lib/pkgconfig/openblas.pc
- script: pytester
  files:
    recipe:
    - test_openblas.py
  requirements:
    build:
    - pytester
    run:
    - pytester-run

about:
  homepage: http://www.openblas.net/
  repository: https://github.com/OpenMathLib/OpenBLAS
  license: BSD-3-Clause
  license_file: LICENSE
  summary: An optimized BLAS library based on GotoBLAS2 1.13 BSD version

extra:
  maintainers:
  - DerThorsten
  - anutosh491
  - IsabelParedes
  - ianthomas23
