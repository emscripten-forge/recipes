context:
  version: 0.8.0

package:
  name: xcanvas
  version: ${{ version }}

source:
  url: https://github.com/jupyter-xeus/xcanvas/archive/refs/tags/${{ version }}.tar.gz
  sha256: fa29aae0f500f9d72463f7dce58d258919ed8e429ea5b82f9c40b116b09525ab

build:
  number: 0

requirements:
  build:
  - ${{ compiler("cxx") }}
  - cmake
  - make
  host:
  - xproperty >=0.12.0,<0.13
  - nlohmann_json >=3.12
  - xwidgets >=0.30.0,<0.31

tests:
- script:
  - test -f $PREFIX/include/xcanvas/xcanvas.hpp
  - test -f $PREFIX/lib/libxcanvas.a
  - test -f $PREFIX/lib/libxcanvas.so

about:
  license: BSD-3-Clause
  license_family: BSD-3
  license_file: LICENSE
  summary: C++ back-end for ipycanvas
  homepage: https://github.com/jupyter-xeus/xcanvas
extra:
  recipe-maintainers:
  - DerThorsten
  - JohanMabille

