context:
  name: primesieve
  version: '12.17'

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/kimwalisch/primesieve/archive/refs/tags/v${{ version }}.tar.gz
  sha256: c18fe8cef84d3cb4f1f5f37d3737999c00489fddc1b58327b61d1e31c9a5b49c

build:
  number: 0

requirements:
  build:
  - autoconf
  - automake
  - libtool
  - make
  - ${{ compiler('cxx') }}
  run_exports:
  - ${{ pin_subpackage('primesieve', upper_bound='x.x') }}

tests:
- package_contents:
    files:
    - lib/libprimesieve.a
    - include/primesieve.h
    - bin/primesieve.js
    - bin/primesieve.wasm

about:
  homepage: https://github.com/kimwalisch/primesieve
  license: BSD-2-Clause
  license_file: COPYING
  summary: Fast prime number generator

extra:
  recipe-maintainers:
  - wangyenshu
