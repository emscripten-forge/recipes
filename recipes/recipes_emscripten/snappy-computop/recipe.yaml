context:
  name: snappy-computop
  version: 3.3.2

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/3-manifolds/SnapPy/archive/refs/tags/${{ version }}_as_released.tar.gz
  sha256: 2ba62fd23e5ee1e75685d30fef74880959c56e0e8f808f75ba95f88a5b2004e9
  patches:
  # snappy/pari.py's non-Sage branch imports CyPari, which has no source
  # release that works on python 3.13: its last sdist, 2.5.4, ships bindings
  # generated by Cython 0.29.32, and from 2.5.5 on there are wheels only.
  # The patch points that branch at CyPari2 instead -- the library CyPari
  # forked from, and the one the Sage branch just above it already uses.
  - patches/0001-use-cypari2-instead-of-cypari.patch

build:
  number: 0

requirements:
  build:
  - ${{ compiler('c') }}
  - ${{ compiler('cxx') }}
  - cross-python_emscripten-wasm32
  - pip <25
  host:
  - python
  - pip
  - setuptools
  - wheel
  - cython >=0.28
  run:
  - python
  - fxrays >=1.3
  - low_index >=1.2.1
  # Was cypari >=2.3. CyPari2 2.2.1 is the release that ported to PARI 2.17,
  # which is what this channel's pari package provides.
  - cypari2 >=2.2.1
  - spherogram >=2.4.1
  - snappy_manifolds >=1.4
  - decorator
  - packaging
  - pypng

tests:
- script: pytester
  files:
    recipe:
    - test_import_snappy.py
  requirements:
    build:
    - pytester
    run:
    - pytester-run
- package_contents:
    files:
    - lib/python3.13/site-packages/snappy/SnapPy.cpython-313-wasm32-emscripten.so
    - lib/python3.13/site-packages/snappy/SnapPyHP.cpython-313-wasm32-emscripten.so

about:
  homepage: https://snappy.computop.org/
  license: GPL-2.0-only
  license_file: README.rst
  summary: SnapPy is a package for studying the topology and geometry of 3-manifolds, with a focus on hyperbolic structures.

extra:
  recipe-maintainers:
  - wangyenshu