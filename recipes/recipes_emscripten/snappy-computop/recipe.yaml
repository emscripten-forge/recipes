context:
  name: snappy-computop
  version: 3.3.2

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/3-manifolds/SnapPy/archive/refs/tags/${{ version }}_as_released.tar.gz
  sha256: 2ba62fd23e5ee1e75685d30fef74880959c56e0e8f808f75ba95f88a5b2004e9

build:
  number: 0

requirements:
  build:
  - ${{ compiler('c') }}
  - ${{ compiler('cxx') }}
  - cross-python_${{ target_platform }}
  - python
  - pip
  - setuptools
  - wheel
  - cython >=0.28
  host:
  - python
  run:
  - python
  - fxrays >=1.3
  - low-index >=1.2.1
  # snappy.twister imports plink.LinkManager unconditionally.
  - plink >=2.4.9
  - cypari >=2.3
  - spherogram >=2.4.1
  - snappy-manifolds >=1.4
  - decorator
  - packaging
  - pypng
  - pyx
  - pickleshare

tests:
- script: pytester
  files:
    recipe:
    - test_snappy.py
  requirements:
    build:
    - pytester
    run:
    - pytester-run
- package_contents:
    files:
    - lib/python3.13/site-packages/snappy/SnapPy.cpython-313-wasm32-emscripten.so
    - lib/python3.13/site-packages/snappy/SnapPyHP.cpython-313-wasm32-emscripten.so
    - lib/python3.13/site-packages/snappy/twister/twister_core.cpython-313-wasm32-emscripten.so

about:
  homepage: https://snappy.computop.org/
  license: GPL-2.0-only
  license_file: README.rst
  summary: SnapPy is a package for studying the topology and geometry of 3-manifolds, with a focus on hyperbolic structures.
  repository: https://github.com/3-manifolds/SnapPy

extra:
  recipe-maintainers:
  - wangyenshu
