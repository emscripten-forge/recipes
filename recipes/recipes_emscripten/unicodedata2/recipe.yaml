context:
  version: 18.0.0
  name: unicodedata2

package:
  name: unicodedata2
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: a9536291a5204caf6423ca7c56131d44f2aafc2fada35ff3a5eac82f7f8c62a7

build:
  number: 0

  files:
    exclude:
    - '**/test_*.py'
requirements:
  build:
  - ${{ compiler("c") }}
  - cross-python_emscripten-wasm32
  - python
  - pip
  host:
  - python

tests:
- script: pytester
  files:
    recipe:
    - test_unicodedata2.py
  requirements:
    build:
    - pytester
    run:
    - pytester-run
about:
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: unicodedata backport/updates to python 3 and python 2.
extra:
  recipe-maintainers:
  - DerThorsten
