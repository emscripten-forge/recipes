context:
  name: nh3
  version: 0.3.7

package:
  name: ${{ name }}
  version: ${{ version }}

source:
- url: https://files.pythonhosted.org/packages/source/n/nh3/nh3-${{ version }}.tar.gz
  sha256: 71860d01c16f4d8c72e334e0674beb2b0899dbd0bf760de18932ef4390303848

build:
  number: 0
  script: |
    set -e
    export MATURIN_PYTHON_SYSCONFIGDATA_DIR=${PREFIX}/etc/conda/_sysconfigdata__emscripten_wasm32-emscripten.py
    export PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1
    rustup component add rust-src
    ${PYTHON} -m pip install . -vvv

requirements:
  build:
  - cross-python_${{ target_platform }}
  - maturin
  - pip
  - rust-nightly
  host:
  - python
  - pip
  run:
  - python

tests:
- script: pytester
  requirements:
    build:
    - pytester
    run:
    - pytester-run
  files:
    recipe:
    - test_nh3.py

about:
  homepage: https://nh3.readthedocs.io
  repository: https://github.com/messense/nh3
  summary: Python bindings to the ammonia HTML sanitization library
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
  - Copilot
