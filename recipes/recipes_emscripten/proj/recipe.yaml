context:
  name: proj
  version: 9.9.0

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://download.osgeo.org/proj/proj-${{ version }}.tar.gz
  sha256: 791a0610547eeabb17006cfd49cdbd2034f3240f47ed5e88a1031811f4e2bcf3
  patches:
  - patches/0001-drop-soversion-emscripten.patch

build:
  number: 0

  files:
    exclude:
    - share/man/man1/**
    - '**/*.ini'
requirements:
  build:
  - cmake
  - make
  - ${{ compiler('c') }}
  - ${{ compiler('cxx') }}
  - requests
  host:
  - sqlitecpp
  - libtiff
  run:
  - sqlitecpp
  - libtiff

tests:
- package_contents:
    files:
    - include/proj.h
    - lib/libproj.so
    - lib/pkgconfig/proj.pc

about:
  homepage: https://proj.org/
  license: MIT
  license_file: COPYING
  summary: Cartographic Projections and Coordinate Transformations Library

extra:
  recipe-maintainers:
  - KGB99
