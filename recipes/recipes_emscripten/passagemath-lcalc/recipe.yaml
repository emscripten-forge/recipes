context:
  version: 10.8.7

package:
  name: passagemath-lcalc
  version: ${{ version }}

source:
- url: https://pypi.org/packages/source/p/passagemath-lcalc/passagemath_lcalc-${{ version }}.tar.gz
  sha256: 9613bf769fb1fcbcba37db005b09b509bfc382698bd7eed16e728221e5cc5f00

build:
  script: ${{ PYTHON }} -m pip install .
  number: 0

requirements:
  build:
  - python
  - crossenv >=1.2
  - cross-python_emscripten-wasm32
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - pip
  - passagemath-setup
  - passagemath-environment
  - cython
  - cysignals
  - numpy
  - pkgconfig
  - passagemath-abi == ${{ version }}
  host:
  - python
  - gmp
  - lcalc
  - mpfr
  - ntl
  - pari
  - numpy
  - passagemath-modules
  run:
  - python
  - cysignals
  - passagemath-modules

tests:
- script: pytester
  files:
    recipe:
    - test_passagemath_lcalc.py
  requirements:
    build:
    - pytester
    run:
    - pytester-run
    - passagemath-repl

about:
  license: GPL-2.0-or-later
  license_file: README.rst
  summary: 'passagemath: L-function calculations with lcalc'
  description: |
    Distribution of a part of the Sage library.
    It provides an interface to Michael Rubinstein's L-function calculator.

extra:
  emscripten_tests:
    python:
      pytest_files:
      - test_passagemath_lcalc.py
  recipe-maintainers:
  - mkoeppe
