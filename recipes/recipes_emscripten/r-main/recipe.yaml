context:
  name: main
  version: 0.1.0
  python_build_string: ${{ "static_libpython_" if r_main_module_static_libpython == "1" else "" }}
  r_build_string: ${{ "r" ~ (r_base | version_to_buildstring) }}

package:
  name: r-${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/IsabelParedes/r-main/archive/refs/tags/${{ version }}.tar.gz
  sha256: 5f5dfdf9ebac93b9e43341392513976b541d01e732f7f436cab0055cf5c8eaf7

build:
  number: 5
  # Explicit build strings so downstream recipes can require the R / static-libpython
  # variants, e.g. `r-main * *r45*` or `r-main * *static_libpython*`.
  string: ${{ python_build_string ~ r_build_string ~ "h" ~ hash ~ "_" ~ build_number }}

  # Pass the variant into build.sh (not inferred from the script by rattler-build).
  script:
    file: build.sh
    env:
      R_MAIN_MODULE_STATIC_LIBPYTHON: ${{ r_main_module_static_libpython }}

  variant:
    # Ensure rattler-build includes this key in the variant matrix.
    use_keys:
    - r_main_module_static_libpython
    # Deprioritize the static-libpython variant so the default build stays
    # preferred by the solver (via down_prioritize_variant / track_features).
    down_prioritize_variant: ${{ 1 if r_main_module_static_libpython == "1" else 0 }}

requirements:
  build:
  - ${{ compiler('c') }}
  host:
  - r-base ==${{ r_base }}
  - libflang
  - libiconv
  - zlib
  - bzip2
  - liblzma
  - pcre2
  - libpng
  - libtiff
  - cairo
  - fontconfig
  - pixman
  - expat
  - freetype
  - zstd
  - libarchive
  # For the static-libpython variant: libpython statically linked into RPY executable.
  - if: r_main_module_static_libpython == "1"
    then:
    - python < 3.14
    - libpython < 3.14
    - libffi
    - sqlite
    - openssl < 4.0
  run:
  - if: r_main_module_static_libpython == "1"
    then:
    - python
    - r-main-module-abi * *static_libpython*
    else:
    - r-main-module-abi *vanilla*

tests:
- package_contents:
    files:
    - bin/Rmain.js
    - bin/Rmain.wasm

about:
  repository: https://github.com/IsabelParedes/r-main
  license: BSD-3-Clause
  license_family: BSD
  license_file: ${{ PREFIX }}/lib/R/share/licenses/BSD_3_clause
  summary: Embedded R MAIN_MODULE Front-End for WebAssembly

extra:
  recipe-maintainers:
  - IsabelParedes
