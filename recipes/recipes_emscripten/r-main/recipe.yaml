context:
  name: main
  version: 0.1.0

package:
  name: r-${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/IsabelParedes/${{ name }}/archive/refs/tags/${{ version }}.tar.gz
  sha256: 5f5dfdf9ebac93b9e43341392513976b541d01e732f7f436cab0055cf5c8eaf7

build:
  number: 5
  skip: ${{ r_base == '4.6.1' }}

requirements:
  build:
  - ${{ compiler('c') }}
  host:
  - r-base ==${{ r_base }}
  - libflang
  - libiconv
  - zlib
  - bzip2
  - liblzma
  - pcre2
  - libpng
  - libtiff
  - cairo
  - fontconfig
  - pixman
  - expat
  - freetype
  # untarjs
  - zstd
  - libarchive
  # For the r-py output: libpython statically linked into RPY executable.
  - python < 3.14
  - libpython < 3.14
  - libffi
  - sqlite
  - openssl < 4.0

tests:
- package_contents:
    files:
    - bin/Rmain.js
    - bin/Rmain.wasm

about:
  repository: https://github.com/IsabelParedes/r-main
  license: BSD-3-Clause
  license_family: BSD
  license_file: ${{ PREFIX }}/lib/R/share/licenses/BSD_3_clause
  summary: Embedded R MAIN_MODULE Front-End for WebAssembly

extra:
  recipe-maintainers:
  - IsabelParedes
