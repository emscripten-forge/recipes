context:
  name: pyinstrument
  version: 5.1.3

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/pyinstrument/pyinstrument-${{ version }}.tar.gz
  sha256: 93dc5576fa90bb267c46d864712329e8e057f51a6b15d0b4f917558d82066ba7

build:
  number: 0
  script: ${PYTHON} -m pip install . ${PIP_ARGS}

requirements:
  build:
  - python
  - cross-python_${{ target_platform }}
  - ${{ compiler('c') }}
  - pip
  host:
  - python
  - pip
  - setuptools
  run:
  - python

tests:
- script: pytester
  files:
    recipe:
    - test_pyinstrument.py
  requirements:
    build:
    - pytester
    run:
    - pytester-run

about:
  homepage: https://github.com/joerick/pyinstrument
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Call stack profiler for Python. Shows you why your code is slow!
  repository: https://github.com/joerick/pyinstrument

extra:
  recipe-maintainers:
  - Copilot
