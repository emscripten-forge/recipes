context:
  name: coolprop
  version: 7.2.0

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://downloads.sourceforge.net/project/coolprop/CoolProp/${{ version }}/source/CoolProp_sources.zip
  sha256: 2bd601b5e06b8765ab77fa121e2b0f4087b249c721ddb8745fd3e65952329689
  patches:
  - 0001-create-cython-output-dir.patch

build:
  number: 0
  script: build.sh

  files:
    exclude:
    - '**/__pycache__/**'
    - '**/*.pyc'
    - '**/test_*.py'
  python:
    skip_pyc_compilation:
    - '**/*.py'

requirements:
  build:
  - ${{ compiler('c') }}
  - ${{ compiler('cxx') }}
  - cross-python_${{ target_platform }}
  - python
  - pip
  - cmake >=3.15
  - scikit-build-core >=0.10
  - cython <3.1
  - numpy
  host:
  - python
  - pip
  - numpy
  run:
  - python
  - numpy
  - matplotlib
  - six

tests:
- script: pytester
  files:
    recipe:
    - test_coolprop.py
  requirements:
    build:
    - pytester
    run:
    - pytester-run

about:
  homepage: http://www.coolprop.org
  repository: https://github.com/CoolProp/CoolProp
  license: MIT
  license_file: LICENSE
  summary: Open-source thermodynamic and transport properties database

extra:
  recipe-maintainers:
  - Copilot
