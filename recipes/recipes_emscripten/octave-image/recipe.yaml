context:
  name: image
  version: "2.20.0"

package:
  name: octave-${{ name }}
  version: ${{ version }}

source:
  url: https://downloads.sourceforge.net/project/octave/Octave%20Forge%20Packages/Individual%20Package%20Releases/image-${{ version }}.tar.gz
  sha256: 5f8d97ed7f7d18ce854a8174bbf819e9e3a703bcd1cb2ca8b1ad15b9ef329522
  target_directory: ${{ name }}

build:
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - make
    - wabt
    - octave 10.3.*
  host:
    - octave 10.3.*

tests:
  - package_contents:
      files:
        - share/octave/packages/${{ name }}-${{ version }}/imgetfile.m

about:
  homepage: https://octave.sourceforge.io/image/
  license: GPL-3.0-or-later
  license_file: ${{ name }}/COPYING
  summary: Image processing toolbox for GNU Octave

extra:
  recipe-maintainers:
    - arjxn-py
    - DerThorsten
