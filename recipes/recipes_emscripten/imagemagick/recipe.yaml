context:
  version: 7.1.2-33
package:
  name: imagemagick
  version: ${{ version | replace("-","_") }}

source:
  url: https://github.com/ImageMagick/ImageMagick/archive/${{ version}}.tar.gz
  sha256: c768ff077cccff1b682aa56653b54247b268752427ca998992b24cc7c597d9e7
build:
  number: 0

  files:
    exclude:
    - share/man/man1/**
requirements:
  build:
  - libtool
  - ${{ compiler('c') }}
  - make
  - pkg-config
  host:
  - libtiff-static
  - libpng-static
  - libjpeg-turbo
  - libbzip2-static
  - libxml2
  - openjpeg
  - zlib-static

tests:
- package_contents:
    files:
    - lib/libMagick++-7.Q8.a
    - include/ImageMagick-7/Magick++.h

about:
  homepage: http://www.imagemagick.org/
  license: AGPL-3.0-only
  license_file: LICENSE
  summary: Software suite to create, edit, compose, or convert bitmap images.

