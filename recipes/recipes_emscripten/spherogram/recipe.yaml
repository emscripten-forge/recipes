context:
  name: spherogram
  version: 2.4.1

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/s/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 9351a77308fee452421b914ae55f3cdaff805692b834777aa6a034a9a85bf970

build:
  number: 0

requirements:
  build:
  - python
  - cross-python_${{ target_platform }}
  - ${{ compiler('c') }}
  - pip
  - setuptools
  # Deliberately no cython. The sdist ships the generated
  # planarity_src/planarity.c and planarmap_src/planarmap.c, and setup.py
  # only re-cythonizes when Cython happens to be importable.
  host:
  - python
  run:
  - python
  - decorator
  - networkx
  - packaging
  - snappy-manifolds >=1.4
  # Upstream asks for >=1.2.2, but that release is wheels-only; 1.2.1 is
  # the newest that can be built from source. The module is imported
  # lazily, inside Link.knot_floer_homology() and exhaust.py, so nothing
  # breaks at import time either way.
  - knot-floer-homology >=1.2.1

tests:
- script: pytester
  files:
    recipe:
    - test_spherogram.py
  requirements:
    build:
    - pytester
    run:
    - pytester-run

about:
  homepage: https://github.com/3-manifolds/spherogram
  license: GPL-2.0-or-later
  license_file: PKG-INFO
  summary: Tools for dealing with graphs, links, and their exteriors
  description: |
    Spherogram works with links and their diagrams: simplification,
    invariants, DT and PD codes, and the construction of link exteriors as
    triangulations. It is a required dependency of SnapPy, which imports it
    at the top of its __init__.py.

    The planarity C sources are vendored in the sdist, so this does not
    link the channel's separate planarity package.
  repository: https://github.com/3-manifolds/spherogram

extra:
  recipe-maintainers:
  - wangyenshu
