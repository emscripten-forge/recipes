context:
  name: umap-learn
  version: 0.6.0

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/lmcinnes/umap/archive/refs/tags/release-${{ version }}.tar.gz
  sha256: 3e1c5d1e847a8e6245aba725a818f79cff3d6cca69077d7279f64aae89eaac1d
  patches:
  - patches/num_threads.patch
  # path: /Users/thorstenbeier/src/umap
build:
  number: 0

requirements:
  build:
  - python
  - cross-python_emscripten-wasm32
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - pip
  - setuptools

  host:
  - python

  run:
  - python
  - setuptools
  - numpy >=1.17
  - numba >=0.51.2
  - scikit-learn >=0.22
  - scipy >=1.3.1
  - pynndescent >=0.5
  - tqdm

tests:
- package_contents:
    files:
    - lib/python*/site-packages/umap/*.py

about:
  homepage: http://github.com/lmcinnes/umap
  license: BSD-2-Clause
  license_file: LICENSE.txt
  summary: Uniform Manifold Approximation and Projection

extra:
  recipe-maintainers:
  - DerThorsten
