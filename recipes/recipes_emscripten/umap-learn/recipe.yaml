context:
  name: umap-learn
  version: 0.5.12

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/lmcinnes/umap/archive/refs/tags/release-${{ version }}.tar.gz
  sha256: 88eab759b2300b49ca7218f1c35a9036d25cfd2494f18f66fb2980752e187227

build:
  number: 0

requirements:
  build:
    - python
    - cross-python_emscripten-wasm32
    - ${{ compiler("c") }}
    - ${{ compiler("cxx") }}
    - pip
    - setuptools

  host:
    - python

  run:
    - python
    - setuptools
    - numpy >=1.17
    - numba >=0.51.2
    - scikit-learn >=0.22
    - scipy >=1.3.1
    - pynndescent >=0.5
    - tqdm

tests:
- script: pytester
  requirements:
    build:
      - pytester
    run:
      - pytester-run
  files:
    recipe:
      - test_umap_learn.py

about:
  homepage:  http://github.com/lmcinnes/umap
  license: BSD-2-Clause
  license_file: LICENSE.txt
  summary: Uniform Manifold Approximation and Projection

extra:
  recipe-maintainers:
  - DerThorsten