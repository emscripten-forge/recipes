context:
  version: 0.6.0
  name: r-gdtools

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url:
  - https://cran.r-project.org/src/contrib/gdtools_${{ version }}.tar.gz
  - https://cloud.r-project.org/src/contrib/gdtools_${{ version }}.tar.gz
  sha256: 9c80a7098d7af0019d5325d0d94d78d7fdac214a93d784ea2c4d4807cc826c9a
build:
  number: 0
  skip: ${{ r_base == '4.6.1' }}
  script: build.sh

requirements:
  build:
  - cross-r-base_${{ target_platform }} ==${{ r_base }}
  - ${{ compiler('c') }}
  - ${{ compiler('cxx') }}
  - pkg-config
  - r-fontquiver >=0.2.0
  - r-htmltools
  - r-rcpp >=0.12.12
  - r-systemfonts >=1.3.1
  host:
  - r-base ==${{ r_base }}
  - cairo
  - expat
  - fontconfig
  - freetype
  - libpng
  - pixman
  - zlib
  - r-fontquiver >=0.2.0
  - r-htmltools
  - r-rcpp >=0.12.12
  - r-systemfonts >=1.3.1
  run:
  - r-fontquiver >=0.2.0
  - r-htmltools
  - r-rcpp >=0.12.12
  - r-systemfonts >=1.3.1

tests:
- package_contents:
    lib:
    - R/library/gdtools/libs/gdtools.so
- script: RTESTER_MOUNT_FONTS=1 run_r_test test-gdtools.R
  files:
    recipe:
    - test-gdtools.R
  requirements:
    build:
    - r-wasm-tester

about:
  homepage: https://davidgohel.github.io/gdtools/
  repository: https://github.com/davidgohel/gdtools
  license: GPL-3.0-only
  license_file: LICENSE
  summary: Font metrics and font management utilities for R graphics

extra:
  recipe-maintainers:
  - adamblake
