context:
  name: xvega
  version: 0.2.0

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/jupyter-xeus/${{ name }}/archive/${{ version }}.tar.gz
  sha256: 35fccb3d19a61471d47440b699fdfd1adaba33f9544d20841a816f2bd30c714b

build:
  number: 0

requirements:
  build:
  - ${{ compiler("cxx") }}
  - cmake
  - ninja
  host:
  - nlohmann_json
  - xproperty
  run:
  - xproperty

tests:
- script:
  - test -f $PREFIX/lib/libxvega.a
  - test -f $PREFIX/include/xvega/xvega.hpp

about:
  license: BSD-3-Clause
  license_family: BSD-3
  license_file: LICENSE
  summary: xvega
  homepage: https://github.com/jupyter-xeus/xvega

extra:
  recipe-maintainers:
  - DerThorsten
