context:
  name: bitops
  version: 1.1-0

package:
  name: r-${{ name }}
  version: ${{ version | replace('-', '_') }}

source:
  url:
  - https://cran.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cloud.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  sha256: 73f063f15c6334d769202a178f7dd5499bdd10044a4ffbef571be57cbcc68b22

build:
  number: 0
  skip: ${{ r_base == '4.6.0' }}
  script: $R CMD INSTALL $R_ARGS .

requirements:
  build:
  - cross-r-base_${{ target_platform }} ==${{ r_base }}
  - ${{ compiler('c') }}
  host:
  - r-base ==${{ r_base }}


tests:
- package_contents:
    lib:
    - R/library/${{ name }}/libs/${{ name }}.so
- script: run_r_test test-r-bitops.R
  files:
    recipe:
    - test-r-bitops.R
  requirements:
    build:
    - r-wasm-tester

about:
  homepage: https://cran.r-project.org/web/packages/bitops/index.html
  repository: https://github.com/cran/bitops
  license: GPL-2.0-or-later
  license_file: GPL-3
  summary: Bitwise Operations for R
  description: |
    Tools for performing bitwise operations in R.

extra:
  recipe-maintainers:
  - DerThorsten
