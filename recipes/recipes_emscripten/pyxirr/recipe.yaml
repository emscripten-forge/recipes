context:
  name: pyxirr
  version: 0.10.8

package:
  name: ${{ name }}
  version: ${{ version }}

source:
- url: https://files.pythonhosted.org/packages/source/p/pyxirr/pyxirr-${{ version }}.tar.gz
  sha256: a5620dd76015444f26f805c4983a41664898fbf2a74956a28589b171ed96d2f5

build:
  number: 0
  script: |
    set -e
    export MATURIN_PYTHON_SYSCONFIGDATA_DIR=${PREFIX}/etc/conda/_sysconfigdata__emscripten_wasm32-emscripten.py
    rustup component add rust-src
    ${PYTHON} -m pip install . -vvv

requirements:
  build:
  - cross-python_${{ target_platform }}
  - maturin
  - pip
  - rust-nightly
  host:
  - python
  - pip
  run:
  - python

tests:
- script: pytester
  requirements:
    build:
    - pytester
    run:
    - pytester-run
  files:
    recipe:
    - test_pyxirr.py

about:
  homepage: https://github.com/Anexen/pyxirr
  repository: https://github.com/Anexen/pyxirr
  summary: Rust-powered collection of financial functions.
  license: Unlicense
  license_file: LICENSE

extra:
  recipe-maintainers:
  - Copilot
