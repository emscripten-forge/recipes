context:
  version: "3.4.6"
package:
  name: sdl3-image
  version: ${{ version }}
source:
  url: https://github.com/libsdl-org/SDL_image/releases/download/release-${{ version }}/SDL3_image-${{ version }}.tar.gz
  sha256: d2e4637ae700f72e5196b8fbd749850ed2e5e1e09c5a5be8d06ff55aaccf3b01
build:
  number: 0
  script: build.sh
requirements:
  build:
    - ${{ compiler('c') }}
    - cmake
    - ninja
  host:
    - sdl3 >=3.4.0
    - libwebp
about:
  homepage: https://github.com/libsdl-org/SDL_image
  license: Zlib
  license_file: LICENSE.txt
  summary: SDL3 image loading library for emscripten-wasm32
