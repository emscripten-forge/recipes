context:
  version: "3.2.4"
package:
  name: sdl3-mixer
  version: ${{ version }}
source:
  url: https://github.com/libsdl-org/SDL_mixer/releases/download/release-${{ version }}/SDL3_mixer-${{ version }}.tar.gz
  sha256: 182a07c745375e113dc740d43964ff21b0be29f29f59876c4dbc4db3d32f6901
build:
  number: 0
  script: build.sh
requirements:
  build:
    - ${{ compiler('c') }}
    - cmake
    - ninja
  host:
    - sdl3 >=3.2.0
about:
  homepage: https://github.com/libsdl-org/SDL_mixer
  license: Zlib
  license_file: LICENSE.txt
  summary: SDL3 mixer with WAV and stb_vorbis backends for emscripten-wasm32
