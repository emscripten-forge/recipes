context:
  version: "1.0.9"

package:
  name: tkrzw
  version: ${{ version }}

source:
  url: https://dbmx.net/tkrzw/pkg/tkrzw-${{ version }}.tar.gz
  sha256: ef008632d2a43f73b54130b4abc80347ca3e284a0e966408866550fd28624675
  patches:
    - emscripten.patch
    - emscripten-2.patch
build:
  number: 0

requirements:
  build:
    - ${{ compiler("c") }}
    - ${{ compiler("cxx") }}
    - make

tests:
  - package_contents:
      files:
        - include/tkrzw_dbm.h
        - include/tkrzw_dbm_hash.h
        - include/tkrzw_file.h
        - include/tkrzw_langc.h
        - lib/libtkrzw.a

about:
  homepage: https://dbmx.net/tkrzw/
  license: Apache-2.0
  license_file: COPYING
  summary: Tkrzw is a C++ library implementing DBM with various algorithms.

extra:
  recipe-maintainers:
    - wangyenshu
