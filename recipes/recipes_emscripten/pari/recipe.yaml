context:
  name: pari
  version: 2.19.1

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pari.math.u-bordeaux.fr/pub/pari/unix/pari-${{ version }}.tar.gz
  sha256: 419553b11ff8c3ecb8e9031b7d91d7cee003a5d721e685fcb499565c96fe2943

build:
  number: 0

requirements:
  build:
  - autoconf
  - automake
  - libtool
  - make
  - pkg-config
  - autoconf-archive
  - ${{ compiler('cxx') }}
  host:
  - gmp
  - readline
  - ncurses

tests:
- package_contents:
    files:
    - lib/libpari.a
    - bin/gp-sta.js
    - bin/gp-sta.wasm
    - include/pari/pari.h

about:
  homepage: https://pari.math.u-bordeaux.fr/
  license: GPL-2.0-only
  license_file: COPYING
  summary: PARI/GP is a cross platform and open-source computer algebra system designed for fast computations in number 
    theory

extra:
  recipe-maintainers:
  - wangyenshu
