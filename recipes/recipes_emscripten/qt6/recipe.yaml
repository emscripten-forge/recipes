context:
  version: 6.11.2
  # Major.minor derived from version so the version-bump bot updates the
  # URL prefix (qt/6.11/) automatically when version rolls to 6.12.x etc.
  major_minor: ${{ (version | split('.'))[0] }}.${{ (version | split('.'))[1] }}

build:
  number: 3

# Each output is built in two variants (jspi / nojspi) via the top-level
# wasm_jspi variant key in variant.yaml. Downstream Qt widget apps that
# use `app.exec()` need the jspi build so Qt's event loop can yield to
# the browser (via JavaScript Promise Integration). Users select via a
# build match spec, e.g.:
#
#   host:
#     - qt6-main[build=jspi*]
#
# Build string is `jspi_h<hash>_<num>` or `nojspi_h<hash>_<num>`. Bare
# `qt6-main` resolves to nojspi by default (jspi is down-prioritized).

outputs:
- package:
    name: qt6-main
    version: ${{ version }}
  source:
    url: https://download.qt.io/official_releases/qt/${{ major_minor }}/${{ version }}/submodules/qtbase-everywhere-src-${{ version }}.tar.xz
    sha256: 5b2e00eccaf5a4d8c14134ffa0ea8dfd0a35ae1ffc7f8d87fa4305a1ed23cf22
    patches:
    - patches/0001-wasm-clear-focus-window-on-tab-blur.patch
    - patches/0002-wasm-activate-on-show-for-toplevel-window.patch
  build:
    string: ${{ "jspi" if wasm_jspi == "1" else "nojspi" }}_h${{ hash }}_${{ build_number }}
    script:
      env:
        QT_EXTRA_FEATURES: ${{ "-feature-wasm-jspi" if wasm_jspi == "1" else "" }}
      content: bash ${{ RECIPE_DIR }}/build_qtbase.sh
    variant:
      use_keys:
      - wasm_jspi
      down_prioritize_variant: ${{ 1 if wasm_jspi == "1" else 0 }}
  requirements:
    build:
    - ${{ compiler('cxx') }}
    - cmake
    - ninja
    - qt6-main == ${{ version }}
    host:
    - zlib
  tests:
  - package_contents:
      files:
      - bin/qmake6
      - lib/libQt6Core.a
      - lib/libQt6Gui.a
      - lib/libQt6Widgets.a
      - lib/libQt6Xml.a
      - lib/libQt6Network.a
      - lib/cmake/Qt6/Qt6Config.cmake
      - include/QtCore/QString
      - plugins/platforms/libqwasm.a
      - plugins/imageformats/libqjpeg.a
      - plugins/imageformats/libqgif.a
      - plugins/imageformats/libqico.a
  - script:
    - build_tests_qtbase.sh
    requirements:
      build:
      - ${{ compiler('cxx') }}
    files:
      recipe:
      - build_tests_qtbase.sh
  about:
    summary: Qt6 base libraries (Core, Gui, Widgets, Network, Xml) for Emscripten (WASM)
    license_file: LICENSES/LGPL-3.0-only.txt

- package:
    name: qt6-svg
    version: ${{ version }}
  source:
    url: https://download.qt.io/official_releases/qt/${{ major_minor }}/${{ version }}/submodules/qtsvg-everywhere-src-${{ version }}.tar.xz
    sha256: d594337feca84c26fb67fe87b85e6a5c12fda404b611d905f9d138210c311876
  build:
    string: ${{ "jspi" if wasm_jspi == "1" else "nojspi" }}_h${{ hash }}_${{ build_number }}
    script: build_qtsvg.sh
    variant:
      use_keys:
      - wasm_jspi
      down_prioritize_variant: ${{ 1 if wasm_jspi == "1" else 0 }}
  requirements:
    build:
    - ${{ compiler('cxx') }}
    - cmake
    - ninja
    - qt6-main == ${{ version }}
    host:
    - ${{ pin_subpackage('qt6-main', exact=True) }}
    run:
    - ${{ pin_subpackage('qt6-main', exact=True) }}
  tests:
  - package_contents:
      files:
      - lib/libQt6Svg.a
      - lib/libQt6SvgWidgets.a
      - lib/cmake/Qt6Svg/Qt6SvgConfig.cmake
      - include/QtSvg/QSvgRenderer
  - script:
    - build_tests_qtsvg.sh
    requirements:
      build:
      - ${{ compiler('cxx') }}
    files:
      recipe:
      - build_tests_qtsvg.sh
  about:
    summary: Qt6 SVG rendering module for Emscripten (WASM)
    license_file: LICENSES/LGPL-3.0-only.txt

- package:
    name: qt6-5compat
    version: ${{ version }}
  source:
    url: https://download.qt.io/official_releases/qt/${{ major_minor }}/${{ version }}/submodules/qt5compat-everywhere-src-${{ version }}.tar.xz
    sha256: 68c320fe3391096a9f2d870170edf1b67dac8af1d0e51c0c9e5343807f114287
  build:
    string: ${{ "jspi" if wasm_jspi == "1" else "nojspi" }}_h${{ hash }}_${{ build_number }}
    script: build_qt5compat.sh
    variant:
      use_keys:
      - wasm_jspi
      down_prioritize_variant: ${{ 1 if wasm_jspi == "1" else 0 }}
  requirements:
    build:
    - ${{ compiler('cxx') }}
    - cmake
    - ninja
    - qt6-main == ${{ version }}
    host:
    - ${{ pin_subpackage('qt6-main', exact=True) }}
    run:
    - ${{ pin_subpackage('qt6-main', exact=True) }}
  tests:
  - package_contents:
      files:
      - lib/libQt6Core5Compat.a
      - lib/cmake/Qt6Core5Compat/Qt6Core5CompatConfig.cmake
      - include/QtCore5Compat/QTextCodec
  - script:
    - build_tests_qt5compat.sh
    requirements:
      build:
      - ${{ compiler('cxx') }}
    files:
      recipe:
      - build_tests_qt5compat.sh
  about:
    summary: Qt5 compatibility module (QTextCodec, etc.) for Emscripten (WASM)
    license_file: LICENSES/LGPL-3.0-only.txt

- package:
    name: qt6-imageformats
    version: ${{ version }}
  source:
    url: https://download.qt.io/official_releases/qt/${{ major_minor }}/${{ version }}/submodules/qtimageformats-everywhere-src-${{ version }}.tar.xz
    sha256: cecd8900f34b6550076309bc94f62f828008b633a4239e0a08c86788f41001f8
  build:
    string: ${{ "jspi" if wasm_jspi == "1" else "nojspi" }}_h${{ hash }}_${{ build_number }}
    script: build_qtimageformats.sh
    variant:
      use_keys:
      - wasm_jspi
      down_prioritize_variant: ${{ 1 if wasm_jspi == "1" else 0 }}
  requirements:
    build:
    - ${{ compiler('cxx') }}
    - cmake
    - ninja
    - qt6-main == ${{ version }}
    host:
    - ${{ pin_subpackage('qt6-main', exact=True) }}
    run:
    - ${{ pin_subpackage('qt6-main', exact=True) }}
  tests:
  - package_contents:
      files:
      - plugins/imageformats/libqtiff.a
      - plugins/imageformats/libqwebp.a
  - script:
    - build_tests_qtimageformats.sh
    requirements:
      build:
      - ${{ compiler('cxx') }}
    files:
      recipe:
      - build_tests_qtimageformats.sh
  about:
    summary: Qt6 extra image-format plugins (TIFF, WebP, JPEG, ...) for Emscripten (WASM)
    license_file: LICENSES/LGPL-3.0-only.txt

