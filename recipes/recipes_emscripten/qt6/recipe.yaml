context:
  version: 6.11.2

source:
- url: https://download.qt.io/official_releases/qt/6.11/${{ version }}/submodules/qtbase-everywhere-src-${{ version }}.tar.xz
  sha256: 5b2e00eccaf5a4d8c14134ffa0ea8dfd0a35ae1ffc7f8d87fa4305a1ed23cf22
  target_directory: qtbase
- url: https://download.qt.io/official_releases/qt/6.11/${{ version }}/submodules/qtsvg-everywhere-src-${{ version }}.tar.xz
  sha256: d594337feca84c26fb67fe87b85e6a5c12fda404b611d905f9d138210c311876
  target_directory: qtsvg
- url: https://download.qt.io/official_releases/qt/6.11/${{ version }}/submodules/qt5compat-everywhere-src-${{ version }}.tar.xz
  sha256: 68c320fe3391096a9f2d870170edf1b67dac8af1d0e51c0c9e5343807f114287
  target_directory: qt5compat
- url: https://download.qt.io/official_releases/qt/6.11/${{ version }}/submodules/qtimageformats-everywhere-src-${{ version }}.tar.xz
  sha256: cecd8900f34b6550076309bc94f62f828008b633a4239e0a08c86788f41001f8
  target_directory: qtimageformats
- url: https://download.qt.io/official_releases/qt/6.11/${{ version }}/submodules/qtwebchannel-everywhere-src-${{ version }}.tar.xz
  sha256: feb3149758bda887f0c292656194812dd2c227595badc8fbdeb2fb2311c5575f
  target_directory: qtwebchannel
- url: https://download.qt.io/official_releases/qt/6.11/${{ version }}/submodules/qtwebsockets-everywhere-src-${{ version }}.tar.xz
  sha256: 2bfe25c383c37f7690e3c59b02c9907d2744cf8527b1f3f1fc2c785b2ff3c9a3
  target_directory: qtwebsockets

build:
  number: 0

outputs:
- package:
    name: qt6-main
    version: ${{ version }}
  build:
    script: build_qtbase.sh
  requirements:
    build:
    - ${{ compiler('cxx') }}
    - cmake
    - ninja
    - perl
    - python
    - qt6-main == ${{ version }}
    host:
    - zlib
  tests:
  - package_contents:
      files:
      - bin/qmake6
      - lib/libQt6Core.a
      - lib/libQt6Gui.a
      - lib/libQt6Widgets.a
      - lib/libQt6Xml.a
      - lib/libQt6Network.a
      - lib/cmake/Qt6/Qt6Config.cmake
      - include/QtCore/QString
      - plugins/platforms/libqwasm.a
  - script:
    - build_tests_qtbase.sh
    requirements:
      build:
      - ${{ compiler('cxx') }}
    files:
      recipe:
      - build_tests_qtbase.sh
  about:
    summary: Qt6 base libraries (Core, Gui, Widgets, Network, Xml) for Emscripten (WASM)
    license_file: qtbase/LICENSES/LGPL-3.0-only.txt

- package:
    name: qt6-svg
    version: ${{ version }}
  build:
    script: build_qtsvg.sh
  requirements:
    build:
    - ${{ compiler('cxx') }}
    - cmake
    - ninja
    - perl
    - python
    - qt6-main == ${{ version }}
    host:
    - ${{ pin_subpackage('qt6-main', exact=True) }}
    run:
    - ${{ pin_subpackage('qt6-main', exact=True) }}
  tests:
  - package_contents:
      files:
      - lib/libQt6Svg.a
      - lib/libQt6SvgWidgets.a
      - lib/cmake/Qt6Svg/Qt6SvgConfig.cmake
      - include/QtSvg/QSvgRenderer
  - script:
    - build_tests_qtsvg.sh
    requirements:
      build:
      - ${{ compiler('cxx') }}
    files:
      recipe:
      - build_tests_qtsvg.sh
  about:
    summary: Qt6 SVG rendering module for Emscripten (WASM)
    license_file: qtsvg/LICENSES/LGPL-3.0-only.txt

- package:
    name: qt6-5compat
    version: ${{ version }}
  build:
    script: build_qt5compat.sh
  requirements:
    build:
    - ${{ compiler('cxx') }}
    - cmake
    - ninja
    - perl
    - python
    - qt6-main == ${{ version }}
    host:
    - ${{ pin_subpackage('qt6-main', exact=True) }}
    run:
    - ${{ pin_subpackage('qt6-main', exact=True) }}
  tests:
  - package_contents:
      files:
      - lib/libQt6Core5Compat.a
      - lib/cmake/Qt6Core5Compat/Qt6Core5CompatConfig.cmake
      - include/QtCore5Compat/QTextCodec
  - script:
    - build_tests_qt5compat.sh
    requirements:
      build:
      - ${{ compiler('cxx') }}
    files:
      recipe:
      - build_tests_qt5compat.sh
  about:
    summary: Qt5 compatibility module (QTextCodec, etc.) for Emscripten (WASM)
    license_file: qt5compat/LICENSES/LGPL-3.0-only.txt

- package:
    name: qt6-imageformats
    version: ${{ version }}
  build:
    script: build_qtimageformats.sh
  requirements:
    build:
    - ${{ compiler('cxx') }}
    - cmake
    - ninja
    - perl
    - python
    - qt6-main == ${{ version }}
    host:
    - ${{ pin_subpackage('qt6-main', exact=True) }}
    run:
    - ${{ pin_subpackage('qt6-main', exact=True) }}
  tests:
  - package_contents:
      files:
      - plugins/imageformats/libqtiff.a
      - plugins/imageformats/libqwebp.a
      - plugins/imageformats/libqjpeg.a
  - script:
    - build_tests_qtimageformats.sh
    requirements:
      build:
      - ${{ compiler('cxx') }}
    files:
      recipe:
      - build_tests_qtimageformats.sh
  about:
    summary: Qt6 extra image-format plugins (TIFF, WebP, JPEG, ...) for Emscripten (WASM)
    license_file: qtimageformats/LICENSES/LGPL-3.0-only.txt

- package:
    name: qt6-webchannel
    version: ${{ version }}
  build:
    script: build_qtwebchannel.sh
  requirements:
    build:
    - ${{ compiler('cxx') }}
    - cmake
    - ninja
    - perl
    - python
    - qt6-main == ${{ version }}
    host:
    - ${{ pin_subpackage('qt6-main', exact=True) }}
    run:
    - ${{ pin_subpackage('qt6-main', exact=True) }}
  tests:
  - package_contents:
      files:
      - lib/libQt6WebChannel.a
      - lib/cmake/Qt6WebChannel/Qt6WebChannelConfig.cmake
      - include/QtWebChannel/QWebChannel
  - script:
    - build_tests_qtwebchannel.sh
    requirements:
      build:
      - ${{ compiler('cxx') }}
    files:
      recipe:
      - build_tests_qtwebchannel.sh
  about:
    summary: Qt6 WebChannel (JavaScript <-> Qt object bridge) for Emscripten (WASM)
    license_file: qtwebchannel/LICENSES/LGPL-3.0-only.txt

- package:
    name: qt6-websockets
    version: ${{ version }}
  build:
    script: build_qtwebsockets.sh
  requirements:
    build:
    - ${{ compiler('cxx') }}
    - cmake
    - ninja
    - perl
    - python
    - qt6-main == ${{ version }}
    host:
    - ${{ pin_subpackage('qt6-main', exact=True) }}
    run:
    - ${{ pin_subpackage('qt6-main', exact=True) }}
  tests:
  - package_contents:
      files:
      - lib/libQt6WebSockets.a
      - lib/cmake/Qt6WebSockets/Qt6WebSocketsConfig.cmake
      - include/QtWebSockets/QWebSocket
  - script:
    - build_tests_qtwebsockets.sh
    requirements:
      build:
      - ${{ compiler('cxx') }}
    files:
      recipe:
      - build_tests_qtwebsockets.sh
  about:
    summary: Qt6 WebSockets (RFC 6455) client/server for Emscripten (WASM)
    license_file: qtwebsockets/LICENSES/LGPL-3.0-only.txt

about:
  homepage: https://www.qt.io/
  repository: https://code.qt.io/qt/qt5.git
  license: LGPL-3.0-only
  license_file: qtbase/LICENSES/LGPL-3.0-only.txt
  summary: Qt6 libraries built for Emscripten (WASM)

extra:
  recipe-maintainers:
  - mmesch
