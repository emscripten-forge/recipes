context:
  version: 0.11.0

package:
  name: xeus-sqlite
  version: ${{ version }}

source:
  url: https://github.com/jupyter-xeus/xeus-sqlite/archive/refs/tags/${{ version }}.tar.gz
  sha256: 230a0aef9a3fc6962b43af650b192c36c1f9b6147be95a631957e8bb61e11041

build:
  number: 0

requirements:
  build:
  - ${{ compiler("cxx") }}
  - cmake
  - ninja
  host:
  - nlohmann_json >= 3.12
  - xproperty >=0.13.1,<0.14
  - cpp-tabulate
  - xvega
  - xvega-bindings
  - xeus-lite >=5.0,<6.0
  - xeus >=6.0,<7.0
  - sqlitecpp

tests:
- package_contents:
    files:
    - bin/xsqlite.js
    - bin/xsqlite.wasm

about:
  license: BSD-3-Clause
  license_family: BSD-3
  license_file: LICENSE
  summary: xeus-sqlite
  homepage: https://github.com/jupyter-xeus/xeus-sqlite
extra:
  recipe-maintainers:
  - DerThorsten
  - JohanMabille
