context:
  name: lrslib
  version: '0.73a'

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://cgm.cs.mcgill.ca/~avis/C/lrslib/archive/lrslib-${{ version | replace('.', '') }}.tar.gz
  sha256: 7fb16ad5c2b7380ef8deaecbfaf53599eef074fd225012aa431b76ee0bded6a6

build:
  number: 0

requirements:
  build:
  - make
  - ${{ compiler("c") }}
  - ${{ compiler('cxx') }}
  - pkg-config
  host:
  - gmp

tests:
- package_contents:
    files:
    - lib/liblrs.a
    - include/lrslib/lrslib.h

about:
  homepage: http://cgm.cs.mcgill.ca/~avis/C/lrs.html
  license: GPL-2.0-only
  license_file: COPYING
  summary: Reverse search algorithm for vertex enumeration/convex hull problems by David Avis.

extra:
  recipe-maintainers:
  - wangyenshu
