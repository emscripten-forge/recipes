context:
  name: lrslib
  version: '0.73'

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://cgm.cs.mcgill.ca/~avis/C/lrslib/archive/lrslib-${{ version | replace('.', '') }}.tar.gz
  sha256: c49a4ebd856183473d1d5a62785fcdfe1057d5d671d4b96f3a1250eb1afe4e83

build:
  number: 0

requirements:
  build:
  - make
  - ${{ compiler("c") }}
  - ${{ compiler('cxx') }}
  - pkg-config
  host:
  - gmp

tests:
- package_contents:
    files:
    - lib/liblrs.a
    - include/lrslib/lrslib.h

about:
  homepage: http://cgm.cs.mcgill.ca/~avis/C/lrs.html
  license: GPL-2.0-only
  license_file: COPYING
  summary: Reverse search algorithm for vertex enumeration/convex hull problems by David Avis.

extra:
  recipe-maintainers:
  - wangyenshu
