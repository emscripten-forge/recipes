context:
  name: libprotobuf
  version: '36.1'
  major_version: 7

package:
  name: ${{ name }}
  version: ${{ major_version }}.${{ version }}

source:
  url: https://github.com/protocolbuffers/protobuf/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 7a7baff8207a57f3fe5c233d432a09eba67bdfb55a3145839d0817cae8e807a4

build:
  number: 0
  script: build.sh

requirements:
  build:
  - ${{ compiler('c') }}
  - ${{ compiler('cxx') }}
  - cmake
  - ninja
  host:
  - libabseil
  - zlib
  run:
  - libabseil
  - zlib

tests:
- package_contents:
    lib:
    - libprotobuf.a
    - libprotobuf-lite.a
    - libutf8_range.a
    - libutf8_validity.a
    include:
    - google/protobuf/message.h
    - google/protobuf/descriptor.h
    - google/protobuf/descriptor.proto
    files:
    - lib/cmake/protobuf/protobufConfig.cmake
    - lib/cmake/protobuf/protobufTargets.cmake
- script:
  - bash build_tests.sh
  requirements:
    build:
    - ${{ compiler('cxx') }}
    - cmake
    - ninja
  files:
    recipe:
    - build_tests.sh
    - tests/

about:
  homepage: https://protobuf.dev/
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Protocol Buffers C++ Libraries
  description: |
    Protocol Buffers are a language-neutral, platform-neutral extensible
    mechanism for serializing structured data. This package provides the C++
    runtime libraries: libprotobuf and libprotobuf-lite.
  documentation: https://protobuf.dev/reference/cpp/
  repository: https://github.com/protocolbuffers/protobuf

extra:
  recipe-maintainers:
  - Alex-PLACET
