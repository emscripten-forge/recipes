context:
  version: 2.4.0

package:
  name: wrapt
  version: ${{ version }}

source:
- url: https://pypi.io/packages/source/w/wrapt/wrapt-${{ version }}.tar.gz
  sha256: 7082fc1f94b020ac275870c4af71b09cff22876fe6e9c4c0ad01ea21d217b288

build:
  number: 0

  files:
    exclude:
    - '**/*.pyi'
    - '**/__pycache__/**'
    - '**/*.pyc'
    - '**/test_*.py'
  python:
    skip_pyc_compilation:
    - '**/*.py'
requirements:
  build:
  - ${{ compiler("c") }}
  - cross-python_emscripten-wasm32
  - python
  - pip
  host:
  - python
  run:
  - python

tests:
- script: pytester
  files:
    recipe:
    - test_import_wrapt.py
  requirements:
    build:
    - pytester
    run:
    - pytester-run
about:
  license: BSD-2-Clause
  license_file: LICENSE
  summary: Module for decorators, wrappers and monkey patching

  homepage: https://github.com/GrahamDumpleton/wrapt
