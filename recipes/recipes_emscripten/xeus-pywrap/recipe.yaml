context:
  version: 0.1.2

package:
  name: xeus-pywrap
  version: ${{ version }}

source:
  url: https://github.com/DerThorsten/xeus-pywrap/archive/refs/tags/${{ version }}.tar.gz
  sha256: bfe2aa21c3b5597d9f608e3207bed08846a98d051fb423d6fc9595c500639093


build:
  number: 0

requirements:
  build:
  - ${{ compiler("cxx") }}
  - cmake >=4
  - ninja
  - python
  host:
  - python
  - libpython
  - nlohmann_json
  - nlohmann_json-abi
  - xeus
  - xeus-lite >=5.0.0
  - pybind11<3
  - pybind11_json
  - xtl
  - pyjs >=4.0.4
  - zstd
  - openssl < 4
  run:
  - python
  - pyjs-rt >=4.0.4

tests:
- package_contents:
    files:
    - bin/xpywrap.wasm
    - bin/xpywrap.js
    - lib/python3.13/site-packages/xpywrap/__init__.py

about:
  license: BSD-3-Clause
  license_family: BSD-3
  license_file: LICENSE
  summary: xeus-pywrap
  homepage: https://github.com/DerThorsten/xeus-pywrap

extra:
  recipe-maintainers:
  - DerThorsten
