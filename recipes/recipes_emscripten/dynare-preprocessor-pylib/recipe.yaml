context:
  name: dynare-preprocessor-pylib
  version: 0.0.2

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/EconForge/dynare_preprocessor_pylib/archive/refs/tags/v${{ version }}.tar.gz
  sha256: e2f6ffad15605ce07945860df44696395f9cdca58655bb23b0f8937543e0208c

build:
  number: 0

requirements:
  build:
  - cross-python_${{ target_platform }}
  - ${{ compiler("cxx") }}
  - bison
  - flex
  - meson
  - ninja
  - pkg-config
  - pip
  - nanobind
  host:
  - python
  - nanobind
  - boost-cpp
  - libpython
  run:
  - python
  - numpy

tests:
- script: pytester
  requirements:
    build:
    - pytester
    run:
    - pytester-run
  files:
    recipe:
    - test_preproc.py

about:
  homepage: https://www.dynare.org/
  summary: Dynare preprocessor and Python library
  description: Preprocessor for Dynare economic models with Python nanobind bindings.
  license: GPL-3.0-or-later
  license_file: COPYING

extra:
  recipe-maintainers:
  - albop
  - svillemot
