context:
  name: httpuv
  version: 1.6.17

package:
  name: r-${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/IsabelParedes/r-httpuv-wasm/archive/refs/tags/${{ version }}.tar.gz
  sha256: 92894bd363ea1495aa6a809825d87deed58a04848ce5e247a2504b705a4c75b1

build:
  number: 5
  # Dependencies not yet available for R 4.6.x on conda-forge
  skip: ${{ r_base == '4.6.1' }}
  script: $R CMD INSTALL $R_ARGS .

requirements:
  build:
  - cross-r-base_${{ target_platform }} ==${{ r_base }}
  - ${{ compiler('c') }}
  - r-jsonlite
  - r-mime
  - r-r6
  host:
  - r-base ==${{ r_base }}
  - r-jsonlite
  - r-mime
  - r-r6
  run:
  - r-jsonlite
  - r-mime
  - r-r6

tests:
- package_contents:
    files:
    - lib/R/library/${{ name }}/libs/${{ name }}.so
- script: run_r_test
  files:
    recipe:
    - test_${{ name }}.R
  requirements:
    build:
    - r-wasm-tester

about:
  homepage: https://github.com/IsabelParedes/r-httpuv-wasm
  repository: https://github.com/IsabelParedes/r-httpuv-wasm
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Experimental version of httpuv for WebAssembly.

extra:
  recipe-maintainers:
  - IsabelParedes
