context:
  name: primecount
  version: '8.7'

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/kimwalisch/primecount/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 5a19eccca337da9e1cc629f2a223890af08987bc21771b9e860e28d823006be3

build:
  number: 0

requirements:
  build:
  - autoconf
  - automake
  - libtool
  - make
  - ${{ compiler('cxx') }}
  host:
  - primesieve

tests:
- package_contents:
    files:
    - lib/libprimecount.a
    - include/primecount.h
    - bin/primecount.js
    - bin/primecount.wasm

about:
  homepage: https://github.com/kimwalisch/primecount/
  license: BSD-2-Clause
  license_file: COPYING
  summary: Fast prime counting function library

extra:
  recipe-maintainers:
  - wangyenshu
