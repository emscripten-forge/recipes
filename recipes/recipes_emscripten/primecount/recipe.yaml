context:
  name: primecount
  version: '9.1'

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/kimwalisch/primecount/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 3f0935f74933acaab2ca06e58f8af6cff2e7dc3cc221db0ff5ad6ad9c83f64b1

build:
  number: 0

requirements:
  build:
  - autoconf
  - automake
  - libtool
  - make
  - ${{ compiler('cxx') }}
  host:
  - primesieve

tests:
- package_contents:
    files:
    - lib/libprimecount.a
    - include/primecount.h
    - bin/primecount.js
    - bin/primecount.wasm

about:
  homepage: https://github.com/kimwalisch/primecount/
  license: BSD-2-Clause
  license_file: COPYING
  summary: Fast prime counting function library

extra:
  recipe-maintainers:
  - wangyenshu
