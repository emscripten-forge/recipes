context:
  name: primecount
  version: '9.0'

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/kimwalisch/primecount/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 0fcc2083a476708f5cf1728dc8a64be60d8f7ca1dc623039889e67f70da048eb

build:
  number: 0

requirements:
  build:
  - autoconf
  - automake
  - libtool
  - make
  - ${{ compiler('cxx') }}
  host:
  - primesieve

tests:
- package_contents:
    files:
    - lib/libprimecount.a
    - include/primecount.h
    - bin/primecount.js
    - bin/primecount.wasm

about:
  homepage: https://github.com/kimwalisch/primecount/
  license: BSD-2-Clause
  license_file: COPYING
  summary: Fast prime counting function library

extra:
  recipe-maintainers:
  - wangyenshu
