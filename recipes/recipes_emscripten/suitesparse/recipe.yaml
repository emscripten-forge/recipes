context:
  version: "7.12.2"

recipe:
  name: suitesparse
  version: ${{ version }}

source:
  url: https://github.com/DrTimothyAldenDavis/SuiteSparse/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 679412daa5f69af96d6976595c1ac64f252287a56e98cc4a8155d09cc7fd69e8

build:
  number: 0

outputs:

  # ---------------------------------------------------------------------------
  # Staging output: builds every enabled project exactly once. Each package
  # output below then picks its own files out of the staged prefix.
  # ---------------------------------------------------------------------------
  - staging:
      name: suitesparse-build
    build:
      script: build
    requirements:
      build:
        - ${{ compiler('cxx') }}
        - cmake
        - make
        - pkg-config
      host:
        - openblas
        - gmp
        - mpfr
      ignore_run_exports:
        # Only the outputs that actually link these get them, declared by hand
        # in `requirements.run` below. Otherwise every output (libamd, libbtf,
        # ...) would inherit a dependency on openblas/gmp/mpfr from staging.
        from_package:
          - openblas
          - gmp
          - mpfr

  # ---------------------------------------------------------------------------
  # SuiteSparse_config: needed by everything except GraphBLAS/LAGraph
  # ---------------------------------------------------------------------------
  - package:
      name: libsuitesparseconfig
      version: ${{ version }}
    inherit: suitesparse-build
    build:
      files:
        - include/suitesparse/SuiteSparse_config.h
        - lib/libsuitesparseconfig.a
        - lib/cmake/SuiteSparse/**
        - lib/cmake/SuiteSparse_config/**
        - lib/pkgconfig/SuiteSparse_config.pc
    requirements:
      run_exports:
        - ${{ pin_subpackage('libsuitesparseconfig') }}
    about:
      license: BSD-3-Clause
      license_file: LICENSE.txt
    tests:
      - package_contents:
          files:
            - lib/libsuitesparseconfig.a
            - include/suitesparse/SuiteSparse_config.h

  - package:
      name: libamd
      version: ${{ version }}
    inherit: suitesparse-build
    build:
      files:
        - include/suitesparse/amd.h
        - lib/libamd.a
        - lib/cmake/AMD/**
        - lib/pkgconfig/AMD.pc
    requirements:
      run:
        - ${{ pin_subpackage('libsuitesparseconfig', exact=True) }}
      run_exports:
        - ${{ pin_subpackage('libamd') }}
    about:
      license: BSD-3-Clause
      license_file: AMD/Doc/License.txt
    tests:
      - package_contents:
          files:
            - lib/libamd.a
            - include/suitesparse/amd.h

  - package:
      name: libbtf
      version: ${{ version }}
    inherit: suitesparse-build
    build:
      files:
        - include/suitesparse/btf.h
        - lib/libbtf.a
        - lib/cmake/BTF/**
        - lib/pkgconfig/BTF.pc
    requirements:
      run:
        - ${{ pin_subpackage('libsuitesparseconfig', exact=True) }}
      run_exports:
        - ${{ pin_subpackage('libbtf') }}
    about:
      license: LGPL-2.1-or-later
      license_file: BTF/Doc/License.txt
    tests:
      - package_contents:
          files:
            - lib/libbtf.a
            - include/suitesparse/btf.h

  - package:
      name: libcamd
      version: ${{ version }}
    inherit: suitesparse-build
    build:
      files:
        - include/suitesparse/camd.h
        - lib/libcamd.a
        - lib/cmake/CAMD/**
        - lib/pkgconfig/CAMD.pc
    requirements:
      run:
        - ${{ pin_subpackage('libsuitesparseconfig', exact=True) }}
      run_exports:
        - ${{ pin_subpackage('libcamd') }}
    about:
      license: BSD-3-Clause
      license_file: CAMD/Doc/License.txt
    tests:
      - package_contents:
          files:
            - lib/libcamd.a
            - include/suitesparse/camd.h

  - package:
      name: libccolamd
      version: ${{ version }}
    inherit: suitesparse-build
    build:
      files:
        - include/suitesparse/ccolamd.h
        - lib/libccolamd.a
        - lib/cmake/CCOLAMD/**
        - lib/pkgconfig/CCOLAMD.pc
    requirements:
      run:
        - ${{ pin_subpackage('libsuitesparseconfig', exact=True) }}
      run_exports:
        - ${{ pin_subpackage('libccolamd') }}
    about:
      license: BSD-3-Clause
      license_file: CCOLAMD/Doc/License.txt
    tests:
      - package_contents:
          files:
            - lib/libccolamd.a
            - include/suitesparse/ccolamd.h

  - package:
      name: libcolamd
      version: ${{ version }}
    inherit: suitesparse-build
    build:
      files:
        - include/suitesparse/colamd.h
        - lib/libcolamd.a
        - lib/cmake/COLAMD/**
        - lib/pkgconfig/COLAMD.pc
    requirements:
      run:
        - ${{ pin_subpackage('libsuitesparseconfig', exact=True) }}
      run_exports:
        - ${{ pin_subpackage('libcolamd') }}
    about:
      license: BSD-3-Clause
      license_file: COLAMD/Doc/License.txt
    tests:
      - package_contents:
          files:
            - lib/libcolamd.a
            - include/suitesparse/colamd.h

  - package:
      name: libcholmod
      version: ${{ version }}
    inherit: suitesparse-build
    build:
      files:
        - include/suitesparse/cholmod.h
        - lib/libcholmod.a
        - lib/cmake/CHOLMOD/**
        - lib/pkgconfig/CHOLMOD.pc
    requirements:
      run:
        - ${{ pin_subpackage('libsuitesparseconfig', exact=True) }}
        - ${{ pin_subpackage('libamd', exact=True) }}
        - ${{ pin_subpackage('libcamd', exact=True) }}
        - ${{ pin_subpackage('libcolamd', exact=True) }}
        - ${{ pin_subpackage('libccolamd', exact=True) }}
        - openblas
      run_exports:
        - ${{ pin_subpackage('libcholmod') }}
    about:
      # CHOLMOD bundles a modified copy of METIS 5.0.1
      license: LGPL-2.1-or-later AND GPL-2.0-or-later AND Apache-2.0
      license_file:
        - CHOLMOD/Doc/License.txt
        - CHOLMOD/SuiteSparse_metis/LICENSE.txt
    tests:
      - package_contents:
          files:
            - lib/libcholmod.a
            - include/suitesparse/cholmod.h

  - package:
      name: libcxsparse
      version: ${{ version }}
    inherit: suitesparse-build
    build:
      files:
        - include/suitesparse/cs.h
        - lib/libcxsparse.a
        - lib/cmake/CXSparse/**
        - lib/pkgconfig/CXSparse.pc
    requirements:
      run:
        - ${{ pin_subpackage('libsuitesparseconfig', exact=True) }}
      run_exports:
        - ${{ pin_subpackage('libcxsparse') }}
    about:
      license: LGPL-2.1-or-later
      license_file: CXSparse/Doc/License.txt
    tests:
      - package_contents:
          files:
            - lib/libcxsparse.a
            - include/suitesparse/cs.h

  - package:
      name: libklu
      version: ${{ version }}
    inherit: suitesparse-build
    build:
      # KLU also ships the optional KLU_CHOLMOD library
      files:
        - include/suitesparse/klu.h
        - include/suitesparse/klu_cholmod.h
        - lib/libklu.a
        - lib/libklu_cholmod.a
        - lib/cmake/KLU/**
        - lib/cmake/KLU_CHOLMOD/**
        - lib/pkgconfig/KLU.pc
        - lib/pkgconfig/KLU_CHOLMOD.pc
    requirements:
      run:
        - ${{ pin_subpackage('libsuitesparseconfig', exact=True) }}
        - ${{ pin_subpackage('libamd', exact=True) }}
        - ${{ pin_subpackage('libbtf', exact=True) }}
        - ${{ pin_subpackage('libcolamd', exact=True) }}
        - ${{ pin_subpackage('libcholmod', exact=True) }}
      run_exports:
        - ${{ pin_subpackage('libklu') }}
    about:
      license: LGPL-2.1-or-later
      license_file: KLU/Doc/License.txt
    tests:
      - package_contents:
          files:
            - lib/libklu.a
            - lib/libklu_cholmod.a
            - include/suitesparse/klu.h

  - package:
      name: libldl
      version: ${{ version }}
    inherit: suitesparse-build
    build:
      files:
        - include/suitesparse/ldl.h
        - lib/libldl.a
        - lib/cmake/LDL/**
        - lib/pkgconfig/LDL.pc
    requirements:
      run:
        - ${{ pin_subpackage('libsuitesparseconfig', exact=True) }}
      run_exports:
        - ${{ pin_subpackage('libldl') }}
    about:
      license: LGPL-2.1-or-later
      license_file: LDL/Doc/License.txt
    tests:
      - package_contents:
          files:
            - lib/libldl.a
            - include/suitesparse/ldl.h

  - package:
      name: libumfpack
      version: ${{ version }}
    inherit: suitesparse-build
    build:
      files:
        - include/suitesparse/umfpack.h
        - lib/libumfpack.a
        - lib/cmake/UMFPACK/**
        - lib/pkgconfig/UMFPACK.pc
    requirements:
      run:
        - ${{ pin_subpackage('libsuitesparseconfig', exact=True) }}
        - ${{ pin_subpackage('libamd', exact=True) }}
        - ${{ pin_subpackage('libcholmod', exact=True) }}
        - openblas
      run_exports:
        - ${{ pin_subpackage('libumfpack') }}
    about:
      license: GPL-2.0-or-later
      license_file: UMFPACK/Doc/License.txt
    tests:
      - package_contents:
          files:
            - lib/libumfpack.a
            - include/suitesparse/umfpack.h

  - package:
      name: libparu
      version: ${{ version }}
    inherit: suitesparse-build
    build:
      files:
        - include/suitesparse/ParU.h
        - lib/libparu.a
        - lib/cmake/ParU/**
        - lib/pkgconfig/ParU.pc
    requirements:
      run:
        - ${{ pin_subpackage('libsuitesparseconfig', exact=True) }}
        - ${{ pin_subpackage('libcholmod', exact=True) }}
        - ${{ pin_subpackage('libumfpack', exact=True) }}
        - openblas
      run_exports:
        - ${{ pin_subpackage('libparu') }}
    about:
      license: GPL-3.0-or-later
      license_file: ParU/LICENSE.txt
    tests:
      - package_contents:
          files:
            - lib/libparu.a
            - include/suitesparse/ParU.h

  - package:
      name: librbio
      version: ${{ version }}
    inherit: suitesparse-build
    build:
      files:
        - include/suitesparse/RBio.h
        - lib/librbio.a
        - lib/cmake/RBio/**
        - lib/pkgconfig/RBio.pc
    requirements:
      run:
        - ${{ pin_subpackage('libsuitesparseconfig', exact=True) }}
      run_exports:
        - ${{ pin_subpackage('librbio') }}
    about:
      license: GPL-2.0-or-later
      license_file: RBio/Doc/License.txt
    tests:
      - package_contents:
          files:
            - lib/librbio.a
            - include/suitesparse/RBio.h

  - package:
      name: libspex
      version: ${{ version }}
    inherit: suitesparse-build
    build:
      files:
        - include/suitesparse/SPEX.h
        - lib/libspex.a
        - lib/cmake/SPEX/**
        - lib/pkgconfig/SPEX.pc
    requirements:
      run:
        - ${{ pin_subpackage('libsuitesparseconfig', exact=True) }}
        - ${{ pin_subpackage('libamd', exact=True) }}
        - ${{ pin_subpackage('libcolamd', exact=True) }}
        - gmp
        - mpfr
      run_exports:
        - ${{ pin_subpackage('libspex') }}
    about:
      license: GPL-2.0-or-later OR LGPL-3.0-or-later
      license_file: SPEX/LICENSE.txt
    tests:
      - package_contents:
          files:
            - lib/libspex.a
            - include/suitesparse/SPEX.h

  - package:
      name: libspqr
      version: ${{ version }}
    inherit: suitesparse-build
    build:
      files:
        - include/suitesparse/SuiteSparseQR.hpp
        - include/suitesparse/SuiteSparseQR_C.h
        - include/suitesparse/SuiteSparseQR_definitions.h
        - lib/libspqr.a
        - lib/cmake/SPQR/**
        - lib/pkgconfig/SPQR.pc
    requirements:
      run:
        - ${{ pin_subpackage('libsuitesparseconfig', exact=True) }}
        - ${{ pin_subpackage('libcholmod', exact=True) }}
        - openblas
      run_exports:
        - ${{ pin_subpackage('libspqr') }}
    about:
      license: GPL-2.0-or-later
      license_file: SPQR/Doc/License.txt
    tests:
      - package_contents:
          files:
            - lib/libspqr.a
            - include/suitesparse/SuiteSparseQR_C.h

  - package:
      name: suitesparse-mongoose
      version: ${{ version }}
    inherit: suitesparse-build
    build:
      files:
        - include/suitesparse/Mongoose.hpp
        - lib/libsuitesparse_mongoose.a
        - lib/cmake/SuiteSparse_Mongoose/**
        - lib/pkgconfig/SuiteSparse_Mongoose.pc
        - bin/suitesparse_mongoose*
    requirements:
      run:
        - ${{ pin_subpackage('libsuitesparseconfig', exact=True) }}
      run_exports:
        - ${{ pin_subpackage('suitesparse-mongoose') }}
    about:
      license: GPL-3.0-only
      license_file: Mongoose/Doc/License.txt
    tests:
      - package_contents:
          files:
            - lib/libsuitesparse_mongoose.a
            - include/suitesparse/Mongoose.hpp

  # ---------------------------------------------------------------------------
  # GraphBLAS and LAGraph. These do not depend on SuiteSparse_config and are by
  # far the largest pieces, so splitting them out is where most of the win is.
  # conda-forge builds them from a separate feedstock; if you would rather do
  # the same here, drop `graphblas`/`lagraph` from SUITESPARSE_ENABLE_PROJECTS
  # in build.sh and delete these two outputs.
  # ---------------------------------------------------------------------------
  - package:
      name: libgraphblas
      version: ${{ version }}
    inherit: suitesparse-build
    build:
      files:
        - include/suitesparse/GraphBLAS.h
        - lib/libgraphblas.a
        - lib/cmake/GraphBLAS/**
        - lib/pkgconfig/GraphBLAS.pc
    requirements:
      run_exports:
        - ${{ pin_subpackage('libgraphblas') }}
    about:
      license: Apache-2.0
      license_file: GraphBLAS/LICENSE
    tests:
      - package_contents:
          files:
            - lib/libgraphblas.a
            - include/suitesparse/GraphBLAS.h

  - package:
      name: liblagraph
      version: ${{ version }}
    inherit: suitesparse-build
    build:
      files:
        - include/suitesparse/LAGraph.h
        - include/suitesparse/LAGraphX.h
        - lib/liblagraph.a
        - lib/liblagraphx.a
        - lib/cmake/LAGraph/**
        - lib/pkgconfig/LAGraph.pc
    requirements:
      run:
        - ${{ pin_subpackage('libgraphblas', exact=True) }}
      run_exports:
        - ${{ pin_subpackage('liblagraph') }}
    about:
      license: BSD-2-Clause
      license_file: LAGraph/LICENSE
    tests:
      - package_contents:
          files:
            - lib/liblagraph.a
            - include/suitesparse/LAGraph.h

  # ---------------------------------------------------------------------------
  # Metapackage. Contains no files, just pulls in the classic SuiteSparse set.
  # `inherit: null` keeps it from picking up the staged files.
  # GraphBLAS/LAGraph are deliberately left out so that `suitesparse` stays
  # small, matching what conda-forge's `suitesparse` metapackage contains.
  # ---------------------------------------------------------------------------
  - package:
      name: suitesparse
      version: ${{ version }}
    inherit: null
    build:
      files: []
    requirements:
      run:
        - ${{ pin_subpackage('libsuitesparseconfig', exact=True) }}
        - ${{ pin_subpackage('libamd', exact=True) }}
        - ${{ pin_subpackage('libbtf', exact=True) }}
        - ${{ pin_subpackage('libcamd', exact=True) }}
        - ${{ pin_subpackage('libccolamd', exact=True) }}
        - ${{ pin_subpackage('libcolamd', exact=True) }}
        - ${{ pin_subpackage('libcholmod', exact=True) }}
        - ${{ pin_subpackage('libcxsparse', exact=True) }}
        - ${{ pin_subpackage('libklu', exact=True) }}
        - ${{ pin_subpackage('libldl', exact=True) }}
        - ${{ pin_subpackage('libumfpack', exact=True) }}
        - ${{ pin_subpackage('libparu', exact=True) }}
        - ${{ pin_subpackage('librbio', exact=True) }}
        - ${{ pin_subpackage('libspex', exact=True) }}
        - ${{ pin_subpackage('libspqr', exact=True) }}
      run_exports:
        - ${{ pin_subpackage('libsuitesparseconfig') }}
        - ${{ pin_subpackage('libamd') }}
        - ${{ pin_subpackage('libbtf') }}
        - ${{ pin_subpackage('libcamd') }}
        - ${{ pin_subpackage('libccolamd') }}
        - ${{ pin_subpackage('libcolamd') }}
        - ${{ pin_subpackage('libcholmod') }}
        - ${{ pin_subpackage('libcxsparse') }}
        - ${{ pin_subpackage('libklu') }}
        - ${{ pin_subpackage('libldl') }}
        - ${{ pin_subpackage('libumfpack') }}
        - ${{ pin_subpackage('libparu') }}
        - ${{ pin_subpackage('librbio') }}
        - ${{ pin_subpackage('libspex') }}
        - ${{ pin_subpackage('libspqr') }}
        - ${{ pin_subpackage('suitesparse') }}

about:
  homepage: https://people.engr.tamu.edu/davis/suitesparse.html
  repository: https://github.com/DrTimothyAldenDavis/SuiteSparse
  license: BSD-3-Clause AND BSD-2-Clause AND Apache-2.0 AND LGPL-2.1-or-later AND GPL-2.0-or-later AND GPL-3.0-or-later AND GPL-3.0-only AND (LGPL-3.0-or-later OR GPL-2.0-or-later)
  license_file: LICENSE.txt
  summary: a suite of sparse matrix algorithms authored or co-authored by Tim Davis, Texas A&M University

extra:
  recipe-maintainers:
    - wangyenshu    tests:
      - package_contents:
          files:
            - lib/libamd.a
            - include/suitesparse/amd.h

  - package:
