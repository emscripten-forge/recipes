      run_exports:
        - ${{ pin_subpackage('libcxsparse') }}
    about:
      license: LGPL-2.1-or-later
      license_file: CXSparse/Doc/License.txt
    tests:
      - package_contents:
          files:
            - lib/libcxsparse.a
            - include/suitesparse/cs.h

  - package:
      name: libklu
      version: ${{ klu_version }}
    inherit: suitesparse-build
    build:
      files:
        - include/suitesparse/klu.h
        - include/suitesparse/klu_cholmod.h
        - lib/libklu.a
        - lib/libklu_cholmod.a
        - lib/cmake/KLU/**
        - lib/cmake/KLU_CHOLMOD/**
        - lib/pkgconfig/KLU.pc
        - lib/pkgconfig/KLU_CHOLMOD.pc
    requirements:
      run:
        - ${{ pin_subpackage('libsuitesparseconfig', exact=True) }}
        - ${{ pin_subpackage('libamd', exact=True) }}
        - ${{ pin_subpackage('libbtf', exact=True) }}
        - ${{ pin_subpackage('libcolamd', exact=True) }}
        - ${{ pin_subpackage('libcholmod', exact=True) }}
      run_exports:
        - ${{ pin_subpackage('libklu') }}
    about:
      license: LGPL-2.1-or-later
      license_file: KLU/Doc/License.txt
    tests:
      - package_contents:
          files:
            - lib/libklu.a
            - lib/libklu_cholmod.a
            - include/suitesparse/klu.h

  - package:
      name: libldl
      version: ${{ ldl_version }}
    inherit: suitesparse-build
    build:
      files:
        - include/suitesparse/ldl.h
        - lib/libldl.a
        - lib/cmake/LDL/**
        - lib/pkgconfig/LDL.pc
    requirements:
      run:
        - ${{ pin_subpackage('libsuitesparseconfig', exact=True) }}
      run_exports:
        - ${{ pin_subpackage('libldl') }}
    about:
      license: LGPL-2.1-or-later
      license_file: LDL/Doc/License.txt
    tests:
      - package_contents:
          files:
            - lib/libldl.a
            - include/suitesparse/ldl.h

  - package:
      name: libumfpack
      version: ${{ umfpack_version }}
    inherit: suitesparse-build
    build:
