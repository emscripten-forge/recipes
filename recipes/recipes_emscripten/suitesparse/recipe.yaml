        - include/suitesparse/btf.h
        - lib/libbtf.a
        - lib/cmake/BTF/**
        - lib/pkgconfig/BTF.pc
    requirements:
      run:
        - ${{ pin_subpackage('libsuitesparseconfig', exact=True) }}
      run_exports:
        - ${{ pin_subpackage('libbtf') }}
    about:
      license: LGPL-2.1-or-later
      license_file: BTF/Doc/License.txt
    tests:
      - package_contents:
          files:
            - lib/libbtf.a
            - include/suitesparse/btf.h

  - package:
      name: libcamd
      version: ${{ camd_version }}
    inherit: suitesparse-build
    build:
      files:
        - include/suitesparse/camd.h
        - lib/libcamd.a
        - lib/cmake/CAMD/**
        - lib/pkgconfig/CAMD.pc
    requirements:
      run:
        - ${{ pin_subpackage('libsuitesparseconfig', exact=True) }}
      run_exports:
        - ${{ pin_subpackage('libcamd') }}
    about:
      license: BSD-3-Clause
      license_file: CAMD/Doc/License.txt
    tests:
      - package_contents:
          files:
            - lib/libcamd.a
            - include/suitesparse/camd.h

  - package:
      name: libccolamd
      version: ${{ ccolamd_version }}
    inherit: suitesparse-build
    build:
      files:
        - include/suitesparse/ccolamd.h
        - lib/libccolamd.a
        - lib/cmake/CCOLAMD/**
        - lib/pkgconfig/CCOLAMD.pc
    requirements:
      run:
        - ${{ pin_subpackage('libsuitesparseconfig', exact=True) }}
      run_exports:
        - ${{ pin_subpackage('libccolamd') }}
    about:
      license: BSD-3-Clause
      license_file: CCOLAMD/Doc/License.txt
    tests:
      - package_contents:
          files:
            - lib/libccolamd.a
            - include/suitesparse/ccolamd.h

  - package:
      name: libcolamd
      version: ${{ colamd_version }}
    inherit: suitesparse-build
    build:
      files:
        - include/suitesparse/colamd.h
        - lib/libcolamd.a
        - lib/cmake/COLAMD/**
        - lib/pkgconfig/COLAMD.pc
    requirements:
      run:
        - ${{ pin_subpackage('libsuitesparseconfig', exact=True) }}
      run_exports:
