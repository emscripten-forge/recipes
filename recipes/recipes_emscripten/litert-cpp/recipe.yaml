context:
  version: 2.1.5

build:
  number: 0

outputs:
  # ============================================================================
  # Staging build: C++ static SDK + Python bindings (merged side module)
  # ============================================================================
  - staging:
      name: build-cache
    build:
      script: build.sh
    requirements:
      build:
      - ${{ compiler('c') }}
      - ${{ compiler('cxx') }}
      - cmake
      - ninja
      - python
      - flatbuffers
      - pybind11
      ignore_run_exports:
        from_package:
        - python
      host:
      - python
      - libabseil
      - flatbuffers
      - eigen
      - cpuinfo
    source:
    - url: https://github.com/google-ai-edge/LiteRT/archive/refs/tags/v${{ version }}.tar.gz
      sha256: 7d0313c4851deb18af6f5f2dbc002bf01293583b87b819b0949ee33dcfe2d91b
      patches:
      - patches/0001-gate-npu-vendor-fetches.patch
      - patches/0002-fix-runtime-cmake-feature-gating.patch
      - patches/0003-complete-runtime-cmake-feature-gating.patch
    - target_directory: third_party/tensorflow
      url: https://github.com/tensorflow/tensorflow/archive/refs/tags/v2.21.0-rc0.tar.gz
      sha256: 91b2c2d12f0ebd78d84e5e1401269d0e6e36db5b74e19cc929e0f012b380af39

  # ============================================================================
  # C++ static SDK (unchanged surface)
  # ============================================================================
  - package:
      name: litert-cpp
      version: ${{ version }}
    inherit: build-cache
    build:
      script: echo "Collecting files from cache"
      files:
        include:
        - include/litert/**
        - lib/liblitert_c_api.a
        - lib/liblitert_cc_api.a
        - lib/liblitert_cc_internal.a
        - lib/liblitert_core.a
        - lib/liblitert_core_model.a
        - lib/liblitert_logging.a
        - lib/liblitert_runtime.a
        - lib/libtensorflow-lite.a
        - lib/cmake/litert/litertConfig.cmake
    requirements:
      run:
      - libabseil
      - flatbuffers
    tests:
    - package_contents:
        files:
        - include/litert/build_common/build_config.h
        - include/litert/c/litert_webgpu_types.h
        - include/litert/cc/litert_tensor_buffer.h
        - include/litert/cc/options/litert_gpu_options.h
        - lib/liblitert_c_api.a
        - lib/liblitert_cc_api.a
        - lib/liblitert_cc_internal.a
        - lib/liblitert_core.a
        - lib/liblitert_core_model.a
        - lib/liblitert_logging.a
        - lib/liblitert_runtime.a
        - lib/libtensorflow-lite.a
        - lib/cmake/litert/litertConfig.cmake
    - script:
      - bash build_tests.sh
      requirements:
        build:
        - ${{ compiler('cxx') }}
        - cmake
        - ninja
        - nodejs
        - libabseil
        - flatbuffers
      files:
        recipe:
        - build_tests.sh
        - tests/

  # ============================================================================
  # Python bindings (ai_edge_litert)
  # ============================================================================
  - package:
      name: ai-edge-litert
      version: ${{ version }}
    inherit: build-cache
    build:
      script: echo "Collecting files from cache"
      files:
        include:
        - lib/python*/site-packages/ai_edge_litert/**
        exclude:
        - '**/*.pyc'
        - '**/__pycache__/**'
        - '**/test_*.py'
      python:
        skip_pyc_compilation:
        - '**/*.py'
    requirements:
      run:
      - python_abi 3.13.* *_cp313
      - numpy
    tests:
    - script: pytester
      files:
        recipe:
        - test_ai_edge_litert.py
      requirements:
        build:
        - pytester
        run:
        - pytester-run

about:
  homepage: https://ai.google.dev/edge/litert
  license: Apache-2.0
  license_file: LICENSE
  summary: LiteRT C++ static SDK and Python bindings for emscripten-wasm32
  description: |
    LiteRT is Google's on-device inference runtime and the successor to
    TensorFlow Lite. This recipe provides the C++ static SDK surface
    (litert-cpp) and the Python bindings (ai-edge-litert) for
    emscripten-wasm32 builds.
  documentation: https://github.com/google-ai-edge/LiteRT/blob/main/g3doc/instructions/CMAKE_BUILD_INSTRUCTIONS.md
  repository: https://github.com/google-ai-edge/LiteRT

extra:
  recipe-maintainers:
  - Alex-PLACET