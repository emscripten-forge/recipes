context:
  version: 1.7.5
  name: netcdf4

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/Unidata/netcdf4-python/archive/refs/tags/v${{ version }}rel.tar.gz
  sha256: 01f3556dd8d5e7d773db259f47df0a8068f6feb81dffe23edc6ef50b39c006ef
  patches:
  - patches/0001-Fix-unknown-arg-R-PREFIX-lib.patch

build:
  number: 0
  script:
  - export LDFLAGS="-L$PREFIX/lib -lhdf5 -lhdf5_hl $LDFLAGS"
  - ${PYTHON} -m pip install . -vvv

  files:
    exclude:
    - '**/*.pyi'
    - '**/*.pyx'
    - '**/__pycache__/**'
    - '**/*.pyc'
    - '**/test_*.py'
  python:
    skip_pyc_compilation:
    - '**/*.py'
requirements:
  build:
  - python
  - cross-python_${{ target_platform }}
  - ${{ compiler("c") }}
  - pip
  - pkg-config
  - numpy
  - cython
  host:
  - python
  - hdf5
  - libnetcdf
  run:
  - python
  - numpy
  - hdf5
  - cftime
  - certifi

tests:
- script: pytester
  requirements:
    build:
    - pytester
    run:
    - pytester-run
  files:
    recipe:
    - test_netcdf4.py

about:
  homepage: http://github.com/Unidata/netcdf4-python
  license: MIT
  license_file: LICENSE
  summary: Provides an object-oriented python interface to the netCDF version 4 library
  repository: https://github.com/Unidata/netcdf4-python
  documentation: https://unidata.github.io/netcdf4-python
