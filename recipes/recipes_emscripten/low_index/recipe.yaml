context:
  name: low_index
  version: '1.3'

package:
  name: low_index
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/l/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 437f1f809e6301f758a77fa522946306155f13f2fd246fc75dc45231a5782992
  patches:
  - patches/0001-force-single-threaded-on-emscripten.patch

build:
  number: 0

requirements:
  build:
  - python
  - cross-python_${{ target_platform }}
  - ${{ compiler('cxx') }}
  - pip
  - setuptools
  host:
  - python
  run:
  - python

tests:
- script: pytester
  files:
    recipe:
    - test_low_index.py
  requirements:
    build:
    - pytester
    run:
    - pytester-run

about:
  homepage: https://github.com/3-manifolds/low_index
  license: GPL-2.0-or-later
  license_file: PKG-INFO
  summary: Enumerates low index subgroups of a finitely presented group
  description: |
    Implements the Sims algorithm for enumerating the conjugacy classes of
    subgroups of bounded index in a finitely presented group, as coset
    tables. It is used by SnapPy to compute covers of 3-manifolds.

    The pybind11 headers are bundled in the sdist, so no pybind11
    dependency is needed.

    This build is patched to always take the single-threaded SimsTree.
    The package otherwise selects the multi-threaded implementation
    whenever the resolved thread count exceeds one, and SnapPy calls
    permutation_reps() with num_threads=0, which resolves to
    std::thread::hardware_concurrency(). Emscripten reports
    navigator.hardwareConcurrency there, so without the patch the
    multi-threaded path is chosen and std::thread's constructor throws in
    a build without pthreads.
  repository: https://github.com/3-manifolds/low_index

extra:
  recipe-maintainers:
  - wangyenshu
