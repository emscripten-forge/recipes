context:
  version: 3.2.3
  name: imath

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/AcademySoftwareFoundation/Imath/archive/v${{ version }}.tar.gz
  sha256: e10c12b3f21f45bf08e09d4215d9c7691368d747beebd840de0b6fefed2df9f8

build:
  number: 0

requirements:
  build:
  - ${{ compiler("cxx") }}
  - cmake
  - make

tests:
- package_contents:
    files:
    - lib/libImath.a
    - lib/pkgconfig/Imath.pc
    - include/Imath/ImathMath.h

about:
  homepage: http://www.openexr.com/
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.md
  summary: IMath libraries required for OpenEXR.

extra:
  recipe-maintainers:
  - DerThorsten
