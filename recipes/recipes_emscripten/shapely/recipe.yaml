context:
  name: shapely
  version: 2.2.0

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/S/Shapely/shapely-${{ version }}.tar.gz
  sha256: e8865e553d874a1ec4a032057ea81fca9def37b188cd8fb550af3b3480b3f88c

build:
  number: 0

  files:
    exclude:
    - '**/tests/**'
    - '**/__pycache__/**'
    - '**/*.pxd'
    - '**/*.pyc'
    - '**/test_*.py'
  python:
    skip_pyc_compilation:
    - '**/*.py'
requirements:
  build:
  - python
  - pip
  - cross-python_${{ target_platform }}
  - cython
  - numpy
  - ${{ compiler('c') }}
  host:
  - python
  - pip
    #- cython
  - numpy
  - geos
  run:
  - geos
  - python
  - numpy

tests:
- script: pytester
  requirements:
    build:
    - pytester
    run:
    - pytester-run
  files:
    recipe:
    - test_shapely.py


about:
  homepage: https://github.com/shapely/shapely
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Python package for manipulation and analysis of geometric objects in the Cartesian plane

extra:
  recipe-maintainers:
  - KGB99
