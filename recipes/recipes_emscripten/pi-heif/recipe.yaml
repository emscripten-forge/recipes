context:
  name: pi-heif
  version: 1.3.0

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/pi_heif/pi_heif-${{ version }}.tar.gz
  sha256: 58151840d0d60507330654a466b06cbf7ca8fb3759eadb5234d70b4dc2bc990c
  patches:
  - patches/0001-Skip-host-system-dirs-when-LIBHEIF_ROOT-is-set.patch

build:
  number: 0
  script: |
    export LIBHEIF_ROOT=$PREFIX
    ${PYTHON} -m pip install . ${PIP_ARGS}

requirements:
  build:
  - python
  - cross-python_${{ target_platform }}
  - ${{ compiler('c') }}
  - pip
  host:
  - python
  - pip
  - setuptools
  - wheel
  - cffi
  - libheif
  run:
  - python
  - cffi
  - pillow

tests:
- script: pytester
  files:
    recipe:
    - test_pi_heif.py
  requirements:
    build:
    - pytester
    run:
    - pytester-run

about:
  homepage: https://github.com/bigcat88/pillow_heif
  license: LGPL-2.1-or-later
  license_file: LICENSE.txt
  summary: Python 3.6+ interface to libheif library
  repository: https://github.com/bigcat88/pillow_heif

extra:
  recipe-maintainers:
  - Copilot
