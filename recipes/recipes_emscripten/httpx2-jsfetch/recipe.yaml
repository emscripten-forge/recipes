context:
  name: httpx2-jsfetch
  version: 0.1.2

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/httpx2-jsfetch-emscripten-forge/httpx2_jsfetch_emscripten_forge-${{ version 
    }}.tar.gz
  sha256: f7bf811d90e05e6574b21ce9c021cbda0b75a1821cabb310dd85cf43da3ab7d7

build:
  number: 1
  script: ${{ PYTHON }} -m pip install . ${{ PIP_ARGS }}
  noarch: python

  files:
    exclude:
    - '**/__pycache__/**'
    - '**/*.pyc'
    - '**/test_*.py'
  python:
    skip_pyc_compilation:
    - '**/*.py'
requirements:
  build:
  - pip != 25.1
  - cross-python_${{ target_platform }}
  - hatchling
  host:
  - python =${{ python_min }}
  run:
  - python >=${{ python_min }}
  - pyjs >=4.0.6
  - httpx2 >=2.12.0,<3.0.0

tests:
- script: pytester
  requirements:
    build:
    - pytester
    run:
    - pytester-run
  files:
    recipe:
    - test_import_httpx2.py

about:
  homepage: https://github.com/davidbrochart/httpx2-jsfetch-emscripten-forge
  license: BSD-3-Clause
  license_file: LICENSE.md
  summary: httpx2 transports for emscripten-forge.

extra:
  recipe-maintainers:
  - davidbrochart
