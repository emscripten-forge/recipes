context:
  name: libyaml
  version: 0.2.6

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/yaml/libyaml/archive/refs/tags/${{ version }}.tar.gz
  sha256: d872e14e3439245919bc0ec2793182e89b4dc6dcc156ef7db47fe3510dee8bc7

build:
  number: 0

requirements:
  build:
  - ${{ compiler("c") }}
  - cmake
  - make

about:
  homepage: https://github.com/yaml/libyaml
  license: MIT
  license_file: License

extra:
  maintainers:
  - IsabelParedes
