context:
  name: low-index
  version: '1.3'

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/l/low_index/low_index-${{ version }}.tar.gz
  sha256: 437f1f809e6301f758a77fa522946306155f13f2fd246fc75dc45231a5782992
  patches:
  - patches/0001-single-threaded-on-emscripten.patch

build:
  number: 0
  script: ${PYTHON} -m pip install . ${PIP_ARGS}

requirements:
  build:
  - ${{ compiler('cxx') }}
  - cross-python_${{ target_platform }}
  - python
  - pip
  - setuptools
  - wheel
  host:
  - python
  run:
  - python

tests:
- script: pytester
  files:
    recipe:
    - test_low_index.py
  requirements:
    build:
    - pytester
    run:
    - pytester-run
- package_contents:
    files:
    - lib/python3.13/site-packages/low_index/_low_index.cpython-313-wasm32-emscripten.so

about:
  homepage: https://github.com/3-manifolds/low_index
  license: GPL-2.0-or-later
  license_file: README.rst
  summary: Enumerate low index subgroups of a finitely presented group
  repository: https://github.com/3-manifolds/low_index

extra:
  recipe-maintainers:
  - wangyenshu
