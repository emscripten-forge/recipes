context:
  version: 0.22.1

package:
  name: xleaflet
  version: ${{ version }}

source:
  url: https://github.com/jupyter-xeus/xleaflet/archive/refs/tags/${{ version }}.tar.gz
  sha256: 043ecfb4286ae2c43f155fec24955fded7c1bbf0520e88d80b4259befd6a9434
  patches:
  - patches/shared.patch

build:
  number: 0

requirements:
  build:
  - ${{ compiler("cxx") }}
  - cmake
  - make
  host:
  - xproperty >=0.13.1,<0.14
  - xwidgets >=0.31.1,<0.32
  - xtensor>=0.27,<0.28

tests:
- script:
  - test -f $PREFIX/share/xleaflet/basemaps.json
  - test -f $PREFIX/lib/libxleaflet.so

about:
  license: BSD-3-Clause
  license_family: BSD-3
  license_file: LICENSE
  summary: C++ backend for the jupyter leaflet widget
  homepage: https://github.com/jupyter-xeus/xleaflet
extra:
  recipe-maintainers:
  - anutosh491
  - JohanMabille
