context:
  version: 0.15.0

package:
  name: python-symengine
  version: ${{ version }}

source:
  url: https://github.com/symengine/symengine.py/releases/download/v${{ version }}/symengine.py-${{ version }}.tar.gz
  sha256: 5fac75a1b347308ba8b6e33b0bf74c5235446e268b3d023f80c02e1a873a7c18

build:
  number: 0

  files:
    exclude:
    - '**/tests/**'
    - '**/*.pxd'
    - '**/__pycache__/**'
    - '**/*.pyc'
    - '**/test_*.py'
  python:
    skip_pyc_compilation:
    - '**/*.py'
requirements:
  build:
  - cross-python_${{ target_platform }}
  - ${{ compiler('cxx') }}
  - python
  - cython
  - numpy
  - pip
  - cmake
  - setuptools
  host:
  - python
  - symengine-dev
  run:
  - symengine
  - setuptools
  - numpy

tests:
- script: pytester
  requirements:
    build:
    - pytester
    run:
    - pytester-run
  files:
    recipe:
    - test_symengine.py

about:
  homepage: https://github.com/symengine/symengine.py
  license: MIT
  license_file: LICENSE
  summary: Python wrappers to the C++ library SymEngine.
  description: |
    Python wrappers to the C++ library SymEngine, a fast C++ symbolic
    manipulation library.
  documentation: https://github.com/symengine/symengine.py
  repository: https://github.com/symengine/symengine.py

extra:
  recipe-maintainers:
  - richardotis
