context:
  name: r-mgcv
  version: 1.9-5

package:
  name: ${{ name }}
  version: ${{ version | replace('-', '_') }}

source:
  url:
  - https://cran.r-project.org/src/contrib/${{ name[2:] }}_${{ version }}.tar.gz
  - https://cloud.r-project.org/src/contrib/${{ name[2:] }}_${{ version }}.tar.gz
  sha256: d079c68e500708de4df79692e83493636004915dc6689cd7350e226291abd992

build:
  number: 0
  # Dependencies not yet available for R 4.6.0 on conda-forge
  skip: ${{ r_base == '4.6.0' }}
  script: $R CMD INSTALL $R_ARGS .

requirements:
  build:
  - ${{ compiler('c') }}
  - cross-r-base_${{ target_platform }} ==${{ r_base }}
  - r-nlme
  - r-matrix
  host:
  - r-base ==${{ r_base }}
  - libblas
  - liblapack
  - libflang
  - r-nlme
  - r-matrix
  run:
  - r-nlme
  - r-matrix

tests:
- package_contents:
    lib:
    - R/library/${{ name[2:] }}/libs/${{ name[2:] }}.so

about:
  homepage: https://CRAN.R-project.org/package=mgcv
  license: GPL-2.0-or-later
  license_file: GPL-2
  license_family: GPL2
  summary: Mixed GAM Computation Vehicle with Automatic Smoothness Estimation
  description: |
    Generalized additive (mixed) models, some of their extensions and other
    generalized ridge regression with multiple smoothing parameter estimation by
    (Restricted) Marginal Likelihood, Generalized Cross Validation and similar,
    or using iterated nested Laplace approximation for fully Bayesian inference.

extra:
  recipe-maintainers:
  - IsabelParedes
  - anutosh491
