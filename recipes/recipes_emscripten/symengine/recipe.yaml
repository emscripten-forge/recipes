context:
  name: symengine
  version: 0.15.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  sha256: 9f75f0367221abd88b9b60ef7b104b4aa1e34e99d3152c3df2bb2467bad2f04f
  url: https://github.com/symengine/symengine/releases/download/v${{ version }}/symengine-${{ version }}.tar.gz
  patches:
  - patches/shared.patch
  - patches/namespace.patch

build:
  number: 0

requirements:
  build:
  - ${{ compiler("cxx") }}
  - cmake
  - make
  host:
  - boost-cpp
  run:
  - boost-cpp

tests:
- package_contents:
    files:
    - lib/libsymengine.so

about:
  homepage: https://symengine.org/
  license: MIT
  license_file: LICENSE
  summary: A fast symbolic manipulation library, written in C++.
  description: |
    SymEngine is a standalone fast C++ symbolic manipulation library.
    Optional thin wrappers allow usage of the library from other languages.
  documentation: https://symengine.org/
  repository: https://github.com/symengine/symengine

extra:
  recipe-maintainers:
  - richardotis
  - anutosh491
