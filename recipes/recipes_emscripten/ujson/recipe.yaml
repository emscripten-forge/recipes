context:
  name: ujson
  version: 6.0.0

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 80e23393feb707582e0ad495c397a4477b646d08094d2df64f7316f9fafd8aae

build:
  number: 0
  script: ${PYTHON} -m pip install . ${PIP_ARGS}
  files:
    exclude:
    - '**/*.pyi'
    - '**/__pycache__/**'
    - '**/*.pyc'
    - '**/test_*.py'
  python:
    skip_pyc_compilation:
    - '**/*.py'

requirements:
  build:
  - python
  - pip
  - cross-python_${{ target_platform }}
  - ${{ compiler('c') }}
  - ${{ compiler('cxx') }}
  host:
  - python
  - pip
  - setuptools >=77
  - setuptools-scm >=3.4
  run:
  - python

tests:
- script: pytester
  requirements:
    build:
    - pytester
    run:
    - pytester-run
  files:
    recipe:
    - test_import_ujson.py

about:
  homepage: https://github.com/ultrajson/ultrajson
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: Ultra fast JSON decoder and encoder written in C with Python bindings
  repository: https://github.com/ultrajson/ultrajson

extra:
  recipe-maintainers:
  - davidbrochart
