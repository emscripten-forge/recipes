context:
  name: memtailor
  version: '1.5'

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url:
  - https://github.com/Macaulay2/memtailor/releases/download/v${{ version }}/memtailor-${{ version }}.tar.gz
  sha256: 53052f0fa41283a3eb575a529d019ba24dad40e6f347a47b00eb87339c4d8e6a

build:
  number: 0

requirements:
  build:
  - autoconf
  - automake
  - libtool
  - make
  - ${{ compiler('cxx') }}

tests:
- package_contents:
    files:
    - lib/libmemtailor.a
    - include/memtailor.h

about:
  repository: https://github.com/Macaulay2/memtailor
  license: BSD-3-Clause
  license_file: license.txt
  summary: Memtailor is a C++ library of special purpose memory allocators

extra:
  recipe-maintainers:
  - wangyenshu
