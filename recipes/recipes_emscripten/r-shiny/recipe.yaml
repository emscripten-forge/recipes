context:
  name: shiny
  version: 1.14.0

package:
  name: r-${{ name }}
  version: ${{ version }}

source:
  url:
  - https://cran.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cloud.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cran.r-project.org/src/contrib/Archive/${{ name }}/${{ name }}_${{ version }}.tar.gz
  sha256: 4a6945ed450effdb90b44ca0439e241f13488af59508be1c2fdab3f4de9dad11
  patches:
  - patches/0001-Replace-later-and-promises-with-wasm-async-primitive.patch
  - patches/0002-Drive-service-loop-from-lucent-host-instead-of-later.patch
  - patches/0003-Publish-plots-via-VFS-URLs.patch
  - patches/0004-Serve-htmltools-deps-from-the-wasm-VFS-path.patch
  - patches/0005-Harden-session-flush-and-output-errors-for-plots.patch
  - patches/0006-Store-TimerCallbacks-deadlines-in-binary-min-heap.patch

build:
  number: 3
  # Dependencies not yet available for R 4.6.0 on conda-forge
  skip: ${{ r_base == '4.6.1' }}
  script: $R CMD INSTALL $R_ARGS .

requirements:
  build:
  - cross-r-base_${{ target_platform }} ==${{ r_base }}
  - ${{ compiler('c') }}
  - r-digest
  - r-fastmap
  - r-htmltools
  - r-httpuv
  - r-jsonlite
  - r-rlang
  - r-base ==${{ r_base }}
  host:
  - r-base ==${{ r_base }}
  - r-bslib
  - r-cachem
  - r-cli
  - r-commonmark
  - r-fastmap
  - r-fontawesome
  - r-glue
  - r-htmltools
  - r-httpuv
  - r-jsonlite
  - r-lifecycle
  - r-mime
  - r-otel
  - r-r6
  - r-rlang
  - r-sourcetools
  - r-withr
  - r-xtable
  run:
  - r-bslib
  - r-cachem
  - r-cli
  - r-commonmark
  - r-fastmap
  - r-fontawesome
  - r-glue
  - r-htmltools
  - r-httpuv
  - r-jsonlite
  - r-lifecycle
  - r-mime
  - r-otel
  - r-r6
  - r-rlang
  - r-sourcetools
  - r-withr
  - r-xtable

tests:
# Pure R package, no shared library
- script: run_r_test
  files:
    recipe:
    - test_shiny.R
  requirements:
    build:
    - r-wasm-tester

about:
  homepage: https://cran.r-project.org/package=${{ name }}
  repository: https://github.com/rstudio/shiny
  license: MIT
  license_family: MIT
  license_file: ${{ PREFIX }}/lib/R/share/licenses/MIT
  summary: Experimental Web Application Framework for R.

extra:
  recipe-maintainers:
  - IsabelParedes
