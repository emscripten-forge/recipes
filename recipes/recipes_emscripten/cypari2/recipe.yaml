context:
  name: cypari2
  version: 2.2.4

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/c/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: f9f0e994a9a0b064619320411e1d9c303158847e055b58082efdade5ac97f613
  patches:
  - patches/0001-support-cross-compilation.patch

build:
  number: 0
  script: build.sh

requirements:
  build:
  - python
  - cross-python_${{ target_platform }}
  - ${{ compiler('c') }}
  - pip
  - meson-python
  - cython
  - pkg-config
  host:
  - python
  - pari
  - gmp
  - cysignals
  run:
  - python
  - cysignals

tests:
- script: pytester
  files:
    recipe:
    - test_cypari2.py
  requirements:
    build:
    - pytester
    run:
    - pytester-run

about:
  homepage: https://github.com/sagemath/cypari2
  license: GPL-2.0-or-later
  license_file: LICENSE
  summary: A Python interface to the number theory library PARI/GP
  description: |
    CyPari2 is SageMath's interface to PARI/GP. It is used here in place of
    CyPari, the standalone fork that SnapPy imports by default.

    CyPari has no source release that supports Python 3.13. Its last sdist,
    2.5.4, carries bindings generated by Cython 0.29.32, which use
    ob_digit, _PyGC_FINALIZED, curexc_traceback and the five-argument
    _PyLong_AsByteArray -- all removed or changed in 3.13 -- and there are
    no .pyx sources in the sdist to regenerate from. Releases from 2.5.5,
    the first with cp313 wheels, ship no sdist at all.

    CyPari2 is the library CyPari forked from, is what SnapPy already uses
    inside Sage, and exposes the same names. It generates its bindings from
    PARI's own pari.desc at build time rather than from a vendored snapshot,
    so they match whatever PARI it is linked against -- the channel's
    2.17.4 here. 2.2.1 was the port to PARI 2.17 and 2.2.2 the port to
    Cython 3.1, so 2.2.4 needs no version-compatibility patching at all.

    The one patch is about cross compilation. upstream's meson.build runs
    two probe programs against the target PARI: one reporting its version,
    which is only a smoke test, and one reporting pari_datadir, which is
    load-bearing because autogen reads pari.desc from it. A cross build
    cannot execute a wasm binary, so the patch compiles the first without
    running it and lets the second be supplied through PARI_DATADIR, which
    build.sh sets. Native builds are unaffected.
  repository: https://github.com/sagemath/cypari2

extra:
  recipe-maintainers:
  - wangyenshu
