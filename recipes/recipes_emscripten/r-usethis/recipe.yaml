context:
  name: r-usethis
  version: 3.2.2

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url:
  - https://cran.r-project.org/src/contrib/${{ name[2:] }}_${{ version }}.tar.gz
  - https://cloud.r-project.org/src/contrib/${{ name[2:] }}_${{ version }}.tar.gz
  sha256: 423d9880847e5873c2978559e0bbe9ea4570aa100cbef3de5911cac35296a67e
  patches:
  - patches/0001-Remove-dependency-of-curl.patch
  - patches/0002-Remove-dependency-of-gh.patch

build:
  number: 0
  skip: ${{ r_base == '4.6.1' }}
  noarch: generic
  script: $R CMD INSTALL $R_ARGS .

requirements:
  build:
  - cross-r-base_${{ target_platform }} ==${{ r_base }}
  - r-cli >=3.0.1
  - r-clipr >=0.3.0
  - r-crayon
  - r-desc >=1.4.2
  - r-fs >=1.3.0
  - r-gert >=1.4.1
  - r-glue >=1.3.0
  - r-jsonlite
  - r-lifecycle >=1.0.0
  - r-purrr
  - r-rappdirs
  - r-rlang >=1.1.0
  - r-rprojroot >=2.1.1
  - r-rstudioapi
  - r-whisker
  - r-withr >=2.3.0
  - r-yaml
  host:
  - r-base ==${{ r_base }}
  - r-cli >=3.0.1
  - r-clipr >=0.3.0
  - r-crayon
  - r-desc >=1.4.2
  - r-fs >=1.3.0
  - r-gert >=1.4.1
  - r-glue >=1.3.0
  - r-jsonlite
  - r-lifecycle >=1.0.0
  - r-purrr
  - r-rappdirs
  - r-rlang >=1.1.0
  - r-rprojroot >=2.1.1
  - r-rstudioapi
  - r-whisker
  - r-withr >=2.3.0
  - r-yaml
  run:
  - r-cli >=3.0.1
  - r-clipr >=0.3.0
  - r-crayon
  - r-desc >=1.4.2
  - r-fs >=1.3.0
  - r-gert >=1.4.1
  - r-glue >=1.3.0
  - r-jsonlite
  - r-lifecycle >=1.0.0
  - r-purrr
  - r-rappdirs
  - r-rlang >=1.1.0
  - r-rprojroot >=2.1.1
  - r-rstudioapi
  - r-whisker
  - r-withr >=2.3.0
  - r-yaml

tests:
- package_contents:
    files:
    - lib/R/library/${{ name[2:] }}/DESCRIPTION
- script: run_r_test
  files:
    recipe:
    - test-r-usethis.R
  requirements:
    build:
    - r-wasm-tester

about:
  homepage: https://usethis.r-lib.org
  license: MIT
  summary: Automate package and project setup tasks that are otherwise performed manually. This includes setting up unit
    testing, test coverage, continuous integration, Git, 'GitHub', licenses, 'Rcpp', 'RStudio' projects, and more.
  license_family: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
  - rgaiacs
