context:
  name: pygplates
  version: 1.1.1.0dev10
  # Snapshot of the 'feature/pygplates-drop-qt-gui' branch of GPlates/GPlates.
  # That branch replaces the Qt5+Widgets+OpenGL+qwt+glew stack of pyGPlates 1.0
  # with just Qt6 Core + Core5Compat, which is what makes an emscripten build
  # tractable.
  commit: bd6fea5b8cdd6e63f5fa14eff8e33e02788af01c

package:
  name: ${{ name }}-experimental
  version: ${{ version }}

source:
  url: https://github.com/GPlates/GPlates/archive/${{ commit }}.tar.gz
  sha256: 4978a9fdfda43736ca21371ce85fc04ea23de0171abf23980441aeba91a25b07
  patches:
  # Guards find_package(Python3) behind GPLATES_SKIP_FIND_PYTHON3, since
  # FindPython3 fails under emscripten cross-compile when sys.platform and
  # SOABI disagree.
  - patches/0001-Allow-skipping-find_package-Python3-for-cross-compil.patch

build:
  number: 2
  files:
    exclude:
    - '**/__pycache__/**'
    - '**/*.pyc'
    - '**/test_*.py'
  python:
    skip_pyc_compilation:
    - '**/*.py'

requirements:
  build:
  - ${{ compiler('cxx') }}
  - cross-python_${{ target_platform }}
  - python
  - pip
  - cmake >=3.22
  - make
  - scikit-build-core >=0.11.1
  - numpy >=2.0
  # Native Qt6 from conda-forge (resolver picks conda-forge version since
  # emscripten-forge-4x has no linux-64 build). Provides moc/rcc/uic/qmake
  # for cross-compile via QT_HOST_PATH.
  - qt6-main
  host:
  - python
  - numpy >=2.0
  # Boost.Python compiled library (provides libboost_python*.a) and the
  # per-module Boost packages the CMakeLists lists as components. The
  # legacy monolithic boost-cpp is stuck at 1.87 in variant.yaml while
  # libboost-python has moved to 1.92 — mixing them produces an
  # unresolved boost::python::detail::init_module at load time.
  # Post-#6609 split, boost-cpp as a resolvable name effectively means
  # 1.87. Pin per-module boost packages to 1.92 to align with
  # libboost-python.
  - libboost-python 1.92.*
  - boost-atomic 1.92.*
  - boost-chrono 1.92.*
  - boost-program_options 1.92.*
  - boost-python 1.92.*
  - boost-thread 1.92.*
  - cgal-cpp
  - gmp
  - mpfr
  - libgdal-core
  - qt6-main
  - qt6-5compat
  - zlib-static
  run:
  - python
  - numpy
  - libgdal-core
  - qt6-main
  - qt6-5compat
  - zlib-static
  - gmp
  - mpfr

tests:
- script: pytester
  files:
    recipe:
    - test_pygplates.py
  requirements:
    build:
    - pytester
    run:
    - pytester-run

about:
  homepage: https://www.gplates.org/
  repository: https://github.com/GPlates/GPlates
  # GPlates is GPL-2.0-only (COPYING says "version 2, not any later version").
  # This build MUST stay headless: linking Qt's WebAssembly QPA plugin
  # (GPL-3.0-only) would produce a combined binary that no license can
  # cover, since GPL-2-only and GPL-3-only are mutually incompatible.
  # Headless works because qt6-main's non-plugin code is tri-licensed
  # (LGPL-3 OR GPL-2 OR GPL-3), and pygplates picks the GPL-2 option.
  license: GPL-2.0-only
  license_file: COPYING
  summary: Python library for fine-grained access to GPlates functionality (Emscripten build, GUI-less snapshot)

extra:
  maintainers:
  - mmesch
  channel: emscripten-forge-4x-experimental
