context:
  name: python-calamine
  version: 0.9.1

package:
  name: ${{ name }}
  version: ${{ version }}

source:
- url: https://files.pythonhosted.org/packages/source/p/python_calamine/python_calamine-${{ version }}.tar.gz
  sha256: 458094c3dd41bd330c0a43d20e23489964ba28b3301687f1c5acc03c81d06a9f

build:
  number: 0
  script: |
    set -e
    export MATURIN_PYTHON_SYSCONFIGDATA_DIR=${PREFIX}/etc/conda/_sysconfigdata__emscripten_wasm32-emscripten.py
    export PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1
    rustup component add rust-src
    ${PYTHON} -m pip install . -vvv

requirements:
  build:
  - cross-python_${{ target_platform }}
  - maturin
  - pip
  - rust-nightly
  host:
  - python
  - pip
  run:
  - python
  - packaging

tests:
- script: pytester
  requirements:
    build:
    - pytester
    run:
    - pytester-run
  files:
    recipe:
    - test_python_calamine.py

about:
  homepage: https://github.com/dimastbk/python-calamine
  repository: https://github.com/dimastbk/python-calamine
  summary: Python binding for Rust's library for reading excel and odf file - calamine
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
  - Copilot
