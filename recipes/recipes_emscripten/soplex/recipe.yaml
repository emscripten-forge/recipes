context:
  version: 8.1.0

package:
  name: soplex
  version: ${{ version }}

source:
  url: https://github.com/scipopt/soplex/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 5aad34f158d251549e2aadbfbef706629f38652fcd027c12b0a8b2d3c8ff0719

build:
  number: 0

requirements:
  build:
  - ${{ compiler("cxx") }}
  - cmake
  - ninja
  host:
  - boost-cpp
  - gmp
  - mpfr
  - zlib
  - bzip2
  # omitted for now: papilo

tests:
- script:
  - test -d ${PREFIX}/include/soplex
- package_contents:
    files:
    - lib/libsoplex.a

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Linear optimization solver using the revised simplex method
  homepage: https://github.com/scipopt/soplex

extra:
  recipe-maintainers:
  - mkoeppe
