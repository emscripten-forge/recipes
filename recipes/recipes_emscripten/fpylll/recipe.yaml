context:
  version: "0.6.4"
  build_number: "0"

package:
  name: fpylll
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/f/fpylll/fpylll-${{ version }}.tar.gz
  sha256: 711d60d8ada46a410932cc45587728b4c7f4ea38a9b8d0be061f5ce098632ecd

build:
  number: ${{ build_number }}
  script: ${{ PYTHON }} -m pip install .

requirements:
  build:
  - python
  - crossenv >=1.2
  - cross-python_emscripten-wasm32
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - pip
  - cython
  - cysignals
  - pkgconfig
  - setuptools
  - numpy
  host:
  - python
  - gmp
  - fplll
  - numpy
  run:
  - python
  - cysignals

tests:
- script: pytester
  files:
    recipe:
    - test_fpylll.py
  requirements:
    build:
    - pytester
    run:
    - pytester-run

about:
  homepage: https://github.com/fplll/fpylll
  summary: A Python interface for https://github.com/fplll/fplll
  license: GPL-2.0-or-later
  license_file: LICENSE

extra:
  emscripten_tests:
    python:
      pytest_files:
      - test_fpylll.py
  recipe-maintainers:
  - mkoeppe
