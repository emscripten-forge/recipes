# Font configuration for OpenJDK on emscripten (no fontconfig in the browser).
# The JDK reads this because fontconfig cannot be loaded; the fonts are the
# DejaVu fonts installed next to it in lib/fonts. Paths assume the JDK is
# mounted at /opt/jdk, which is where openjdk21-wasm-link puts it.

version=1

dialog.plain.latin-1=DejaVu Sans
dialog.bold.latin-1=DejaVu Sans Bold
dialog.italic.latin-1=DejaVu Sans Oblique
dialog.bolditalic.latin-1=DejaVu Sans Bold Oblique

sansserif.plain.latin-1=DejaVu Sans
sansserif.bold.latin-1=DejaVu Sans Bold
sansserif.italic.latin-1=DejaVu Sans Oblique
sansserif.bolditalic.latin-1=DejaVu Sans Bold Oblique

serif.plain.latin-1=DejaVu Serif
serif.bold.latin-1=DejaVu Serif Bold
serif.italic.latin-1=DejaVu Serif Italic
serif.bolditalic.latin-1=DejaVu Serif Bold Italic

monospaced.plain.latin-1=DejaVu Sans Mono
monospaced.bold.latin-1=DejaVu Sans Mono Bold
monospaced.italic.latin-1=DejaVu Sans Mono Oblique
monospaced.bolditalic.latin-1=DejaVu Sans Mono Bold Oblique

dialoginput.plain.latin-1=DejaVu Sans Mono
dialoginput.bold.latin-1=DejaVu Sans Mono Bold
dialoginput.italic.latin-1=DejaVu Sans Mono Oblique
dialoginput.bolditalic.latin-1=DejaVu Sans Mono Bold Oblique

sequence.allfonts=latin-1

filename.DejaVu_Sans=/opt/jdk/lib/fonts/DejaVuSans.ttf
filename.DejaVu_Sans_Bold=/opt/jdk/lib/fonts/DejaVuSans-Bold.ttf
filename.DejaVu_Sans_Oblique=/opt/jdk/lib/fonts/DejaVuSans-Oblique.ttf
filename.DejaVu_Sans_Bold_Oblique=/opt/jdk/lib/fonts/DejaVuSans-BoldOblique.ttf
filename.DejaVu_Serif=/opt/jdk/lib/fonts/DejaVuSerif.ttf
filename.DejaVu_Serif_Bold=/opt/jdk/lib/fonts/DejaVuSerif-Bold.ttf
filename.DejaVu_Serif_Italic=/opt/jdk/lib/fonts/DejaVuSerif-Italic.ttf
filename.DejaVu_Serif_Bold_Italic=/opt/jdk/lib/fonts/DejaVuSerif-BoldItalic.ttf
filename.DejaVu_Sans_Mono=/opt/jdk/lib/fonts/DejaVuSansMono.ttf
filename.DejaVu_Sans_Mono_Bold=/opt/jdk/lib/fonts/DejaVuSansMono-Bold.ttf
filename.DejaVu_Sans_Mono_Oblique=/opt/jdk/lib/fonts/DejaVuSansMono-Oblique.ttf
filename.DejaVu_Sans_Mono_Bold_Oblique=/opt/jdk/lib/fonts/DejaVuSansMono-BoldOblique.ttf
