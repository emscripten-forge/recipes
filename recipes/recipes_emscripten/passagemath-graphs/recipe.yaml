context:
  version: 10.8.13

package:
  name: passagemath-graphs
  version: ${{ version }}

source:
- url: https://pypi.org/packages/source/p/passagemath-graphs/passagemath_graphs-${{ version }}.tar.gz
  sha256: ba79e37599cdf98ba6976e9605c34b7c799b5d70c644e180c8caa691bc6c44a1

build:
  script: ${{ PYTHON }} -m pip install .
  number: 0

requirements:
  build:
  - python
  - crossenv >=1.2
  - cross-python_emscripten-wasm32
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - pip
  - passagemath-setup
  - passagemath-environment
  - cython<3.3
  - gmpy2
  - cysignals
  - pkgconfig
  - passagemath-abi == ${{ version }}
  host:
  - python
  - gmp-static
  - mpfr
  - mpc
  - boost-cpp
  - passagemath-categories
  run:
  - python
  - gmpy2
  - cysignals
  - passagemath-categories

tests:
- script: pytester
  files:
    recipe:
    - test_passagemath_graphs.py
  requirements:
    build:
    - pytester
    run:
    - pytester-run
    - passagemath-repl

about:
  license: GPL-2.0-or-later
  license_file: README.rst
  summary: |
    'passagemath: Graphs, posets, hypergraphs, designs, abstract complexes, combinatorial
    polyhedra, abelian sandpiles, quivers'
  description: |
    Distribution of a part of the Sage library.
    It provides directed and undirected graphs, but also posets, combinatorial designs,
    abstract simplicial complexes, quivers, etc.  It consists of over 170 first-party Python
    and Cython modules and uses the Boost Graph Library, with additional functionality from
    NetworkX and several other libraries.

extra:
  emscripten_tests:
    python:
      pytest_files:
      - test_passagemath_graphs.py
  recipe-maintainers:
  - mkoeppe
