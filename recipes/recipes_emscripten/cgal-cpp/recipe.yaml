context:
  name: cgal-cpp
  version: 6.2.1

build:
  number: 5

outputs:
  - staging:
      name: build-cache
    source:
      url: https://github.com/CGAL/cgal/releases/download/v${{ version }}/CGAL-${{ version }}-library.tar.xz
      sha256: 8e7ce1e30e8ffcb3e69d153c3a561bb1f38bbb4becd8e6544cbaa0fb2889af62
      patches:
      - patches/keep-boost-find-module-mode.patch
    build:
      script: build.sh
    requirements:
      build:
      # Even though nothing gets compiled, CGAL's CMakeLists calls
      # project(CGAL LANGUAGES CXX), which triggers compiler detection at
      # configure time. Pin one so it doesn't fall back to /usr/bin/c++.
      - ${{ compiler('cxx') }}
      - cmake
      - ninja
      host:
      - boost-algorithm
      - boost-any
      - boost-bimap
      - boost-bind
      - boost-callable_traits
      - boost-concept_check
      - boost-config
      - boost-container
      - boost-container_hash
      - boost-core
      - boost-dynamic_bitset
      - boost-foreach
      - boost-format
      - boost-function
      - boost-functional
      - boost-fusion
      - boost-geometry
      - boost-graph
      - boost-heap
      - boost-intrusive
      - boost-iostreams
      - boost-iterator
      - boost-lexical_cast
      - boost-logic
      - boost-math
      - boost-mpl
      - boost-multi_array
      - boost-multi_index
      - boost-multiprecision
      - boost-numeric_interval
      - boost-optional
      - boost-phoenix
      - boost-predef
      - boost-preprocessor
      - boost-program_options
      - boost-property_map
      - boost-property_tree
      - boost-ptr_container
      - boost-random
      - boost-range
      - boost-serialization
      - boost-smart_ptr
      - boost-spirit
      - boost-stl_interfaces
      - boost-thread
      - boost-timer
      - boost-tuple
      - boost-type_traits
      - boost-unordered
      - boost-utility
      - boost-variant
      - gmp
      - mpfr

  - package:
      name: cgal-cpp
      version: ${{ version }}
    inherit: build-cache
    build:
      script: echo "Collecting files from cache"
      # Header-only library: everything a compiling consumer needs (headers,
      # CGALConfig.cmake) lives in cgal-cpp-dev; this package carries the
      # link-time/run dependencies plus the docs, so it stays a meta package.
      files:
        include:
        - share/**
    tests:
    - package_contents:
        files:
        - share/doc/CGAL/LICENSE
        - share/man/man1/cgal_create_cmake_script.1
    requirements:
      run:
      - boost-algorithm
      - boost-any
      - boost-bimap
      - boost-bind
      - boost-callable_traits
      - boost-concept_check
      - boost-config
      - boost-container
      - boost-container_hash
      - boost-core
      - boost-dynamic_bitset
      - boost-foreach
      - boost-format
      - boost-function
      - boost-functional
      - boost-fusion
      - boost-geometry
      - boost-graph
      - boost-heap
      - boost-intrusive
      - boost-iostreams
      - boost-iterator
      - boost-lexical_cast
      - boost-logic
      - boost-math
      - boost-mpl
      - boost-multi_array
      - boost-multi_index
      - boost-multiprecision
      - boost-numeric_interval
      - boost-optional
      - boost-phoenix
      - boost-predef
      - boost-preprocessor
      - boost-program_options
      - boost-property_map
      - boost-property_tree
      - boost-ptr_container
      - boost-random
      - boost-range
      - boost-serialization
      - boost-smart_ptr
      - boost-spirit
      - boost-stl_interfaces
      - boost-thread
      - boost-timer
      - boost-tuple
      - boost-type_traits
      - boost-unordered
      - boost-utility
      - boost-variant
      - gmp
      - mpfr

  - package:
      name: cgal-cpp-dev
      version: ${{ version }}
    inherit: build-cache
    build:
      script: echo "Collecting files from cache"
      files:
        include:
        - include/CGAL/**
        - lib/cmake/CGAL/**
    requirements:
      run:
      - ${{ pin_subpackage('cgal-cpp', exact=True) }}
    tests:
    - package_contents:
        files:
        - include/CGAL/version.h
        - lib/cmake/CGAL/CGALConfig.cmake
    - script:
      - build_tests.sh
      requirements:
        build:
        - ${{ compiler('cxx') }}
        - cmake
        - ninja
        - nodejs
      files:
        recipe:
        - build_tests.sh
        - tests/

about:
  homepage: https://www.cgal.org/
  license: LGPL-3.0-or-later AND GPL-3.0-or-later
  license_file:
  - LICENSE
  - LICENSE.LGPL
  - LICENSE.GPL
  summary: The Computational Geometry Algorithms Library (header-only distribution)

extra:
  recipe-maintainers:
  - mmesch
