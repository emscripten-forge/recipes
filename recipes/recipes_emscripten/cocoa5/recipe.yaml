context:
  name: cocoa5
  version: '0.99850'

package:
  name: ${{ name }}
  version: ${{ version }}

source:
- url: http://cocoa.altervista.org/cocoalib/tgz/CoCoALib-${{ version }}.tgz
  sha256: d3e7af0153c6950f83f4e3556540f0177fedf5179f0f7667b7d6d670268fd445
- git: https://github.com/wangyenshu/cocoa5-web-assets.git
  target_directory: web

build:
  number: 2

requirements:
  build:
  - autoconf
  - automake
  - libtool
  - make
  - ${{ compiler('cxx') }}
  - pkg-config
  - autoconf-archive
  host:
  - gmp
  - boost-algorithm
  - boost-asio
  - boost-bind
  - boost-config
  - boost-core
  - boost-date_time
  - boost-filesystem
  - boost-foreach
  - boost-iostreams
  - boost-lexical_cast
  - boost-property_tree
  - boost-scope_exit
  - boost-smart_ptr
  - boost-thread
  - cddlib
  - libfrobby
  - gfanlib
  - gsl
  - mpfr
  - libflint
  - normaliz
  - ntl
  - nauty

tests:
- package_contents:
    files:
    - bin/CoCoAInterpreter.js
    - bin/CoCoAInterpreter.wasm
    - bin/CoCoAInterpreter.data
    - bin/CoCoAInterpreter.data.js
    - lib/libcocoa.a

about:
  homepage: https://sites.google.com/view/cocoa-cocoalib
  license: GPL-3.0-only
  license_file: COPYRIGHT-full-text
  summary: CoCoA-5 is an interactive system for Computations in Commutative Algebra.

extra:
  recipe-maintainers:
  - wangyenshu
