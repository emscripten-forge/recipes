context:
  name: ggiraph
  version: 0.9.6

package:
  name: r-${{ name }}
  version: ${{ version }}

source:
  url:
  - https://cran.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cloud.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cran.r-project.org/src/contrib/Archive/${{ name }}/${{ name }}_${{ version }}.tar.gz
  sha256: 715f1ef27f0e3ab7775c90684ce8932aa0739ba2a2103713eb0a20eac1b7b645

build:
  number: 0
  skip: ${{ r_base >= '4.6.0' }}
  script: $R CMD INSTALL $R_ARGS .

requirements:
  build:
  - cross-r-base ==${{ r_base }}
  - ${{ compiler('cxx') }}
  - r-cli
  - r-dplyr
  - r-gdtools >=0.5.0
  - r-ggplot2 >=4.0.0
  - r-htmltools
  - r-htmlwidgets >=1.5
  - r-mass
  - r-purrr
  - r-rcpp >=1.1.0
  - r-rlang
  - r-s7 >=0.2.0
  - r-systemfonts >=1.3.1
  - r-vctrs
  host:
  - r-base ==${{ r_base }}
  - libpng-static
  - libzlib-static
  - r-cli
  - r-dplyr
  - r-gdtools >=0.5.0
  - r-ggplot2 >=4.0.0
  - r-htmltools
  - r-htmlwidgets >=1.5
  - r-mass
  - r-purrr
  - r-rcpp >=1.1.0
  - r-rlang
  - r-s7 >=0.2.0
  - r-systemfonts >=1.3.1
  - r-vctrs
  # Nested dep
  - r-haven
  run:
  - r-cli
  - r-dplyr
  - r-gdtools >=0.5.0
  - r-ggplot2 >=4.0.0
  - r-htmltools
  - r-htmlwidgets >=1.5
  - r-mass
  - r-purrr
  - r-rcpp >=1.1.0
  - r-rlang
  - r-s7 >=0.2.0
  - r-systemfonts >=1.3.1
  - r-vctrs

tests:
- package_contents:
    lib:
    - R/library/${{ name }}/libs/${{ name }}.so
- script:
  - RTESTER_MOUNT_FONTS=1 run_r_test test_${{ name }}.R
  - generic-testing
  files:
    recipe:
    - test_${{ name }}.R
  requirements:
    build:
    - r-wasm-tester
    - generic-testing
    run:
    - r-ggformula >=1.0.1

about:
  homepage: https://davidgohel.github.io/ggiraph/
  repository: https://github.com/davidgohel/ggiraph
  license: GPL-3.0-only
  license_file:
  - ${{ PREFIX }}/lib/R/share/licenses/GPL-3
  summary: Make ggplot2 graphics interactive
  description: Create interactive 'ggplot2' graphics using 'htmlwidgets'.

extra:
  recipe-maintainers:
  - adamblake
