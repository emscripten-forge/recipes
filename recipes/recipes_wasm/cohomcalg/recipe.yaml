context:
  name: cohomcalg
  version: '0.32'

package:
  name: ${{ name }}-static
  version: ${{ version }}

source:
  url: https://github.com/BenjaminJurke/cohomCalg/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 367c52b99c0b0a4794b215181439bf54abe4998872d3ef25d793bc13c4d40e42
  patches:
  # std::thread workers can't be started without pthreads
  - patches/0001-run-traverse-worker-inline-without-threads.patch

build:
  number: 0

requirements:
  build:
  - make
  - ${{ compiler("c") }}
  - ${{ compiler('cxx') }}

tests:
- package_contents:
    files:
    - lib/libcohomcalg.a
- script: bash tests/run_test.sh
  requirements:
    build:
    - ${{ compiler('cxx') }}
    - nodejs
  files:
    recipe:
    - tests/
- script: generic-testing
  requirements:
    build:
    - generic-testing

about:
  homepage: https://github.com/BenjaminJurke/cohomCalg
  license: GPL-3.0-only
  license_file: LICENSE
  summary: A software package for computation of sheaf cohomologies for line bundles on toric varieties.

extra:
  recipe-maintainers:
  - wangyenshu
