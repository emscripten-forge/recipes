context:
  name: gdtools
  version: 0.5.2

package:
  name: r-${{ name }}
  version: ${{ version }}

source:
  url:
  - https://cran.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cloud.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cran.r-project.org/src/contrib/Archive/${{ name }}/${{ name }}_${{ version }}.tar.gz
  sha256: 1d7e11d47bcb4bfc43c8a1a518810e4b62f743bf2b0c9bff9fc053644be8eef6

build:
  number: 1
  skip: ${{ r_base >= '4.6.0' }}
  script: $R CMD INSTALL $R_ARGS .

requirements:
  build:
  - cross-r-base ==${{ r_base }}
  - ${{ compiler('c') }}
  - ${{ compiler('cxx') }}
  - pkg-config
  - r-fontquiver >=0.2.0
  - r-htmltools
  - r-rcpp >=0.12.12
  - r-systemfonts >=1.3.1
  host:
  - r-base ==${{ r_base }}
  - cairo-static
  - libexpat-static
  - fontconfig-static
  - freetype-static
  - libpng-static
  - pixman-static
  - libzlib-static
  - r-fontquiver >=0.2.0
  - r-htmltools
  - r-rcpp >=0.12.12
  - r-systemfonts >=1.3.1
  run:
  - r-fontquiver >=0.2.0
  - r-htmltools
  - r-rcpp >=0.12.12
  - r-systemfonts >=1.3.1

tests:
- package_contents:
    lib:
    - R/library/${{ name }}/libs/${{ name }}.so
- script:
  - RTESTER_MOUNT_FONTS=1 run_r_test test_${{ name }}.R
  - generic-testing
  files:
    recipe:
    - test_${{ name }}.R
  requirements:
    build:
    - r-wasm-tester
    - generic-testing

about:
  homepage: https://davidgohel.github.io/gdtools/
  repository: https://github.com/davidgohel/gdtools
  license: GPL-3.0-only
  license_file: LICENSE
  summary: Font metrics and font management utilities for R graphics

extra:
  recipe-maintainers:
  - adamblake
