context:
  name: nnet
  version: 7.3-21

package:
  name: r-${{ name }}
  version: ${{ version | replace('-', '_') }}

source:
  url:
  - https://cran.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cloud.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cran.r-project.org/src/contrib/Archive/${{ name }}/${{ name }}_${{ version }}.tar.gz
  sha256: c3914e2b8fd2cc2df7afb60cfa106070fc43cd5b60f877f3790303fc6513895b

build:
  number: 0
  script: $R CMD INSTALL $R_ARGS .

requirements:
  build:
  - cross-r-base ==${{ r_base }}
  - ${{ compiler('c') }}
  host:
  - r-base ==${{ r_base }}

tests:
- package_contents:
    lib:
    - R/library/${{ name }}/libs/${{ name }}.so
- script:
  - run_r_test test_${{ name }}.R
  - generic-testing
  files:
    recipe:
    - test_${{ name }}.R
  requirements:
    build:
    - r-wasm-tester
    - generic-testing

about:
  homepage: http://www.stats.ox.ac.uk/pub/MASS4/
  license: GPL-2.0-or-later
  license_family: GPL3
  license_file:
  - ${{ PREFIX }}/lib/R/share/licenses/GPL-3
  summary: Feed-Forward Neural Networks and Multinomial Log-Linear Models
  description: |
    Software for feed-forward neural networks with a single hidden layer, and
    for multinomial log-linear models.

extra:
  recipe-maintainers:
  - IsabelParedes
