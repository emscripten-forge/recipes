context:
  version: 10.8.13

package:
  name: passagemath-lcalc
  version: ${{ version }}

source:
- url: https://pypi.org/packages/source/p/passagemath-lcalc/passagemath_lcalc-${{ version }}.tar.gz
  sha256: c9668752affddf91ce33c58cf9f3665e77b54dd1056ffecec51f593ed9da9e17

build:
  script: ${{ PYTHON }} -m pip install .
  number: 0

requirements:
  build:
  - python
  - crossenv >=1.2
  - cross-python_${{ target_platform }}
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - pip
  - passagemath-setup
  - passagemath-environment
  - cython<3.3
  - cysignals
  - numpy
  - pkgconfig
  - passagemath-abi == ${{ version }}
  host:
  - python-dev
  - gmp-static
  - lcalc-static
  - mpfr-static
  - ntl-static
  - pari-static
  - numpy
  - passagemath-modules
  run:
  - python
  - cysignals
  - passagemath-modules

tests:
- script: pytester
  files:
    recipe:
    - test_passagemath_lcalc.py
  requirements:
    build:
    - pytester
    run:
    - pytester-run
    - passagemath-repl
- script: generic-testing
  requirements:
    build:
    - generic-testing

about:
  license: GPL-2.0-or-later
  license_file: README.rst
  summary: 'passagemath: L-function calculations with lcalc'
  description: |
    Distribution of a part of the Sage library.
    It provides an interface to Michael Rubinstein's L-function calculator.

extra:
  emscripten_tests:
    python:
      pytest_files:
      - test_passagemath_lcalc.py
  recipe-maintainers:
  - mkoeppe
