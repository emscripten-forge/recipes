context:
  name: spatialgeometry
  version: 1.4.2

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/spatialgeometry-${{version }}.tar.gz
  sha256: 82bc3325eb25395b974f076ce6a963852dba215a2b979a91d79a1a08f7f4ae0c

build:
  number: 0
  noarch: python
  # SG_PURE_WHEEL=1 is upstream's switch for the Pyodide/JupyterLite build:
  # it skips the optional nanobind extension (never built for Emscripten
  # anyway) and the pure-Python fallback spatialgeometry/scene.py is used.
  # Install with the native build python (cross-python cannot be activated
  # for target_platform=noarch).
  script:
  - export SG_PURE_WHEEL=1
  - export CMAKE_ARGS="${CMAKE_ARGS} -Dnanobind_DIR=$(python -m nanobind --cmake_dir)"
  - python -m pip install . --no-deps --no-build-isolation --prefix=${PREFIX} -vv

  files:
    exclude:
    - '**/__pycache__/**'
    - '**/*.pyc'
  python:
    skip_pyc_compilation:
    - '**/*.py'

requirements:
  build:
  # same python version as the (emscripten) host python, so pip installs
  # into the matching lib/pythonX.Y/site-packages
  - python ${{ python_min }}.*
  - pip
  - scikit-build-core >=0.9
  - nanobind >=2
  - cmake
  - ${{ compiler('c') }}
  - ${{ compiler('cxx') }}
  host:
  - python
  run:
  - python
  - spatialmath-python >=1.0.0
  - numpy

tests:
- script: pytester
  requirements:
    build:
    - pytester
    run:
    - pytester-run
  files:
    recipe:
    - test_spatialgeometry.py
- script: target_platform=${{ host_platform }} generic-testing
  requirements:
    build:
    - generic-testing

about:
  summary: A Shape and Geometry Package
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/jhavl/spatialgeometry

extra:
  recipe-maintainers:
  - IsabelParedes
