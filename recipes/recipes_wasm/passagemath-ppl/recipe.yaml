context:
  version: 0.8.10.3

package:
  name: passagemath-ppl
  version: ${{ version }}

source:
- url: https://pypi.org/packages/source/p/passagemath-ppl/passagemath_ppl-${{ version }}.tar.gz
  sha256: 62e24a12dee8f8fcee80bb8231c9652e17d3f2d710c0a2815d26a8b071162ea3

build:
  number: 0
  script: |
    export CXXFLAGS="$CXXFLAGS -std=c++14"
    ${{ PYTHON }} -m pip install .

requirements:
  build:
  - python
  - crossenv >=1.2
  - cross-python_emscripten-wasm32
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - pip
  - cython<3.3
  - gmpy2
  - cysignals
  - pkgconfig
  host:
  - python-dev
  - glpk-static
  - gmp-static
  - mpc-static
  - mpfr-static
  - ppl-static
  run:
  - python
  - gmpy2
  - cysignals

tests:
- script: pytester
  files:
    recipe:
    - test_passagemath_ppl.py
  requirements:
    build:
    - pytester
    run:
    - pytester-run

- script: generic-testing
  requirements:
    build:
    - generic-testing
about:
  summary: 'passagemath: Python wrapper for the Parma Polyhedra Library (pplpy fork)'
  license: GPL-2.0-or-later
  license_file: README.rst
  description: |
    Python interface to the Parma Polyhedra Library.

extra:
  emscripten_tests:
    python:
      pytest_files:
      - test_passagemath_ppl.py
  recipe-maintainers:
  - mkoeppe
