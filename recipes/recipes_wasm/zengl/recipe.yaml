context:
  name: zengl
  version: 2.7.3

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/z/zengl/zengl-${{ version }}.tar.gz
  sha256: 1c748c90989e9989dc256b0c3a70e53d271a4aba7546f42221c0f21227e17d9c

build:
  number: 0
  script: ${PYTHON} -m pip install . ${PIP_ARGS}

requirements:
  build:
  - python
  - cross-python_${{ target_platform }}
  - ${{ compiler('c') }}
  - pip
  host:
  - python-dev
  - pip
  - setuptools
  run:
  - python

tests:
- script: pytester
  files:
    recipe:
    - test_zengl.py
  requirements:
    build:
    - pytester
    run:
    - pytester-run

- script: generic-testing
  requirements:
    build:
    - generic-testing
about:
  homepage: https://github.com/szabolcsdombi/zengl/
  license: MIT
  license_file: LICENSE
  summary: OpenGL Pipelines for Python
  repository: https://github.com/szabolcsdombi/zengl

extra:
  recipe-maintainers:
  - Copilot
