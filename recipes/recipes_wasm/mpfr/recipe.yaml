context:
  name: mpfr
  version: 4.2.2

package:
  name: ${{ name }}-static
  version: ${{ version }}

source:
  url: https://ftp.gnu.org/gnu/mpfr/mpfr-${{ version }}.tar.gz
  sha256: 826cbb24610bd193f36fde172233fb8c009f3f5c2ad99f644d0dea2e16a20e42

build:
  number: 0

requirements:
  build:
  - ${{ compiler('c') }}
  - libtool
  - m4
  - make
  - gnuconfig
  host:
  - gmp-static
  run:
  - ${{ pin_compatible("gmp-static", lower_bound='x', upper_bound='x') }}

tests:
- package_contents:
    files:
    - include/mpf2mpfr.h
    - include/mpfr.h
    - lib/libmpfr.a
    - lib/pkgconfig/mpfr.pc
- script: generic-testing
  requirements:
    build:
    - generic-testing

about:
  license: LGPL-3.0-only
  license_file: COPYING.LESSER
  summary: |
    The MPFR library is a C library for multiple-precision floating-point
    computations with correct rounding.
  homepage: http://www.mpfr.org/

extra:
  recipe-maintainers:
  - wolfv
