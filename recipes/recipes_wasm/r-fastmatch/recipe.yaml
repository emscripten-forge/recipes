context:
  name: fastmatch
  version: 1.1-8

package:
  name: r-${{ name }}
  version: ${{ version | replace("-", "_") }}

source:
  url:
  - https://cran.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cloud.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cran.r-project.org/src/contrib/Archive/${{ name }}/${{ name }}_${{ version }}.tar.gz
  sha256: 2661c01bdc2383f4a30bf940e6bc3b68f1329db5f0e837df8160eb893f748d54
  patches:
  - patches/0001-Remove-dummy.c.patch

build:
  number: 0
  script: $R CMD INSTALL $R_ARGS .

requirements:
  build:
  - ${{ compiler('c') }}
  - cross-r-base ==${{ r_base }}
  host:
  - r-base ==${{ r_base }}

tests:
- package_contents:
    lib:
    - R/library/${{ name }}/libs/${{ name }}.so
- script:
  - run_r_test test_${{ name }}.R
  - generic-testing
  files:
    recipe:
    - test_${{ name }}.R
  requirements:
    build:
    - r-wasm-tester
    - generic-testing

about:
  homepage: https://www.rforge.net/fastmatch
  license: GPL-2.0-only
  license_family: GPL2
  license_file:
  - ${{ PREFIX }}/lib/R/share/licenses/GPL-2
  summary: Fast 'match()' Function
  description: |
    Package providing a fast match() replacement for cases that require repeated
    look-ups. It is slightly faster that R's built-in match() function on first
    match against a table, but extremely fast on any subsequent lookup as it
    keeps the hash table in memory.
