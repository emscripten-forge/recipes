context:
  name: pycdfpp
  version: 0.20.0

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/SciQLop/CDFpp/archive/v${{ version }}.tar.gz
  sha256: 7d1cf626e7f58fc326d6ec60e2fabac0380a66b8ac7d4343ca865e53c3e31626

build:
  number: 0

  files:
    exclude:
    - '**/__pycache__/**'
    - '**/*.pyc'
    - '**/test_*.py'
  python:
    skip_pyc_compilation:
    - '**/*.py'

requirements:
  build:
  - ${{ compiler('c') }}
  - ${{ compiler('cxx') }}
  - cross-python_${{ target_platform }}
  - meson-python
  - ninja >=1.8.2
  - pip >=24.0
  - python
  - cmake
  host:
  - python-dev

tests:
- script: pytester
  requirements:
    build:
    - pytester
    run:
    - pytester-run
    - numpy
  files:
    recipe:
    - test_pycdfpp.py
- script: generic-testing
  requirements:
    build:
    - generic-testing

about:
  homepage: https://github.com/SciQLop/CDFpp
  license: MIT
  license_file: COPYING
  summary: A modern C++ header only cdf library with Python bindings

extra:
  recipe-maintainers:
  - AlexisJeandet
