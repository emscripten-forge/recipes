context:
  name: openssl
  version: 3.5.8
  build_number: 0



source:
  url: https://www.openssl.org/source/${{ name }}-${{ version }}.tar.gz
  sha256: a8f84a39918ec6415ce765d9b429d313ba97b8143169c172e734b9514464f5b2


outputs:


  - package:
      name: libopenssl-static
      version: ${{ version }}
    build:
      number: 0
      script: build.sh

    requirements:
      build:
      - ${{ compiler("cxx") }}
      - ${{ compiler("c") }}

    tests:
      - package_contents:
          files:
          - lib/libcrypto.a
          - lib/libssl.a
          - include/openssl/crypto.h
          - include/openssl/ssl.h
          - lib/cmake/OpenSSL/OpenSSLConfig.cmake
          
      - script:
        - generic-testing
        requirements:
          build:
          - generic-testing
          
      - script:
        - build_tests.sh
        requirements:
          build:
          - ${{ compiler("cxx") }}
          - cmake
          - make
        files:
          recipe:
          - build_tests.sh
          - tests/
  # NOTE, the shared build is dropped since we run into undefined symbols
        
about:
  homepage: https://www.openssl.org/
  license_file: LICENSE.txt
  license: Apache-2.0
  license_family: Apache
  summary: OpenSSL is an open-source implementation of the SSL and TLS protocols
  repository: https://github.com/openssl/openssl
  documentation: https://docs.openssl.org/master/

extra:
  recipe-maintainers:
  - IsabelParedes
  - DerThorsten
  version-bot:
    # this recipe is for 3.5.x  (this is the longterm support version of openssl)
    # therefore dont bump to 3.6.x automatically
    bump_constraint: "< 3.6.0"
