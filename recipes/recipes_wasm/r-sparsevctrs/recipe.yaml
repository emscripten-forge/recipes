context:
  name: sparsevctrs
  version: 0.3.6

package:
  name: r-${{ name }}
  version: ${{ version }}

source:
  url:
  - https://cran.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cloud.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cran.r-project.org/src/contrib/Archive/${{ name }}/${{ name }}_${{ version }}.tar.gz
  sha256: b5913cb3b7471937d10b7784c78e955f8dc263c15ede4bef85a44c7572240aec

build:
  number: 0
  skip: ${{ r_base >= '4.6.0' }}
  script: $R CMD INSTALL $R_ARGS .

requirements:
  build:
  - cross-r-base ==${{ r_base }}
  - ${{ compiler('c') }}
  - r-cli >=3.4.0
  - r-rlang >=1.1.0
  - r-vctrs
  host:
  - r-base ==${{ r_base }}
  - r-cli >=3.4.0
  - r-rlang >=1.1.0
  - r-vctrs
  run:
  - r-cli >=3.4.0
  - r-rlang >=1.1.0
  - r-vctrs

tests:
- package_contents:
    lib:
    - R/library/${{ name }}/libs/${{ name }}.so
- script:
  - run_r_test test_${{ name }}.R
  - generic-testing
  files:
    recipe:
    - test_${{ name }}.R
  requirements:
    build:
    - r-wasm-tester
    - generic-testing

about:
  homepage: https://github.com/r-lib/sparsevctrs
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Sparse Vectors for Use in Data Frames
  description: |
    Provides sparse vectors powered by ALTREP (Alternative Representations for R
    Objects) that behave like regular vectors, and can thus be used in data
    frames. Also provides tools to convert between sparse matrices and data
    frames with sparse columns and functions to interact with sparse vectors.

extra:
  recipe-maintainers:
  - DerThorsten
  - IsabelParedes
