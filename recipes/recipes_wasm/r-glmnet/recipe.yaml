context:
  name: glmnet
  version: '5.1'

package:
  name: r-${{ name }}
  version: ${{ version }}

source:
  url:
  - https://cran.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cloud.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cran.r-project.org/src/contrib/Archive/${{ name }}/${{ name }}_${{ version }}.tar.gz
  sha256: a6c23c906806f89a451de30b202e5bf088577f4da260d0b7f8887a7df3f22778

build:
  number: 0
  skip: ${{ r_base >= '4.6.0' }}
  script: $R CMD INSTALL $R_ARGS .

requirements:
  build:
  - cross-r-base ==${{ r_base }}
  - ${{ compiler('c') }}
  - ${{ compiler('cxx') }}
  - r-matrix
  - r-rcpp
  - r-rcppeigen
  - r-foreach
  - r-shape
  - r-survival
  host:
  - r-base ==${{ r_base }}
  - r-matrix
  - r-rcpp
  - r-rcppeigen
  - r-foreach
  - r-shape
  - r-survival
  run:
  - r-matrix
  - r-rcpp
  - r-rcppeigen
  - r-foreach
  - r-shape
  - r-survival

tests:
- package_contents:
    lib:
    - R/library/${{ name }}/libs/${{ name }}.so
- script:
  - run_r_test test_${{ name }}.R
  - generic-testing
  files:
    recipe:
    - test_${{ name }}.R
  requirements:
    build:
    - r-wasm-tester
    - generic-testing

about:
  homepage: https://glmnet.stanford.edu
  repository: https://github.com/cran/glmnet
  license: GPL-2.0-only
  license_family: GPL2
  license_file:
  - ${{ PREFIX }}/lib/R/share/licenses/GPL-2
  summary: Lasso and Elastic-Net Regularized Generalized Linear Models
  description: |
    Extremely efficient procedures for fitting the entire lasso or elastic-net
    regularization path for linear regression, logistic and multinomial
    regression models, Poisson regression, Cox model, multiple-response
    Gaussian, and the grouped multinomial regression; see
    <doi:10.18637/jss.v033.i01> and <doi:10.18637/jss.v039.i05>. There are two
    new and important additions. The family argument can be a GLM family object,
    which opens the door to any programmed family (<doi:10.18637/jss.v106.i01>).
    This comes with a modest computational cost, so when the built-in families
    suffice, they should be used instead. The other novelty is the relax option,
    which refits each of the active sets in the path unpenalized. The algorithm
    uses cyclical coordinate descent in a path-wise fashion, as described in the
    papers cited.

extra:
  recipe-maintainers:
  - anutosh491
  - IsabelParedes
