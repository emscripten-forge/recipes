context:
  name: pillow
  version: 13.0.0

package:
  name: ${{ name }}
  version: ${{ version }}

source:
- url: https://github.com/python-pillow/Pillow/archive/refs/tags/${{ version }}.tar.gz
  sha256: edf59ba26a21ea6d7e6a3755fe139a57297704591c4113ad470dac9ac2ccaf5e
  patches:
  - patches/0001-Avoid-using-usr-headers-and-libs.patch
- path: src/setup.cfg

build:
  number: 0

  files:
    exclude:
    - '**/*.pyi'
    - '**/__pycache__/**'
    - '**/*.pyc'
    - '**/test_*.py'
  python:
    skip_pyc_compilation:
    - '**/*.py'
requirements:
  build:
  - ${{ compiler("cxx") }}
  - cross-python_${{ target_platform }}
  - pip
  host:
  - python-dev
  - pybind11 >=3.0
  - zlib-static
  - freetype-static
  - jpeg-static
  - openjpeg-static
  - libtiff-static
  - libwebp-static


tests:
- script: pytester
  files:
    recipe:
    - test_import_Pillow.py
  requirements:
    build:
    - pytester
    run:
    - pytester-run

about:
  homepage: https://pillow.readthedocs.io
  license: HPND
  license_file: LICENSE
  summary: Pillow is the friendly PIL fork by Alex Clark and Contributors
  repository: https://github.com/python-pillow/Pillow/

extra:
  recipe-maintainers:
  - IsabelParedes
