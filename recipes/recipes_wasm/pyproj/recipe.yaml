context:
  name: pyproj
  version: 3.8.0

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/p/pyproj/pyproj-${{ version }}.tar.gz
  sha256: efa59725bba68bf97fa808b61302df32934acdceb6a5c92a8dd0e71dc266a876
  patches:
  - patches/0001-no-rpath-on-emscripten.patch

build:
  number: 0

  files:
    exclude:
    - '**/*.pyi'
    - '**/*.pxi'
    - '**/__pycache__/**'
    - '**/*.pyx'
    - '**/*.pxd'
    - '**/*.pyc'
    - '**/test_*.py'
  python:
    skip_pyc_compilation:
    - '**/*.py'
requirements:
  build:
  - python
  - cross-python_${{ target_platform }}
  - cython
  - pkg-config
  - ${{ compiler('c') }}
  host:
  - python-dev
  - proj >=9.9
  run:
  - python
  - proj
  - certifi

tests:
- script: pytester
  requirements:
    build:
    - pytester
    run:
    - pytester-run
  files:
    recipe:
    - test_pyproj.py
- script: generic-testing
  requirements:
    build:
    - generic-testing

about:
  homepage: https://github.com/pyproj4/pyproj
  license: MIT
  license_file:
  - LICENSE
  - LICENSE_proj
  summary: Python interface to PROJ library

extra:
  recipe-maintainers:
  - KGB99
  - DerThorsten
