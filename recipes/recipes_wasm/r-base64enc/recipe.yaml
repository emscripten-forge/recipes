context:
  name: base64enc
  version: 0.1-6

package:
  name: r-${{ name }}
  version: ${{ version | replace("-", "_") }}

source:
  url:
  - https://cran.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cloud.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cran.r-project.org/src/contrib/Archive/${{ name }}/${{ name }}_${{ version }}.tar.gz
  sha256: 3c7e9d22f7409fa2989008fa6e980c3dd8e2693eb20676acf2470ae7addb0816

build:
  number: 0
  script: $R CMD INSTALL $R_ARGS .

requirements:
  build:
  - cross-r-base ==${{ r_base }}
  - ${{ compiler('c') }}
  host:
  - r-base ==${{ r_base }}

tests:
- package_contents:
    lib:
    - R/library/${{ name }}/libs/${{ name }}.so
- script:
  - run_r_test test_${{ name }}.R
  - generic-testing
  files:
    recipe:
    - test_${{ name }}.R
  requirements:
    build:
    - r-wasm-tester
    - generic-testing

about:
  homepage: http://www.rforge.net/base64enc
  license: GPL-2.0-or-later
  license_family: GPL3
  license_file:
  - ${{ PREFIX }}/lib/R/share/licenses/GPL-3
  summary: Tools for base64 Encoding
  description: |
    This package provides tools for handling base64 encoding. It is more
    flexible than the orphaned base64 package.

extra:
  recipe-maintainers:
  - IsabelParedes
