context:
  name: LiblineaR
  version: 2.10-26

package:
  name: r-${{ name | lower }}
  version: ${{ version | replace("-", "_") }}

source:
  url:
  - https://cran.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cloud.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cran.r-project.org/src/contrib/Archive/${{ name }}/${{ name }}_${{ version }}.tar.gz
  sha256: fc1f224a5f96f0f949a47f98c2e789c77fa8925a9a784652ec4fdefca1922b02
  patches:
  - patches/0001-Change-function-signature.patch

build:
  number: 0
  script: $R CMD INSTALL $R_ARGS .

requirements:
  build:
  - ${{ compiler('c') }}
  - ${{ compiler('cxx') }}
  - cross-r-base ==${{ r_base }}
  host:
  - r-base ==${{ r_base }}
  - libflang-rt-static

tests:
- package_contents:
    lib:
    - R/library/${{ name }}/libs/${{ name }}.so
- script:
  - run_r_test test_${{ name }}.R
  - generic-testing
  files:
    recipe:
    - test_${{ name }}.R
  requirements:
    build:
    - r-wasm-tester
    - generic-testing

about:
  homepage: https://dnalytics.com/software/liblinear/
  license: GPL-2.0-only
  license_family: GPL2
  license_file: COPYING
  summary: Linear Predictive Models Based on the LIBLINEAR C/C++ Library
  description: |
    A wrapper around the LIBLINEAR C/C++ library for machine learning (available
    at <https://www.csie.ntu.edu.tw/~cjlin/liblinear/>). LIBLINEAR is a simple
    library for solving large-scale regularized linear classification and
    regression. It currently supports L2-regularized classification (such as
    logistic regression, L2-loss linear SVM and L1-loss linear SVM) as well as
    L1-regularized classification (such as L2-loss linear SVM and logistic
    regression) and L2-regularized support vector regression (with L1- or
    L2-loss). The main features of LiblineaR include multi-class classification
    (one-vs-the rest, and Crammer & Singer method), cross validation for model
    selection, probability estimates (logistic regression only) or weights for
    unbalanced data. The estimation of the models is particularly fast as
    compared to other libraries.

extra:
  recipe-maintainers:
  - rgaiacs
