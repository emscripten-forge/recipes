context:
  name: libiconv-static
  version: '1.19'

package:
  name: ${{ name }}
  version: ${{ version }}

source:
- url: https://ftp.gnu.org/pub/gnu/libiconv/libiconv-${{ version }}.tar.gz
  sha256: 88dd96a8c0464eca144fc791ae60cd31cd8ee78321e67397e25fc095c4a19aa6

build:
  number: 0
  files:
    exclude:
    - share/man/man*/**

requirements:
  build:
  - ${{ compiler("c") }}

tests:
- package_contents:
    files:
    - bin/iconv*
    - lib/libcharset.a
    - lib/libiconv.a
    - include/iconv.h
- script:
  - node ${PREFIX}/bin/iconv --version
  requirements:
    build:
    - nodejs
- script: generic-testing
  requirements:
    build:
    - generic-testing

about:
  homepage: https://www.gnu.org/software/libiconv/
  license: LGPL-2.1-only
  license_file: COPYING.LIB
  summary: |
    This library provides an iconv() implementation, for use on systems which
    don't have one, or whose implementation cannot convert from/to Unicode.

extra:
  recipe-maintainers:
  - IsabelParedes
  ci:
    platforms:
      emscripten-wasm32: true
      emscripten-wasm64: true
