context:
  version: 1.1.2

source:
  url: https://www.wm.uni-bayreuth.de/de/team/rambau_joerg/TOPCOM-Downloads/TOPCOM-${{ version | replace(".", "_") }}.tgz
  sha256: 4fb10754ee5b76056441fea98f2c8dee5db6f2984d8c14283b49239ad4378ab6

build:
  number: 0

outputs:
- staging:
    name: topcom-build
  requirements:
    build:
    - make
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    host:
    - gmp-static
  build:
    script: build.sh

#==============================================================================#

# TOPCOM command line programs (points2triangs, cube, checkregularity, ...)
- package:
    name: topcom
    version: ${{ version }}
  inherit: topcom-build
  build:
    files:
      include:
      - bin/
  requirements:
    ignore_run_exports:
      from_package:
      - gmp-static
  tests:
  - package_contents:
      files:
      - bin/points2ntriangs
      - bin/points2ntriangs.wasm
      - bin/cube
      - bin/checkregularity
  - script: bash test_topcom.sh
    requirements:
      build:
      - nodejs
    files:
      recipe:
      - test_topcom.sh
  - script: generic-testing
    requirements:
      build:
      - generic-testing

#==============================================================================#

# libTOPCOM / libCHECKREG and headers
- package:
    name: topcom-static
    version: ${{ version }}
  inherit: topcom-build
  build:
    files:
      include:
      - include/
      - lib/libTOPCOM.a
      - lib/libCHECKREG.a
  requirements:
    host:
    - gmp-static
    run:
    - ${{ pin_compatible('gmp-static', lower_bound='x', upper_bound='x') }}
  tests:
  - package_contents:
      files:
      - lib/libTOPCOM.a
      - lib/libCHECKREG.a
  # the parallel enumeration / symmetry checks use std::thread, so libTOPCOM.a
  # references pthread_create. They only run with --parallelenumeration /
  # --parallelsymmetries (default: 1 thread); nothing is compiled with -pthread.
  - script: generic-testing --allow-pthread
    requirements:
      build:
      - generic-testing

#==============================================================================#

about:
  homepage: https://www.wm.uni-bayreuth.de/de/team/rambau_joerg/TOPCOM/index.html
  license: GPL-3.0-only
  license_file: COPYING
  summary: TOPCOM is a package for computing Triangulations Of Point Configurations and Oriented Matroids.

extra:
  recipe-maintainers:
  - wangyenshu
