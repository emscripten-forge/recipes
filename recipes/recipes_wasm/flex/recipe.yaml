context:
  name: flex
  version: 2.6.13

package:
  name: ${{ name }}-static
  version: ${{ version }}

source:
  url: https://github.com/westes/flex/releases/download/v${{ version }}/flex-${{ version }}.tar.gz
  sha256: a54de3a79dc191d9d9a3acd07b8981be160d1be588261ef7687ccfdaeb1190ed

build:
  number: 0

requirements:
  build:
  - autoconf
  - automake
  - libtool
  - make
  - ${{ compiler("c") }}
  - ${{ compiler('cxx') }}
  - pkg-config
  - autoconf-archive
  - gettext
  - gcc
  - gxx

tests:
- package_contents:
    files:
    - lib/libfl.a
    - include/FlexLexer.h
- script: generic-testing
  requirements:
    build:
    - generic-testing

about:
  homepage: https://github.com/westes/flex
  license: LicenseRef-flex-BSD
  license_file: COPYING
  summary: The Fast Lexical Analyzer - scanner generator for lexing in C and C++

extra:
  recipe-maintainers:
  - wangyenshu
