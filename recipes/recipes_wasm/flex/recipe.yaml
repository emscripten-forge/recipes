context:
  name: flex
  version: 2.6.8

package:
  name: ${{ name }}-static
  version: ${{ version }}

source:
  url: https://github.com/westes/flex/releases/download/v${{ version }}/flex-${{ version }}.tar.gz
  sha256: 2672fda28aacee5e269c9a9bbf4a08a9bc48a21638a8916572014584e2500dc6

build:
  number: 0

requirements:
  build:
  - autoconf
  - automake
  - libtool
  - make
  - ${{ compiler("c") }}
  - ${{ compiler('cxx') }}
  - pkg-config
  - autoconf-archive
  - gettext
  - gcc
  - gxx

tests:
- package_contents:
    files:
    - lib/libfl.a
    - include/FlexLexer.h
- script: generic-testing
  requirements:
    build:
    - generic-testing

about:
  homepage: https://github.com/westes/flex
  license: LicenseRef-flex-BSD
  license_file: COPYING
  summary: The Fast Lexical Analyzer - scanner generator for lexing in C and C++

extra:
  recipe-maintainers:
  - wangyenshu
