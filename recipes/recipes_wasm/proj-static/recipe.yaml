context:
  name: proj-static
  version: 9.9.0

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://download.osgeo.org/proj/proj-${{ version }}.tar.gz
  sha256: 791a0610547eeabb17006cfd49cdbd2034f3240f47ed5e88a1031811f4e2bcf3

build:
  number: 0

  files:
    exclude:
    - share/man/man1/**
    - '**/*.ini'
requirements:
  build:
  - cmake
  - make
  - ${{ compiler('c') }}
  - ${{ compiler('cxx') }}
  - requests
  - sqlite
  host:
  - libsqlite-static
  - libtiff-static
  run:
  - ${{ pin_compatible('libsqlite-static', lower_bound='x', upper_bound='x') }}
  - ${{ pin_compatible('libtiff-static', lower_bound='x', upper_bound='x') }}

tests:
- package_contents:
    lib:
    - libproj.a
    include:
    - proj.h
- script: generic-testing
  requirements:
    build:
    - generic-testing

about:
  homepage: https://proj.org/
  license: MIT
  license_file: COPYING
  summary: Cartographic Projections and Coordinate Transformations Library

extra:
  recipe-maintainers:
  - KGB99
