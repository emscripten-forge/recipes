context:
  name: mocpy
  version: 0.20.0

package:
  name: ${{ name }}
  version: ${{ version }}

source:
- url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: a593519e28eef91635ca151fc8b258ac6a56ae6c5c714bfdffc8ab167911f477
# the moc and cdshealpix Rust crates; build.sh adds an emscripten fallback
# for show_with_default_app (only defined for linux/macos/windows) to both
# and uses them through [patch.crates-io]
- url: https://static.crates.io/crates/moc/moc-0.19.2.crate
  sha256: 6f3ead7aafd8b1397b8432855fd803cc8ab4e19dae31417a14ba1d915a67b222
  file_name: moc-0.19.2.tar.gz
  target_directory: moc-crate
- url: https://static.crates.io/crates/cdshealpix/cdshealpix-0.9.1.crate
  sha256: 8f43f12e4bfde350aa1936fa2896c5e8dd6d717ec27f854272b6f3cb2e478479
  file_name: cdshealpix-0.9.1.tar.gz
  target_directory: cdshealpix-crate

build:
  number: 0

  files:
    exclude:
    - '**/*.pyi'
    - '**.dist-info/**'
    - '**/__pycache__/**'
    - '**/*.pyc'
    - '**/test_*.py'
  python:
    skip_pyc_compilation:
    - '**/*.py'

requirements:
  build:
  - python
  - cross-python_${{ target_platform }}
  - pip
  - setuptools-rust
  - rust-nightly
  - maturin
  - ${{ compiler('cxx') }}
  host:
  - python-dev
  run:
  - python
  - numpy
  - astropy
  - cdshealpix

tests:
- script: pytester
  requirements:
    build:
    - pytester
    run:
    - pytester-run
  files:
    recipe:
    - test_import_mocpy.py
- script: generic-testing
  requirements:
    build:
    - generic-testing

about:
  homepage: https://github.com/cds-astro/mocpy/
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Multi-Order Coverages manipulation
  description: |
    MOCpy allows to read, generate, write and manipulate MOCs. It supports operations
    between MOCs. The available MOC flavors are Space-MOCs, TimeMOCs, FrequencyMOCs, 
    Space-TimeMOCs, and SpaceFrequencyMOCs.
  documentation: https://cds-astro.github.io/mocpy/
  repository: https://github.com/cds-astro/mocpy/
