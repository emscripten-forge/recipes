context:
  name: libyaml
  version: 0.2.7

package:
  name: ${{ name }}-static
  version: ${{ version }}

source:
  url: https://github.com/yaml/libyaml/archive/refs/tags/${{ version }}.tar.gz
  sha256: 7f76964485c67dc4e1537fdfd4ad5c8772bcef501c5451b617e43f831034994e

build:
  number: 1

requirements:
  build:
  - ${{ compiler("c") }}
  - cmake
  - make

tests:
- package_contents:
    files:
    - include/yaml.h
    - lib/libyaml.a
- script: generic-testing
  requirements:
    build:
    - generic-testing

about:
  homepage: https://github.com/yaml/libyaml
  license: MIT
  license_file: License

extra:
  maintainers:
  - IsabelParedes
