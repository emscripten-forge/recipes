context:
  name: data.table
  version: 1.18.6

package:
  name: r-${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/Rdatatable/${{ name }}/archive/refs/tags/${{ version }}.tar.gz
  sha256: c19e911dee3f5ad68956d63401e72e65ea5d6b3d827d4f6e693f4d11dee2cec6

build:
  number: 0
  script: $R CMD INSTALL $R_ARGS .

  files:
    exclude:
    - '**/tests/**'

requirements:
  build:
  - cross-r-base ==${{ r_base }}
  - ${{ compiler('c') }}
  host:
  - r-base ==${{ r_base }}
  - zlib-static
  run:
  - zlib-static

tests:
- package_contents:
    lib:
    - R/library/${{ name }}/libs/${{ name | replace('.', '_') }}.so
- script:
  - run_r_test test_${{ name }}.R
  - generic-testing
  files:
    recipe:
    - test_${{ name }}.R
  requirements:
    build:
    - r-wasm-tester
    - generic-testing

about:
  homepage: http://r-datatable.com/
  repository: https://github.com/Rdatatable/data.table
  license: MPL-2.0
  license_file: LICENSE
  summary: R's data.table package extends data.frame
  description: |
    data.table provides a high-performance version of base R's data.frame with
    syntax and feature enhancements for ease of use, convenience and programming
    speed.

extra:
  recipe-maintainers:
  - IsabelParedes
