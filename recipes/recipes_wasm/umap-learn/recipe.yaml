context:
  name: umap-learn
  version: 0.5.12

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/lmcinnes/umap/archive/refs/tags/release-${{ version }}.tar.gz
  sha256: 88eab759b2300b49ca7218f1c35a9036d25cfd2494f18f66fb2980752e187227
  patches:
  # numba.get_num_threads/set_num_threads initialize a threading layer,
  # which is unavailable in the single-threaded Emscripten runtime.
  - patches/num_threads.patch

build:
  number: 0
  noarch: python
  script: python -m pip install . --no-deps --no-build-isolation --prefix=${PREFIX} -vv

requirements:
  build:
  - python ${{ python_min }}.*
  - pip
  - setuptools
  host:
  - python
  run:
  - python >=${{ python_min }}
  - numpy >=1.17
  - numba >=0.51.2
  - scikit-learn >=0.22
  - scipy >=1.3.1
  - pynndescent >=0.5
  - tqdm

tests:
- script: pytester
  files:
    recipe:
    - test_umap_learn.py
  requirements:
    build:
    - pytester
    run:
    - pytester-run
    - matplotlib-base
- script: target_platform=${{ host_platform }} generic-testing
  requirements:
    build:
    - generic-testing

about:
  homepage: http://github.com/lmcinnes/umap
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Uniform Manifold Approximation and Projection

extra:
  recipe-maintainers:
  - DerThorsten
