context:
  name: statsmodels
  version: 0.15.0

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 5d257fe58d0772bc46a557880ca78e2a8e07fec7bfd9d11074aef8e33e1aecbc

build:
  number: 0

  files:
    exclude:
    - '**/tests/**'
    - '**/__pycache__/**'
    - '**/*.pyc'
    - '**/test_*.py'
  python:
    skip_pyc_compilation:
    - '**/*.py'
requirements:
  build:
  - ${{ compiler('c') }}
  - cython >=3.0.13
  - cross-python_${{target_platform}}
  - python
  - meson-python
  - numpy
  - pip
  - packaging
  - pkg-config
  - setuptools_scm
  host:
  - python-dev
    # Do not add any constraint on numpy here to use global pinning
  - numpy
  - scipy >=1.13
  - pandas >=1.0
  - patsy >=0.5.2
  run:
  - python
  - numpy
  - scipy >=1.3
  - pandas >=1.0
  - patsy >=0.5.2
  - packaging

tests:
- script: generic-testing
  requirements:
    build:
    - generic-testing
- script: pytester
  files:
    recipe:
    - test_statsmodels.py
  requirements:
    build:
    - pytester
    run:
    - pytester-run

about:
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Statistical computations and models for use with SciPy
  homepage: https://www.statsmodels.org

extra:
  recipe-maintainers:
  - martinRenou
