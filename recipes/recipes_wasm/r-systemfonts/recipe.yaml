context:
  name: systemfonts
  version: 1.3.2

package:
  name: r-${{ name }}
  version: ${{ version }}

source:
  url:
  - https://cran.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cloud.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cran.r-project.org/src/contrib/Archive/${{ name }}/${{ name }}_${{ version }}.tar.gz
  sha256: 828a1780e540bd05107cd0a1ddfac6727de8aef1d6d82b43591dabaf753dd135
  patches:
  - patches/0001-Honor-Emscripten-target-when-cross-compiling-on-macOS.patch

build:
  number: 0
  skip: ${{ r_base >= '4.6.0' }}
  script: $R CMD INSTALL $R_ARGS .

requirements:
  build:
  - cross-r-base ==${{ r_base }}
  - ${{ compiler('cxx') }}
  - pkg-config
  - r-base64enc
  - r-cpp11 >=0.2.1
  - r-jsonlite
  - r-lifecycle
  host:
  - r-base ==${{ r_base }}
  - libexpat-static
  - fontconfig-static
  - freetype-static
  - r-base64enc
  - r-cpp11 >=0.2.1
  - r-jsonlite
  - r-lifecycle
  run:
  - font-ttf-dejavu
  - r-base64enc
  - r-cpp11 >=0.2.1
  - r-jsonlite
  - r-lifecycle

tests:
- package_contents:
    lib:
    - R/library/${{ name }}/libs/${{ name }}.so
- script:
  - RTESTER_MOUNT_FONTS=1 run_r_test test_${{ name }}.R
  - generic-testing
  files:
    recipe:
    - test_${{ name }}.R
  requirements:
    build:
    - r-wasm-tester
    - generic-testing

about:
  homepage: https://systemfonts.r-lib.org
  repository: https://github.com/r-lib/systemfonts
  license: MIT
  license_file: LICENSE
  summary: System native font finding

extra:
  recipe-maintainers:
  - adamblake
