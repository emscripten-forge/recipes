context:
  version: 10.8.13

package:
  name: passagemath-plot
  version: ${{ version }}

source:
- url: https://pypi.org/packages/source/p/passagemath-plot/passagemath_plot-${{ version }}.tar.gz
  sha256: 30cd97bb670b07b44cb1d15eab231a739a10fd2ddc8d73db5b9d58fefdf742f6

build:
  script: ${{ PYTHON }} -m pip install .
  number: 0

requirements:
  build:
  - python
  - crossenv >=1.2
  - cross-python_${{ target_platform }}
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - pip
  - passagemath-setup
  - passagemath-environment
  - cython<3.3
  - gmpy2
  - numpy
  - cysignals
  - memory-allocator
  - pkgconfig
  - numpy
  - passagemath-abi == ${{ version }}
  host:
  - python-dev
  - gmp-static
  - gsl-static
  - numpy
  - passagemath-modules
  run:
  - python
  - cysignals
  - gmpy2
  - matplotlib
  - memory-allocator
  - numpy
  - pillow
  - passagemath-modules
  - scipy

tests:
- script: pytester
  files:
    recipe:
    - test_passagemath_plot.py
  requirements:
    build:
    - pytester
    run:
    - pytester-run
    - passagemath-repl

- script: generic-testing
  requirements:
    build:
    - generic-testing

about:
  license: GPL-2.0-or-later
  license_file: README.rst
  summary: 'passagemath: Plotting and graphics with Matplotlib, Three.JS, etc.'
  description: |
    Distribution of a small part of the Sage library.
    It provides the namespace packages sage.plot and sage.plot.plot3d, which provide
    functions for plotting that are very similar to Mathematica's plotting functions.

extra:
  emscripten_tests:
    python:
      pytest_files:
      - test_passagemath_plot.py
  recipe-maintainers:
  - mkoeppe
