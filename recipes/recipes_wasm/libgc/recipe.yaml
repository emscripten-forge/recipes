context:
  name: libgc
  version: 8.2.12

package:
  name: ${{ name }}-static
  version: ${{ version }}

source:
  - if: target_platform == "emscripten-wasm32"
    then:
      url: https://github.com/bdwgc/bdwgc/releases/download/v${{ version }}/gc-${{ version }}.tar.gz
      sha256: 42e5194ad06ab6ffb806c83eb99c03462b495d979cda782f3c72c08af833cd4e
  - if: target_platform == "emscripten-wasm64"
    then:
      git: https://github.com/bdwgc/bdwgc.git
      rev: 86bd7c0
      patches:
        - patches/0001_enable_wasm64.patch
  


build:
  number: 0

requirements:
  build:
  - cmake
  - make
  - ${{ compiler('cxx') }}
  - nodejs

tests:
- package_contents:
    files:
    - lib/libgc.a
    - include/gc.h

- script: generic-testing
  requirements:
    build:
    - generic-testing
about:
  homepage: https://www.hboehm.info/gc/
  license: LicenseRef-MIT-style
  license_file: README.md
  summary: The Boehm-Demers-Weiser conservative C/C++ Garbage Collector

extra:
  recipe-maintainers:
  - wangyenshu
