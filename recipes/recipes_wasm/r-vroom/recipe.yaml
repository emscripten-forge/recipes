context:
  name: vroom
  version: 1.7.1

package:
  name: r-${{ name }}
  version: ${{ version }}

source:
  url:
  - https://cran.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cloud.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cran.r-project.org/src/contrib/Archive/${{ name }}/${{ name }}_${{ version }}.tar.gz
  sha256: 7d64f6227fdac3ee64c506654bb1d919e407f92fc2d0d5a2398dbb83001e8790
  patches:
  - patches/0001-Disable-multi-threading.patch

build:
  number: 0
  skip: ${{ r_base >= '4.6.0' }}
  script: $R CMD INSTALL $R_ARGS .

requirements:
  build:
  - ${{ compiler('c') }}
  - ${{ compiler('cxx') }}
  - cross-r-base ==${{ r_base }}
  - r-bit64
  - r-cli
  - r-crayon
  - r-glue
  - r-hms
  - r-lifecycle
  - r-rlang
  - r-tibble
  - r-tidyselect
  - r-tzdb
  - r-vctrs
  - r-withr
  - r-cpp11
  - r-progress
  host:
  - r-base ==${{ r_base }}
  - r-bit64
  - r-cli
  - r-crayon
  - r-glue
  - r-hms
  - r-lifecycle
  - r-rlang
  - r-tibble
  - r-tidyselect
  - r-tzdb
  - r-vctrs
  - r-withr
  - r-cpp11
  - r-progress
  run:
  - r-bit64
  - r-cli
  - r-crayon
  - r-glue
  - r-hms
  - r-lifecycle
  - r-rlang
  - r-tibble
  - r-tidyselect
  - r-tzdb
  - r-vctrs
  - r-withr
  - r-cpp11
  - r-progress

tests:
- package_contents:
    lib:
    - R/library/${{ name }}/libs/${{ name }}.so
- script:
  - run_r_test test_${{ name }}.R
  - generic-testing
  files:
    recipe:
    - test_${{ name }}.R
  requirements:
    build:
    - r-wasm-tester
    - generic-testing

about:
  homepage: https://vroom.r-lib.org/
  repository: https://github.com/r-lib/vroom
  license: MIT
  license_file: LICENSE
  summary: Read and Write Rectangular Text Data Quickly
  description: |
    The goal of 'vroom' is to read and write data (like 'csv', 'tsv' and 'fwf')
    quickly. When reading it uses a quick initial indexing step, then reads the
    values lazily , so only the data you actually use needs to be read. The
    writer formats the data in parallel and writes to disk asynchronously from
    formatting.

extra:
  recipe-maintainers:
  - IsabelParedes
