context:
  version: 0.19.2

package:
  name: xeus-python
  version: ${{ version }}

source:
  url: https://github.com/jupyter-xeus/xeus-python/archive/refs/tags/${{ version }}.tar.gz
  sha256: 5f3da1c4f7e771f72f973b603a499f2081a3e757bb6c9bfabea621bf9943f7ad

build:
  number: 0

requirements:
  build:
  - ${{ compiler("cxx") }}
  - cross-python_${{target_platform}}
  - cmake
  - ninja
  host:
  - python-dev
  - nlohmann_json
  - nlohmann_json-abi
  - xeus
  - xeus-lite-static >=5.0.0
  - pybind11
  - pybind11_json
  - xtl
  - pyjs-dev >= 4.4.0
  run:
  - python
  - xeus-python-shell-lite >=0.8,<0.9


tests:
- package_contents:
    files:
    - bin/xpython.wasm
    - bin/xpython.js

- script:
  - generic-testing
  requirements:
    build:
    - generic-testing

about:
  license: BSD-3-Clause
  license_family: BSD-3
  license_file: LICENSE
  summary: xeus-python
  homepage: https://github.com/jupyter-xeus/xeus-python

extra:
  recipe-maintainers:
  - DerThorsten
  - martinRenou
  - JohanMabille
