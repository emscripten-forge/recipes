context:
  version: 0.0.2
  name: dtks

package:
  name: ${{ name }}
  version: ${{ version }}

source:
- url: https://github.com/DerThorsten/dtks/archive/refs/tags/${{version}}.tar.gz
  sha256: cf86bd419231e2f976fcfbd0a7fbee308e77f7cc29b20c55e7cfc384c84a9d11

build:
  number: 0

  files:
    exclude:
    - '**/__pycache__/**'
    - '**/*.pyc'
    - '**/test_*.py'
  python:
    skip_pyc_compilation:
    - '**/*.py'
requirements:
  build:
  - ${{ compiler("cxx") }}
  - cross-python_${{ target_platform }}
  - cmake >=4.0
  - make
  - nanobind
  - python
  - pip
  host:
  - python-dev
  - numpy
  run:
  - python
  - numpy

tests:
- script: pytester
  files:
    recipe:
    - test_dtks.py
  requirements:
    build:
    - pytester
    run:
    - pytester-run
- script: generic-testing
  requirements:
    build:
    - generic-testing

about:
  license: MIT
  license_file: LICENSE
  summary: dtks - DerThorsten's Kitchen Sink - A collection of fun projects
  homepage: https://github.com/DerThorsten/dtks

extra:
  recipe-maintainers:
  - DerThorsten
