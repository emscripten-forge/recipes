context:
  name: libtiff
  version: 4.7.2

source:
  url: https://download.osgeo.org/libtiff/tiff-${{ version }}.tar.gz
  sha256: 672bd7d10aee4606171afb864f3570b83340f6a33e2c186dc0512f7145ffdf6a

build:
  number: 0

outputs:

- package:
    name: libtiff-static
    version: ${{ version }}
  requirements:
    build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - cmake
    - ninja
  build:
    script:
      env:
        BUILD_SHARED_LIBS: "OFF"
      file: build.sh
  tests:
  - package_contents:
      lib:
      - libtiff.a
      - libtiffxx.a
      include:
      - tiff.h
      - tiffio.h
  - script: generic-testing
    requirements:
      build:
      - generic-testing

about:
  license: HPND
  license_file: LICENSE.md
  summary: Support for the Tag Image File Format (TIFF).
  description: |
    This software provides support for the Tag Image File Format (TIFF), a
    widely used format for storing image data.
  homepage: http://www.libtiff.org/

extra:
  recipe-maintainers:
  - DerThorsten
  - IsabelParedes
  ci:
    platforms:
      emscripten-wasm32: true
      emscripten-wasm64: true