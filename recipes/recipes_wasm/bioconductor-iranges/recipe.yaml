context:
  name: IRanges
  version: 2.44.0
  bioc: 3.22

package:
  name: bioconductor-${{ name | lower }}
  version: ${{ version }}

source:
  url:
  - https://bioconductor.org/packages/${{ bioc }}/bioc/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://bioconductor.org/packages/${{ bioc }}/bioc/src/contrib/Archive/${{ name }}/${{ name }}_${{ version }}.tar.gz
  - https://bioarchive.galaxyproject.org/${{ name }}_${{ version }}.tar.gz
  - https://depot.galaxyproject.org/software/bioconductor-${{ name|lower }}/bioconductor-${{ name|lower }}_${{ version }}_src_all.tar.gz
  sha256: 244e55ca485805ae2fcae8621dec7bb35e9fcd0da707271eb5ef984b88605042

build:
  number: 0
  skip: ${{ r_base >= '4.6.0' }}
  script: $R CMD INSTALL $R_ARGS .

requirements:
  build:
  - cross-r-base ==${{ r_base }}
  - ${{ compiler('c') }}
  - bioconductor-biocgenerics # Not yet available for R 4.6.0
  - bioconductor-s4vectors # Not yet available for R 4.6.0
  host:
  - r-base ==${{ r_base }}
  - bioconductor-biocgenerics
  - bioconductor-s4vectors
  run:
  - bioconductor-biocgenerics
  - bioconductor-s4vectors

tests:
- package_contents:
    lib:
    - R/library/${{ name }}/libs/${{ name }}.so
- script: generic-testing
  requirements:
    build:
    - generic-testing

about:
  repository: https://github.com/Bioconductor/IRanges
  license: Artistic-2.0
  license_file: LICENSE
  summary: |
    Provides efficient low-level and highly reusable S4 classes for storing, manipulating
    and aggregating over annotated ranges of integers

extra:
  recipe-maintainers:
  - DerThorsten
