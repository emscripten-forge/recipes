context:
  version: 0.11.2.dev20260824
  xla_revision: 4a3ed06eee75b376e9aab20211e5ee600790a498
  llvm_version: 23.1.2

source:
# Tag points to cf107153ae460472d4a8ccb426dffd44c8552f95.
- url: https://github.com/anutosh491/jax/archive/refs/tags/emscripten-6x-${{ version }}-r2.tar.gz
  sha256: 75c28008831e4c89fb0890d873140542c0af5e5dac2b9c24cd12e9e3febb1b66
- url: https://github.com/anutosh491/xla/archive/${{ xla_revision }}.tar.gz
  sha256: 67f41596e06f8bd906f21168f047270a5444a4847fbe4a92fe391d19cd3164e7
  target_directory: xla
# Bazel overlay definitions and two small runtime sources; core libraries are installed.
- url: https://github.com/llvm/llvm-project/archive/refs/tags/llvmorg-${{ llvm_version }}.tar.gz
  sha256: 75788d759e6987a910975b902f554dc77c08b076b945b2cebde54116d8e831ca
  target_directory: llvm-project

build:
  number: 0

outputs:
- package:
    name: jaxlib
    version: ${{ version }}
  build:
    script: build.sh
  requirements:
    build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - python 3.14.*
    - pip
    - setuptools
    - wheel
    - bazel 8.7.*
    - clangxx ==${{ llvm_version }}
    - llvmdev ==${{ llvm_version }}
    - mlir ==${{ llvm_version }}
    host:
    - python
    - python-dev
    - numpy >=2.1
    - llvm-static ==${{ llvm_version }}
    - mlir-static ==${{ llvm_version }}
    - lld-static ==${{ llvm_version }}
    - mlir-python-bindings ==${{ llvm_version }}
    run:
    - python
    - numpy >=2.0
    - scipy >=1.14
    - ml_dtypes >=0.5.0
    ignore_run_exports:
      # Only generated Python sources are reused from these bindings.
      from_package:
      - mlir-python-bindings
    run_constraints:
    - jax ==${{ version }}
  tests:
  # TODO: Restore generic-testing for both outputs after its Wasm checks are fixed.
  - package_contents:
      site_packages:
      - jaxlib/_jax.so
      - jaxlib/_xla.so
      - jaxlib/_hlo.so
      - jaxlib/cpu/_lapack.so
      - jaxlib/mlir/_mlir_libs/_stablehlo.so
      files:
        not_exists:
        - '**/*.a'

- package:
    name: jax
    version: ${{ version }}
  build:
    noarch: python
    script: build.sh
  requirements:
    build:
    - python =${{ python_min }}
    - pip
    - setuptools
    - wheel
    host:
    - python =${{ python_min }}
    run:
    - python >=${{ python_min }}
    - jaxlib ==${{ version }}
    - numpy >=2.1
    - scipy >=1.15
    - ml_dtypes >=0.5.0
    - opt_einsum
  tests:
  - package_contents:
      site_packages:
      - jax
  - script: pytester
    files:
      recipe:
      - test_jax.py
    requirements:
      build:
      - pytester
      run:
      - pytester-run

about:
  homepage: https://github.com/jax-ml/jax
  repository: https://github.com/jax-ml/jax
  summary: Composable transformations of Python and NumPy programs
  license: Apache-2.0
  license_file:
  - LICENSE
  - jaxlib/tools/LICENSE.txt

extra:
  recipe-maintainers:
  - anutosh491
  ci:
    platforms:
      emscripten-wasm32: true
      emscripten-wasm64: true
