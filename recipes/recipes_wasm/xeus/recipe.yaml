context:
  version: 6.0.6

package:
  name: xeus
  version: ${{ version }}

source:
  url: https://github.com/jupyter-xeus/xeus/archive/refs/tags/${{ version }}.tar.gz
  sha256: 2cf58d5466a541f7acf668e3500507ca54eb2393780ba3743d94308c24d6ca80

build:
  number: 1

requirements:
  run_exports:
  - ${{ pin_subpackage('xeus', upper_bound='x.x') }}
  build:
  - cmake
  - ${{ compiler("cxx") }}
  - make
  host:
  - nlohmann_json
  - nlohmann_json-abi

tests:
- package_contents:
    files:
    - lib/libxeus.so
    - include/xeus/xeus.hpp
- script:
    - generic-testing
  requirements:
    build:
    - generic-testing
- if: target_platform == "emscripten-wasm64"
  then:
    script: grep -q 'CMAKE_SIZEOF_VOID_P STREQUAL "8"' "$PREFIX/lib/cmake/xeus/xeusConfigVersion.cmake"
  else:
    script: grep -q 'CMAKE_SIZEOF_VOID_P STREQUAL "4"' "$PREFIX/lib/cmake/xeus/xeusConfigVersion.cmake"

about:
  license: BSD-3-Clause
  license_family: BSD-3
  license_file: LICENSE
  summary: xeus
  homepage: https://github.com/jupyter-xeus/xeus

extra:
  recipe-maintainers:
  - DerThorsten
  - JohanMabille
