context:
  name: libxml2
  version: 2.15.4

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://gitlab.gnome.org/GNOME/libxml2/-/archive/v${{ version }}/libxml2-v${{ version }}.tar.gz
  sha256: a569ee9c59eabb197a0d5047046d757ee14c86fb2d4a734555b633cb5584ad25

build:
  number: 0

requirements:
  build:
  - ${{ compiler('c') }}
  - cmake
  - make

tests:
- package_contents:
    files:
    - lib/libxml2.so
    - include/libxml2/libxml/globals.h
- script: generic-testing --allow-pthread  # libxml2 exports xmlInitThreads/xmlCleanupThreads as ABI stubs even with LIBXML2_WITH_THREADS=OFF; no actual pthread activity.
  requirements:
    build:
    - generic-testing
- script:
  - build_tests.sh
  requirements:
    build:
    - ${{ compiler('c') }}
    - cmake
    - ninja
  files:
    recipe:
    - build_tests.sh
    - tests/

about:
  homepage: https://xmlsoft.org/
  license: MIT
  license_family: MIT
  license_file: Copyright
  summary: The XML C parser and toolkit of Gnome
  description: |
    Though libxml2 is written in C a variety of language
    bindings make it available in other environments.
  documentation: https://xmlsoft.org/html/index.html
  repository: https://git.gnome.org/browse/libxml2/

extra:
  recipe-maintainers:
  - IsabelParedes
  ci:
    platforms:
      emscripten-wasm32: true
      emscripten-wasm64: true
