context:
  name: maps
  version: 3.4.4

package:
  name: r-${{ name }}
  version: ${{ version }}

source:
  url:
  - https://cran.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cloud.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cran.r-project.org/src/contrib/Archive/${{ name }}/${{ name }}_${{ version }}.tar.gz
  sha256: ec1aec4f5cd18908b3cc7f2a60895ee541aaa5b3ab26b14ccb861640d4552334
  patches:
  - patches/0001-Build-shared-lib-with-emcc.patch

build:
  number: 0
  script: build.sh

requirements:
  build:
  - cross-r-base ==${{ r_base }}
  - ${{ compiler('c') }}
  - gcc # for Lmake and Gmake
  host:
  - r-base ==${{ r_base }}

tests:
- package_contents:
    lib:
    - R/library/${{ name }}/libs/${{ name }}.so
- script:
  - run_r_test test_${{ name }}.R
  - generic-testing
  files:
    recipe:
    - test_${{ name }}.R
  requirements:
    build:
    - r-wasm-tester
    - generic-testing

about:
  homepage: https://cran.r-project.org/package=maps
  documentation: https://r.igraph.org/
  repository: https://github.com/adeckmyn/maps
  license: GPL-2.0-only
  license_file:
  - ${{ PREFIX }}/lib/R/share/licenses/GPL-2
  summary: Draw Geographical Maps
  description: |
    Display of maps. Projection code and larger maps are in separate packages
    ('mapproj' and 'mapdata').

extra:
  recipe-maintainers:
  - IsabelParedes
