context:
  name: sparrow
  version: 2.5.0

source:
  url: https://github.com/sparrow-org/sparrow/archive/${{ version }}.tar.gz
  sha256: 2b5866332bd811b53a74f86f8a36c3b577133c93f0e4ffb9952bb56cf535db39

build:
  number: 0

outputs:

# Two separate builds so that each package ships the CMake config for its
# own library flavour (sparrow::sparrow points at the .a or the .so).
- staging:
    name: sparrow-static-build
  requirements:
    build:
    - ${{ compiler("cxx") }}
    - cmake
    - make
    host:
    - howardhinnant_date-static
  build:
    script:
      env:
        SPARROW_BUILD_SHARED: "OFF"
      file: build.sh
- staging:
    name: sparrow-shared-build
  requirements:
    build:
    - ${{ compiler("cxx") }}
    - cmake
    - make
    host:
    - howardhinnant_date-static
  build:
    script:
      env:
        SPARROW_BUILD_SHARED: "ON"
      file: build.sh

#==============================================================================#

- package:
    name: sparrow-static
    version: ${{ version }}
  inherit: sparrow-static-build
  build:
    files:
      exclude:
      - '**/tests/**'
  requirements:
    host:
    - howardhinnant_date-static
    run:
    - ${{ pin_compatible('howardhinnant_date-static', lower_bound='x.x', upper_bound='x.x') }}
  tests:
  - package_contents:
      files:
      - lib/libsparrow.a
      - include/sparrow/buffer/buffer.hpp
      - include/sparrow/config/sparrow_version.hpp
      - share/cmake/sparrow/sparrowConfig.cmake
      - share/cmake/sparrow/sparrowConfigVersion.cmake
      - share/cmake/sparrow/sparrowTargets.cmake
  - script:
    - build_tests.sh
    requirements:
      build:
      - ${{ compiler("cxx") }}
      - cmake
      - make
    files:
      recipe:
      - build_tests.sh
      - tests/
  - script: generic-testing
    requirements:
      build:
      - generic-testing

#==============================================================================#

- package:
    name: sparrow
    version: ${{ version }}
  inherit: sparrow-shared-build
  build:
    files:
      exclude:
      - '**/tests/**'
  requirements:
    host:
    - howardhinnant_date-static
    run:
    - ${{ pin_compatible('howardhinnant_date-static', lower_bound='x.x', upper_bound='x.x') }}
    run_exports:
    - ${{ pin_subpackage('sparrow', upper_bound='x.x') }}
  tests:
  - package_contents:
      files:
      - lib/libsparrow.so
      - include/sparrow/buffer/buffer.hpp
      - include/sparrow/config/sparrow_version.hpp
      - share/cmake/sparrow/sparrowConfig.cmake
      - share/cmake/sparrow/sparrowConfigVersion.cmake
      - share/cmake/sparrow/sparrowTargets.cmake
  - script:
    - build_tests.sh
    requirements:
      build:
      - ${{ compiler("cxx") }}
      - cmake
      - make
    files:
      recipe:
      - build_tests.sh
      - tests/
  - script: generic-testing
    requirements:
      build:
      - generic-testing

about:
  summary: C++20 idiomatic APIs for the Apache Arrow Columnar Format
  description: C++20 idiomatic APIs for the Apache Arrow Columnar Format
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  homepage: https://github.com/sparrow-org/sparrow
  documentation: https://github.com/sparrow-org/sparrow

extra:
  recipe-maintainers:
  - JohanMabille
  - anutosh491
