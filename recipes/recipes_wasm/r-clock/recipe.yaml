context:
  name: clock
  version: 0.7.4

package:
  name: r-${{ name }}
  version: ${{ version }}

source:
  url:
  - https://cran.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cloud.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cran.r-project.org/src/contrib/Archive/${{ name }}/${{ name }}_${{ version }}.tar.gz
  sha256: 13763c5da610f2db016d2af16d83aecc76b411738aabd750188222a28a2397ca

build:
  number: 0
  skip: ${{ r_base >= '4.6.0' }}
  script: $R CMD INSTALL $R_ARGS .

requirements:
  build:
  - cross-r-base ==${{ r_base }}
  - ${{ compiler('c') }}
  - r-cli >=3.6.4
  - r-cpp11 >=0.5.2
  - r-lifecycle >=1.0.4
  - r-rlang >=1.1.5
  - r-tzdb >=0.5.0
  - r-vctrs >=0.6.5
  host:
  - r-base ==${{ r_base }}
  - r-cli >=3.6.4
  - r-cpp11 >=0.5.2
  - r-lifecycle >=1.0.4
  - r-rlang >=1.1.5
  - r-tzdb >=0.5.0
  - r-vctrs >=0.6.5
  run:
  - r-cli >=3.6.4
  - r-cpp11 >=0.5.2
  - r-lifecycle >=1.0.4
  - r-rlang >=1.1.5
  - r-tzdb >=0.5.0
  - r-vctrs >=0.6.5

tests:
- package_contents:
    lib:
    - R/library/${{ name }}/libs/${{ name }}.so
- script:
  - run_r_test test_${{ name }}.R
  - generic-testing
  files:
    recipe:
    - test_${{ name }}.R
  requirements:
    build:
    - r-wasm-tester
    - generic-testing

about:
  homepage: https://cran.r-project.org/package=clock
  license: MIT
  license_file: LICENSE
  summary: Date-Time Types and Tools
  description: |
    Provides a comprehensive library for date-time manipulations using a new
    family of orthogonal date-time classes (durations, time points, zoned-times,
    and calendars) that partition responsibilities so that the complexities of
    time zones are only considered when they are really needed. Capabilities
    include: date-time parsing, formatting, arithmetic, extraction and updating
    of components, and rounding.

extra:
  recipe-maintainers:
  - DerThorsten
  - IsabelParedes
