context:
  name: Rsamtools
  version: 2.28.0

package:
  name: bioconductor-${{ name | lower }}
  version: ${{ version }}

source:
  url:
  - https://www.bioconductor.org/packages/release/bioc/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://bioarchive.galaxyproject.org/${{ name }}_${{ version }}.tar.gz
  - https://depot.galaxyproject.org/software/bioconductor-${{ name|lower }}/bioconductor-${{ name|lower }}_${{ version }}_src_all.tar.gz
  sha256: 5840f1035018bf55608f54647265122de53a2ab5e2531bd5f29f770b636fb730
  patches:
  - patches/0001-Disable-BiocParallel.patch
  - patches/0002-Replace-bplapply-with-lapply.patch
  - patches/0003-Use-Rscript-from-build-prefix.patch

build:
  number: 0
  skip: ${{ r_base >= '4.6.0' }}
  script: $R CMD INSTALL $R_ARGS .

requirements:
  build:
  - cross-r-base ==${{ r_base }}
  - ${{ compiler('c') }}
  - bioconductor-biocgenerics
  - bioconductor-s4vectors
  - bioconductor-iranges
  - bioconductor-xvector
  - bioconductor-biostrings
  - bioconductor-seqinfo
  - bioconductor-genomicranges
  - bioconductor-rhtslib
  - r-bitops
  host:
  - r-base ==${{ r_base }}
  - bioconductor-biocgenerics
  - bioconductor-s4vectors
  - bioconductor-iranges
  - bioconductor-xvector
  - bioconductor-biostrings
  - bioconductor-seqinfo
  - bioconductor-genomicranges
  - bioconductor-rhtslib
  - r-bitops
  - libzlib-static
  - libbzip2-static
  - liblzma-static
  run:
  - bioconductor-biocgenerics
  - bioconductor-s4vectors
  - bioconductor-iranges
  - bioconductor-xvector
  - bioconductor-biostrings
  - bioconductor-seqinfo
  - bioconductor-genomicranges
  - bioconductor-rhtslib
  - r-bitops

tests:
- package_contents:
    lib:
    - R/library/${{ name }}/libs/${{ name }}.so
- script:
  - run_r_test test_${{ name }}.R
  - generic-testing
  files:
    recipe:
    - test_${{ name }}.R
  requirements:
    build:
    - r-wasm-tester
    - generic-testing

about:
  homepage: https://bioconductor.org/packages/${{ name }}
  repository: https://github.com/Bioconductor/${{ name }}
  license: Artistic-2.0
  license_file:
  - ${{ PREFIX }}/lib/R/share/licenses/Artistic-2.0
  summary: Binary alignment (BAM), FASTA, variant call (BCF), and tabix file import

extra:
  recipe-maintainers:
  - DerThorsten
  - IsabelParedes
