context:
  version: 10.8.13

package:
  name: passagemath-linbox
  version: ${{ version }}

source:
- url: https://pypi.org/packages/source/p/passagemath-linbox/passagemath_linbox-${{ version }}.tar.gz
  sha256: 462d6bf9d91478fb5b2f0587a93e6a2d103532a22e8c0c12f8848d12b53674ca

build:
  script: |
    export LDFLAGS="$LDFLAGS -Wl,--allow-multiple-definition"
    ${{ PYTHON }} -m pip install .
  number: 0

requirements:
  build:
  - python
  - crossenv >=1.2
  - cross-python_${{ target_platform }}
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - pip
  - passagemath-setup
  - passagemath-environment
  - cython<3.3
  - cysignals
  - pkgconfig
  - numpy
  - passagemath-abi == ${{ version }}
  host:
  - python-dev
  - gmp-static
  - mpfr-static
  - mpc-static
  - givaro-static
  - fflas-ffpack
  - linbox-static
  - libflint-static
  - gsl-static
  # openblas-dev has the headers and openblas.pc (sage_setup looks up the
  # cblas module with pkg-config); its run_exports pin openblas
  - openblas-dev
  - numpy
  - cysignals
  - memory-allocator
  - passagemath-categories
  - passagemath-modules
  - passagemath-flint
  run:
  - python
  - cysignals
  - memory-allocator
  - passagemath-categories
  - passagemath-iml
  - passagemath-m4ri-m4rie

tests:
- script: pytester
  files:
    recipe:
    - test_passagemath_linbox.py
  requirements:
    build:
    - pytester
    run:
    - pytester-run
    - passagemath-modules
    - passagemath-repl
- script: generic-testing
  requirements:
    build:
    - generic-testing

about:
  license: GPL-2.0-or-later
  license_file: README.rst
  summary: 'passagemath: Linear Algebra with Givaro, fflas-ffpack, LinBox'
  description: |
    Distribution of a part of the Sage library.
    It provides modules that depend on the LinBox suite (Givaro, fflas-ffpack, LinBox).

extra:
  emscripten_tests:
    python:
      pytest_files:
      - test_passagemath_linbox.py
  recipe-maintainers:
  - mkoeppe
