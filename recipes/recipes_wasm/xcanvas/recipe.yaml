context:
  version: 0.7.0


source:
  url: https://github.com/jupyter-xeus/xcanvas/archive/refs/tags/${{ version }}.tar.gz
  sha256: 586de0aa53369e8e0804242186f85081bda674314d861fca7f7320815c09a4c9

build:
  number: 2


outputs:
  - package:
      name: xcanvas
      version: ${{ version }}
    build:
      script: build_pkg.sh
    requirements:
      build:
      - ${{ compiler("cxx") }}
      - cmake
      - make
      host:
      - xproperty >=0.12.0,<0.13
      - nlohmann_json
      - xwidgets
      run_exports:
          - ${{ pin_subpackage("xcanvas", upper_bound="x.x") }}
    tests:
    - script:
      - test -f $PREFIX/include/xcanvas/xcanvas.hpp
      - test -f $PREFIX/lib/libxcanvas.so
      - generic-testing
      requirements:
        build:
        - generic-testing


about:
  license: BSD-3-Clause
  license_family: BSD-3
  license_file: LICENSE
  summary: C++ back-end for ipycanvas
  homepage: https://github.com/jupyter-xeus/xcanvas
extra:
  recipe-maintainers:
  - DerThorsten
  - JohanMabille

