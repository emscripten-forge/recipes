context:
  name: bitarray
  version: 3.12.2

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: b712ea178c26c00b60b14bfd17fd0bab6138a05b515884b0ce418c0f6fecd2f3
  patches:
  - patches/0001_wasm64.patch

build:
  number: 0
  script: ${PYTHON} -m pip install . ${PIP_ARGS}

requirements:
  build:
  - python
  - cross-python_${{ target_platform }}
  - ${{ compiler('c') }}
  - pip
  host:
  - python-dev
  - pip
  run:
  - python

tests:
- script: pytester
  files:
    recipe:
    - test_bitarray.py
  requirements:
    build:
    - pytester
    run:
    - pytester-run

about:
  homepage: https://github.com/ilanschnell/bitarray
  license: PSF-2.0
  license_file: LICENSE
  summary: efficient arrays of booleans -- C extension
  description: |
    Bitarray provides an object type which efficiently represents an array of
    booleans. Bitarrays are sequence types that behave very similarly
    to usual lists. All functionality is implemented in C.
  documentation: https://pypi.python.org/pypi/bitarray/
  repository: https://github.com/ilanschnell/bitarray

extra:
  recipe-maintainers:
  - KGB99
