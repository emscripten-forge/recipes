context:
  name: raylib
  version: '6.0'

package:
  name: ${{ name }}-static
  version: ${{ version }}

source:
  url: https://github.com/raysan5/raylib/archive/refs/tags/${{ version }}.tar.gz
  sha256: 2b3ee1e2120c7a0796b33062c7e9a694dd8a8caa56a96319ac8c8ecf54a90d0b

build:
  number: 0

requirements:
  build:
  - ${{ compiler('c') }}

tests:
- package_contents:
    files:
    - include/raylib.h
    - include/raymath.h
    - lib/libraylib.a
# image / color / math API under node (no window or GL context needed)
- script:
  - emcc test_raylib.c -o test_raylib.js -I${PREFIX}/include -L${PREFIX}/lib -lraylib -sUSE_GLFW=3 -sALLOW_MEMORY_GROWTH
  - node test_raylib.js
  requirements:
    build:
    - ${{ compiler('c') }}
    - nodejs
  files:
    recipe:
    - test_raylib.c
# raudio bundles miniaudio, whose ma_thread/ma_mutex wrappers call the pthread
# API (single-threaded stubs in emscripten's libc). Nothing is compiled with
# -pthread, and the Web Audio backend doesn't need a worker thread.
- script: generic-testing --allow-pthread
  requirements:
    build:
    - generic-testing

about:
  homepage: https://github.com/raysan5/raylib
  license: Zlib
  license_file: LICENSE
  summary: A simple and easy-to-use library to enjoy videogames programming

extra:
  recipe-maintainers:
  - DerThorsten
