context:
  version: 10.8.13

package:
  name: passagemath-setup
  version: ${{ version }}

source:
- url: https://pypi.org/packages/source/p/passagemath-setup/passagemath_setup-${{ version }}.tar.gz
  sha256: 90a7d416c9949af1ff04bf0d858b8315d6c151b377e2dccae2bd0cd663562823

build:
  # pure-python noarch package: install with the native build python
  # (cross-python cannot be activated for target_platform=noarch)
  script: python -m pip install . --no-deps --no-build-isolation --prefix=${PREFIX} -vv
  noarch: python
  number: 0

requirements:
  build:
  # same python version as the (emscripten) host python, so pip installs
  # into the matching lib/pythonX.Y/site-packages
  - python ${{ python_min }}.*
  - pip
  - setuptools
  - wheel
  - passagemath-abi == ${{ version }}
  host:
  - python
  run:
  - python
  - setuptools
  - jinja2
  - passagemath-abi == ${{ version }}

tests:
- script: pytester
  files:
    recipe:
    - test_passagemath_setup.py
  requirements:
    build:
    - pytester
    run:
    - pytester-run

- script: target_platform=${{ host_platform }} generic-testing
  requirements:
    build:
    - generic-testing

about:
  summary: 'passagemath: Build system of the Sage library'
  license: GPL-2.0-or-later
  license_file: README.rst
  description: |
    sage-setup: Build system of the Sage library
    ================================================

    This is the build system of the Sage library, based on setuptools.

extra:
  emscripten_tests:
    python:
      pytest_files:
      - test_passagemath_setup.py
  recipe-maintainers:
  - mkoeppe
