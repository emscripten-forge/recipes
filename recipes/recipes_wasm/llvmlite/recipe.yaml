context:
  name: llvmlite
  version: 0.50.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
- url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: f2a2cd6ec9ffcc1b7147dea0d7a49efebf17a2b434e0c2844fe175999d571eb4
  patches:
  - patches/0001-emscripten-cmake-build-system.patch
  - patches/0002-add-wasmlinker-cpp.patch
  - patches/0003-add-wasmengine-python.patch
  - patches/0004-emscripten-python-compat.patch
  # LLVM 23 removed UnifyFunctionExitNodesPass.
  - patches/0005-llvm23-remove-unify-function-exit-nodes.patch
  # Upstream bug: the module variant omits the int threshold argtype, so
  # ctypes makes a variadic call that traps with a signature mismatch on wasm64.
  - patches/0006-fix-jump-threading-module-argtypes.patch

build:
  number: 0

requirements:
  build:
  - python
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - cross-python_${{ target_platform }}
  - cmake
  - make
  - setuptools

  host:
  - python-dev
  # LLVM static archives; liblldWasm.a + liblldCommon.a (for wasmlinker.cpp)
  # come from lld-static.
  - llvm-static 23.1.*
  - lld-static 23.1.*

  run:
  - python
  # view_dot_graph() uses Graphviz's in-process SWIG binding on Emscripten;
  # the ordinary python-graphviz backend requires an unavailable subprocess.
  - graphviz-python 15.*

tests:
- script: pytester
  files:
    recipe:
    - test_llvmlite.py
  requirements:
    build:
    - pytester
    run:
    - pytester-run
# Statically linked LLVM only imports pthread_setspecific (TLS key stub in
# non-threaded builds); no threads are spawned.
- script: generic-testing --allow-pthread
  requirements:
    build:
    - generic-testing

about:
  homepage: http://llvmlite.pydata.org
  license: BSD-2-Clause
  license_file: LICENSE
  summary: >
    A lightweight LLVM python binding for writing JIT compilers.
    Includes WasmExecutionEngine for JIT-like execution inside Emscripten/JupyterLite.
  documentation: http://llvmlite.pydata.org/
  repository: https://github.com/numba/llvmlite

extra:
  recipe-maintainers:
  - anutosh491
