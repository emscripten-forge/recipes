context:
  name: xeus-singular
  version: 0.2.0
  singular_version: 4.4.1p5

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/wangyenshu/xeus-singular/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 9386ed08092f1e64ea148ead99ce3fe3a4c323380b807b3a284b1dc1bf647452

build:
  number: 0

requirements:
  build:
  - ${{ compiler("cxx") }}
  - cmake
  - ninja
  host:
  - xeus
  - xeus-lite-static
  - nlohmann_json
  - nlohmann_json-abi
  - libsingular-static ==${{ singular_version }}
  - libflint-static
  - ntl-static
  - gmp-static
  - mpfr-static
  - cddlib-static
  - mathicgb
  - mathic-static
  - memtailor-static
  run:
  # Singular's LIB files (share/singular/LIB) are loaded at runtime
  - singular ==${{ singular_version }}

tests:
- package_contents:
    files:
    - bin/xsingular.js
    - bin/xsingular.wasm
    - share/jupyter/kernels/xsingular/kernel.json
    - share/jupyter/kernels/xsingular/logo-32x32.png
    - share/jupyter/kernels/xsingular/logo-64x64.png
- script: generic-testing
  requirements:
    build:
    - generic-testing

about:
  homepage: https://github.com/wangyenshu/xeus-singular
  license: GPL-2.0-or-later
  license_file: LICENSE
  summary: Jupyter kernel for Singular based on xeus

extra:
  recipe-maintainers:
  - wangyenshu
