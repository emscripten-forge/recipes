context:
  name: bit
  version: 4.6.0

package:
  name: r-${{ name }}
  version: ${{ version }}

source:
  url:
  - https://cran.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cloud.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cran.r-project.org/src/contrib/Archive/${{ name }}/${{ name }}_${{ version }}.tar.gz
  sha256: 48fe21c5d04c7b724d695eeb60074395c0c631a7fb234e2075de92471445de08

build:
  number: 0
  script: $R CMD INSTALL $R_ARGS .

requirements:
  build:
  - cross-r-base ==${{ r_base }}
  - ${{ compiler('c') }}
  host:
  - r-base ==${{ r_base }}

tests:
- package_contents:
    lib:
    - R/library/${{ name }}/libs/${{ name }}.so
- script:
  - run_r_test test_${{ name }}.R
  - generic-testing
  files:
    recipe:
    - test_${{ name }}.R
  requirements:
    build:
    - r-wasm-tester
    - generic-testing

about:
  homepage: https://github.com/r-lib/bit
  license: GPL-2.0-or-later
  license_family: GPL2
  license_file:
  - ${{ PREFIX }}/lib/R/share/licenses/GPL-2
  summary: Classes and Methods for Fast Memory-Efficient Boolean Selections
  description: |
    Provided are classes for boolean and skewed boolean vectors, fast boolean
    methods, fast unique and non-unique integer sorting, fast set operations on
    sorted and unsorted sets of integers, and foundations for ff (range index,
    compression, chunked processing).

extra:
  recipe-maintainers:
  - IsabelParedes
