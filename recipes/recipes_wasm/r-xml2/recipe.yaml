context:
  name: xml2
  version: 1.6.0

package:
  name: r-${{ name }}
  version: ${{ version }}

source:
  url:
  - https://cran.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cloud.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cran.r-project.org/src/contrib/Archive/${{ name }}/${{ name }}_${{ version }}.tar.gz
  sha256: b0660edab0a839866a0cccd44721c54d497000fd6577a25106a33280318bf579
  patches:
  - patches/0001-Avoid-using-system-xml2-config.patch

build:
  number: 0
  skip: ${{ r_base >= '4.6.0' }}
  script: $R CMD INSTALL $R_ARGS .

requirements:
  build:
  - cross-r-base ==${{ r_base }}
  - ${{ compiler('c') }}
  - pkg-config
  - r-cli
  - r-rlang
  host:
  - r-base ==${{ r_base }}
  - r-cli
  - r-rlang
  - libxml2-static
  run:
  - r-cli
  - r-rlang

tests:
- package_contents:
    lib:
    - R/library/${{ name }}/libs/${{ name }}.so
- script:
  - run_r_test test_${{ name }}.R
  # libxml2 is built with -DLIBXML2_WITH_THREADS=OFF, but it still exports
  # xmlInitThreads / xmlCleanupThreads. No actual pthreads.
  - generic-testing --allow-pthread
  files:
    recipe:
    - test_${{ name }}.R
  requirements:
    build:
    - r-wasm-tester
    - generic-testing

about:
  homepage: https://xml2.r-lib.org/
  repository: https://github.com/r-lib/xml2
  license: GPL-2.0-or-later
  license_file: LICENSE
  summary: XML Tools for R
  description: |
    Tools for working with XML files in R.

extra:
  recipe-maintainers:
  - DerThorsten
  - IsabelParedes
