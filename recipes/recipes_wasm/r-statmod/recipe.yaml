context:
  name: statmod
  version: 1.5.2

package:
  name: r-${{ name }}
  version: ${{ version }}

source:
  url:
  - https://cran.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cloud.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cran.r-project.org/src/contrib/Archive/${{ name }}/${{ name }}_${{ version }}.tar.gz
  sha256: 5f83d82043c5e26f1048fc0139580da1b7e40becf95fb4cb26ed3afcd46a581d

build:
  number: 0
  script: $R CMD INSTALL $R_ARGS .

requirements:
  build:
  - cross-r-base ==${{ r_base }}
  - ${{ compiler('c') }}
  - ${{ compiler('fortran') }}
  host:
  - r-base ==${{ r_base }}
  - libflang-rt-static

tests:
- package_contents:
    lib:
    - R/library/${{ name }}/libs/${{ name }}.so
- script:
  - run_r_test test_${{ name }}.R
  - generic-testing
  files:
    recipe:
    - test_${{ name }}.R
  requirements:
    build:
    - r-wasm-tester
    - generic-testing

about:
  homepage: https://cran.r-project.org/package=statmod
  license: GPL-2.0-or-later
  license_family: GPL3
  license_file:
  - ${{ PREFIX }}/lib/R/share/licenses/GPL-3
  summary: Statistical Modeling
  description: |
    A collection of algorithms and functions to aid statistical modeling.
    Includes limiting dilution analysis (aka ELDA), growth curve comparisons,
    mixed linear models, heteroscedastic regression, inverse-Gaussian
    probability calculations, Gauss quadrature and a secure convergence
    algorithm for nonlinear models. Also includes advanced generalized linear
    model functions including Tweedie and Digamma distributional families,
    secure convergence and exact distributional calculations for unit deviances.

extra:
  recipe-maintainers:
  - DerThorsten
  - IsabelParedes
