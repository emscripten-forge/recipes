context:
  version: 10.8.13

package:
  name: passagemath-tdlib
  version: ${{ version }}

source:
- url: https://pypi.org/packages/source/p/passagemath-tdlib/passagemath_tdlib-${{ version }}.tar.gz
  sha256: e6945e57ba02c22663fe60f07c07d0733035cf5b564f6641f0cb2d1924435fb4

build:
  number: 0
  script: ${{ PYTHON }} -m pip install .

requirements:
  build:
  - python
  - crossenv >=1.2
  - cross-python_${{ target_platform }}
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - pip
  - passagemath-setup
  - passagemath-environment
  - cython<3.3
  - cysignals
  - pkgconfig
  - passagemath-abi == ${{ version }}
  host:
  - python-dev
  - boost-headers
  - treedec
  run:
  - python
  - cysignals

tests:
- script: pytester
  files:
    recipe:
    - test_passagemath_tdlib.py
  requirements:
    build:
    - pytester
    run:
    - pytester-run
    - passagemath-repl

- script: generic-testing
  requirements:
    build:
    - generic-testing

about:
  license: GPL-2.0-or-later
  license_file: README.rst
  summary: 'passagemath: Tree decompositions with tdlib'
  description: |
    Distribution of a part of the Sage library.
    It provides a Cython interface to the tdlib library, now also known as treedec,
    providing algorithms concerning tree decompositions.

extra:
  emscripten_tests:
    python:
      pytest_files:
      - test_passagemath_tdlib.py
  recipe-maintainers:
  - mkoeppe
