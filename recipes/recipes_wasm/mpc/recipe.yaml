context:
  version: 1.3.1
  name: mpc

package:
  name: ${{ name }}-static
  version: ${{ version }}

source:
  url: https://ftp.gnu.org/gnu/mpc/mpc-${{ version }}.tar.gz
  sha256: ab642492f5cf882b74aa0cb730cd410a81edcdbec895183ce930e706c1c759b8

build:
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - gnuconfig
    - make
  host:
    - gmp-static
    - mpfr-static
  run:
    - ${{ pin_compatible("gmp-static", lower_bound='x', upper_bound='x') }}
    - ${{ pin_compatible("mpfr-static", lower_bound='x', upper_bound='x') }}

tests:
- package_contents:
    files:
    - include/mpc.h
    - lib/libmpc.a
- script: generic-testing
  requirements:
    build:
    - generic-testing

about:
  homepage: http://www.multiprecision.org/
  license: LGPL-3.0-or-later
  license_file: COPYING.LESSER
  summary: |
    A C library for the arithmetic of complex numbers with arbitrarily high
    precision.

extra:
  recipe-maintainers:
    - wolfv
