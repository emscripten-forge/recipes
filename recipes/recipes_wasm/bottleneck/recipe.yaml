context:
  name: bottleneck
  version: 1.6.1

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/b/bottleneck/bottleneck-${{ version }}.tar.gz
  sha256: d87fd88e01132b7211131c3d12c242e6f30e36fc95786c97d97c74ae26d4c421

build:
  number: 0
  script: ${PYTHON} -m pip install . ${PIP_ARGS}

requirements:
  build:
  - python
  - cross-python_${{ target_platform }}
  - numpy
  - ${{ compiler('c') }}
  - pip
  host:
  - python-dev
  - pip
  - setuptools
  - versioneer
  - numpy
  run:
  - python
  - numpy

tests:
- script: pytester
  files:
    recipe:
    - test_bottleneck.py
  requirements:
    build:
    - pytester
    run:
    - pytester-run

- script: generic-testing
  requirements:
    build:
    - generic-testing
about:
  homepage: https://github.com/pydata/bottleneck
  license: BSD-2-Clause
  license_file: LICENSE
  summary: Fast NumPy array functions written in C
  repository: https://github.com/pydata/bottleneck

extra:
  recipe-maintainers:
  - Copilot
