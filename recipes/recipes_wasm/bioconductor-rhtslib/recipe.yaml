context:
  name: Rhtslib
  version: 3.8.0

package:
  name: bioconductor-${{ name | lower }}
  version: ${{ version }}

source:
  url:
  - https://www.bioconductor.org/packages/release/bioc/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://bioarchive.galaxyproject.org/${{ name }}_${{ version }}.tar.gz
  - https://depot.galaxyproject.org/software/bioconductor-${{ name|lower }}/bioconductor-${{ name|lower }}_${{ version }}_src_all.tar.gz
  sha256: e89153bbac580adc2e988a095ce39c26e28cdf23b9a337988d18f66bc3b1eded
  patches:
  - patches/0001-Disable-threads.patch
  - patches/0002-Disable-libcurl.patch
  - patches/0003-Disable-soversions.patch

build:
  number: 0
  script: $R CMD INSTALL $R_ARGS  .

requirements:
  build:
  - cross-r-base ==${{ r_base }}
  - ${{ compiler('c') }}
  host:
  - r-base ==${{ r_base }}
  - libzlib-static
  - libbzip2-static
  - liblzma-static

tests:
- package_contents:
    lib:
    - R/library/${{ name }}/libs/${{ name }}.so
- script:
  - run_r_test test_${{ name }}.R
  - generic-testing --allow-pthread
  files:
    recipe:
    - test_${{ name }}.R
  requirements:
    build:
    - r-wasm-tester
    - generic-testing

about:
  homepage: https://bioconductor.org/packages/${{ name }}
  repository: https://github.com/Bioconductor/${{ name }}
  license: LGPL-2.0-or-later
  license_file:
  - ${{ PREFIX }}/lib/R/share/licenses/LGPL-2
  summary: |
    Provides memory efficient S4 classes for storing sequences "externally"
    (e.g. behind an R external pointer, or on disk).

extra:
  recipe-maintainers:
  - DerThorsten
  - IsabelParedes
