context:
  name: cpp-tabulate
  version: '2.2'

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/p-ranav/tabulate/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 3c12853cbf103adf659c4821351a302351d139513f1c43528095da41e8a37044

build:
  number: 0

requirements:
  build:
  - ${{ compiler("cxx") }}
  - cmake
  - ninja

about:
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Table Maker for Modern C++
  homepage: https://github.com/p-ranav/tabulate

extra:
  recipe-maintainers:
  - DerThorsten
tests:
- script: generic-testing
  requirements:
    build:
    - generic-testing
