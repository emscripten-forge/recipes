context:
  name: cpp-tabulate
  version: '2.1'

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/p-ranav/tabulate/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 6f7b17faca249b12366e152242e2fffcef15ea880dbecfb3af63d798971f2686

build:
  number: 0

requirements:
  build:
  - ${{ compiler("cxx") }}
  - cmake
  - ninja

about:
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Table Maker for Modern C++
  homepage: https://github.com/p-ranav/tabulate

extra:
  recipe-maintainers:
  - DerThorsten
tests:
- script: generic-testing
  requirements:
    build:
    - generic-testing
