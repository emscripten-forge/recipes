context:
  name: cryptography
  version: 50.0.2

package:
  name: cryptography
  version: ${{ version }}

source:
- url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 7b46165bb56eb4704e2eaaf86f3c940d19154535d9b0ca7d6d590b04060e00d5

build:
  number: 0
  script:
    - export MATURIN_PYTHON_SYSCONFIGDATA_DIR=${PREFIX}/etc/conda/_sysconfigdata__emscripten_${target_platform#emscripten-}-emscripten.py
    # the cffi part (_openssl.c) is compiled by the cc crate, which needs the target Python headers
    - export CFLAGS="${CFLAGS} -I${PREFIX}/include/python${PY_VER}"
    - ${PYTHON} -m pip install . -vvv

  files:
    exclude:
    - '**/*.pyi'
    - '**/__pycache__/**'
    - '**/*.pyc'
    - '**/test_*.py'
  python:
    skip_pyc_compilation:
    - '**/*.py'
requirements:
  build:
  - ${{compiler('cxx')}}
  - cross-python_${{target_platform}}
  - cffi
  - openssl
  - setuptools-rust
  - rust-nightly
  - maturin
  host:
  - python-dev
  - libopenssl-static
  run:
  - cffi

tests:
- script: pytester
  requirements:
    build:
    - pytester
    run:
    - pytester-run
  files:
    recipe:
    - test_import_cryptography.py
- script: generic-testing
  requirements:
    build:
    - generic-testing

about:
  homepage: https://cryptography.io
  license: Apache-2.0 AND BSD-3-Clause AND PSF-2.0 AND MIT
  license_family: BSD
  license_file: LICENSE
