context:
  version: 23.1.2

source:
  url: https://github.com/llvm/llvm-project/archive/refs/tags/llvmorg-${{ version }}.tar.gz
  sha256: 75788d759e6987a910975b902f554dc77c08b076b945b2cebde54116d8e831ca
  patches:
  - patches/enable_exception_handling.patch
  - patches/fix_initialization_logs.patch
  - patches/support_wasm64.patch
  # Backport LLVM PR #221647: Emscripten does not support ELF version scripts.
  - patches/disable-emscripten-version-scripts.patch
  # Preserve the shared LLVM/Clang APIs with WebAssembly export lists.
  - patches/emscripten-symbol-exports.patch

build:
  number: 1

outputs:
- staging:
    name: llvm-build
  build:
    script: build.sh
  requirements:
    build:
    - ${{ compiler("c") }}
    - ${{ compiler("cxx") }}
    - cmake >=4.3.3,<4.4
    - make
    - llvm-tblgen ==${{ version }}

# Preserve the existing LLVM/Clang/LLD development bundle, but keep its
# archives and CMake exports independent of the shared libraries.
- package:
    name: llvm-static
    version: ${{ version }}
  inherit: llvm-build
  build:
    script: echo "Packaging the LLVM/Clang/LLD static libraries"
    files:
      include:
      - include/**
      - lib/*.a
      - lib/cmake/**
      - share/**
      exclude:
      - lib/cmake/llvm/LLVMSharedExports*.cmake
      - lib/cmake/clang/ClangSharedTargets*.cmake
      - '**/__pycache__/**'
      - '**/*.pyc'
    python:
      skip_pyc_compilation:
      - '**/*.py'
  tests:
  - package_contents:
      files:
        exists:
        - include/llvm-c/lto.h
        - lib/cmake/llvm/LLVMConfig.cmake
        - lib/cmake/llvm/LLVMStaticExports.cmake
        - lib/cmake/clang/ClangConfig.cmake
        - lib/cmake/lld/LLDConfig.cmake
        - lib/liblldWasm.a
        - lib/libclangInterpreter.a
        - lib/libLLVMX86CodeGen.a
        - lib/libLLVMAArch64CodeGen.a
        not_exists:
        - '**/*.so*'
        - lib/cmake/llvm/LLVMSharedExports*.cmake
        - lib/cmake/clang/ClangSharedTargets*.cmake
  # LLVM's single-threaded executor uses deferred std::async. libc++ can
  # retain pthread symbols for its unused async branch; no threads are enabled.
  - script: generic-testing --allow-pthread
    requirements:
      build:
      - generic-testing
  - script: test_static.sh
    files:
      recipe:
      - test_static.sh
      - tests/
    requirements:
      build:
      - ${{ compiler("c") }}
      - ${{ compiler("cxx") }}
      - cmake
      - make

- package:
    name: llvm
    version: ${{ version }}
  inherit: llvm-build
  build:
    script: echo "Packaging the LLVM/Clang shared libraries"
    files:
      include:
      - lib/libLTO.so
      - lib/libRemarks.so
      - lib/libclang.so
      - lib/libclang-cpp.so
      - lib/cmake/llvm/LLVMSharedExports*.cmake
      - lib/cmake/clang/ClangSharedTargets*.cmake
  requirements:
    run_exports:
    - ${{ pin_subpackage('llvm', lower_bound='x.x', upper_bound='x.x') }}
  tests:
  - package_contents:
      files:
        exists:
        - lib/libLTO.so
        - lib/libRemarks.so
        - lib/libclang.so
        - lib/libclang-cpp.so
        - lib/cmake/llvm/LLVMSharedExports.cmake
        - lib/cmake/clang/ClangSharedTargets.cmake
        not_exists:
        - '**/*.a'
  # LLVM's single-threaded executor uses deferred std::async. libc++ can
  # retain pthread symbols for its unused async branch; no threads are enabled.
  - script: generic-testing --allow-pthread
    requirements:
      build:
      - generic-testing

about:
  license: Apache-2.0 WITH LLVM-exception
  license_family: Apache
  license_file: LICENSE.TXT
  summary: The LLVM Project is a collection of modular and reusable compiler and toolchain technologies.
  homepage: https://llvm.org
extra:
  ci:
    platforms:
      emscripten-wasm32: true
      emscripten-wasm64: true
  recipe-maintainers:
  - DerThorsten
  - anutosh491
