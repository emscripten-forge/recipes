context:
  version: 23.1.2

source:
  url: https://github.com/llvm/llvm-project/archive/refs/tags/llvmorg-${{ version }}.tar.gz
  sha256: 75788d759e6987a910975b902f554dc77c08b076b945b2cebde54116d8e831ca
  patches:
  # Backport LLVM PR #221647: Emscripten does not support ELF version scripts.
  - patches/disable-emscripten-version-scripts.patch
  # Preserve the shared LLVM/Clang APIs with WebAssembly export lists.
  - patches/emscripten-symbol-exports.patch

build:
  number: 3

outputs:
- staging:
    name: llvm-build
  build:
    script: build.sh
  requirements:
    build:
    - ${{ compiler("c") }}
    - ${{ compiler("cxx") }}
    - cmake >=4.3.3,<4.4
    - make
    - llvm-tblgen ==${{ version }}

# LLVM libraries are built independently of Clang and LLD.
- package:
    name: llvm-static
    version: ${{ version }}
  inherit: llvm-build
  build:
    script: echo "Packaging llvm-static"
    files:
      include:
      - include/llvm/**
      - include/llvm-c/**
      - lib/libLLVM*.a
      - lib/cmake/llvm/**
      - share/llvm/**
      exclude:
      - lib/cmake/llvm/LLVMSharedExports*.cmake
      - '**/__pycache__/**'
      - '**/*.pyc'
    python:
      skip_pyc_compilation:
      - '**/*.py'
  tests:
  - package_contents:
      files:
        exists:
        - include/llvm-c/lto.h
        - lib/cmake/llvm/LLVMConfig.cmake
        - lib/cmake/llvm/LLVMStaticExports.cmake
        - lib/libLLVMX86CodeGen.a
        - lib/libLLVMAArch64CodeGen.a
        not_exists:
        - '**/*.so*'
        - include/clang/**
        - include/lld/**
        - lib/libclang*.a
        - lib/liblld*.a
  # libc++ can retain unused pthread symbols from LLVM's deferred std::async.
  - script: generic-testing --allow-pthread
    requirements:
      build:
      - generic-testing
  - script: test_static.sh
    files:
      recipe:
      - test_static.sh
      - tests/
    requirements:
      build:
      - ${{ compiler("c") }}
      - ${{ compiler("cxx") }}
      - cmake
      - make

- package:
    name: llvm
    version: ${{ version }}
  inherit: llvm-build
  build:
    script: echo "Packaging llvm"
    files:
      include:
      - lib/libLTO.so
      - lib/libRemarks.so
      - lib/cmake/llvm/LLVMSharedExports*.cmake
  requirements:
    run_exports:
    - ${{ pin_subpackage('llvm', lower_bound='x.x', upper_bound='x.x') }}
  tests:
  - package_contents:
      files:
        exists:
        - lib/libLTO.so
        - lib/libRemarks.so
        - lib/cmake/llvm/LLVMSharedExports.cmake
        not_exists:
        - '**/*.a'
        - lib/libclang*.so
  # libc++ can retain unused pthread symbols from LLVM's deferred std::async.
  - script: generic-testing --allow-pthread
    requirements:
      build:
      - generic-testing

about:
  license: Apache-2.0 WITH LLVM-exception
  license_family: Apache
  license_file: LICENSE.TXT
  summary: The LLVM Project is a collection of modular and reusable compiler and toolchain technologies.
  homepage: https://llvm.org
extra:
  ci:
    platforms:
      emscripten-wasm32: true
      emscripten-wasm64: true
  recipe-maintainers:
  - DerThorsten
  - anutosh491
