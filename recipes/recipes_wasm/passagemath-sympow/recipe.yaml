context:
  version: 10.8.13

package:
  name: passagemath-sympow
  version: ${{ version }}

source:
- url: https://pypi.org/packages/source/p/passagemath-sympow/passagemath_sympow-${{ version }}.tar.gz
  sha256: 435f52b5a6ab41fb38ab8909017fbe5b83264df9fb7bdd7a659ccc120c6a2217

build:
  script: ${{ PYTHON }} -m pip install .
  number: 0

requirements:
  build:
  - python
  - crossenv >=1.2
  - cross-python_${{ target_platform }}
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - pip
  - passagemath-setup
  - passagemath-environment
  - cython<3.3
  - cysignals
  - pkgconfig
  - passagemath-abi == ${{ version }}
  host:
  - python-dev
  - sympow
  - passagemath-categories
  run:
  - python
  - cysignals
  - sympow
  - passagemath-categories
  - passagemath-linbox
  - passagemath-modules

tests:
- script: pytester
  files:
    recipe:
    - test_passagemath_sympow.py
  requirements:
    build:
    - pytester
    run:
    - pytester-run
    - passagemath-repl
- script: generic-testing
  requirements:
    build:
    - generic-testing

about:
  license: GPL-2.0-or-later
  license_file: README.rst
  summary: 'passagemath: Special values of symmetric power elliptic curve L-functions with sympow'
  description: |
    Distribution of a part of the Sage library.
    It provides an interface to sympow.

extra:
  emscripten_tests:
    python:
      pytest_files:
      - test_passagemath_sympow.py
  recipe-maintainers:
  - mkoeppe
