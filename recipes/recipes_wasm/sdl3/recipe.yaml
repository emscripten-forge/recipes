context:
  name: sdl3
  version: 3.4.18

package:
  name: ${{ name }}-static
  version: ${{ version }}

source:
- url: https://github.com/libsdl-org/SDL/releases/download/release-${{ version }}/SDL3-${{ version }}.tar.gz
  sha256: 9c75cf16330322c217dedd2e0609f1124f1b54b8633e763467b4684d0f4334a3

build:
  number: 0

requirements:
  build:
  - ${{ compiler('c') }}
  - cmake
  - ninja
  - pkg-config

tests:
- package_contents:
    files:
    - include/SDL3/SDL.h
    - include/SDL3/SDL_main.h
    - lib/libSDL3.a
    - lib/cmake/SDL3/SDL3Config.cmake
    - lib/cmake/SDL3/SDL3staticTargets.cmake
    - lib/pkgconfig/sdl3.pc
    - share/licenses/SDL3/LICENSE.txt
- script: generic-testing
  requirements:
    build:
    - generic-testing
- script:
  - build_tests.sh
  requirements:
    build:
    - ${{ compiler('c') }}
    - cmake
    - ninja
    - nodejs
    - pkg-config
  files:
    recipe:
    - build_tests.sh
    - run_demo.sh
    - demo/
    - tests/

about:
  homepage: https://libsdl.org/
  license: Zlib
  license_file: LICENSE.txt
  summary: Simple DirectMedia Layer
  description: |
    SDL3 is a cross-platform development library designed to provide low level
    access to audio, keyboard, mouse, joystick, and graphics hardware via
    OpenGL, Vulkan, Metal, and Direct3D.
  documentation: https://wiki.libsdl.org/SDL3/
  repository: https://github.com/libsdl-org/SDL

extra:
  recipe-maintainers:
  - Alex-PLACET
