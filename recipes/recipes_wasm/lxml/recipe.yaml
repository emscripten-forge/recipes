context:
  name: lxml
  version: 6.1.3

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 45222d94ddd511536f3b2f7d9deae3b2339b4ce0f075f1ca25703b07cad9dd21

build:
  number: 0
  script: ${PYTHON} -m pip install . ${PIP_ARGS}

  files:
    exclude:
    - '**/*.pxd'
    - '**/*.pxi'
    - '**/*.pyx'
    - '**/__pycache__/**'
    - '**/*.pyc'
    - '**/test_*.py'
  python:
    skip_pyc_compilation:
    - '**/*.py'
requirements:
  build:
  - ${{ compiler("c") }}
  - cross-python_${{ target_platform }}
  - python
  - setuptools
  - pip
  - cython
  - pkg-config
  host:
  - python-dev
  - libiconv-static
  - libxml2-static
  - libxslt-static
  - zlib-static
  run:
  - python
  - ${{ pin_compatible("libiconv-static", lower_bound='x.x', upper_bound='x.x') }}
  - ${{ pin_compatible("libxml2-static", lower_bound='x.x', upper_bound='x.x') }}
  - ${{ pin_compatible("libxslt-static", lower_bound='x.x', upper_bound='x.x') }}
  - ${{ pin_compatible("zlib-static", lower_bound='x.x', upper_bound='x.x') }}

tests:
- script: pytester
  files:
    recipe:
    - test_import_lxml.py
  requirements:
    build:
    - pytester
    run:
    - pytester-run
- script: generic-testing --allow-pthread  # statically linked libxml2 exports xmlInitThreads/xmlCleanupThreads as ABI stubs even with LIBXML2_WITH_THREADS=OFF; no actual pthread activity.
  requirements:
    build:
    - generic-testing

about:
  license: BSD-3-Clause
  license_file: LICENSE.txt
  license_family: BSD
  summary: Pythonic binding for the C libraries libxml2 and libxslt.
  description: |
    lxml is the most feature-rich and easy-to-use library for processing XML and
    HTML in the Python language.
  documentation: https://github.com/lxml/lxml/blob/master/doc/main.txt
  homepage: https://github.com/lxml/lxml

extra:
  recipe-maintainers:
  - michaelweinold
