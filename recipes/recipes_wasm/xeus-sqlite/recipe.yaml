context:
  version: 0.11.0

package:
  name: xeus-sqlite
  version: ${{ version }}

source:
  url: https://github.com/jupyter-xeus/xeus-sqlite/archive/refs/tags/${{ version }}.tar.gz
  sha256: 230a0aef9a3fc6962b43af650b192c36c1f9b6147be95a631957e8bb61e11041

build:
  number: 1

requirements:
  build:
  - ${{ compiler("cxx") }}
  - cmake
  - ninja
  host:
  - nlohmann_json >= 3.12
  - xproperty 0.13.*
  - cpp-tabulate
  - xvega-static 0.2.*
  - xvega-bindings 0.2.*
  - xeus-lite-static
  - xeus 6.2.*
  - sqlitecpp-static

tests:
- script:
  - test -f $PREFIX/bin/xsqlite.wasm
  - test -f $PREFIX/bin/xsqlite.js
  - test -f $PREFIX/share/jupyter/kernels/xsqlite/kernel.json
  - generic-testing
  requirements:
    build:
    - generic-testing
- script: xeus-tester --shim sqlite
  files:
    recipe:
    - xeus_test_xsqlite.sql
  requirements:
    build:
    - xeus-tester
    - playwright  # also run xeus-tester tests in a browser

about:
  license: BSD-3-Clause
  license_family: BSD-3
  license_file: LICENSE
  summary: xeus-sqlite
  homepage: https://github.com/jupyter-xeus/xeus-sqlite
extra:
  recipe-maintainers:
  - DerThorsten
  - JohanMabille
