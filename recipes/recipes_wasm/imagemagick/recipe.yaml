context:
  version: 7.1.2-34
package:
  name: imagemagick-static
  version: ${{ version | replace("-","_") }}

source:
  url: https://github.com/ImageMagick/ImageMagick/archive/${{ version}}.tar.gz
  sha256: f5163a573a1c1bff16358d0a592b2fb168ad0fd3b9dc5ff57dc7820eebc5cf79

build:
  number: 0
  files:
    exclude:
    - share/man/man1/**

requirements:
  build:
  - libtool
  - ${{ compiler('c') }}
  - make
  - pkg-config
  host:
  - libtiff-static
  - libpng-static
  - libjpeg-turbo-static
  - libbzip2-static
  - libxml2-static
  - zlib-static
  run:
  - ${{ pin_compatible('libtiff-static', lower_bound='x', upper_bound='x') }}
  - ${{ pin_compatible('libpng-static', lower_bound='x.x', upper_bound='x.x') }}
  - ${{ pin_compatible('libjpeg-turbo-static', lower_bound='x', upper_bound='x') }}
  - ${{ pin_compatible('libbzip2-static', lower_bound='x.x', upper_bound='x.x') }}
  - ${{ pin_compatible('libxml2-static', lower_bound='x.x', upper_bound='x.x') }}
  - ${{ pin_compatible('zlib-static', lower_bound='x.x', upper_bound='x.x') }}

tests:
- package_contents:
    files:
    - lib/libMagick++-7.Q8.a
    - include/ImageMagick-7/Magick++.h
- script: generic-testing
  requirements:
    build:
    - generic-testing

about:
  homepage: http://www.imagemagick.org/
  license: AGPL-3.0-only
  license_file: LICENSE
  summary: Software suite to create, edit, compose, or convert bitmap images.

