context:
  name: fs
  version: 2.1.0

package:
  name: r-${{ name }}
  version: ${{ version }}

source:
  url:
  - https://cran.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cloud.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cran.r-project.org/src/contrib/Archive/${{ name }}/${{ name }}_${{ version }}.tar.gz
  sha256: 7088af1117d65c4ceb144b532e323f197fc8243b1d704bf6edf40774789829cd
  patches:
  # Sourced from https://github.com/r-wasm/fs/tree/webr
  - patches/0001-Modify-vendored-libuv-source-for-webR-compat.patch
  - patches/0002-Add-Makevars-for-webR.patch
  # Select Emscripten as the target
  - patches/0003-Set-UNAME-to-Emscripten.patch

build:
  number: 0
  script: |
    $R CMD INSTALL \
    --no-docs \
    --no-html \
    --no-test-load \
    --no-staged-install \
    --no-byte-compile \
    $R_ARGS .

requirements:
  build:
  - ${{ compiler('c') }}
  - cross-r-base ==${{ r_base }}
  - pkg-config
  host:
  - r-base ==${{ r_base }}

tests:
- package_contents:
    lib:
    - R/library/${{ name }}/libs/${{ name }}.so
- script:
  - run_r_test test_${{ name }}.R
  - generic-testing
  files:
    recipe:
    - test_${{ name }}.R
  requirements:
    build:
    - r-wasm-tester
    - generic-testing

about:
  homepage: https://fs.r-lib.org
  license: MIT
  summary: A cross-platform interface to file system operations, built on top of the 'libuv' C library.
  license_family: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
  - rgaiacs
