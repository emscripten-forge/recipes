context:
  name: xz
  version: 5.8.4

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/tukaani-project/xz/releases/download/v${{ version }}/xz-${{ version }}.tar.gz
  sha256: 0014c7886930454fe8bd4228665b51af55eeae560ea135c9c4cd33f55b2591d9

build:
  number: 0

requirements:
  build:
  - autoconf
  - automake
  - libtool
  - make
  - ${{ compiler('c') }}
  - nodejs

tests:
# the xz program only; liblzma is packaged as liblzma-static
- package_contents:
    files:
    - bin/xz
    - bin/xz.wasm
# the program is built for the browser: under node it neither sees the host
# file system nor can it stream (emscripten reports stdin/stdout as terminals,
# which xz refuses for compressed data), so only check that it runs
- script:
  - node ${PREFIX}/bin/xz --version | grep "xz (XZ Utils) ${PKG_VERSION}"
  requirements:
    build:
    - nodejs
- script: generic-testing
  requirements:
    build:
    - generic-testing

about:
  homepage: https://tukaani.org/xz/
  license: 0BSD
  license_file: COPYING
  summary: XZ Utils (the xz program)

extra:
  recipe-maintainers:
  - wangyenshu
