context:
  name: cairo
  version: 1.18.6

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: http://cairographics.org/releases/${{ name }}-${{ version }}.tar.xz
  sha256: 1c767308174337a74694da0f3ec069c271452163a1ef4540964c50c301f157d4

build:
  number: 0

requirements:
  build:
  - ${{ compiler('c') }}
  - ${{ compiler('cxx') }}
  - meson
  - ninja
  - pkg-config
  - gobject-introspection
  host:
  - freetype
  - fontconfig>=2.12
    # - glib
  - libpng
  - pixman
  - lzo
  - expat
  - zlib
  - libffi

tests:
- package_contents:
    lib:
    - libcairo.a
    - libcairo-script-interpreter.a
    include:
    - cairo/cairo.h
    - cairo/cairo-svg.h

about:
  homepage: http://cairographics.org/
  documentation: https://www.cairographics.org/documentation/
  license: MPL-1.1 # or LGPL-2.1-only
  license_file:
  - COPYING
  - COPYING-LGPL-2.1
  - COPYING-MPL-1.1
  summary: |
    Cairo is a 2D graphics library with support for multiple output devices.

extra:
  recipe-maintainers:
  - IsabelParedes
  - anutosh491
