context:
  name: cairo
  version: 1.18.6

source:
  url: http://cairographics.org/releases/${{ name }}-${{ version }}.tar.xz
  sha256: 1c767308174337a74694da0f3ec069c271452163a1ef4540964c50c301f157d4

build:
  number: 0

outputs:
- staging:
    name: cairo-build
  requirements:
    build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - meson
    - ninja
    - pkg-config
    host:
    - freetype-static
    - libfontconfig-static
    - libpng-static
    - libpixman-static
    - liblzo-static
    - libexpat-static
    - libzlib-static
    - libffi-static
  build:
    script: build.sh

#==============================================================================#

- package:
    name: libcairo-static
    version: ${{ version }}
  inherit: cairo-build
  requirements:
    host:
    - freetype-static
    - libfontconfig-static
    - libpng-static
    - libpixman-static
    - liblzo-static
    - libexpat-static
    - libzlib-static
    - libffi-static
    run:
    - ${{ pin_compatible('freetype-static', lower_bound='x', upper_bound='x') }}
    - ${{ pin_compatible('libfontconfig-static', lower_bound='x.x', upper_bound='x.x') }}
    - ${{ pin_compatible('libpng-static', lower_bound='x.x', upper_bound='x.x') }}
    - ${{ pin_compatible('libpixman-static', lower_bound='x.x', upper_bound='x.x') }}
    - ${{ pin_compatible('liblzo-static', lower_bound='x', upper_bound='x') }}
    - ${{ pin_compatible('libexpat-static', lower_bound='x', upper_bound='x') }}
    - ${{ pin_compatible('libzlib-static', lower_bound='x.x', upper_bound='x.x') }}
    - ${{ pin_compatible('libffi-static', lower_bound='x.x', upper_bound='x.x') }}
  tests:
  - package_contents:
      files:
      - include/cairo/cairo.h
      - lib/libcairo.a
      - lib/libcairo-script-interpreter.a
  - script: generic-testing
    requirements:
      build:
      - generic-testing

#==============================================================================#

# Meta package for the static library
- package:
    name: cairo-static
    version: ${{ version }}
  requirements:
    run:
    - ${{ pin_subpackage('libcairo-static', exact=True) }}
  tests:
  - package_contents:
      files: []

#==============================================================================#

about:
  homepage: http://cairographics.org/
  documentation: https://www.cairographics.org/documentation/
  license: MPL-1.1 # or LGPL-2.1-only
  license_file:
  - COPYING
  - COPYING-LGPL-2.1
  - COPYING-MPL-1.1
  summary: |
    Cairo is a 2D graphics library with support for multiple output devices.

extra:
  recipe-maintainers:
  - IsabelParedes
  - anutosh491
