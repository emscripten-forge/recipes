context:
  name: pari
  version: 2.19.0

package:
  name: ${{ name }}-static
  version: ${{ version }}

source:
  url: https://pari.math.u-bordeaux.fr/pub/pari/unix/pari-${{ version }}.tar.gz
  sha256: f317b9722eb5d9094a60303774f066f3a83e3ec1f170be8546c44d7583f30b6d

build:
  number: 0

requirements:
  build:
  - autoconf
  - automake
  - libtool
  - make
  - pkg-config
  - autoconf-archive
  - ${{ compiler('c') }}
  - ${{ compiler('cxx') }}
  host:
  - gmp-static
  - readline-static
  - ncurses-static
  run:
  - ${{ pin_compatible('gmp-static', lower_bound='x', upper_bound='x') }}
  - ${{ pin_compatible('readline-static', lower_bound='x', upper_bound='x') }}
  - ${{ pin_compatible('ncurses-static', lower_bound='x', upper_bound='x') }}

tests:
- package_contents:
    lib:
    - libpari.a
    include:
    - pari/pari.h
    files:
    - bin/gp-sta.js
    - bin/gp-sta.wasm
- script:
  - echo "print(factor(2^64+1))" | node ${PREFIX}/bin/gp-sta.js -q
  requirements:
    build:
    - nodejs
- script: generic-testing
  requirements:
    build:
    - generic-testing

about:
  homepage: https://pari.math.u-bordeaux.fr/
  license: GPL-2.0-only
  license_file: COPYING
  summary: PARI/GP is a cross platform and open-source computer algebra system designed for fast computations in number
    theory

extra:
  recipe-maintainers:
  - wangyenshu
