context:
  name: highs
  version: 1.16.0

package:
  name: ${{ name }}-static
  version: ${{ version }}

source:
  url: https://github.com/ERGO-Code/${{ name }}/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 0fa9da512955fb08c6cca7bfb274ca12e8a0e8a12e44189bd6e0c355ce7701bc

build:
  number: 1

requirements:
  build:
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - cmake
  - make

tests:
- package_contents:
    lib:
    - libhighs.a
    include:
    - highs/Highs.h
    files:
    - bin/highs.js
    - bin/highs.wasm
- script:
  - bash test_highs.sh
  requirements:
    build:
    - ${{ compiler("cxx") }}
    - nodejs
  files:
    recipe:
    - test_highs.sh
    - test_highs.cpp
# HighsTaskExecutor (the parallel scheduler) creates its workers with
# std::thread, so libhighs.a references pthread_create. It starts
# num_threads - 1 workers, and without pthreads hardware_concurrency() is 1,
# so no thread is ever created (the test above solves an LP under node).
- script: generic-testing --allow-pthread
  requirements:
    build:
    - generic-testing

about:
  summary: Linear optimization software
  description: |
    HiGHS is a high performance serial and parallel solver for large scale
    sparse linear optimization problems
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/ERGO-Code/HiGHS

extra:
  recipe-maintainers:
  - DerThorsten
