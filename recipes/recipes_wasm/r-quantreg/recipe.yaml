context:
  name: quantreg
  version: '6.1'

package:
  name: r-${{ name }}
  version: ${{ version }}

source:
  url:
  - https://cran.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cloud.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cran.r-project.org/src/contrib/Archive/${{ name }}/${{ name }}_${{ version }}.tar.gz
  sha256: f42292c5ab25a15f39295b93391deafef192fe09eefde563399a64eba7e0169a
  patches:
  - if: target_platform == "emscripten-wasm64"
    then:
    - patches/0001-Avoid-NINT-to-work-around-wasm64-lround-codegen.patch

build:
  number: 0
  skip: ${{ r_base >= '4.6.0' }}
  script: $R CMD INSTALL $R_ARGS .

requirements:
  build:
  - cross-r-base ==${{ r_base }}
  - ${{ compiler('c') }}
  - ${{ compiler('fortran') }}
  - r-sparsem
  - r-matrix
  - r-matrixmodels
  - r-survival
  - r-mass
  host:
  - libflang-rt-static
  - r-base ==${{ r_base }}
  - r-sparsem
  - r-matrix
  - r-matrixmodels
  - r-survival
  - r-mass
  run:
  - r-sparsem
  - r-matrix
  - r-matrixmodels
  - r-survival
  - r-mass

tests:
- package_contents:
    lib:
    - R/library/${{ name }}/libs/${{ name }}.so
- script:
  - run_r_test test_${{ name }}.R
  - generic-testing
  files:
    recipe:
    - test_${{ name }}.R
  requirements:
    build:
    - r-wasm-tester
    - generic-testing

about:
  homepage: https://cran.r-project.org/package=quantreg
  repository: https://github.com/cran/quantreg
  license: GPL-2.0-or-later
  license_family: GPL
  license_file:
  - ${{ PREFIX }}/lib/R/share/licenses/GPL-2
  summary: Quantile Regression
  description: |
    Estimation and inference methods for models of conditional quantiles: Linear
    and nonlinear parametric and non-parametric (semi-parametric) models for
    conditional quantiles of a univariate response and several methods for
    handling censored regression data. The models can contain explanatory
    variables in factor form, linear forms, and nonlinear forms.

extra:
  recipe-maintainers:
  - IsabelParedes
