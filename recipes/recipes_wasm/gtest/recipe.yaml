context:
  version: 1.18.0
  name: gtest

package:
  name: ${{ name }}-static
  version: ${{ version }}

source:
  url: https://github.com/google/googletest/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 6e3191c1455468b3fc35a417fb565c1c5071aee1b7e7f85e30cf48a98d37d8b5

build:
  number: 0

requirements:
  build:
  - ${{ compiler('cxx') }}
  - cmake
  - ninja
  run_constraints:
  - gmock = ${{ version }}
tests:
- package_contents:
    lib:
    - libgtest.a
    - libgtest_main.a
    - libgmock.a
    - libgmock_main.a
    include:
    - gtest/gtest.h
    - gmock/gmock.h
- script: generic-testing
  requirements:
    build:
    - generic-testing

about:
  homepage: https://github.com/google/googletest
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Google's C++ test framework

extra:
  recipe-maintainers:
  - KGB99
