context:
  name: libcadabra2
  version: 2.6.0

package:
  name: ${{ name }}-static
  version: ${{ version }}

source:
  url: https://github.com/kpeeters/cadabra2/archive/refs/tags/${{ version }}.tar.gz
  sha256: bb6e4e58002468573652ac51f0fe64a49fe47d4a5238b2dbcc766f33ca8b52b8

build:
  number: 0

requirements:
  build:
  - ${{ compiler("c") }}
  - ${{ compiler('cxx') }}
  - cmake
  - make
  - python
  - cross-python_${{ target_platform }}
  host:
  - python-dev
  - gmp-static
  - boost-headers
  run:
  - ${{ pin_compatible('gmp-static', lower_bound='x', upper_bound='x') }}

tests:
- package_contents:
    files:
    - lib/libcadabra2++_static.a
    - include/cadabra2++/include/cadabra2++.hh
- script: generic-testing
  requirements:
    build:
    - generic-testing

about:
  homepage: https://cadabra.science/
  license: GPL-3.0-only
  license_file: LICENSE
  summary: A field-theory motivated approach to computer algebra (C++ library).

extra:
  recipe-maintainers:
  - wangyenshu
