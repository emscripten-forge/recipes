context:
  version: 1.1.0
  name: pyb2d3

source:
- url: https://github.com/DerThorsten/pyb2d3/archive/refs/tags/v${{version}}.tar.gz
  sha256: 71723c8b023f104edefe656f002407dfaeb04a21b3565e808e8e0a1405ecffe6

build:
  number: 0

outputs:
- package:
    name: pyb2d3
    version: ${{ version }}

  build:
    script: build.sh
    files:
      exclude:
      - '**/__pycache__/**'
      - '**/*.pyc'
    python:
      skip_pyc_compilation:
      - '**/*.py'

  requirements:
    build:
    - ${{ compiler("cxx") }}
    - cross-python_${{ target_platform }}
    - cmake >=4.0
    - ninja
    - numpy
    - nanobind <2.10.2
    - scikit-build-core
    - python
    - pip
    host:
    - python-dev
    - numpy
    - box2d-static >=3.2.0
    run:
    - numpy
    - python

  tests:
  - script: pytester
    files:
      recipe:
      - test_pyb2d3.py
    requirements:
      build:
      - pytester
      run:
      - pytester-run
  - script: generic-testing
    requirements:
      build:
      - generic-testing

about:
  license: MIT
  license_file: LICENSE
  summary: python bindings for box2d v3, a 2D physics engine
  homepage: https://github.com/DerThorsten/pyb2d3

extra:
  recipe-maintainers:
  - DerThorsten
