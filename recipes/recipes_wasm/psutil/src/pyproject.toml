[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "psutil"
version = "7.2.2"  # (the same as in recipe.yaml)
description = "psutil's API for Emscripten / WebAssembly, answered as well as a browser allows"
license = "BSD-3-Clause"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["psutil"]
