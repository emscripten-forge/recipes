context:
  version: 0.21.0

package:
  name: xleaflet
  version: ${{ version }}

source:
  url: https://github.com/jupyter-xeus/xleaflet/archive/refs/tags/${{ version }}.tar.gz
  sha256: 6553676a2b634a7e16d03defb4b07c25e413fc834f6e24799ded375c0ba92909
  patches:
  - patches/shared.patch
  # xwidgets 0.31 uses the new xproperty: properties are declared with the
  # xcommon owner and patched generically (no set_property_from_patch); also
  # drops the --std=c++17 the xeus target exports (xtensor 0.28 needs C++20)
  - patches/0002-port-to-xwidgets-0.31.patch

build:
  number: 0

requirements:
  build:
  - ${{ compiler("cxx") }}
  - cmake
  - make
  host:
  - xproperty
  - xwidgets
  - xtensor
  - nlohmann_json
  run_exports:
  - ${{ pin_subpackage("xleaflet", upper_bound="x.x") }}

tests:
- script:
  - test -f $PREFIX/share/xleaflet/basemaps.json
  - test -f $PREFIX/lib/libxleaflet.so
- script: generic-testing
  requirements:
    build:
    - generic-testing

about:
  license: BSD-3-Clause
  license_family: BSD-3
  license_file: LICENSE
  summary: C++ backend for the jupyter leaflet widget
  homepage: https://github.com/jupyter-xeus/xleaflet
extra:
  recipe-maintainers:
  - anutosh491
