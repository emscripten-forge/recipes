context:
  version: 0.1.1

package:
  name: xeus-pywrap
  version: ${{ version }}

source:
  url: https://github.com/DerThorsten/xeus-pywrap/archive/refs/tags/${{ version }}.tar.gz
  sha256: 6be2c4b922ef3c0cb0e4de82a04119490e05f5b60d08f9638f5ac27b22479f0d
  patches:
  - patches/0001-use-shared-xeus-on-emscripten.patch


build:
  number: 2

requirements:
  build:
  - ${{ compiler("cxx") }}
  - cross-python_${{target_platform}}
  - cmake >=4
  - ninja
  host:
  - python-dev
  - nlohmann_json
  - nlohmann_json-abi
  - xeus
  - xeus-lite-static >=5.0.0
  - pybind11<3
  - pybind11_json
  - xtl
  - pyjs-dev
  run:
  - python
  - pyjs >=4.0.6

tests:
- package_contents:
    files:
    - bin/xpywrap.wasm
    - bin/xpywrap.js
    - lib/python3.14/site-packages/xpywrap/__init__.py

about:
  license: BSD-3-Clause
  license_family: BSD-3
  license_file: LICENSE
  summary: xeus-pywrap
  homepage: https://github.com/DerThorsten/xeus-pywrap

extra:
  recipe-maintainers:
  - DerThorsten
