context:
  name: sweater
  version: 0.1.8

package:
  name: r-${{ name }}
  version: ${{ version }}

source:
  url:
  - https://cran.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cloud.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cran.r-project.org/src/contrib/Archive/${{ name }}/${{ name }}_${{ version }}.tar.gz
  sha256: 23cf198ff1edfce86cadd4de23e94dea0acb1310faec77df651366ab1bf4ac10

build:
  number: 0
  skip: ${{ r_base >= '4.6.0' }}
  script: $R CMD INSTALL $R_ARGS .

requirements:
  build:
  - ${{ compiler('cxx') }}
  - cross-r-base
  - r-liblinear
  - r-rcpp
  - r-cli
  - r-combinat
  - r-data.table
  - r-proxy
  - r-purrr
  - r-quanteda
  host:
  - r-base ==${{ r_base }}
  - r-liblinear
  - r-rcpp
  - r-cli
  - r-combinat
  - r-data.table
  - r-proxy
  - r-purrr
  - r-quanteda
  run:
  - r-liblinear
  - r-rcpp
  - r-cli
  - r-combinat
  - r-data.table
  - r-proxy
  - r-purrr
  - r-quanteda

tests:
- package_contents:
    lib:
    - R/library/${{ name }}/libs/${{ name }}.so
- script:
  - run_r_test test_${{ name }}.R
  - generic-testing
  files:
    recipe:
    - test_${{ name }}.R
  requirements:
    build:
    - r-wasm-tester
    - generic-testing

about:
  homepage: https://github.com/gesistsa/sweater
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file:
  - ${{ PREFIX }}/lib/R/share/licenses/GPL-3
  summary: Speedy Word Embedding Association Test and Extras Using R
  description: |
    Conduct various tests for evaluating implicit biases in word embeddings:
    Word Embedding Association Test (Caliskan et al., 2017),
    <doi:10.1126/science.aal4230>, Relative Norm Distance (Garg et al., 2018),
    <doi:10.1073/pnas.1720347115>, Mean Average Cosine Similarity
    (Mazini et al., 2019) <arXiv:1904.04047>, SemAxis (An et al., 2018)
    <arXiv:1806.05521>, Relative Negative Sentiment Bias (Sweeney & Najafian,
    2019) <doi:10.18653/v1/P19-1162>, and Embedding Coherence Test (Dev &
    Phillips, 2019) <arXiv:1901.07656>.

extra:
  recipe-maintainers:
  - rgaiacs
  - IsabelParedes
