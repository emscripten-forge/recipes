context:
  version: 0.11.26

package:
  name: miniaudio-c-static
  version: ${{ version }}

source:
  url: https://github.com/mackron/miniaudio/archive/refs/tags/${{ version }}.tar.gz
  sha256: 838ba55a21c9142adf7b76bdc4351e5cd8b7ae128f46b25ec25f94ae9969c600

build:
  number: 0
  script: build.sh

requirements:
  build:
  - ${{ compiler('c') }}
  - cmake
  - ninja

tests:
- package_contents:
    include:
    - miniaudio/miniaudio.h
    files:
    - lib/libminiaudio.a
    - lib/pkgconfig/miniaudio.pc
    - lib/cmake/miniaudio/miniaudioConfig.cmake
- script:
  - build_tests.sh
  requirements:
    build:
    - ${{ compiler('c') }}
    - cmake
    - ninja
  files:
    recipe:
    - build_tests.sh
    - tests/
# miniaudio's ma_thread/ma_mutex/ma_event wrappers call the pthread API, which
# emscripten's non-threaded libc provides as single-threaded stubs. Nothing is
# compiled with -pthread, and the Web Audio backend runs its callbacks without
# a worker thread (MA_NO_THREADING would also require MA_NO_DEVICE_IO).
- script: generic-testing --allow-pthread
  requirements:
    build:
    - generic-testing

about:
  homepage: https://miniaud.io/
  license: MIT-0 OR Unlicense
  license_file: LICENSE
  summary: A single file audio playback and capture library written in C.
  description: |
    miniaudio is a single-header audio playback and capture library
    written in C. It has no external dependencies except the C standard
    library. It supports all major platforms including Windows, macOS,
    Linux, Android, iOS, and Web (Emscripten).
  documentation: https://miniaud.io/docs/manual/
  repository: https://github.com/mackron/miniaudio

extra:
  recipe-maintainers:
  - Alex-PLACET
