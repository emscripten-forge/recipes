context:
  name: libflang
  version: 23.1.0

source:
  url: https://github.com/llvm/llvm-project/archive/refs/tags/llvmorg-${{ version }}.tar.gz
  sha256: d8657b2a7291e518407bf13c4b41c85ef2cded2d4354097a2f451644dfc817b0
  patches:
    # Originally from https://github.com/serge-sans-paille/llvm-project/tree/feature/flang-wasm
    - patches/0001-Add-CodeGen-target-support-for-wasm32-and-wasm64.patch
    - patches/0002-Use-32-bit-indeces-in-FIR-to-LLVM-for-32-bit-targets.patch
    - patches/0003-Specialize-flang-to-target-wasm.patch
    - patches/0004-Predefine-__wasm-macros-from-the-target-triple.patch
    # These are only needed for the runtime lib
    - patches/0005-Treat-iso_c_binding-c_long-as-32-bit-for-wasm32.patch
    - patches/0006-Fix-signature-mismatches.patch

build:
  number: 0

outputs:
  - staging:
      name: libflang-build
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - ${{ compiler('fortran') }}
        - ninja
        - cmake
    build:
      script:
        env:
          PKG_VERSION: ${{ version }}
        file: build.sh

  - package:
      name: libflang
      version: ${{ version }}
    inherit: libflang-build
    requirements:
      run_exports:
      - ${{ pin_subpackage('libflang', upper_bound='x.x') }}
    build:
      files:
        exclude:
        - lib/*.a
    tests:
    - package_contents:
        files:
        - lib/libflang_rt.runtime.so
    - script: test_libflang.sh
      files:
        recipe:
        - hello.f90
      requirements:
        build:
        - ${{ compiler('fortran') }}
        - ${{ compiler('cxx') }}
        - nodejs

  - package:
      name: libflang-static
      version: ${{ version }}
    inherit: libflang-build
    build:
      files:
        exclude:
        - lib/*.so
    tests:
    - package_contents:
        files:
        - lib/libflang_rt.runtime.a
    - script: test_libflang.sh
      files:
        recipe:
        - hello.f90
      requirements:
        build:
        - ${{ compiler('fortran') }}
        - ${{ compiler('cxx') }}
        - nodejs

about:
  homepage: https://flang.llvm.org
  license: Apache-2.0
  license_file: flang/LICENSE.TXT
  summary: Flang is a Fortran compiler targeting LLVM.
  repository: https://github.com/llvm/llvm-project

extra:
  recipe-maintainers:
  - IsabelParedes
  ci:
    platforms:
      emscripten-wasm32: true
      emscripten-wasm64: true