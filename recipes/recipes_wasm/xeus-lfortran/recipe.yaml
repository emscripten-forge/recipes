context:
  name: xeus-lfortran
  source_name: lfortran
  version: 0.66.0

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/lfortran/lfortran/releases/download/v${{ version }}/${{ source_name }}-${{ version }}.tar.gz
  sha256: 961d84f49d07951a279b7835e0f9864489a167a80a8c3c502a797fb6c61669c7
  patches:
  - patches/0001-link-shared-xeus.patch
  - patches/0002-float128-treat-wasm64-like-wasm32.patch
  - patches/0003-wasm64-cell-executor.patch

build:
  number: 0

  files:
    exclude:
    - share/man/man1/**
    # the runtime is linked statically into xlfortran; don't ship the
    # standalone shared+static runtime libs, headers and helper scripts
    - lib/liblfortran_runtime*
    - include/lfortran/**
    - share/lfortran/**
    - '**/__pycache__/**'
    - '**/*.pyc'
  python:
    skip_pyc_compilation:
    - '**/*.py'

requirements:
  build:
  - ${{ compiler('c') }}
  - ${{ compiler('cxx') }}
  - cmake
  - make
  - lfortran=${{ version }}
  host:
  - xeus-lite-static
  - xeus
  - nlohmann_json
  - nlohmann_json-abi
  - llvm-static
  - lld-static

tests:
- package_contents:
    files:
    - bin/xlfortran.js
    - bin/xlfortran.wasm
    - share/jupyter/kernels/fortran/kernel.json
    - share/jupyter/kernels/fortran/logo-svg.svg
- script:
  # test_lfortran loads libxeus.so and test_lfortran.data from its own directory
  - cp ${PREFIX}/bin/test_lfortran.* ${PREFIX}/lib/libxeus.so .
  - node test_lfortran.js
  requirements:
    build:
    - nodejs
- script: generic-testing
  requirements:
    build:
    - generic-testing

about:
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Modern interactive LLVM-based Fortran compiler
  description: |
    LFortran is a modern open-source (BSD licensed) interactive Fortran
    compiler built on top of LLVM. It can execute user's code interactively to
    allow exploratory work (much like Python, MATLAB or Julia) as well as
    compile to binaries with the goal to run user’s code on modern
    architectures such as multi-core CPUs and GPUs.
  homepage: https://lfortran.org

extra:
  recipe-maintainers:
  - certik
  - anutosh491
