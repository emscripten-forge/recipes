context:
  version: 10.8.13

package:
  name: passagemath-planarity
  version: ${{ version }}

source:
- url: https://pypi.org/packages/source/p/passagemath-planarity/passagemath_planarity-${{ version }}.tar.gz
  sha256: 8a30caf7c40d2c5e46628135d0d8d7fd4461c5c1bff7c4a18eb22ddd6f8ab482

build:
  script: ${{ PYTHON }} -m pip install .
  number: 0

requirements:
  build:
  - python
  - crossenv >=1.2
  - cross-python_${{ target_platform }}
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - pip
  - passagemath-setup
  - passagemath-environment
  - cython<3.3
  - cysignals
  - pkgconfig
  - passagemath-abi == ${{ version }}
  host:
  - python-dev
  - planarity-static
  run:
  - python
  - cysignals
  - passagemath-graphs

tests:
- script: pytester
  files:
    recipe:
    - test_passagemath_planarity.py
  requirements:
    build:
    - pytester
    run:
    - pytester-run
    - passagemath-repl

- script: generic-testing
  requirements:
    build:
    - generic-testing

about:
  license: GPL-2.0-or-later
  license_file: README.rst
  summary: 'passagemath: Graph planarity with the edge addition planarity suite'
  description: |
    Distribution of a part of the Sage library.
    It provides a Cython interface to the Edge Addition Planarity Suite.

extra:
  emscripten_tests:
    python:
      pytest_files:
      - test_passagemath_planarity.py
  recipe-maintainers:
  - mkoeppe
