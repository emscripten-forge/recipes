context:
  name: keyring
  version: 25.7.0

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: fe01bd85eb3f8fb3dd0405defdeac9a5b4f6f0439edbb3149577f244a2e8245b

build:
  number: 0
  noarch: python
  # pure-python noarch package: install with the native build python
  # (cross-python cannot be activated for target_platform=noarch)
  script: python -m pip install . --no-deps --no-build-isolation --prefix=${PREFIX} -vv

  files:
    exclude:
    - '**/__pycache__/**'
    - '**/*.pyc'
    - '**/test_*.py'
  python:
    entry_points:
    - keyring = keyring.cli:main
    skip_pyc_compilation:
    - '**/*.py'

requirements:
  build:
  # same python version as the (emscripten) host python, so pip installs
  # into the matching lib/pythonX.Y/site-packages
  - python ${{ python_min }}.*
  - pip
  - setuptools >=56
  - setuptools-scm >=3.4.1
  - toml
  host:
  - python
  run:
  - python
  - importlib-metadata >=4.11.4
  - importlib-resources
  - jaraco.classes
  - jaraco.context
  - jaraco.functools

tests:
- script: pytester
  files:
    recipe:
    - test_import_keyring.py
  requirements:
    build:
    - pytester
    run:
    - pytester-run
- script: target_platform=${{ host_platform }} generic-testing
  requirements:
    build:
    - generic-testing

about:
  homepage: https://github.com/jaraco/keyring
  repository: https://github.com/jaraco/keyring
  documentation: https://pypi.org/project/keyring/
  license: MIT
  license_file: LICENSE
  license_family: MIT
  summary: Store and access your passwords safely

extra:
  recipe-maintainers:
  - copilot
