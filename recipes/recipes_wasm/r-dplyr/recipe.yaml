context:
  name: dplyr
  version: 1.2.1

package:
  name: r-${{ name }}
  version: ${{ version }}

source:
  url:
  - https://cran.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cloud.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cran.r-project.org/src/contrib/Archive/${{ name }}/${{ name }}_${{ version }}.tar.gz
  sha256: 18d66fe2f24cda8b619c177326d39dd015229ab99695fa67d3fa31e4569390e0

build:
  number: 0
  skip: ${{ r_base >= '4.6.0' }}
  script: $R CMD INSTALL $R_ARGS .

requirements:
  build:
  - cross-r-base ==${{ r_base }}
  - ${{ compiler('c') }}
  - r-cli
  - r-generics
  - r-glue
  - r-lifecycle
  - r-magrittr
  - r-pillar
  - r-r6
  - r-rlang
  - r-tibble
  - r-tidyselect
  - r-vctrs
  host:
  - r-base ==${{ r_base }}
  - r-cli
  - r-generics
  - r-glue
  - r-lifecycle
  - r-magrittr
  - r-pillar
  - r-r6
  - r-rlang
  - r-tibble
  - r-tidyselect
  - r-vctrs
  run:
  - r-cli
  - r-generics
  - r-glue
  - r-lifecycle
  - r-magrittr
  - r-pillar
  - r-r6
  - r-rlang
  - r-tibble
  - r-tidyselect
  - r-vctrs

tests:
- package_contents:
    lib:
    - R/library/${{ name }}/libs/${{ name }}.so
- script:
  - run_r_test test_${{ name }}.R
  - generic-testing
  files:
    recipe:
    - test_${{ name }}.R
  requirements:
    build:
    - r-wasm-tester
    - generic-testing

about:
  homepage: https://dplyr.tidyverse.org
  repository: https://github.com/tidyverse/dplyr
  license: MIT
  license_file: LICENSE
  summary: A grammar of data manipulation
  description: |
    A fast, consistent tool for working with data frame like objects, both in
    memory and out of memory.

extra:
  recipe-maintainers:
  - IsabelParedes
