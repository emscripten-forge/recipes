context:
  version: 23.1.3

source:
  url: https://github.com/llvm/llvm-project/archive/refs/tags/llvmorg-${{ version }}.tar.gz
  sha256: 791b560dee8f65fdf7b19ad5db0b4ac627467824d8b687957d8a437b806103f0
  patches:
  - patches/enable_exception_handling.patch
  - patches/fix_initialization_logs.patch
  - patches/support_wasm64.patch
  - patches/standalone-emscripten-lld.patch

build:
  number: 0

outputs:
- staging:
    name: clang-build
  build:
    script: build.sh
  requirements:
    build:
    - ${{ compiler("c") }}
    - ${{ compiler("cxx") }}
    - cmake >=4.3.3,<4.4
    - make
    - llvm-tblgen ==${{ version }}
    host:
    - llvm-static ==${{ version }}[build_number='>=2']
    - lld-static ==${{ version }}

- package:
    name: clangdev-static
    version: ${{ version }}
  inherit: clang-build
  build:
    script: echo "Packaging clangdev-static"
    files:
      include:
      - include/clang/**
      - include/clang-c/**
      - lib/libclang*.a
      - lib/clang/**
      - lib/cmake/clang/ClangConfig*.cmake
      - lib/cmake/clang/AddClang.cmake
      - lib/cmake/clang/ClangStaticTargets*.cmake
      exclude:
      - lib/libclangInterpreter.a
  requirements:
    host:
    - llvm-static ==${{ version }}[build_number='>=2']
    - lld-static ==${{ version }}
    run:
    - ${{ pin_compatible('llvm-static', exact=True) }}
  tests:
  - package_contents:
      files:
        exists:
        - include/clang/AST/ASTContext.h
        - include/clang-c/Index.h
        - lib/libclangBasic.a
        - lib/clang/23/include/stddef.h
        - lib/cmake/clang/ClangConfig.cmake
        - lib/cmake/clang/ClangStaticTargets.cmake
        not_exists:
        - '**/*.so*'
        - lib/libclangInterpreter.a
        - lib/liblld*.a
        - lib/cmake/clang/ClangInterpreterTargets*.cmake
  # libc++ can retain unused pthread symbols from LLVM's deferred std::async.
  - script: generic-testing --allow-pthread
    requirements:
      build:
      - generic-testing
  - script: test_static.sh
    files:
      recipe:
      - test_static.sh
      - tests/
    requirements:
      build:
      - ${{ compiler("c") }}
      - ${{ compiler("cxx") }}
      - cmake
      - make

- package:
    name: clang-interpreter-static
    version: ${{ version }}
  inherit: clang-build
  build:
    script: echo "Packaging clang-interpreter-static"
    files:
      include:
      - lib/libclangInterpreter.a
      - lib/cmake/clang/ClangInterpreterTargets*.cmake
  requirements:
    host:
    - llvm-static ==${{ version }}[build_number='>=2']
    - ${{ pin_subpackage('clangdev-static', exact=True) }}
    - lld-static ==${{ version }}
    run:
    - ${{ pin_compatible('llvm-static', exact=True) }}
    - ${{ pin_compatible('clangdev-static', exact=True) }}
    - ${{ pin_compatible('lld-static', exact=True) }}
  tests:
  - package_contents:
      files:
        exists:
        - lib/libclangInterpreter.a
        - lib/cmake/clang/ClangInterpreterTargets.cmake
        not_exists:
        - '**/*.so*'
        - lib/libclangBasic.a
        - lib/liblld*.a
  # libc++ can retain unused pthread symbols from LLVM's deferred std::async.
  - script: generic-testing --allow-pthread
    requirements:
      build:
      - generic-testing
  - script: test_static.sh
    files:
      recipe:
      - test_static.sh
      - tests/
    requirements:
      build:
      - ${{ compiler("c") }}
      - ${{ compiler("cxx") }}
      - cmake
      - make

- package:
    name: libclang
    version: ${{ version }}
  inherit: clang-build
  build:
    script: echo "Packaging libclang"
    files:
      include:
      - lib/libclang.so
      - lib/cmake/clang/ClangLibClangTargets*.cmake
  requirements:
    host:
    - llvm-static ==${{ version }}[build_number='>=2']
    - lld-static ==${{ version }}
    run_exports:
    - ${{ pin_subpackage('libclang', lower_bound='x.x', upper_bound='x.x') }}
    # Older llvm packages owned these shared libraries; older llvm-static
    # packages shipped ClangConfig.cmake without the separate export sets.
    run_constraints:
    - llvm ==${{ version }}[build_number='>=2']
    - ${{ pin_compatible('llvm-static', exact=True) }}
  tests:
  - package_contents:
      files:
        exists:
        - lib/libclang.so
        - lib/cmake/clang/ClangLibClangTargets.cmake
        not_exists:
        - '**/*.a'
        - lib/libclang-cpp.so
  # libc++ can retain unused pthread symbols from LLVM's deferred std::async.
  - script: generic-testing --allow-pthread
    requirements:
      build:
      - generic-testing

- package:
    name: libclang-cpp
    version: ${{ version }}
  inherit: clang-build
  build:
    script: echo "Packaging libclang-cpp"
    files:
      include:
      - lib/libclang-cpp.so
      - lib/cmake/clang/ClangClangCppTargets*.cmake
  requirements:
    host:
    - llvm-static ==${{ version }}[build_number='>=2']
    - lld-static ==${{ version }}
    run_exports:
    - ${{ pin_subpackage('libclang-cpp', lower_bound='x.x', upper_bound='x.x') }}
    # Older llvm packages owned these shared libraries; older llvm-static
    # packages shipped ClangConfig.cmake without the separate export sets.
    run_constraints:
    - llvm ==${{ version }}[build_number='>=2']
    - ${{ pin_compatible('llvm-static', exact=True) }}
  tests:
  - package_contents:
      files:
        exists:
        - lib/libclang-cpp.so
        - lib/cmake/clang/ClangClangCppTargets.cmake
        not_exists:
        - '**/*.a'
        - lib/libclang.so
  # libc++ can retain unused pthread symbols from LLVM's deferred std::async.
  - script: generic-testing --allow-pthread
    requirements:
      build:
      - generic-testing

about:
  license: Apache-2.0 WITH LLVM-exception
  license_family: Apache
  license_file: LICENSE.TXT
  summary: Clang libraries and interpreter for WebAssembly hosts.
  homepage: https://llvm.org
extra:
  ci:
    platforms:
      emscripten-wasm32: true
      emscripten-wasm64: true
  recipe-maintainers:
  - DerThorsten
  - anutosh491
