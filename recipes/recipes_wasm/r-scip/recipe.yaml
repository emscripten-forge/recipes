context:
  name: scip
  version: 1.10.1-1

package:
  name: r-${{ name }}
  version: ${{ version | replace('-', '_') }}

source:
  url:
  - https://cran.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cloud.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cran.r-project.org/src/contrib/Archive/${{ name }}/${{ name }}_${{ version }}.tar.gz
  sha256: fb18879935fe5ab9db1f87e0fe6410a2fb522fb9589d4617e2f9d79890406e71
  patches:
  - patches/0001-Skip-openmp-compile-test.patch

build:
  number: 0
  skip: ${{ r_base >= '4.6.0' }}
  script: $R CMD INSTALL $R_ARGS .

requirements:
  build:
  - cross-r-base ==${{ r_base }}
  - ${{ compiler('c') }}
  - cmake
  - r-matrix
  host:
  - r-base ==${{ r_base }}
  - r-matrix
  - libflang-rt-static
  run:
  - r-matrix

tests:
- package_contents:
    lib:
    - R/library/${{ name }}/libs/${{ name }}.so
- script:
  - run_r_test test_${{ name }}.R
  - generic-testing
  files:
    recipe:
    - test_${{ name }}.R
  requirements:
    build:
    - r-wasm-tester
    - generic-testing

about:
  homepage: https://cran.r-project.org/package=${{ name }}
  repository: https://bnaras.github.io/scip/
  documentation: https://scipopt.org/
  license: Apache-2.0
  license_file: LICENSE
  license_family: Apache-2.0
  summary: Interface to the SCIP Optimization Suite
  description: |
    Provides an R interface to SCIP (Solving Constraint Integer Programs), a
    framework for mixed-integer programming (MIP), mixed-integer nonlinear
    programming (MINLP), and constraint integer programming (2025, <doi:10.
    48550/arXiv.2511.18580>). Supports linear, quadratic, SOS, indicator, and
    knapsack constraints with continuous, binary, and integer variables.
    Includes a one-shot solver interface and a model-building API for
    incremental problem construction.

extra:
  recipe-maintainers:
  - DerThorsten
  - IsabelParedes
