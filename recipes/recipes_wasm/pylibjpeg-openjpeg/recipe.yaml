context:
  name: pylibjpeg-openjpeg
  version: 2.6.0

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pylibjpeg_openjpeg-${{ version }}.tar.gz
  sha256: ee6630c860263f34088c60b98bb343b1649b78d1299fe9a5c7ef60b88c6626ff

build:
  number: 0
  # builds the bundled openjpeg sources into the extension (see build.sh)

  files:
    exclude:
    - '**/__pycache__/**'
    - '**/*.pyc'
    - '**/tests/**'
  python:
    skip_pyc_compilation:
    - '**/*.py'

requirements:
  build:
  - ${{ compiler('c') }}
  - cross-python_${{ target_platform }}
  - python
  - pip
  - poetry-core >=1.8,<2
  - setuptools
  - cython >=3.0
  - numpy >=2
  - cmake
  host:
  - python-dev
  - numpy
  run:
  - python
  - numpy >=2.0,<3.0

tests:
- script: pytester
  files:
    recipe:
    - test_pylibjpeg_openjpeg.py
  requirements:
    build:
    - pytester
    run:
    - pytester-run
- script: generic-testing
  requirements:
    build:
    - generic-testing

about:
  homepage: https://github.com/pydicom/pylibjpeg-openjpeg
  repository: https://github.com/pydicom/pylibjpeg-openjpeg
  license: MIT
  license_file: LICENSE
  summary: A J2K and JP2 plugin for pylibjpeg (Python wrapper for openjpeg)

extra:
  recipe-maintainers:
  - DerThorsten
