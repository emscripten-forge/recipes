context:
  version: 0.0.20260811
  revision: 069c69c4db19a1f0da4a4b80c7dbcc716d271aa9
  llvm_version: 23.1.2

package:
  name: torch-mlir
  version: ${{ version }}

source:
  url: https://github.com/llvm/torch-mlir/archive/${{ revision }}.tar.gz
  sha256: 851c4449658797bac60bc6817b5ee380b199bf988b36381b352547b2456e0e08
  patches:
  - patches/optional-tests.patch

build:
  number: 0
  script: build.sh
  python:
    skip_pyc_compilation:
    - '**/*.py'

requirements:
  build:
  - ${{ compiler('c') }}
  - ${{ compiler('cxx') }}
  - cmake >=4.3.3,<4.4
  - make
  - llvm-tblgen ==${{ llvm_version }}
  - cross-python_${{ target_platform }}
  - nanobind >=2.9,<3
  host:
  - python-dev
  - llvm-static ==${{ llvm_version }}
  - mlir-static ==${{ llvm_version }}
  run:
  - python
  - numpy
  - packaging

tests:
- package_contents:
    files:
    - lib/python*/site-packages/torch_mlir/__init__.py
    - lib/python*/site-packages/torch_mlir/fx.py
    - lib/python*/site-packages/torch_mlir/_mlir_libs/_torchMlir*.so
    - lib/python*/site-packages/torch_mlir/_mlir_libs/libTorchMLIRAggregateCAPI.so
- script: generic-testing
  requirements:
    build:
    - generic-testing
- script: pytester
  files:
    recipe:
    - test_torch_mlir.py
  requirements:
    build:
    - pytester
    run:
    - pytester-run
    - pytorch

about:
  homepage: https://github.com/llvm/torch-mlir
  repository: https://github.com/llvm/torch-mlir
  license: Apache-2.0 WITH LLVM-exception AND BSD-3-Clause
  license_file: LICENSE
  summary: Torch-MLIR Python bindings and Torch-to-Linalg lowering for WebAssembly

extra:
  ci:
    platforms:
      emscripten-wasm32: true
      emscripten-wasm64: true
  recipe-maintainers:
  - anutosh491
