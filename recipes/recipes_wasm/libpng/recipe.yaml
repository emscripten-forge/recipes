context:
  name: libpng
  version: 1.6.59

package:
  name: ${{ name }}-static
  version: ${{ version }}

source:
  url: https://downloads.sourceforge.net/project/${{ name }}/libpng16/${{ version }}/${{ name }}-${{ version }}.tar.gz
  sha256: 86a3e4b501f7f50e392c4e456ea158893e9a595b1c63eb88c7bb9f6cf8772dad

build:
  number: 1

requirements:
  build:
  - ${{ compiler("c") }}
  - libtool
  host:
  - libzlib-static
  run:
  - ${{pin_compatible("libzlib-static", lower_bound="x.x.x", upper_bound="x.x.x") }}

tests:
- package_contents:
    files:
    - bin/pngfix.wasm
    - bin/png-fix-itxt.wasm
    - lib/libpng16.a
    - include/png.h
- script:
  - libpng-config --version
  - generic-testing
  requirements:
    build:
    - generic-testing

about:
  license: zlib-acknowledgement
  license_file: LICENSE
  summary: PNG reference library
  description: |
    libpng is the official PNG reference library. It supports almost all PNG
    features, is extensible, and has been extensively tested for over 20 years.
  homepage: http://www.libpng.org/pub/png/libpng.html

extra:
  recipe-maintainers:
  - martinRenou
  - IsabelParedes
