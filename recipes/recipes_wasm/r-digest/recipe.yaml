context:
  name: digest
  version: 0.6.39

package:
  name: r-${{ name }}
  version: ${{ version }}

source:
  url:
  - https://cran.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cloud.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cran.r-project.org/src/contrib/Archive/${{ name }}/${{ name }}_${{ version }}.tar.gz
  sha256: 8bf048b49b2d17077138fae758bda56bbd53278d9437f2fdeaedf979c90a13c9

build:
  number: 0
  script: $R CMD INSTALL $R_ARGS .

requirements:
  build:
  - cross-r-base ==${{ r_base }}
  - ${{ compiler('c') }}
  - ${{ compiler('cxx') }}
  host:
  - r-base ==${{ r_base }}

tests:
- package_contents:
    lib:
    - R/library/${{ name }}/libs/${{ name }}.so
- script:
  - run_r_test test_${{ name }}.R
  - generic-testing
  files:
    recipe:
    - test_${{ name }}.R
  requirements:
    build:
    - r-wasm-tester
    - generic-testing

about:
  homepage: https://dirk.eddelbuettel.com/code/digest.html
  repository: https://github.com/eddelbuettel/digest
  license: GPL-2.0-or-later
  license_family: GPL2
  license_file:
  - ${{ PREFIX }}/lib/R/share/licenses/GPL-2
  summary: Compact hash representations of arbitrary R objects.
  description: |
    Implementation of a function 'digest()' for the creation of hash digests of
    arbitrary R objects (using the 'md5', 'sha-1', 'sha-256', 'crc32', 'xxhash',
    'murmurhash', 'spookyhash', 'blake3', 'crc32c', 'xxh3_64', and 'xxh3_128'
    algorithms) permitting easy comparison of R language objects, as well as
    functions such as'hmac()' to create hash-based message authentication code.

extra:
  recipe-maintainers:
  - IsabelParedes
