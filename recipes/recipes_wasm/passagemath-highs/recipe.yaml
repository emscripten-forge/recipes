context:
  version: 10.8.14

package:
  name: passagemath-highs
  version: ${{ version }}

source:
- url: https://pypi.org/packages/source/p/passagemath-highs/passagemath_highs-${{ version }}.tar.gz
  sha256: e71868bc79f649af87eee6b6a82ae4e77885cc0d76d89d304374d86943b87770

build:
  script: ${{ PYTHON }} -m pip install .
  number: 0

requirements:
  build:
  - python
  - crossenv >=1.2
  - cross-python_${{ target_platform }}
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - pip
  - passagemath-setup
  - passagemath-environment
  - cython<3.3
  - cysignals
  - pkgconfig
  - passagemath-abi == ${{ version }}
  host:
  - python-dev
  - highs-static
  - zlib-static
  - gmp-static
  - passagemath-categories
  run:
  - python
  - cysignals
  - passagemath-categories

tests:
- script: pytester
  files:
    recipe:
    - test_passagemath_highs.py
  requirements:
    build:
    - pytester
    run:
    - pytester-run
    - passagemath-repl
- script: generic-testing
  requirements:
    build:
    - generic-testing

about:
  license: GPL-2.0-or-later
  license_file: README.rst
  summary: 'passagemath: Linear and mixed integer linear optimization backend using HiGHS'
  description: |
    Distribution of a part of the Sage library.
    It provides a backend for linear and mixed integer linear optimization backend using HiGHS.

extra:
  emscripten_tests:
    python:
      pytest_files:
      - test_passagemath_highs.py
  recipe-maintainers:
  - mkoeppe
