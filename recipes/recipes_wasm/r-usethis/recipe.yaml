context:
  name: usethis
  version: 3.2.1

package:
  name: r-${{ name }}
  version: ${{ version }}

source:
  url:
  - https://cran.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cloud.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cran.r-project.org/src/contrib/Archive/${{ name }}/${{ name }}_${{ version }}.tar.gz
  sha256: 45bc39d35b0cc2ef7dfe03c488a05c0bac62b498a3d16f745b757e4fba772b77
  patches:
  - patches/0001-Remove-dependency-of-curl.patch
  - patches/0002-Remove-dependency-of-gh.patch

build:
  number: 0
  skip: ${{ r_base >= '4.6.0' }}
  noarch: generic
  script: $R CMD INSTALL $R_ARGS .

requirements:
  build:
  - cross-r-base ==${{ r_base }}
  - r-cli >=3.0.1
  - r-clipr >=0.3.0
  - r-crayon
  - r-desc >=1.4.2
  - r-fs >=1.3.0
  - r-gert >=1.4.1
  - r-glue >=1.3.0
  - r-jsonlite
  - r-lifecycle >=1.0.0
  - r-purrr
  - r-rappdirs
  - r-rlang >=1.1.0
  - r-rprojroot >=2.1.1
  - r-rstudioapi
  - r-whisker
  - r-withr >=2.3.0
  - r-yaml
  host:
  - r-base ==${{ r_base }}
  - r-cli >=3.0.1
  - r-clipr >=0.3.0
  - r-crayon
  - r-desc >=1.4.2
  - r-fs >=1.3.0
  - r-gert >=1.4.1
  - r-glue >=1.3.0
  - r-jsonlite
  - r-lifecycle >=1.0.0
  - r-purrr
  - r-rappdirs
  - r-rlang >=1.1.0
  - r-rprojroot >=2.1.1
  - r-rstudioapi
  - r-whisker
  - r-withr >=2.3.0
  - r-yaml
  run:
  - r-cli >=3.0.1
  - r-clipr >=0.3.0
  - r-crayon
  - r-desc >=1.4.2
  - r-fs >=1.3.0
  - r-gert >=1.4.1
  - r-glue >=1.3.0
  - r-jsonlite
  - r-lifecycle >=1.0.0
  - r-purrr
  - r-rappdirs
  - r-rlang >=1.1.0
  - r-rprojroot >=2.1.1
  - r-rstudioapi
  - r-whisker
  - r-withr >=2.3.0
  - r-yaml

tests:
# Pure R / noarch package, no shared library
- package_contents:
    files:
    - lib/R/library/${{ name }}/DESCRIPTION
- script:
  - run_r_test test_${{ name }}.R
  files:
    recipe:
    - test_${{ name }}.R
  requirements:
    build:
    - r-wasm-tester

about:
  homepage: https://usethis.r-lib.org
  repository: https://github.com/r-lib/usethis
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Automate Package and Project Setup
  description: |
    Automate package and project setup tasks that are otherwise performed
    manually. This includes setting up unit testing, test coverage, continuous
    integration, Git, 'GitHub', licenses, 'Rcpp', 'RStudio' projects, and more.

extra:
  recipe-maintainers:
  - rgaiacs
  - IsabelParedes
