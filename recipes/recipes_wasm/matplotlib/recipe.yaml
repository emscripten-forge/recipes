context:
  name: matplotlib
  version: 3.11.2
source:
- url: https://github.com/matplotlib/matplotlib/archive/v${{ version }}.tar.gz
  sha256: 14b555ae7477ff593d842fba9714b5cbc6ea1db9461d2ea9d6da3ec0dc420f1a
  patches:
  - patches/0001-Font-cache-path.patch
build:
  number: 0
  files:
    exclude:
    - '**/test_*.py'
outputs:
- package:
    name: matplotlib-base
    version: ${{ version }}
  build:
    script: build-base.sh
    files:
      exclude:
      - '**/*.pyi'
      - '**/tests/**'
      - '**/*.ini'
      - '**/__pycache__/**'
      - '**/*.pyx'
      - '**/*.pxd'
      - '**/*.pyc'
      - '**/test_*.py'
    python:
      skip_pyc_compilation:
      - '**/*.py'
  requirements:
    build:
    - python
    - pip
    - cross-python_${{ target_platform }}
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - pkg-config
    - meson-python
    - numpy
    - setuptools_scm_git_archive
    - sed
    host:
    - freetype-static
    - harfbuzz-static
    - libraqm-static
    - numpy
    - python-dev
    - pybind11
    - qhull-static
    - sheenbidi-static
    run:
    - contourpy
    - cycler
    - fonttools
    - kiwisolver
    - numpy
    - packaging
    - pillow
    - pyparsing
    - python-dateutil
    - pytz
  tests:
  - package_contents:
      files:
      - lib/python*/site-packages/matplotlib/_c_internal_utils.cpython-*-wasm*-emscripten.so
      - lib/python*/site-packages/matplotlib/ft2font.cpython-*-wasm*-emscripten.so
      - lib/python*/site-packages/matplotlib/_image.cpython-*-wasm*-emscripten.so
      - lib/python*/site-packages/matplotlib/_path.cpython-*-wasm*-emscripten.so
      - lib/python*/site-packages/matplotlib/_qhull.cpython-*-wasm*-emscripten.so
      - lib/python*/site-packages/matplotlib/_tri.cpython-*-wasm*-emscripten.so
  - script: pytester
    files:
      recipe:
      - test_matplotlib_base.py
    requirements:
      build:
      - pytester
      run:
      - pytester-run
- package:
    name: matplotlib
    version: ${{ version }}
  build:
    noarch: python
  requirements:
    host:
    - python-dev
    run:
    - python
    - ${{ pin_subpackage('matplotlib-base', exact=True) }}
  tests:
  - script: pytester
    files:
      recipe:
      - test_import_matplotlib.py
    requirements:
      build:
      - pytester
      run:
      - pytester-run
about:
  homepage: http://matplotlib.org/
  license: PSF-2.0
  license_family: PSF
  license_file:
  - LICENSE/LICENSE
  - LICENSE/LICENSE_AMSFONTS
  - LICENSE/LICENSE_BAKOMA
  - LICENSE/LICENSE_COLORBREWER
  - LICENSE/LICENSE_COURIERTEN
  - LICENSE/LICENSE_FREETYPE
  - LICENSE/LICENSE_HARFBUZZ
  - LICENSE/LICENSE_JSXTOOLS_RESIZE_OBSERVER
  - LICENSE/LICENSE_LAST_RESORT_FONT
  - LICENSE/LICENSE_LIBRAQM
  - LICENSE/LICENSE_SHEENBIDI
  - LICENSE/LICENSE_SOLARIZED
  - LICENSE/LICENSE_STIX
  - LICENSE/LICENSE_YORICK
  summary: Publication quality figures in Python
