context:
  version: 10.8.13

package:
  name: passagemath-ntl
  version: ${{ version }}

source:
- url: https://pypi.org/packages/source/p/passagemath-ntl/passagemath_ntl-${{ version }}.tar.gz
  sha256: 77738eb1f144b2ea106e43cdb999f3a2d61a6d95fbc67b99d417ff2ce0271094

build:
  script: ${{ PYTHON }} -m pip install .
  number: 0

requirements:
  build:
  - python
  - crossenv >=1.2
  - cross-python_${{ target_platform }}
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - pip
  - passagemath-setup
  - passagemath-environment
  - cython<3.3
  - cysignals
  - pkgconfig
  - numpy
  - passagemath-abi == ${{ version }}
  host:
  - python-dev
  - gmp-static
  - mpfr-static
  - mpc-static
  - ntl-static
  - mpfi-static
  - m4ri-static
  - numpy
  - cysignals
  - memory-allocator
  - passagemath-categories
  - passagemath-modules
  run:
  - python
  - cysignals
  - memory-allocator
  - passagemath-categories
  - passagemath-environment

tests:
- script: pytester
  files:
    recipe:
    - test_passagemath_ntl.py
  requirements:
    build:
    - pytester
    run:
    - pytester-run
    - passagemath-modules
    - passagemath-repl

- script: generic-testing
  requirements:
    build:
    - generic-testing

about:
  license: GPL-2.0-or-later
  license_file: README.rst
  summary: 'passagemath: Computational Number Theory with NTL'
  description: |
    Distribution of a part of the Sage library.
    It provides modules that depend on NTL, the library for doing number theory.

extra:
  emscripten_tests:
    python:
      pytest_files:
      - test_passagemath_ntl.py
  recipe-maintainers:
  - mkoeppe
