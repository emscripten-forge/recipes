context:
  name: DiceDesign
  version: 1.10

package:
  name: r-${{ name | lower }}
  version: ${{ version }}

source:
  url:
  - https://cran.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cloud.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cran.r-project.org/src/contrib/Archive/${{ name }}/${{ name }}_${{ version }}.tar.gz
  sha256: 06543b207b8c1732bda575b9f60ca4ec004f896676e04200af8b222f8933c73d

build:
  number: 0
  script: $R CMD INSTALL $R_ARGS .
  skip: ${{ r_base >= '4.6.0' }}

requirements:
  build:
  - cross-r-base ==${{ r_base }}
  - ${{ compiler('c') }}
  host:
  - r-base ==${{ r_base }}

tests:
- package_contents:
    lib:
    - R/library/${{ name }}/libs/${{ name }}.so
- script:
  - run_r_test test_${{ name }}.R
  - generic-testing
  files:
    recipe:
    - test_${{ name }}.R
  requirements:
    build:
    - r-wasm-tester
    - generic-testing

about:
  homepage: http://dice.emse.fr/
  license: GPL-3.0-only
  license_file:
  - ${{ PREFIX }}/lib/R/share/licenses/GPL-3
  summary: Space-Filling Designs and Uniformity Criteria.

extra:
  recipe-maintainers:
  - DerThorsten
