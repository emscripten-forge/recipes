context:
  name: survival
  version: 3.8-12

package:
  name: r-${{ name }}
  version: ${{ version | replace('-', '_') }}

source:
  url:
  - https://cran.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cloud.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cran.r-project.org/src/contrib/Archive/${{ name }}/${{ name }}_${{ version }}.tar.gz
  sha256: ebb70d9a4e7e8ad7f886a563184d6f079e64c0591a0bce219ae90967f0bdf994

build:
  number: 0
  skip: ${{ r_base >= '4.6.0' }}
  script: $R CMD INSTALL $R_ARGS .

requirements:
  build:
  - cross-r-base ==${{ r_base }}
  - ${{ compiler('c') }}
  - r-matrix
  host:
  - r-base ==${{ r_base }}
  - r-matrix
  run:
  - r-matrix

tests:
- package_contents:
    lib:
    - R/library/${{ name }}/libs/${{ name }}.so
- script:
  - run_r_test test_${{ name }}.R
  - generic-testing
  files:
    recipe:
    - test_${{ name }}.R
  requirements:
    build:
    - r-wasm-tester
    - generic-testing

about:
  homepage: https://cran.r-project.org/package=survival
  repository: https://github.com/therneau/survival
  license: LGPL-2.0-or-later
  license_family: LGPL
  license_file:
  - ${{ PREFIX }}/lib/R/share/licenses/LGPL-2
  summary: Survival Analysis
  description: |
    Contains the core survival analysis routines, including definition of Surv
    objects, Kaplan-Meier and Aalen-Johansen (multi-state) curves, Cox models,
    and parametric accelerated failure time models.

extra:
  recipe-maintainers:
  - IsabelParedes
