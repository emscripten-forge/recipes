context:
  name: hypothesis
  version: 6.170.2

package:
  name: ${{ name }}
  version: ${{ version }}

source:
- url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 2fababffacf64e1a9fb9cb5cb55e4bda6268739cd775971cb3d11fc36c040d9f

build:
  number: 0
  script: ${PYTHON} -m pip install . --no-deps --no-build-isolation

  files:
    exclude:
    - '**/*.pyi'
    - '**/__pycache__/**'
    - '**/*.pyc'
    - '**/test_*.py'
  python:
    skip_pyc_compilation:
    - '**/*.py'

requirements:
  build:
  - cross-python_${{ target_platform }}
  - python
  - pip
  - setuptools-rust
  - rust-nightly
  - maturin >=1.7,<2.0
  host:
  - python-dev
  - pip
  run:
  - python
  - sortedcontainers >=2.1.0,<3.0.0

tests:
- script: pytester
  requirements:
    build:
    - pytester
    run:
    - pytester-run
  files:
    recipe:
    - test_hypothesis.py

- script: generic-testing
  requirements:
    build:
    - generic-testing
about:
  summary: The property-based testing library for Python
  license: MPL-2.0
  license_file: LICENSE.txt
  homepage: https://hypothesis.works
  repository: https://github.com/HypothesisWorks/hypothesis
  documentation: https://hypothesis.readthedocs.io

extra:
  recipe-maintainers:
  - jjerphan
