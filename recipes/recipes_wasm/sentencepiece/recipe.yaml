context:
  name: sentencepiece
  version: 0.2.2

package:
  name: ${{ name }}-static
  version: ${{ version }}

source:
  url: https://github.com/google/sentencepiece/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 92381f713e094a15a1ccff1ac4a5315a4c4b82a99ac1332d6ac53c9dc8e1bcf1

build:
  number: 0
  script: build.sh

requirements:
  build:
  - ${{ compiler('c') }}
  - ${{ compiler('cxx') }}
  - cmake
  - ninja
  # protoc must match the libprotobuf-static runtime in host
  - libprotobuf 7.36.*
  host:
  - libabseil-static
  - libprotobuf-static
  run:
  - ${{ pin_compatible('libabseil-static', lower_bound='x', upper_bound='x') }}
  - ${{ pin_compatible('libprotobuf-static', lower_bound='x.x', upper_bound='x.x') }}

tests:
- package_contents:
    lib:
    - libsentencepiece.a
    include:
    - sentencepiece_processor.h
    - sentencepiece_trainer.h
    files:
    - lib/cmake/sentencepiece/sentencepieceConfig.cmake
    - lib/cmake/sentencepiece/sentencepieceConfigVersion.cmake
- script:
  - build_tests.sh
  requirements:
    build:
    - ${{ compiler('cxx') }}
    - cmake
    - ninja
  files:
    recipe:
    - build_tests.sh
    - tests/
- script: generic-testing
  requirements:
    build:
    - generic-testing

about:
  homepage: https://github.com/google/sentencepiece
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: Unsupervised text tokenizer for Neural Network-based text generation
  description: |
    SentencePiece is an unsupervised text tokenizer and detokenizer mainly for
    Neural Network-based text generation systems where the vocabulary size is
    predetermined prior to the neural model training. It implements subword
    units (BPE and unigram language model) with the extension of direct training
    from raw sentences.
  documentation: https://github.com/google/sentencepiece
  repository: https://github.com/google/sentencepiece

extra:
  recipe-maintainers:
  - Alex-PLACET
