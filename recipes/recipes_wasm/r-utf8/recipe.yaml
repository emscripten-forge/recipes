context:
  name: utf8
  version: 1.2.6

package:
  name: r-${{ name }}
  version: ${{ version }}

source:
  url:
  - https://cran.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cloud.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cran.r-project.org/src/contrib/Archive/${{ name }}/${{ name }}_${{ version }}.tar.gz
  sha256: 4589f8b72291329e70b7f3a8c20f2feb4e7764eebad2e6976bc9a3eee7686ce9

build:
  number: 0
  script: $R CMD INSTALL $R_ARGS .

requirements:
  build:
  - cross-r-base ==${{ r_base }}
  - ${{ compiler('c') }}
  host:
  - r-base ==${{ r_base }}

tests:
- package_contents:
    lib:
    - R/library/${{ name }}/libs/${{ name }}.so
- script:
  - run_r_test test_${{ name }}.R
  - generic-testing
  files:
    recipe:
    - test_${{ name }}.R
  requirements:
    build:
    - r-wasm-tester
    - generic-testing

about:
  homepage: https://ptrckprry.com/r-utf8/
  repository: https://github.com/patperry/r-utf8
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: Unicode Text Processing
  description: |
    Process and print 'UTF-8' encoded international text (Unicode). Input,
    validate, normalize, encode, format, and display.

extra:
  recipe-maintainers:
  - IsabelParedes
