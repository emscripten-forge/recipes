context:
  name: cocoa5
  version: '0.99850'

package:
  name: ${{ name }}
  version: ${{ version }}

source:
- url: http://cocoa.altervista.org/cocoalib/tgz/CoCoALib-${{ version }}.tgz
  sha256: d3e7af0153c6950f83f4e3556540f0177fedf5179f0f7667b7d6d670268fd445
- git: https://github.com/wangyenshu/cocoa5-web-assets.git
  target_directory: web

build:
  number: 0

requirements:
  build:
  - autoconf
  - automake
  - libtool
  - make
  - ${{ compiler('cxx') }}
  - pkg-config
  - autoconf-archive
  host:
  - gmp-static
  - boost-headers
  - boost-filesystem-static
  - cddlib-static
  - libfrobby-static
  - gfanlib-static
  - gsl-static
  - mpfr-static
  - libflint-static
  - normaliz-static
  - ntl-static
  - nauty-static


tests:
- package_contents:
    files:
    - bin/cocoa5/CoCoAInterpreter.js
    - bin/cocoa5/CoCoAInterpreter.wasm
    - bin/cocoa5/CoCoAInterpreter.data
    - bin/cocoa5/CoCoAInterpreter.data.js
- script: generic-testing
  requirements:
    build:
    - generic-testing

about:
  homepage: https://sites.google.com/view/cocoa-cocoalib
  license: GPL-3.0-only
  license_file: COPYRIGHT-full-text
  summary: CoCoA-5 is an interactive system for Computations in Commutative Algebra.

extra:
  recipe-maintainers:
  - wangyenshu
