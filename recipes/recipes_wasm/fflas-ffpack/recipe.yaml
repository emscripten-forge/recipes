context:
  name: fflas-ffpack
  version: 2.5.0

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/linbox-team/fflas-ffpack/releases/download/v${{ version }}/fflas-ffpack-${{ version }}.tar.gz
  sha256: dafb4c0835824d28e4f823748579be6e4c8889c9570c6ce9cce1e186c3ebbb23

build:
  number: 0

requirements:
  build:
  - autoconf
  - automake
  - libtool
  - make
  - pkg-config
  - ${{ compiler('c') }}
  - ${{ compiler('cxx') }}
  host:
  - openblas-dev
  - givaro-static
  - gmp-static
  # header-only (no --enable-precompilation): users compile against these
  run:
  - ${{ pin_compatible('givaro-static', lower_bound='x.x', upper_bound='x.x') }}
  - ${{ pin_compatible('gmp-static', lower_bound='x', upper_bound='x') }}

tests:
- package_contents:
    include:
    - fflas-ffpack/fflas-ffpack.h
    - fflas-ffpack/fflas/fflas.h
    - fflas-ffpack/ffpack/ffpack.h
    - fflas-ffpack/config-blas.h
    files:
    - lib/pkgconfig/fflas-ffpack.pc
- script: generic-testing
  requirements:
    build:
    - generic-testing

about:
  homepage: http://linbox-team.github.io/fflas-ffpack/
  license: LGPL-2.1-only
  license_file: COPYING
  summary: FFLAS-FFPACK is a LGPL-2.1+ source code library for basic linear algebra operations over a finite field.

extra:
  recipe-maintainers:
  - wangyenshu
