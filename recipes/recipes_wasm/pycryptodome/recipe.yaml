context:
  name: pycryptodome
  version: 4.4.0

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/pycryptodome/pycryptodome-${{ version }}.tar.gz
  sha256: eab7620c60c85f3fa251d026ec06e094f036d96187bebb9752e46fbcebabbb55

build:
  number: 0
  script: ${PYTHON} -m pip install . ${PIP_ARGS}

requirements:
  build:
  - python
  - cross-python_${{ target_platform }}
  - ${{ compiler('c') }}
  - pip
  host:
  - python-dev
  - pip
  - setuptools
  run:
  - python

tests:
- script: pytester
  files:
    recipe:
    - test_pycryptodome.py
  requirements:
    build:
    - pytester
    run:
    - pytester-run

- script: generic-testing
  requirements:
    build:
    - generic-testing
about:
  homepage: https://www.pycryptodome.org
  license: BSD-2-Clause AND LicenseRef-Public-Domain
  license_file: LICENSE.rst
  summary: Cryptographic library for Python
  repository: https://github.com/Legrandin/pycryptodome

extra:
  recipe-maintainers:
  - Copilot
