context:
  name: openssl
  version: 4.0.2
  build_number: 0



source:
  url: https://www.openssl.org/source/${{ name }}-${{ version }}.tar.gz
  sha256: 736b467530f916737b7031310ccb21d8218c6229e61e8e160cd1d3458cd543a8


outputs:


  - package:
      name: libopenssl-static
      version: ${{ version }}
    build:
      number: 0
      script: build.sh

      files:
        exclude:
        - '**/*.so'


    tests:
      - package_contents:
          files:
          - lib/libcrypto.a
          - lib/libssl.a
          - include/openssl/crypto.h
          - include/openssl/ssl.h
          - lib/cmake/OpenSSL/OpenSSLConfig.cmake
          
      - script:
        - generic-testing
        requirements:
          build:
          - generic-testing
          
      - script:
        - build_tests.sh
        requirements:
          build:
          - ${{ compiler("cxx") }}
          - cmake
          - make
        files:
          recipe:
          - build_tests.sh
          - tests/
  # NOTE, the shared build is dropped since we run into undefined symbols
        
about:
  homepage: https://www.openssl.org/
  license_file: LICENSE.txt
  license: Apache-2.0
  license_family: Apache
  summary: OpenSSL is an open-source implementation of the SSL and TLS protocols
  repository: https://github.com/openssl/openssl
  documentation: https://docs.openssl.org/master/

extra:
  recipe-maintainers:
  - IsabelParedes
  - DerThorsten
