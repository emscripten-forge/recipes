context:
  version: 23.1.1

source:
  url: https://github.com/llvm/llvm-project/archive/refs/tags/llvmorg-${{ version }}.tar.gz
  sha256: 851b3d701a4fbdd9f69536d4acda578469e810ca7056687d6556443f5fd39557
  patches:
  # Build-system integration for the Emscripten execution engine.
  - patches/0001-emscripten-wasm-execution-engine-cmake.patch
  # New CAPI header
  - patches/0002-add-wasm-execution-engine-header.patch
  # New CAPI implementation (WasmExecutionEngine.cpp)
  - patches/0003-add-wasm-execution-engine-capi.patch
  # New nanobind extension module
  - patches/0004-add-wasm-execution-engine-nanobind.patch
  # New Python wrapper class
  - patches/0005-add-wasm-execution-engine-python.patch
  # Use the target-native index type in C++ MemRef descriptors.
  - patches/0006-target-native-crunner-utils.patch
  # Keep NumPy-backed descriptors ABI-compatible with CRunnerUtils.
  - patches/0007-target-native-numpy-memrefs.patch

build:
  number: 0

outputs:
- staging:
    name: mlir-build
  build:
    script: build.sh
  requirements:
    build:
    - ${{ compiler("c") }}
    - ${{ compiler("cxx") }}
    - cmake
    - make    # [unix]
    # mlir-tblgen + llvm-tblgen + mlir-linalg-ods-yaml-gen must match the
    # LLVM/MLIR source version being cross-compiled.
    - llvm-tblgen ==${{ version }}
    - cross-python_${{ target_platform }}
    - nanobind >=2.9,<3
    host:
    - python-dev
    # LLVM bundles the wasm static libraries, liblldWasm.a, liblldCommon.a,
    # LLVMConfig.cmake and LLDConfig.cmake required by this standalone build.
    - llvm ==${{ version }}

- package:
    name: mlir
    version: ${{ version }}
  inherit: mlir-build
  build:
    script: echo "Packaging the MLIR C++ SDK from the shared build"
    files:
      include:
      - bin/mlir-*
      - include/mlir/**
      - include/mlir-c/**
      - lib/libMLIR*.a
      - lib/libmlir*.a
      - lib/cmake/mlir/**
      - share/mlir/**
  requirements:
    run:
    - llvm ==${{ version }}
  tests:
  - package_contents:
      files:
      - include/mlir/IR/MLIRContext.h
      - include/mlir-c/IR.h
      - lib/libMLIRIR.a
      - lib/cmake/mlir/MLIRConfig.cmake

- package:
    name: mlir-python-bindings
    version: ${{ version }}
  inherit: mlir-build
  build:
    script: echo "Packaging the MLIR Python bindings from the shared build"
    files:
      include:
      - lib/python*/site-packages/mlir/**
      exclude:
      - '**/__pycache__/**'
      - '**/*.pyc'
    python:
      skip_pyc_compilation:
      - '**/*.py'
  requirements:
    run:
    - python
    # Used by mlir.runtime.np_to_memref, mlir.ir NumPy interop and the Linalg
    # Python helpers. The bindings do not compile against the NumPy C API.
    - numpy
  tests:
  - package_contents:
      files:
      - lib/python*/site-packages/mlir/__init__.py
      - lib/python*/site-packages/mlir/dialects/__init__.py
      - lib/python*/site-packages/mlir/_mlir_libs/_mlir*.so
      - lib/python*/site-packages/mlir/_mlir_libs/libMLIRPythonCAPI.so*
      - lib/python*/site-packages/mlir/_mlir_libs/libnanobind-mlir.so
      - lib/python*/site-packages/mlir/wasm_execution_engine.py
  - script: pytester
    files:
      recipe:
      - test_mlir_python_bindings.py
    requirements:
      build:
      - pytester
      run:
      - pytester-run

about:
  homepage: https://mlir.llvm.org
  license: Apache-2.0 WITH LLVM-exception
  license_family: Apache
  license_file: LICENSE.TXT
  summary: >
    MLIR Python bindings compiled for Emscripten, including a WasmExecutionEngine
    that JIT-compiles MLIR (LLVM dialect) modules in-process using lld::wasm::link and
    dlopen inside JupyterLite / xeus-python kernels.
  documentation: https://mlir.llvm.org/docs/Bindings/Python/
  repository: https://github.com/llvm/llvm-project

extra:
  recipe-maintainers:
  - anutosh491
