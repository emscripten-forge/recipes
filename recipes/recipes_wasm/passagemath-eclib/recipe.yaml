context:
  version: 10.8.13

package:
  name: passagemath-eclib
  version: ${{ version }}

source:
- url: https://pypi.org/packages/source/p/passagemath-eclib/passagemath_eclib-${{ version }}.tar.gz
  sha256: ac6dd01203c7f76847881d13289edb1beaa0f5d272c67f6a7d6025efdf409bad

build:
  script: ${{ PYTHON }} -m pip install .
  number: 0

requirements:
  build:
  - python
  - crossenv >=1.2
  - cross-python_${{ target_platform }}
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - pip
  - passagemath-setup
  - passagemath-environment
  - cython<3.3
  - cysignals
  - pkgconfig
  - numpy
  - passagemath-abi == ${{ version }}
  host:
  - python-dev
  - numpy
  - eclib-static
  - fflas-ffpack
  - givaro-static
  - gmp-static
  - libflint-static
  - linbox-static
  - openblas-dev
  - mpfr-static
  - ntl-static
  - pari-static
  - passagemath-categories
  - passagemath-flint
  - passagemath-linbox
  - passagemath-modules
  - passagemath-ntl
  run:
  - python
  - cysignals
  - passagemath-categories
  - passagemath-linbox
  - passagemath-modules
  - passagemath-ntl

tests:
- script: pytester
  files:
    recipe:
    - test_passagemath_eclib.py
  requirements:
    build:
    - pytester
    run:
    - pytester-run
    - passagemath-repl
- script: generic-testing
  requirements:
    build:
    - generic-testing

about:
  license: GPL-2.0-or-later
  license_file: README.rst
  summary: 'passagemath: Elliptic curves over the rationals with eclib/mwrank'
  description: |
    Distribution of a part of the Sage library.
    It provides the Cython interface to John Cremona's programs for enumerating
    and computing with elliptic curves defined over the rational numbers.

extra:
  emscripten_tests:
    python:
      pytest_files:
      - test_passagemath_eclib.py
  recipe-maintainers:
  - mkoeppe
