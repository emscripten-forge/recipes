context:
  version: 23.1.2

package:
  name: llvm-driver
  version: ${{ version }}

source:
  url: https://github.com/llvm/llvm-project/archive/refs/tags/llvmorg-${{ version }}.tar.gz
  sha256: 75788d759e6987a910975b902f554dc77c08b076b945b2cebde54116d8e831ca
  patches:
    - patches/0001-fix-multicall-tool-aliases.patch

build:
  number: 0
  script: build.sh

requirements:
  build:
    - ${{ compiler("c") }}
    - ${{ compiler("cxx") }}
    - cmake
    - make
    - llvm-tblgen ==${{ version }}

tests:
  - package_contents:
      files:
        - bin/llvm.js
        - bin/llvm.wasm
  - script: generic-testing
    requirements:
      build:
        - generic-testing

about:
  license: Apache-2.0 WITH LLVM-exception
  license_family: Apache
  license_file: LICENSE.TXT
  summary: LLVM's multicall tool driver for WebAssembly hosts
  homepage: https://llvm.org

extra:
  recipe-maintainers:
    - anutosh491
