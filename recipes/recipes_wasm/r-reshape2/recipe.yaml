context:
  name: reshape2
  version: 1.4.5

package:
  name: r-${{ name }}
  version: ${{ version }}

source:
  url:
  - https://cran.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cloud.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cran.r-project.org/src/contrib/Archive/${{ name }}/${{ name }}_${{ version }}.tar.gz
  sha256: 0ead5acd0153e5073b3c24e8e782982a4eab3aaa768ba17700d796fb13b68cef

build:
  number: 0
  skip: ${{ r_base >= '4.6.0' }}
  script: $R CMD INSTALL $R_ARGS .

requirements:
  build:
  - cross-r-base ==${{ r_base }}
  - ${{ compiler('c') }}
  - r-rcpp
  - r-stringr
  - r-plyr
  host:
  - r-base ==${{ r_base }}
  - r-rcpp
  - r-stringr
  - r-plyr
  run:
  - r-rcpp
  - r-stringr
  - r-plyr

tests:
- package_contents:
    lib:
    - R/library/${{ name }}/libs/${{ name }}.so
- script:
  - run_r_test test_${{ name }}.R
  - generic-testing
  files:
    recipe:
    - test_${{ name }}.R
  requirements:
    build:
    - r-wasm-tester
    - generic-testing

about:
  homepage: https://cran.r-project.org/package=reshape2
  repository: https://github.com/hadley/reshape
  license: MIT
  license_file: LICENSE
  summary: |
    Flexibly restructure and aggregate data using just two functions, melt and
    'dcast' (or 'acast').

extra:
  recipe-maintainers:
  - DerThorsten
  - IsabelParedes
