context:
  name: SnowballC
  version: 0.7.1

package:
  name: r-${{ name | lower }}
  version: ${{ version }}

source:
  url:
  - https://cran.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cloud.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cran.r-project.org/src/contrib/Archive/${{ name }}/${{ name }}_${{ version }}.tar.gz
  sha256: 753cf13f3206751662c03b1cf39bce9e680024f6d9f8503b836a83797181c034

build:
  number: 0
  script: $R CMD INSTALL $R_ARGS .

requirements:
  build:
  - ${{ compiler('c') }}
  - cross-r-base ==${{ r_base }}
  host:
  - r-base ==${{ r_base }}

tests:
- package_contents:
    lib:
    - R/library/${{ name }}/libs/${{ name }}.so
- script:
  - run_r_test test_${{ name }}.R
  - generic-testing
  files:
    recipe:
    - test_${{ name }}.R
  requirements:
    build:
    - r-wasm-tester
    - generic-testing

about:
  homepage: https://cran.r-project.org/package=${{ name }}
  repository: https://github.com/nalimilan/R.TeMiS
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Snowball Stemmers Based on the C 'libstemmer' UTF-8 Library
  description: |
    An R interface to the C 'libstemmer' library that implements Porter's word
    stemming algorithm for collapsing words to a common root to aid comparison
    of vocabulary. Currently supported languages are Arabic, Basque, Catalan,
    Danish, Dutch, English, Finnish, French, German, Greek, Hindi, Hungarian,
    Indonesian, Irish, Italian, Lithuanian, Nepali, Norwegian, Portuguese,
    Romanian, Russian, Spanish, Swedish, Tamil and Turkish.

extra:
  recipe-maintainers:
  - rgaiacs
  - IsabelParedes
