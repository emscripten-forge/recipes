context:
  name: box2d
  version: 3.2.0

recipe:
  name: box2d-split

source:
  url: https://github.com/erincatto/box2d/archive/refs/tags/v${{ version }}.tar.gz
  sha256: ffec747b27a2267016f8d0240d658c82d187fb2271fa0f69fcbe53fbc067180d



build:
  number: 0

outputs:
- package:
    name: ${{ name|lower }}-static
    version: ${{ version }}

  build:
    script: build_static.sh
  requirements:
    build:
    - ${{ compiler('cxx') }}
    - cmake
    - ninja

  tests:
  - package_contents:
      include:
      - box2d/box2d.h
      lib:
      - libbox2d.a
      files:
      - lib/cmake/box2d/box2dConfig.cmake
- package:
    name: ${{ name|lower }}
    version: ${{ version }}

  build:
    script: build_shared.sh
  requirements:
    build:
    - ${{ compiler('cxx') }}
    - cmake
    - ninja

  tests:
  - package_contents:
      include:
      - box2d/box2d.h
      lib:
      - libbox2d.so
      files:
      - lib/cmake/box2d/box2dConfig.cmake
about:
  homepage: https://box2d.org/
  license: MIT
  license_file: LICENSE


extra:
  recipe-maintainers:
  - DerThorsten
