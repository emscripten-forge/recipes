context:
  version: '2.20'
  name: lcms2

package:
  name: ${{ name }}-static
  version: ${{ version }}

source:
  url: https://github.com/mm2/Little-CMS/releases/download/lcms${{ version }}/lcms2-${{ version }}.tar.gz
  sha256: 18ff5504fa9cc8a2b1f3591180d90ead16c8a2ea78e530523b46eab70e1ca6b9

build:
  number: 1

  files:
    exclude:
    - share/man/man1/**
requirements:
  build:
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - make
  host:
  - libjpeg-turbo-static
  - libtiff-static
  run:
  - ${{pin_compatible('libjpeg-turbo-static', lower_bound='x.x', upper_bound='x.x')}}
  - ${{pin_compatible('libtiff-static', lower_bound='x.x', upper_bound='x.x')}}
tests:
- package_contents:
    lib:
    - liblcms2.a
    include:
    - lcms2.h
    - lcms2_plugin.h
- script: generic-testing
  requirements:
    build:
    - generic-testing

about:
  homepage: http://www.littlecms.com/
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Open Source Color Management Engine

extra:
  recipe-maintainers:
  - DerThorsten
