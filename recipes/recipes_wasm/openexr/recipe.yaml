context:
  version: 3.4.12
  name: openexr

package:
  name: ${{ name }}-static
  version: ${{ version }}

source:
  url: https://github.com/AcademySoftwareFoundation/openexr/archive/v${{ version }}.tar.gz
  sha256: a455779c389f65c64220d45b63ead2900081e5f6337cdf93431cb1032c3e2686
  patches:
  - patches/disable-openjph.patch
  - patches/disable-sse-wasm.patch
  - patches/disable-htj2k.patch

build:
  number: 0

requirements:
  build:
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - cmake
  - make
  - pkg-config
  host:
  - libdeflate-static
  - imath
  - zlib-static
  run:
  - ${{ pin_compatible('libdeflate-static', lower_bound='x.x', upper_bound='x.x') }}
  - ${{ pin_compatible('imath', lower_bound='x.x', upper_bound='x.x') }}
  - ${{ pin_compatible('zlib-static', lower_bound='x.x', upper_bound='x.x') }}

tests:
- package_contents:
    files:
    - lib/libIex.a
    - include/OpenEXR/openexr.h
- script: generic-testing
  requirements:
    build:
    - generic-testing

about:
  homepage: https://www.openexr.com/
  repository: https://github.com/AcademySoftwareFoundation/openexr
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.md
  summary: |
    OpenEXR is a high dynamic-range (HDR) image file format developed by
    Industrial Light & Magic for use in computer imaging applications.
  description: |
    OpenEXR is a high dynamic-range (HDR) image file format developed by
    Industrial Light & Magic (ILM) for use in computer imaging applications. It
    supports stereoscopic and deep images. Weta Digital, Walt Disney Animation
    Studios, Sony Pictures Imageworks, Pixar Animation Studios, DreamWorks, and
    other studios, companies, and individuals have made contributions to the
    code base. The file format has seen wide adoption in a number of industries.

extra:
  recipe-maintainers:
  - DerThorsten
