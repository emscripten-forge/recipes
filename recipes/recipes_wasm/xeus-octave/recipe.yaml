context:
  version: 0.7.0
  name: xeus-octave

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/jupyter-xeus/${{ name }}/archive/refs/tags/v${{ version }}.tar.gz
  sha256: e741fde4ee7abe94f74dd2a210041d40cdb89b4bd4c94b36650b47230034fc8d
  patches:
  - patches/0001-Update-libraries.patch
  - patches/0002-Remove-libz-from-kernel-spec.patch

build:
  number: 0

requirements:
  build:
  - ${{ compiler("cxx") }}
  - cmake
  - make
  - pkg-config
  host:
  - xeus >=6,<7
  - xeus-lite-static >=5,<6
  - nlohmann_json
  - nlohmann_json-abi
  - octave
  - libpng-static
  - libzlib-static
  - libflang-rt-static
  - pcre2-static >=10.49
  - libblas-static
  - liblapack-static
  - freetype-static
  run:
  - plotly

tests:
- package_contents:
    files:
    - bin/xoctave.js
    - bin/xoctave.wasm

about:
  homepage: https://github.com/jupyter-xeus/xeus-octave
  documentation: https://xeus-octave.readthedocs.io
  license: GPL-3.0-only
  license_family: GPL
  license_file: LICENSE
  summary: Jupyter kernel for GNU Octave

extra:
  recipe-maintainers:
  - IsabelParedes
