context:
  version: 3.2.1
  name: libjpeg-turbo

package:
  name: ${{ name }}-static
  version: ${{ version }}

source:
  url: https://github.com/libjpeg-turbo/libjpeg-turbo/archive/${{ version }}.tar.gz
  sha256: 428c5fb2750f819f12522c939242caefb746d52b1a8c071f93429154b0a5e830

build:
  number: 0

  files:
    exclude:
    - share/man/man1/**
requirements:
  build:
  - ${{ compiler("cxx") }}
  - cmake
  - make
  - yasm

tests:
- package_contents:
    files:
    - include/jpeglib.h
    - include/turbojpeg.h
    - lib/libjpeg.a
    - lib/libturbojpeg.a

- script: generic-testing
  requirements:
    build:
    - generic-testing
about:
  homepage: https://www.libjpeg-turbo.org/
  repository: https://github.com/libjpeg-turbo/libjpeg-turbo
  license: IJG AND BSD-3-Clause AND Zlib
  license_file: LICENSE.md
  summary: IJG JPEG compliant runtime library with SIMD and other optimizations

extra:
  recipe-maintainers:
  - DerThorsten

