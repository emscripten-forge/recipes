context:
  version: 4.3.0
  name: pyjs
  build_number: 0

source:
  url: https://github.com/emscripten-forge/pyjs/archive/refs/tags/${{ version }}.tar.gz
  sha256: 3e441d66432450c726e1a89cea39c93aa58b363b738ddef55110085557223b99
build:
  number: ${{ build_number }}

outputs:
- staging:
    name: pyjs-build

  build:
    script: ./build_all.sh
  requirements:
    build:
    - ${{ compiler("c") }}
    - ${{ compiler("cxx") }}
    - cmake
    - make
    host:
    - libpython-static
    - pybind11


- package:  
    name: libpyjs-static
    version: ${{ version }}
  inherit: pyjs-build

  build:
    script: echo "nothing to do here, we take all content from the pyjs-build package"
    files:
      exclude:
      - "**/*.py"
  requirements:
    build:
    - ${{ compiler("c") }}
    - ${{ compiler("cxx") }}
    - cmake
    - make
    host:
    - libpython-static
    - pybind11
    run:
    - ${{ pin_compatible("libpython-static", lower_bound="x.x.x", upper_bound="x.x.x") }}

  tests:
    - package_contents:
        strict: false
        files:
          - lib/libpyjs.a
          - include/pyjs/export_js_module.hpp
          - lib_js/pyjs/pyjs_runtime_browser.js 
          - lib_js/pyjs/pyjs_runtime_browser.wasm
          - lib/cmake/pyjs/pyjsConfig.cmake 



- package:  
    name: pyjs # the run-time package
    version: ${{ version }}
  inherit: pyjs-build

  build:
    script: echo "nothing to do here, we take all content from the pyjs-build package"
    files:
      include:
      - "**/*.py"
      

  requirements:
    run:
    - python
  
  tests:
    - package_contents:
        strict: false
        files:
          - lib/python*/site-packages/pyjs/core.py 
- package:  
    name: pyjs-dev
    version: ${{ version }}
  
  requirements:
    run:
    - ${{pin_subpackage("pyjs", exact=True) }}
    - ${{pin_subpackage("libpyjs-static", exact=True) }}

  tests:
  - script: |
      echo "install playwright"
      playwright install chromium
      # run_tests.py (from the recipe) runs tests/ (from the source)
      echo "test in browser (main thread)"
      pyjs_code_runner run script \
          browser-main \
          --conda-env     $PREFIX \
          --mount         $(pwd):/pyjs_tests \
          --script        run_tests.py \
          --work-dir      /pyjs_tests \
          --headless \
          --async-main \
          --no-cache
      # worker
      echo "test in browser (worker thread)"
      pyjs_code_runner run script \
          browser-worker \
          --conda-env     $PREFIX \
          --mount         $(pwd):/pyjs_tests \
          --script        run_tests.py \
          --work-dir      /pyjs_tests \
          --headless \
          --async-main \
          --no-cache

    requirements:
      build:
        - nodejs
        - playwright
        - playwright-python
        - pyjs_code_runner >= 3.2.0
      run:
        - python
        - pytest
        

    files:
      recipe:
      - run_tests.py
      source:
      - tests/**/*

about:
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: pyjs

  homepage: https://github.com/emscripten-forge/pyjs
extra:
  recipe-maintainers:
  - DerThorsten
