context:
  name: cachem
  version: 1.1.0

package:
  name: r-${{ name }}
  version: ${{ version }}

source:
  url:
  - https://cran.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cloud.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cran.r-project.org/src/contrib/Archive/${{ name }}/${{ name }}_${{ version }}.tar.gz
  sha256: 550839fc2ae5d865db475ba2c1714144f07fa0c052c72135b0e4a70287492e21

build:
  number: 0
  skip: ${{ r_base >= '4.6.0' }}
  script: $R CMD INSTALL $R_ARGS .

requirements:
  build:
  - cross-r-base ==${{ r_base }}
  - ${{ compiler('c') }}
  - r-rlang
  - r-fastmap
  host:
  - r-base ==${{ r_base }}
  - r-rlang
  - r-fastmap
  run:
  - r-rlang
  - r-fastmap

tests:
- package_contents:
    lib:
    - R/library/${{ name }}/libs/${{ name }}.so
- script:
  - run_r_test test_${{ name }}.R
  - generic-testing
  files:
    recipe:
    - test_${{ name }}.R
  requirements:
    build:
    - r-wasm-tester
    - generic-testing

about:
  homepage: https://cachem.r-lib.org/
  repository: https://github.com/r-lib/cachem
  license: MIT
  summary: Key-value caches for R
  description: |
    Key-value stores with automatic pruning. Caches can limit either their total
    size or the age of the oldest object (or both), automatically pruning
    objects to maintain the constraints.
  license_family: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
  - IsabelParedes
