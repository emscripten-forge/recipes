context:
  version: 1.0.1

source:
  - url: https://release.files.ghostty.org/libghostty-vt/${{ version }}/libghostty-vt-${{ version }}.tar.gz
    sha256: 333dfce97641ef9b536bb9e08907ad86abaaada50e8f7417b70d9284adef37aa
    patches:
      - patches/emscripten-side-module.patch
  - url: https://release.files.ghostty.org/libghostty-vt/${{ version }}/libghostty-vt-${{ version }}-deps.tar.gz
    sha256: 91a4e10960a52bf5bf4b15aa2a2cddaff8a89d6cd903d3055bda4fd17de3356d
    target_directory: vt-deps

build:
  number: 0

outputs:
- staging:
    name: libghostty-vt-build
  requirements:
    build:
      - ${{ compiler('c') }}
      - zig 0.17.0.*
  build:
    script: build.sh
    env:
      PKG_VERSION: ${{ version }}

#==============================================================================#

# Headers and pkg-config files
- package:
    name: libghostty-vt-dev
    version: ${{ version }}
  inherit: libghostty-vt-build
  build:
    files:
      include:
      - include/
      - lib/pkgconfig/
  tests:
  - package_contents:
      files:
      - include/ghostty/vt.h
      - include/ghostty/vt/osc.h
      - include/ghostty/vt/terminal.h
      - include/ghostty/vt/formatter.h
      - lib/pkgconfig/libghostty-vt.pc
      - lib/pkgconfig/libghostty-vt-static.pc

#==============================================================================#

- package:
    name: libghostty-vt-static
    version: ${{ version }}
  inherit: libghostty-vt-build
  build:
    files:
      include:
      - lib/*.a
  requirements:
    run:
    - ${{ pin_subpackage('libghostty-vt-dev', exact=True) }}
  tests:
  - package_contents:
      files:
      - lib/libghostty-vt.a
  - script:
    - bash test-lib.sh static
    - generic-testing
    requirements:
      build:
        - ${{ compiler('c') }}
        - nodejs
        - generic-testing
    files:
      recipe:
        - test-lib.sh
        - test-lib.c

#==============================================================================#

- package:
    name: libghostty-vt
    version: ${{ version }}
  inherit: libghostty-vt-build
  build:
    files:
      include:
      - lib/*.so
  requirements:
    run_constraints:
    - ${{ pin_subpackage('libghostty-vt-dev', exact=True) }}
    run_exports:
    - ${{ pin_subpackage('libghostty-vt', upper_bound='x') }}
  tests:
  - package_contents:
      files:
      - lib/libghostty-vt.so
  - script:
    - bash test-lib.sh dynamic
    - generic-testing
    requirements:
      build:
        - ${{ compiler('c') }}
        - nodejs
        - generic-testing
      run:
        - ${{ pin_subpackage('libghostty-vt-dev', exact=True) }}
    files:
      recipe:
        - test-lib.sh
        - test-lib.c

#==============================================================================#

about:
  homepage: https://ghostty.org
  summary: Ghostty VT parsing library with a C API
  description: Standalone terminal sequence parsing library.
  license: MIT
  license_file: LICENSE
  repository: https://github.com/ghostty-org/ghostty
  documentation: https://ghostty.org/docs

extra:
  recipe-maintainers:
    - davidbrochart
