context:
  name: statistics
  version: 2.1.3

package:
  name: octave-${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/gnu-octave/statistics/releases/download/release-${{ version }}/statistics-${{ version }}.tar.gz
  sha256: 29ebf1ade40d5066d05dc403a7df14bc8471904a854fd1c68cd1b2ec0a85158e

build:
  number: 0

requirements:
  build:
  - ${{ compiler('cxx') }}
  - make
  host:
  - octave
  run:
  - octave-datatypes >=1.5.0

tests:
- package_contents:
    files:
    - share/octave/packages/${{ name }}-${{ version }}/Distribution_Functions/normcdf.m
    - share/octave/packages/${{ name }}-${{ version }}/editDistance.oct
- script:
  - node "$PREFIX/bin/octave-cli" "./statistics.m"
  files:
    recipe:
    - statistics.m
  requirements:
    build:
    - nodejs
    - generic-testing

about:
  homepage: https://github.com/gnu-octave/statistics
  license: GPL-3.0-or-later
  license_file: COPYING
  summary: The Statistics package for GNU Octave

extra:
  recipe-maintainers:
  - arjxn-py
