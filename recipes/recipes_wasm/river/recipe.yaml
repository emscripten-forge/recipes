context:
  name: river
  version: 0.26.1

package:
  name: ${{ name }}
  version: ${{ version }}

source:
- url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 2326f87f396801cfd8672ac02d9f9731c10e936696e7a0a1f89a378b994fba3f

build:
  number: 0

  files:
    exclude:
    - '**/*.pyi'
    - '**/*.pxd'
    - '**/*.pyx'
    - '**/__pycache__/**'
    - '**/*.pyc'
    - '**/test_*.py'
  python:
    skip_pyc_compilation:
    - '**/*.py'

requirements:
  build:
  - ${{ compiler('c') }}
  - cross-python_${{ target_platform }}
  - python
  - pip
  - maturin >=1.13,<2
  - rust-nightly
  host:
  - python-dev
  run:
  - python
  - numpy >=2.2.5,<3
  - scipy >=1.14.1,<2
  - narwhals >=2.0.0

tests:
- script: pytester
  files:
    recipe:
    - test_import_river.py
  requirements:
    build:
    - pytester
    run:
    - pytester-run
- script: generic-testing
  requirements:
    build:
    - generic-testing

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Online machine learning in Python
  homepage: https://github.com/online-ml/river
  documentation: https://riverml.xyz/
  repository: https://github.com/online-ml/river

extra:
  recipe-maintainers:
  - IsabelParedes
