context:
  name: cobs
  version: 1.2.2

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/c/cobs/cobs-${{ version }}.tar.gz
  sha256: dbdd5e32111d72786f83d0c269215dcd6ac629b1ac1962c6878221f3b2ca98da

build:
  number: 0
  script: ${PYTHON} -m pip install . ${PIP_ARGS}

requirements:
  build:
  - python
  - cross-python_${{ target_platform }}
  - ${{ compiler('c') }}
  - pip
  host:
  - python-dev
  - pip
  - setuptools
  run:
  - python

tests:
- script: pytester
  files:
    recipe:
    - test_cobs.py
  requirements:
    build:
    - pytester
    run:
    - pytester-run

- script: generic-testing
  requirements:
    build:
    - generic-testing
about:
  homepage: https://github.com/cmcqueen/cobs-python
  license: MIT
  license_file: LICENSE.txt
  summary: Consistent Overhead Byte Stuffing (COBS)
  repository: https://github.com/cmcqueen/cobs-python

extra:
  recipe-maintainers:
  - Copilot
