context:
  version: 3.47.2
  # the amalgamation's file name: 3.47.2 -> 3470200, and its release year
  version_code: 3470200
  year: 2024

package:
  name: libsqlite-static
  version: ${{ version }}


# the amalgamation (sqlite3.c + headers): builds without tcl / code generators
source:
  url: https://www.sqlite.org/${{ year }}/sqlite-autoconf-${{ version_code }}.tar.gz
  sha256: f1b2ee412c28d7472bc95ba996368d6f0cdcf00362affdadb27ed286c179540b


build:
  number: 5
requirements:
  build:
  - ${{ compiler('c') }}
  host:
  -  zlib-static
  run:
  - ${{pin_compatible('zlib-static', lower_bound='x.x', upper_bound='x.x')}}
tests:
  - script:
    - test -f ${PREFIX}/lib/libsqlite3.a
    - generic-testing
    requirements:
      build:
      - generic-testing

about:
  license: Unlicense
  license_file: LICENSE.md
  summary: Implements a self-contained, zero-configuration, SQL database engine
  description: |
    SQLite is a self-contained, high-reliability, embedded, full-featured,
    public-domain, SQL database engine.It is the most used database engine
    in the world.
  documentation: https://github.com/mackyle/sqlite/tree/master/doc
  homepage: http://www.sqlite.org/
extra:
  recipe-maintainers:
  - DerThorsten

