context:
  name: xvega
  version: 0.1.3

package:
  name: ${{ name }}-static
  version: ${{ version }}

source:
  url: https://github.com/jupyter-xeus/${{ name }}/archive/${{ version }}.tar.gz
  sha256: 5b8a42723176b1872dc3e2777c6f0b2be95fff8ad54ec1356b26b5af5b645965

build:
  number: 0

requirements:
  build:
  - ${{ compiler("cxx") }}
  - cmake
  - ninja
  host:
  - nlohmann_json
  # xvega 0.1.x needs the old xproperty API (< 0.13)
  - xproperty 0.12.*
  run:
  - xproperty 0.12.*

tests:
- package_contents:
    lib:
    - libxvega.a
    include:
    - xvega/xvega.hpp
- script: generic-testing
  requirements:
    build:
    - generic-testing

about:
  license: BSD-3-Clause
  license_family: BSD-3
  license_file: LICENSE
  summary: xvega
  homepage: https://github.com/jupyter-xeus/xvega

extra:
  recipe-maintainers:
  - DerThorsten
