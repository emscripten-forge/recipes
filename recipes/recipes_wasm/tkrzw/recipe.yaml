context:
  version: 1.0.34

package:
  name: tkrzw-static
  version: ${{ version }}

source:
  url: https://dbmx.net/tkrzw/pkg/tkrzw-${{ version }}.tar.gz
  sha256: afe894c1532feda086b7a94672f412f801758cbe81431fd3c88514fa27ebe369

  patches:
  - emscripten.patch
  - emscripten-2.patch

build:
  number: 0

requirements:
  build:
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - make

tests:
- package_contents:
    files:
    - include/tkrzw_dbm.h
    - include/tkrzw_dbm_hash.h
    - include/tkrzw_file.h
    - include/tkrzw_langc.h
    - lib/libtkrzw.a
- script:
  - em++ -std=c++17 test_tkrzw.cpp -o test_tkrzw.js -I${PREFIX}/include -L${PREFIX}/lib -ltkrzw -sALLOW_MEMORY_GROWTH -sNODERAWFS
  - node test_tkrzw.js
  requirements:
    build:
    - ${{ compiler('cxx') }}
    - nodejs
  files:
    recipe:
    - test_tkrzw.cpp
# Only AsyncDBM (through TaskQueue) starts std::threads; the regular DBMs
# (exercised by the test above) don't. Nothing is compiled with -pthread.
- script: generic-testing --allow-pthread
  requirements:
    build:
    - generic-testing

about:
  homepage: https://dbmx.net/tkrzw/
  license: Apache-2.0
  license_file: COPYING
  summary: Tkrzw is a C++ library implementing DBM with various algorithms.

extra:
  recipe-maintainers:
  - wangyenshu
