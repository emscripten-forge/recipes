context:
  version: '20260526.0'
  name: libabseil

package:
  name: ${{ name }}-static
  version: ${{ version }}

source:
  url: https://github.com/abseil/abseil-cpp/archive/refs/tags/${{ version }}.tar.gz
  sha256: 6e1aee535473414164bf83e4ebc40240dec71a4701f8a642d906e95bea1aea0c

build:
  number: 0

requirements:
  build:
  - ${{ compiler('c') }}
  - ${{ compiler('cxx') }}
  - cmake
  - ninja

tests:
- package_contents:
    lib:
    - libabsl_base.a
    - libabsl_civil_time.a
    - libabsl_cord.a
    - libabsl_strings.a
    - libabsl_status.a
    include:
    - absl/base/config.h
    - absl/strings/string_view.h
    - absl/status/status.h
    - absl/synchronization/mutex.h
- script:
  - bash build_tests.sh
  requirements:
    build:
    - ${{ compiler('cxx') }}
    - cmake
    - ninja
  files:
    recipe:
    - build_tests.sh
    - tests/
# Abseil creates no threads. It calls the pthread mutex/condvar/TLS-key API
# (absl::Mutex waiter, thread identity), which emscripten's non-threaded libc
# provides as single-threaded stubs; nothing is compiled with -pthread.
- script: generic-testing --allow-pthread
  requirements:
    build:
    - generic-testing

about:
  homepage: https://github.com/abseil/abseil-cpp
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: Abseil Common Libraries (C++)
  description: |
    Abseil is an open-source collection of C++ library code designed to augment
    the C++ standard library. The Abseil library code is collected from Google's
    own C++ code base and has been extensively tested and used in production.
  documentation: https://abseil.io
  repository: https://github.com/abseil/abseil-cpp

extra:
  recipe-maintainers:
  - KGB99
  - Alex-PLACET
