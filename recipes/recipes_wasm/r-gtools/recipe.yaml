context:
  name: gtools
  version: 3.9.5

package:
  name: r-${{ name }}
  version: ${{ version }}

source:
  url:
  - https://cran.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cloud.r-project.org/src/contrib/${{ name }}_${{ version }}.tar.gz
  - https://cran.r-project.org/src/contrib/Archive/${{ name }}/${{ name }}_${{ version }}.tar.gz
  sha256: dee9b6c1152db1a5dc427d074b32bbbb738708683f17a95e0e95e4d79fdf174b

build:
  number: 0
  script: $R CMD INSTALL $R_ARGS .

requirements:
  build:
  - cross-r-base ==${{ r_base }}
  - ${{ compiler('c') }}
  host:
  - r-base ==${{ r_base }}

tests:
- package_contents:
    lib:
    - R/library/${{ name }}/libs/${{ name }}.so
- script:
  - run_r_test test_${{ name }}.R
  - generic-testing
  files:
    recipe:
    - test_${{ name }}.R
  requirements:
    build:
    - r-wasm-tester
    - generic-testing

about:
  homepage: https://cran.r-project.org/package=gtools
  repository: https://github.com/cran/gtools
  license: GPL-2.0-only
  license_family: GPL2
  license_file:
  - ${{ PREFIX }}/lib/R/share/licenses/GPL-2

extra:
  recipe-maintainers:
  - DerThorsten
