context:
  version: 23.1.0

package:
  name: llvm-tblgen
  version: ${{ version }}

source:
  url: https://github.com/llvm/llvm-project/archive/refs/tags/llvmorg-${{ version
    }}.tar.gz
  sha256: d8657b2a7291e518407bf13c4b41c85ef2cded2d4354097a2f451644dfc817b0

build:
  number: 0

requirements:
  build:
  - cmake
  - make    # [unix]
  
tests:
- package_contents:
    files:
    - bin/llvm-tblgen
    - bin/clang-tblgen
    - bin/mlir-tblgen
    - bin/mlir-linalg-ods-yaml-gen

about:
  license: Apache-2.0 WITH LLVM-exception
  license_family: Apache
  license_file: LICENSE.TXT
  summary: The LLVM Project is a collection of modular and reusable compiler and toolchain
    technologies.
  homepage: https://llvm.org

extra:
  recipe-maintainers:
  - DerThorsten
  - anutosh491
