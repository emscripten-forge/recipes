name: Version Ticker Bot

on:
  workflow_dispatch:
  schedule:
  - cron: '0 0 * * *'


jobs:

  update_versions:
    strategy:
      matrix:
        branch: [main]

    if: (github.event_name == 'schedule' && github.repository == 'emscripten-forge/recipes') || (github.event_name != 'schedule')
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Install micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: ci_env.yml

      - name: Merge/label already-open bot PRs
        shell: bash -l -eo pipefail {0}
        run:  python -m emci bot merge-open-prs ${{ matrix.branch }}
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_ACCESS_TOKEN }}

      - name: Open new bump PRs
        shell: bash -l -eo pipefail {0}
        run:  python -m emci bot bump-recipes-versions ${{ matrix.branch }} --mode submit
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_ACCESS_TOKEN }}
