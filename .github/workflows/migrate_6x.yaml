name: 6X Migration Helper

on:
  schedule:
  - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      wildcards:
        description: "comma separated list of wildcards for recipes to include"
        required: true
        default: "*"
      wildcards_ignore:
        description: "comma separated list of wildcards for recipes to ignore"
        required: true
        default: "boost*,clang*,llvm*"
      timeout:
        description: "timeout for the migration process in seconds"
        required: true
        default:  "3000"


jobs:

  migrate:
    if: github.repository == 'emscripten-forge/recipes'
    runs-on: ubuntu-latest
    env:
      FORCE_COLOR: 1
      TARGET_PLATFORM: emscripten-wasm32
      GITHUB_OWNER: "emscripten-forge"


    steps:
      ################################################################
      # SETUP
      ################################################################
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_ACCESS_TOKEN }}
          ref: emscripten-6x

      ################################################################
      # CONFIG
      ################################################################
      - name: Global config
        shell: bash -el {0}
        run: git config --global advice.detachedHead false

      ################################################################
      # MAMBA
      ################################################################
      - name: Install micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: ci_env.yml
          init-shell: bash
          cache-environment: false
          post-cleanup: "all"


      ################################################################
      # SYNC
      ################################################################
      - name: Sync migration branch
        shell: bash -el {0}
        run: |
          python -m emci migrate build-tentative \
            --wildcards "$WILDCARDS" \
            --wildcards-ignore "$WILDCARDS_IGNORE" \
            --timeout "$TIMEOUT"
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_ACCESS_TOKEN }}
          WILDCARDS: ${{ inputs.wildcards || '*' }}
          WILDCARDS_IGNORE: ${{ inputs.wildcards_ignore || 'boost*,clang*,llvm*' }}
          TIMEOUT: ${{ inputs.timeout || '6000' }}
