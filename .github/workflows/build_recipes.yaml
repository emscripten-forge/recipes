name: Build Recipes

on:
  push:
    branches:
      - "emscripten-6x"
    paths:
      - "recipes/**"
  pull_request:
    paths:
      - "recipes/**"

permissions:
  contents: read
  id-token: write

jobs:

  build_recipes:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            wasm-arch: emscripten-wasm32

          - os: ubuntu-latest
            wasm-arch: emscripten-wasm64

          - os: macos-latest
            wasm-arch: None
            
    runs-on: ${{ matrix.os }}
    env:
      FORCE_COLOR: 1
      TARGET_PLATFORM: ${{ matrix.wasm-arch }}
      GITHUB_OWNER: "emscripten-forge"

    steps:
      ################################################################
      # SETUP
      ################################################################
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      ################################################################
      # CONFIG
      ################################################################
      - name: Global config
        shell: bash -el {0}
        run: git config --global advice.detachedHead false

      ################################################################
      # MAMBA
      ################################################################
      - name: Install micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: ci_env.yml
          init-shell: bash
          cache-environment: false
          post-cleanup: "all"

      ################################################################
      # PLAYWRIGHT
      ################################################################
      - name: Detect playwright requirement
        id: playwright
        shell: bash -el {0}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            OLD=origin/main~1
            NEW=origin/main
          else
            OLD=origin/main
            NEW=HEAD
          fi
          needed=$(python -m emci build needs-playwright "$OLD" "$NEW")
          echo "needed=$needed" >> "$GITHUB_OUTPUT"

      - name: Install playwright dependencies
        if: runner.os == 'Linux' && steps.playwright.outputs.needed == 'true'
        run: |
          sudo apt-get update -y && sudo apt-get install -y  \
          libwoff1  libvpx9  libevent-2.1-7t64 libopus0 libgstreamer-plugins-base1.0-0 \
          libgstreamer-gl1.0-0 \
          libgstreamer-plugins-bad1.0-0 \
          libflite1 \
          libavif16 \
          libharfbuzz-icu0 \
          libsecret-1-0 \
          libhyphen0 \
          libmanette-0.2-0 \
          libgles2 \
          gstreamer1.0-libav \
          libgtk-4-1 \
          libwayland-server0

      ################################################################
      # PUSH
      ################################################################
      - name: Build recipes with changes PUSH
        shell: bash -el {0}
        if: github.event_name == 'push'
        run: |
          python -m emci build changed $GITHUB_WORKSPACE/ origin/emscripten-6x~1 origin/emscripten-6x --target-platform ${{ matrix.wasm-arch }}

      ################################################################
      # PULL_REQUEST
      ################################################################
      - name: Build recipes with changes PULL_REQUEST
        shell: bash -el {0}
        if: github.event_name == 'pull_request'
        run: |
          python -m emci build changed $GITHUB_WORKSPACE/ origin/emscripten-6x HEAD --target-platform ${{ matrix.wasm-arch }}

      ################################################################
      # UPLOAD
      ################################################################
      - name: Create artifact
        uses: actions/upload-artifact@v7
        with:
          name: output
          path: output
        continue-on-error: true

      - name: Upload packages to prefix channel
        if: (github.event_name == 'push' && github.repository == 'emscripten-forge/recipes')
        shell: bash -l {0}
        run: |

          # delete noarch pkgs for when on emscripten-wasm64
          # and just upload these when on emscripten-wasm32
          if [ "${{ matrix.wasm-arch }}" = "emscripten-wasm64" ]; then
            echo "Deleting noarch pkgs for emscripten-wasm64"
            rm -rf "${GITHUB_WORKSPACE}/output/noarch"
          fi

          # add github workspace to python path
          export PYTHONPATH="${GITHUB_WORKSPACE}:${PYTHONPATH}"
          case "$(uname -s)" in
              Darwin)
                  # macOS: only upload osx-arm64
                  platforms=(osx-arm64)
                  ;;
              Linux)
                  # Linux: upload Linux artifacts
                  platforms=(emscripten-wasm32 emscripten-wasm64 linux-64 noarch)
                  ;;
              *)
                  echo "Unsupported OS: $(uname -s)"
                  exit 1
                  ;;
          esac
          overall_success=true
          for platform in "${platforms[@]}"; do
            if [ -d "${GITHUB_WORKSPACE}/output/${platform}" ]; then
              cd "${GITHUB_WORKSPACE}/output/${platform}"
              files=$(ls *.tar.bz2 2> /dev/null)
              if [ -n "$files" ]; then
                for package in $files; do

                  # get the channel
                  CHANNEL=$(python -m emci upload extract-channel ${package})
                  echo "Extracted channel: ${CHANNEL}"

                  echo "Uploading ${package} for ${platform}"

                  rattler-build upload prefix \
                    --channel ${CHANNEL} \
                    --generate-attestation \
                    ${package}

                  RETURNCODE=$?

                  # Check the RETURN CODE
                  if [[ $RETURNCODE -eq 0 ]]; then
                    echo "Upload succeeded for ${package} on ${platform}"
                  else
                    echo "Error: Upload failed with HTTP status $HTTP_STATUS"
                    echo "Response Body: $RESPONSE"
                    overall_success=false
                  fi
                done
              fi
            fi
          done

          # Check if all uploads were successful
          if [ "$overall_success" = false ]; then
            echo "One or more uploads failed"
            exit 1
          else
            echo "All uploads completed successfully"
          fi
